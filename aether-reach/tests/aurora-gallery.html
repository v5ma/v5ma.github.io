<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurora asset QA fixture</title><style>body{margin:0;background:#b7d5de;font:16px system-ui}canvas{display:block}header{position:absolute;padding:18px;color:#18333b;background:#f4edd9e8}footer{position:absolute;bottom:15px;width:100%;text-align:center;color:#18333b} </style><header>ASSET QA FIXTURE / Quaternius CC0 humans<br>Independent animated skeletons; original Aether costume colors and rim material.</header><footer>Surveyor / Worker &nbsp;&nbsp;&nbsp; Tavi / Courier &nbsp;&nbsp;&nbsp; Registry / Guard</footer><canvas></canvas><script type="module">
import * as T from '../vendor/three.module.js';import {GLTFLoader} from '../vendor/loaders/GLTFLoader.js';import {makeActor} from '../aurora-rig.mjs';import {makeRiftVeil} from '../aurora-shaders.mjs';
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(1,devicePixelRatio));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
const scene=new T.Scene();scene.background=new T.Color('#b7d5de');scene.add(new T.HemisphereLight('#eff8ff','#706749',2));const sun=new T.DirectionalLight('#ffe9c6',3);sun.position.set(-4,6,-4);scene.add(sun);const camera=new T.PerspectiveCamera(39,innerWidth/innerHeight,.05,30);camera.position.set(0,2.5,-8);camera.lookAt(0,1,0);
const floor=new T.Mesh(new T.PlaneGeometry(30,30),new T.MeshStandardMaterial({color:'#d1c5a9',roughness:.9}));floor.rotation.x=-Math.PI/2;floor.position.y=-.01;scene.add(floor);
const roles=['worker','courier','guard'],models=[];for(const [i,role]of roles.entries()){const gltf=await new GLTFLoader().loadAsync('../art/characters/'+role+'.glb');const a=makeActor(gltf,role);models.push({a,role,i});scene.add(a.root);}
const veil=makeRiftVeil(),rift=new T.Mesh(new T.BoxGeometry(.9,1.7,.15),veil);rift.position.set(3.5,.85,.7);scene.add(rift);
window.galleryReady=true;let time=0;const animate=()=>{time+=1/60;for(const {a,role,i}of models)a.update({x:(i-1)*1.65,y:role==='guard'?1.05:0,z:0,heading:0,hp:100,walking:role==='worker'},1/60,{time,rich:true});veil.uniforms.time.value=time;renderer.render(scene,camera);requestAnimationFrame(animate);};animate();
window.galleryStats=()=>models.map(v=>v.a.stats());
</script></html>
