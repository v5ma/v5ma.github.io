<!doctype html><html lang="en"><meta charset="utf-8"><title>Rainward character and shader acceptance</title><style>body{margin:0;background:#1c2826;color:#eee;font:14px Arial}canvas{display:block}#tools{position:absolute;top:10px;left:12px;display:flex;gap:8px;z-index:2}button{padding:8px;background:#34443c;color:white;border:1px solid #9aac93}</style><div id="tools"><button id="female">Field runner</button><button id="male">Patrol</button><button id="stand">Stand</button><button id="crouch">Crouch</button><button id="prone">Prone</button><button id="aim">Aim</button><button id="front">Front</button><button id="back">Back</button></div><script type="module">
import * as T from '../vendor/three.module.js';
import {actor,pose} from '../actors.mjs';
import {createDetailedHumans} from '../rainworn-humans.mjs';
const scene=new T.Scene();scene.background=new T.Color(0x283b36);const camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.01,100);camera.position.set(.2,1.3,-3.5);camera.lookAt(0,.95,0);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;document.body.append(renderer.domElement);scene.add(new T.HemisphereLight(0xd9edf2,0x423b2c,1.2));for(const [x,y,z,i]of[[3,5,-4,2],[-4,3,1,.8]]){let l=new T.DirectionalLight(0xffffff,i);l.position.set(x,y,z);scene.add(l);}const floor=new T.Mesh(new T.PlaneGeometry(10,10),new T.MeshStandardMaterial({color:0x35473c,roughness:.85}));floor.rotation.x=-Math.PI/2;floor.position.y=-.03;scene.add(floor);
const female=actor(scene,null,0x748473),male=actor(scene,null,0x747765,true);male.root.visible=false;
const p={x:0,z:0,yaw:0,hp:100,stance:'stand',speed:0},enemy={...p,id:'male'},state={player:p,enemies:[enemy]},manager=createDetailedHumans(scene,female,new Map([['male',male]]));manager.set(true,false);let gender='female',time=0;
for(const id of ['female','male'])document.getElementById(id).onclick=()=>{gender=id;female.root.visible=id==='female';male.root.visible=id==='male';};for(const id of ['stand','crouch','prone'])document.getElementById(id).onclick=()=>{p.stance=enemy.stance=id;p.aim=enemy.aim=false;};document.getElementById('aim').onclick=()=>p.aim=enemy.aim=!p.aim;document.getElementById('front').onclick=()=>{camera.position.set(.2,1.3,-3.5);camera.lookAt(0,.95,0)};document.getElementById('back').onclick=()=>{camera.position.set(-.2,1.3,3.5);camera.lookAt(0,.95,0)};
renderer.setAnimationLoop(()=>{time+=.016;pose(female,p,time);pose(male,enemy,time);manager.update(state);renderer.render(scene,camera);});
await new Promise((resolve,reject)=>{const started=performance.now(),timer=setInterval(()=>{if(manager.stats().loaded===2&&manager.stats().active===2){clearInterval(timer);resolve();}else if(performance.now()-started>20000){clearInterval(timer);reject(Error('Actual human adapter did not load: '+JSON.stringify(manager.stats())));}},30);});
window.AssetTest={get gender(){return gender},get actor(){return gender==='female'?female:male},scene,camera,renderer,modelStatus:()=>manager.stats(),get state(){return p},get group(){return this.actor.rig.children.find(g=>g.name==='Rainward adapted '+gender+' / Quaternius CC0');},bounds(){scene.updateMatrixWorld(true);const b=new T.Box3().setFromObject(this.group,true);return {min:b.min.toArray(),max:b.max.toArray()};},pose(next,t=1){Object.assign(p,next);Object.assign(enemy,next);pose(female,p,t);pose(male,enemy,t);manager.update(state);scene.updateMatrixWorld(true);}};
</script></html>
