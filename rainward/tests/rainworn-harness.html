<!doctype html><html lang="en"><meta charset="utf-8"><title>Rainward character and shader acceptance</title><style>body{margin:0;background:#1c2826;color:#eee;font:14px Arial}canvas{display:block}#tools{position:absolute;top:10px;left:12px;display:flex;gap:8px;z-index:2}button{padding:8px;background:#34443c;color:white;border:1px solid #9aac93}</style><div id="tools"><button id="female">Field runner</button><button id="male">Patrol</button><button id="stand">Stand</button><button id="crouch">Crouch</button><button id="prone">Prone</button><button id="aim">Aim</button><button id="front">Front</button><button id="back">Back</button></div><script type="module">
import * as T from '../vendor/three.module.js';import {GLTFLoader} from '../vendor/GLTFLoader.js';import {actor,pose} from '../actors.mjs';
const scene=new T.Scene();scene.background=new T.Color(0x283b36);const camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.01,100);camera.position.set(1.5,1.35,-3.5);camera.lookAt(0,.95,0);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;document.body.append(renderer.domElement);scene.add(new T.HemisphereLight(0xd9edf2,0x423b2c,2));for(const [x,y,z,i]of[[3,5,-4,4],[-4,3,1,2]]){let l=new T.DirectionalLight(0xffffff,i);l.position.set(x,y,z);scene.add(l);}const floor=new T.Mesh(new T.PlaneGeometry(10,10),new T.MeshStandardMaterial({color:0x35473c,roughness:.85}));floor.rotation.x=-Math.PI/2;floor.position.y=-.03;scene.add(floor);const a=actor(scene,null,0x748473);a.skin.layers.set(31);let group=null,gender='female',state={x:0,z:0,yaw:0,hp:100,stance:'stand',speed:0},time=0;
async function load(g){gender=g;if(group)a.rig.remove(group);const gltf=await new GLTFLoader().loadAsync('../assets/humans/survivor-'+g+'.glb');group=new T.Group();gltf.scene.traverse(m=>{if(!m.isSkinnedMesh)return;const skin=new T.SkinnedMesh(m.geometry,m.material);skin.bind(a.skin.skeleton,new T.Matrix4());skin.frustumCulled=false;group.add(skin);});a.rig.add(group);window.AssetTest={gender,actor:a,scene,camera,renderer,get state(){return state},get group(){return group},gltf,bounds(){scene.updateMatrixWorld(true);const b=new T.Box3().setFromObject(group,true);return {min:b.min.toArray(),max:b.max.toArray()};},pose(next,t=1){Object.assign(state,next);pose(a,state,t);scene.updateMatrixWorld(true);}};}
for(const id of ['female','male'])document.getElementById(id).onclick=()=>load(id);for(const id of ['stand','crouch','prone'])document.getElementById(id).onclick=()=>{state.stance=id;state.aim=false;};document.getElementById('aim').onclick=()=>state.aim=!state.aim;document.getElementById('front').onclick=()=>{camera.position.set(.2,1.3,-3.5);camera.lookAt(0,.95,0)};document.getElementById('back').onclick=()=>{camera.position.set(-.2,1.3,3.5);camera.lookAt(0,.95,0)};await load('female');renderer.setAnimationLoop(()=>{pose(a,state,time+=.016);renderer.render(scene,camera);});
</script></html>
