<!doctype html><meta charset="utf-8"><title>Freefield production shader fixture</title><canvas id="world" width="512" height="256"></canvas>
<script type="module">
import * as T from '../vendor/three.module.js';
import {PortalMaterials,seesFragment,boxInverse} from '../world-aperture.mjs';
import {renderWaistAR} from '../waist-ar.mjs';
import {createPortalOcclusion} from '../portal-occlusion.mjs';
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),alpha:true,antialias:false,preserveDrawingBuffer:true});renderer.setSize(512,256,false);renderer.setPixelRatio(1);renderer.setClearColor(0,0);renderer.outputColorSpace=T.LinearSRGBColorSpace;renderer.toneMapping=T.NoToneMapping;
const left=new T.PerspectiveCamera(60,1,.05,500),right=left.clone();left.position.set(-.032,.36,0);right.position.set(.032,.36,0);left.viewport=new T.Vector4(0,0,256,256);right.viewport=new T.Vector4(256,0,256,256);left.updateMatrixWorld();right.updateMatrixWorld();const stereo=new T.ArrayCamera([left,right]);
const scene=new T.Scene(),far=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshBasicMaterial({color:0xff0000,toneMapped:false}));far.position.set(0,.36,-80);scene.add(far);
const front=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshBasicMaterial({color:0x00ff00,toneMapped:false}));front.position.z=-.5;scene.add(front);
const adapter=new PortalMaterials(),anchor=new T.Vector3(0,0,-2),size={width:1.6,depth:1.2,height:.72};adapter.collect(scene);adapter.configure(anchor,0,size);adapter.active=true;renderer.render(scene,stereo);
const gl=renderer.getContext(),pixels=new Uint8Array(512*256*4);gl.readPixels(0,0,512,256,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
let samples=0,visible=0,mismatches=0,foregroundLeaks=0;const eyeResults=[];
for(const [index,camera]of [left,right].entries()){
 let eyeMismatch=0,eyeVisible=0;const origin=camera.position.clone();
 function sample(x,y){const ray=new T.Vector3(x/256*2-1,y/256*2-1,.5).unproject(camera).sub(origin).normalize();return origin.clone().addScaledVector(ray,(-80-origin.z)/ray.z);}
 for(let y=4;y<252;y+=4)for(let x=4;x<252;x+=4){const expected=seesFragment(origin,sample(x+.5,y+.5),boxInverse(anchor,0),size);
  if([[x-1,y],[x+1,y],[x,y-1],[x,y+1]].some(([a,b])=>seesFragment(origin,sample(a+.5,b+.5),boxInverse(anchor,0),size)!==expected))continue;
  const offset=(y*512+x+index*256)*4,actual=pixels[offset]>200&&pixels[offset+1]<10&&pixels[offset+3]>200;
  samples++;visible+=expected;eyeVisible+=expected;if(actual!==expected){mismatches++;eyeMismatch++;}if(pixels[offset+1]>10)foregroundLeaks++;
 }
 eyeResults.push({visible:eyeVisible,mismatches:eyeMismatch});
}
window.portalFixture={samples,visible,mismatches,foregroundLeaks,eyeResults,scope:'Oversized far geometry and foreground occluder rendered through two real ArrayCamera eye draws with production masking. Not game completion or physical headset data.'};
window.runWaist=()=>{
 adapter.active=false;scene.clear();renderer.setSize(512,256,false);const camera=new T.PerspectiveCamera(60,2,.05,100);camera.position.set(0,1.5,0);camera.updateMatrixWorld();const env=new T.Mesh(new T.PlaneGeometry(1.6,3),new T.MeshBasicMaterial({color:0xff0000})),actor=new T.Mesh(new T.PlaneGeometry(1.6,3),new T.MeshBasicMaterial({color:0x0000ff}));env.position.set(-1,1.5,-4);actor.position.set(1,1.5,-4);scene.add(env,actor);renderWaistAR(renderer,scene,camera,new Set([env]),.92);
 const out=new Uint8Array(512*256*4);gl.readPixels(0,0,512,256,gl.RGBA,gl.UNSIGNED_BYTE,out);let compared=0,wrong=0,red=0,blue=0;
 for(let y=3;y<253;y+=4)for(let x=3;x<509;x+=4){const o=camera.position,d=new T.Vector3((x+.5)/512*2-1,(y+.5)/256*2-1,.5).unproject(camera).sub(o).normalize(),p=o.clone().addScaledVector(d,-4/d.z);if(p.y<.1||p.y>2.9||Math.abs(p.y-.92)<.03)continue;
  const i=(y*512+x)*4;
  if(p.x>-1.7&&p.x<-.3){const yes=p.y<.92,actual=out[i]>200;compared++;red+=actual;if(actual!==yes)wrong++;}
  if(p.x>.3&&p.x<1.7){compared++;const actual=out[i+2]>200;blue+=actual;if(!actual)wrong++;}
 }
 return {compared,wrong,red,blue,originalVisibilityRestored:env.visible&&actor.visible,scope:'Production waist-cut environment pass leaves full dynamic actor geometry visible; synthetic graphics fixture only.'};
};
window.runSightline=()=>{
 scene.clear();adapter.active=false;renderer.setClearColor(0,0);const camera=new T.PerspectiveCamera(60,2,.05,100),focus=new T.Vector3(0,1.15,-1.5);camera.position.set(0,1.65,0);camera.lookAt(focus);camera.updateMatrixWorld();
 const wall=new T.Mesh(new T.PlaneGeometry(1.8,1.6),new T.MeshBasicMaterial({color:0x0000ff}));wall.position.set(0,1.30,-1.05);scene.add(wall);
 const actor=new T.Mesh(new T.PlaneGeometry(.15,.25),new T.MeshBasicMaterial({color:0x00ff00}));actor.position.copy(focus);scene.add(actor);
 const pixel=()=>{const out=new Uint8Array(4);gl.readPixels(256,128,1,1,gl.RGBA,gl.UNSIGNED_BYTE,out);return [...out];};
 renderer.render(scene,camera);const before=pixel(),cut=createPortalOcclusion();cut.collect([wall]);cut.configure(focus,1.10,.04);cut.active=true;renderer.render(scene,camera);const after=pixel();cut.active=false;cut.dispose();return {before,after,actorStillPresent:actor.parent===scene,wallStillPresent:wall.parent===scene};
};
</script>
