<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Exhibit mask regression fixture</title></head><body><script type="module">
import * as T from '../vendor/three.webgpu.js';
import {createWorldAperture} from '../xr-world-aperture.mjs';
window.fixture={done:false,passed:false,checks:[],error:null};
try {
 const renderer=new T.WebGPURenderer({forceWebGL:true,antialias:false,alpha:true});
 renderer.setSize(800,600);renderer.setPixelRatio(1);renderer.setClearColor(0,0);await renderer.init();document.body.append(renderer.domElement);
 const scene=new T.Scene(),anchor=new T.Group(),world=new T.Group();scene.add(anchor);anchor.add(world);
 const material=color=>new T.MeshBasicNodeMaterial({color,toneMapped:false});
 const inside=new T.Mesh(new T.BoxGeometry(.45,.45,.2),material(0x00ff00));inside.position.set(0,0,-2.4);world.add(inside);
 const classic=new T.Mesh(new T.BoxGeometry(.3,.3,.15),new T.MeshBasicMaterial({color:0x0000ff,toneMapped:false}));classic.position.set(.7,.3,-2.4);world.add(classic);
 const placements=[[1.6,0,-2.4],[-1.6,0,-2.4],[0,1.07,-2.4],[0,-1.07,-2.4],[.6,0,-1.79],[-.6,0,-3.31]];
 for(const [i,p] of placements.entries()){const o=new T.Mesh(new T.BoxGeometry(.1,.1,.1),(i%2?material(0xff0000):new T.MeshBasicMaterial({color:0xff0000,toneMapped:false})));o.position.fromArray(p);world.add(o);}
 anchor.position.set(.2,.1,-.15);anchor.rotation.y=.23;scene.updateMatrixWorld(true);
 const camera=new T.PerspectiveCamera(75,800/600,.05,20),target=new T.Vector3(0,0,-2.4).applyMatrix4(anchor.matrixWorld);camera.lookAt(target);renderer.render(scene,camera);
 const aperture=createWorldAperture(T);aperture.update(anchor.matrixWorld,{},true);aperture.sync(world);
 const gl=renderer.backend.getContext(),pixels=new Uint8Array(800*600*4);
 const read=()=>{gl.readPixels(0,0,800,600,gl.RGBA,gl.UNSIGNED_BYTE,pixels);let green=0,red=0,blue=0,transparent=0;for(let i=0;i<pixels.length;i+=4){if(pixels[i]<20&&pixels[i+1]>200&&pixels[i+2]<20)green++;if(pixels[i]>200&&pixels[i+1]<20&&pixels[i+2]<20)red++;if(pixels[i]<20&&pixels[i+1]<20&&pixels[i+2]>200)blue++;if(!pixels[i+3])transparent++;}return{green,red,blue,transparent};};
 const baseline=read();if(baseline.red<10||baseline.blue<100||baseline.green<100)throw Error('Baseline '+JSON.stringify(baseline));fixture.checks.push({name:'before-mask',...baseline});
 for(const [n,pose]of [["center",[0,0,0]],["left",[-.35,0,-.1]],["right",[.35,.15,.1]],["above",[0,.4,0]],["below",[0,-.35,0]]])for(const eye of [-.032,.032]){
  camera.position.set(pose[0]+eye,pose[1],pose[2]);camera.lookAt(target);camera.updateMatrixWorld(true);renderer.render(scene,camera);const measured=read();
  if(measured.green<100||measured.blue<100||measured.red!==0||measured.transparent<10000)throw Error('Masked '+n+' '+eye+' '+JSON.stringify(measured));
  fixture.checks.push({name:n,eye,...measured});
 }
 aperture.update(anchor.matrixWorld,{},false);renderer.render(scene,camera);const disabled=read();
 if(disabled.red<10||disabled.green<100||disabled.blue<100)throw Error('Disabled mask lost scene '+JSON.stringify(disabled));
 fixture.checks.push({name:'mask-disabled',...disabled});aperture.dispose();
 if(world.children.some(o=>o.material.maskNode!=null))throw Error('Original material ownership not restored');
 fixture.checks.push({name:'restored-original-materials'});fixture.passed=true;
} catch(error){fixture.error=String(error.stack||error);}
fixture.done=true;
</script></body></html>
