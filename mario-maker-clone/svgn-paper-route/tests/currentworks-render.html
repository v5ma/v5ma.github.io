<!doctype html><meta charset="utf-8"><title>Currentworks r177 curved-render fixture</title><body><script type="module">
import * as T from '../vendor/three.webgpu.js';
import {createGarden} from '../currentworks-environment.mjs';
import {createDepthWarp} from '../depth-path.mjs';
import {createPath} from '../depth-path-core.mjs';
window.fixture={passed:false,checks:[],error:null};
try{
 const scene=new T.Scene();scene.background=new T.Color(0x101521);
 scene.add(new T.AmbientLight(0xffffff,1.3));const sun=new T.DirectionalLight(0xffffff,1.7);sun.position.set(-1,3,1);scene.add(sun);
 const renderer=new T.WebGPURenderer({forceWebGL:true,antialias:false,preserveDrawingBuffer:true});renderer.setSize(1100,600);renderer.setPixelRatio(1);document.body.append(renderer.domElement);await renderer.init();
 const camera=new T.OrthographicCamera(-1250,1250,680,-680,.1,6000);camera.position.set(1740,500,0);camera.up.set(0,0,-1);camera.lookAt(1740,-1950,0);camera.updateMatrixWorld();
 const garden=createGarden(scene),path=createPath(),warp=createDepthWarp(scene);
 garden.update({time:0,riderX:1740,xr:true,quiet:true,curved:true});warp.update(true,1740);
 renderer.render(scene,camera);
 const c=document.createElement('canvas');c.width=1100;c.height=600;const ctx=c.getContext('2d');ctx.drawImage(renderer.domElement,0,0);
 const check=(ok,label)=>{if(!ok)throw Error(label);fixture.checks.push(label);};
 function sample(object,curved=true){const p=object.getWorldPosition(new T.Vector3());if(curved){p.fromArray(path.project(p.toArray()));p.x-=path.sample(1740).x-1740;}p.project(camera);const x=Math.round((p.x+1)*550),y=Math.round((1-p.y)*300);return [...ctx.getImageData(x,y,1,1).data];}
 const a=sample(garden.clouds.group.children[1]),b=sample(garden.islands.group.children[1]);
 check(a[0]>50&&a[1]>50&&a[2]>50,'Actual library cloud geometry draws with the r177 Toon material at its curved position');
 check(b[1]>25&&b[1]>b[0]*.8,'Actual library island geometry draws at its shared curved position');
 check(garden.clouds.stats.levels.every(x=>x===2),'One conservative cloud detail level is shared across eyes');
 check(garden.style.stats.textureCount===1&&garden.stats.renderTargets===0,'The library adapter adds one ramp and no persistent render targets');
 fixture.image=renderer.domElement.toDataURL();
 warp.update(false);garden.update({time:0,riderX:1740,xr:false,quiet:true,curved:false});renderer.render(scene,camera);ctx.drawImage(renderer.domElement,0,0);
 const flat=sample(garden.clouds.group.children[1],false);check(flat[0]>50,'Original straight material positions are restored after leaving curved view');
 garden.dispose();warp.dispose();renderer.render(scene,camera);check(!scene.getObjectByName('Sky Cycle / Currentworks gardens'),'Module disposal removes only the new garden layer');
 fixture.passed=true;
}catch(e){fixture.error=String(e.stack||e);console.error(e);}
</script>
