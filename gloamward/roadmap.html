<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gloamward • Development board</title><style>body{margin:0;background:#122e3b;color:#e4eee2;font:15px/1.6 system-ui}main{max-width:1260px;margin:auto;padding:35px 24px}h1{font:42px Georgia;color:#f3d6a1}a{color:#d5e7d7}header{max-width:850px}#board{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:30px}section{background:#183d48;border:1px solid #5c8487;border-radius:13px;padding:18px}article{background:#224d56;padding:14px;border-radius:7px;margin:13px 0}article strong{font-size:14px}small{color:#a8caca}article p{font-size:12px}#error{color:#ffba9b}</style></head><body><main><header><a href="index.html">← Archery demo</a><h1>From bow prototype to a full expedition.</h1><p>Implementation, browser acceptance, physical-device testing, and public release are separate milestones. This is a read-only view of the versioned roadmap, not an automatically synchronized project manager.</p><p id="status"></p></header><div id="board"></div><p id="error" role="status"></p></main><script type="module">try{const r=await fetch('./roadmap.json');if(!r.ok)throw Error('Roadmap unavailable');const d=await r.json();document.querySelector('#status').textContent=d.status;for(const state of['Implemented','Open gate','Hardware QA','Planned']){const s=document.createElement('section'),h=document.createElement('h2');h.textContent=state;s.append(h);for(const t of d.tasks.filter(t=>t.status===state)){const a=document.createElement('article'),id=document.createElement('small'),title=document.createElement('strong');id.textContent=t.id+' · '+(t.depends?.join(', ')||'Foundation');title.textContent=t.title;a.append(id,document.createElement('br'),title);if(t.acceptance){const p=document.createElement('p');p.textContent=t.acceptance;a.append(p);}s.append(a);}document.querySelector('#board').append(s);}}catch(e){document.querySelector('#error').textContent=e.message;}</script></body></html>
