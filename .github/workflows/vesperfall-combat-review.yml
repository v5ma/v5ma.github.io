name: Refine Vesperfall combat verification
on:
  push:
    branches: [feat/vesperfall-quest-archery]
    paths: [.github/workflows/vesperfall-combat-review.yml]
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vesperfall-quest-archery
      - name: Let ordinary-input navigation stop when a patrol becomes visible
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('vesperfall/tests/browser.py');s=p.read_text()
          assert 'def walk(page,x,z,close=.7):' in s
          s=s.replace('def walk(page,x,z,close=.7):','def walk(page,x,z,close=.7,combat=False):')
          s=s.replace('async ({x,z,close})=>','async ({x,z,close,combat})=>')
          old="if(d<close||Vesperfall.state.phase!=='playing'||performance.now()-start>160000)"
          new="const enemy= combat && Vesperfall.state.world.enemies.some(e=>!e.dead&&VesperCore.len(VesperCore.sub(e.p,Vesperfall.state.head))<15&&!VesperCore.segmentBlocked(Vesperfall.state.world,Vesperfall.state.head,VesperCore.add(e.p,[0,.5,0])));if(d<close||enemy||Vesperfall.state.phase!=='playing'||performance.now()-start>160000)"
          assert old in s
          s=s.replace(old,new).replace('if(d<close)resolve();else reject','if(d<close||enemy)resolve();else reject')
          s=s.replace("{'x':x,'z':z,'close':close}","{'x':x,'z':z,'close':close,'combat':combat}")
          s=s.replace("walk(page,travel['x'],travel['z'],1)","walk(page,travel['x'],travel['z'],1,combat=True)")
          s=s.replace('# Visit nodes along the generated graph; stop to shoot actual visible enemies.','# Visit real graph doorways, but stop as soon as a patrol is visible.\n   # The old driver walked into each room centre while absorbing multiple bolts.\n   # Difficulty and actor/enemy state are unchanged; only ordinary input choices differ.')
          p.write_text(s)
          p=Path('vesperfall/app.js');s=p.read_text()
          old="if(this.xr){const {ctx:g,canvas:c,texture}=this.xrHud;g.fillStyle='#172638ee';"
          assert old in s
          s=s.replace(old,"if(this.xr){const {ctx:g,canvas:c,texture}=this.xrHud;g.clearRect(0,0,c.width,c.height);g.fillStyle='#172638ee';")
          p.write_text(s)
          PY
          python -m py_compile vesperfall/tests/browser.py
          node --check vesperfall/app.js
          node --test vesperfall/tests/core.test.cjs
          git config user.name 'Vesperfall combat review'
          git config user.email 'vesperfall@users.noreply.github.com'
          git add vesperfall/tests/browser.py vesperfall/app.js
          git commit -m 'Stop test navigation at visible patrols and clear XR HUD before redrawing'
          git push origin HEAD:feat/vesperfall-quest-archery
