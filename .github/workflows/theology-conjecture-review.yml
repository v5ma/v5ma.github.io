name: Theology conditional conjecture review
on:
  push:
    branches: [theology/conditional-conjecture-framing-2026-10-03]
permissions:
  contents: write
concurrency:
  group: theology-conjecture-edit
  cancel-in-progress: true
jobs:
  revise:
    if: github.ref == 'refs/heads/theology/conditional-conjecture-framing-2026-10-03'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: theology/conditional-conjecture-framing-2026-10-03
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact reviewed corrections and remove the temporary writer
        run: |
          python - <<'PY'
          import json,gzip,base64,hashlib
          from pathlib import Path
          files=[Path('theology-wiki/tools/conjecture-transfer-'+str(i)+'.b64') for i in [1,2]]
          data=''.join(p.read_text().strip() for p in files)
          assert hashlib.sha256(data.encode()).hexdigest()=='e53421be4f33cf2af1912c8234e42bccdc34d98aff8de33745255ed03713323b'
          ops=json.loads(gzip.decompress(base64.b64decode(data)))
          assert len(ops)==7
          for r in ops:
              p=Path(r['path']);donor=Path(r['donor']) if r.get('donor') else p
              assert str(p).startswith('theology-wiki/') and '..' not in p.parts and not p.is_symlink()
              if r['old_sha256'] is None:
                  assert not p.exists(),p
                  text=''
              else:
                  text=donor.read_text()
                  assert hashlib.sha256(text.encode()).hexdigest()==r['old_sha256'],donor
                  if r.get('donor'):assert not p.exists(),p
              for start,end,replacement in reversed(r['splices']):text=text[:start]+replacement+text[end:]
              assert hashlib.sha256(text.encode()).hexdigest()==r['new_sha256'],p
              p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
          for p in files:p.unlink()
          Path('.github/workflows/theology-conjecture-review.yml').unlink()
          PY
          node theology-wiki/tools/publication.cjs
          node --check theology-wiki/assets/js/publication-tools.js
          git config user.name 'Micah Blumberg'
          git config user.email '60057241+v5ma@users.noreply.github.com'
          git add -- theology-wiki .github/workflows/theology-conjecture-review.yml
          git commit -m 'Clarify computational theology as a conditional conjecture and connect its research sources'
          mkdir -p conjecture-validation
          git rev-parse HEAD > conjecture-validation/source-revision.txt
          node theology-wiki/tools/publication.cjs --snapshot "$(git rev-parse HEAD)"
          node theology-wiki/tools/publication.cjs --check > conjecture-validation/corpus.json
      - name: Validate reader data, conditional scope and source preservation
        run: |
          node --test theology-wiki/tests/research.test.cjs theology-wiki/tests/conjecture.test.cjs > conjecture-validation/tests.log 2>&1 || { tail -100 conjecture-validation/tests.log; exit 1; }
          tail -12 conjecture-validation/tests.log
          git fetch origin 51ccd4fce33e35454477a82cafa110e24ed42028 --depth=1
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          base='51ccd4fce33e35454477a82cafa110e24ed42028'
          prefixes=['theology-sources/','papers/','theology-wiki/editorial/authorial-articles/','theology-wiki/research-notes/','theology-wiki/authority/manuscripts/','theology-wiki/products/media/','theology-wiki/planning/']
          rows=[]
          for line in subprocess.check_output(['git','ls-tree','-r',base],text=True).splitlines():
              meta,p=line.split('\t',1)
              if any(p.startswith(x) for x in prefixes):
                  assert Path(p).is_file(),p
                  assert meta.split()[2]==subprocess.check_output(['git','hash-object',p],text=True).strip(),p
                  rows.append(p)
          Path('conjecture-validation/preservation.json').write_text(json.dumps({'baseline':base,'unchanged':len(rows),'paths':rows},indent=2))
          PY
      - name: Install native browser
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Test actual loaded article text and source links
        run: |
          python -m http.server 4174 --bind 127.0.0.1 >/tmp/theology-conjecture-http.log 2>&1 &
          PUBLICATION_TEST_OUTPUT=conjecture-validation/reader python theology-wiki/tests/publication_browser.py
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright,expect
          cfg=json.loads(Path('theology-wiki/editorial/publication.json').read_text());results=[]
          with sync_playwright() as p:
              browser=p.chromium.launch();page=browser.new_page(viewport={'width':1440,'height':1000});errors=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              for slug in cfg['conditionalScope']['pages']:
                  page.goto('http://127.0.0.1:4174/theology-wiki/san-reader.html?page='+slug)
                  expect(page.locator('#conjecture-scope')).to_contain_text('does not know for sure')
                  expect(page.locator('#conjecture-scope')).to_contain_text('required belief')
                  results.append(slug)
              page.goto('http://127.0.0.1:4174/theology-wiki/san-reader.html?page=computational-god-capabilities-bridge')
              expect(page.locator('#article-body')).to_contain_text('I do not know for sure.')
              expect(page.locator('#conjecture-scope')).to_be_visible()
              page.screenshot(path='conjecture-validation/conditional-desktop.png')
              page.set_viewport_size({'width':390,'height':844})
              assert page.evaluate('document.documentElement.scrollWidth <= innerWidth+1')
              page.screenshot(path='conjecture-validation/conditional-mobile.png')
              page.goto('http://127.0.0.1:4174/theology-wiki/san-reader.html?page=publication-history')
              expect(page.locator('#conjecture-scope')).to_have_count(0)
              assert not errors,errors
              browser.close()
          Path('conjecture-validation/scope.json').write_text(json.dumps({'visibleConditionalPages':results,'errors':errors,'mobileOverflow':False},indent=2))
          PY
      - name: Publish tested source and archive to the review branch
        run: |
          node theology-wiki/tools/publication.cjs --check
          git add -- theology-wiki
          git commit -m 'Refresh hash-checked public backups and exact-version links for the author clarification'
          git push origin HEAD:theology/conditional-conjecture-framing-2026-10-03
          git rev-parse HEAD > conjecture-validation/tested-head.txt
          python - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('conjecture-validation/corrected-files.zip','w',zipfile.ZIP_DEFLATED) as z:
              for f in Path('theology-wiki').rglob('*'):
                  if f.is_file() and f.suffix in {'.md','.json','.cjs','.js','.html','.css','.txt','.csv'} and '__pycache__' not in f.parts:z.write(f)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theology-conjecture-validation
          path: conjecture-validation
          retention-days: 14
