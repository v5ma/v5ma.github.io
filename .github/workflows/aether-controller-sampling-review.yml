name: Aether controller sampling review
on:
  push:
    branches: [fix/aether-controller-sampling-tideglass]
    paths: ['aether-reach/tests/controller-journey.py', '.github/workflows/aether-controller-sampling-review.yml']
permissions:
  contents: read
jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regress the unchanged game and record its public byte contract
        run: |
          mkdir -p aether-reach/test-output
          node --test aether-reach/tests/*.test.mjs > aether-reach/test-output/controller-node.log
          node aether-reach/tests/release-manifest.mjs
      - name: Install the real browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Operate menus, archive, purchases, rooftop and reconnect through gamepad inputs
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/controller-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python -u aether-reach/tests/controller-journey.py | tee aether-reach/test-output/controller-browser.log
      - name: Record exact tested source
        if: always()
        run: |
          mkdir -p aether-reach/test-output
          git rev-parse HEAD > aether-reach/test-output/tested-commit.txt
          git diff --stat > aether-reach/test-output/uncommitted-diff.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-controller-sampling-review
          path: aether-reach/test-output
          retention-days: 14
