name: Review Theology prophecy and origins expansion
on:
  push:
    branches: [feat/theology-prophecy-origins-20260904]
    paths: ['theology-wiki/**', '.github/workflows/theology-expansion-build.yml']
permissions:
  contents: write
concurrency:
  group: theology-expansion-${{ github.ref }}
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Materialize integrity-checked source delta when present
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma,subprocess
          parts=sorted(Path('theology-wiki').glob('expansion-transfer-*.txt'))
          if parts:
            digest,payload=''.join(p.read_text().strip() for p in parts).split(':',1)
            assert digest=='4fd3e07d96b98e4b9b6e8869053c00e3814efa7d25aaf0c43feb3b660957a110'
            data=base64.b64decode(payload,validate=True)
            assert hashlib.sha256(data).hexdigest()==digest,'Source transfer differs'
            decoded=lzma.decompress(data)
            assert len(decoded)<300000
            package=json.loads(decoded)
            allowed={'theology-wiki/README.md','theology-wiki/assets/css/research.css','theology-wiki/assets/js/research-tools.js','theology-wiki/tests/browser.py','theology-wiki/tests/research.test.cjs','theology-wiki/tools/build.cjs'}
            patch=Path('/tmp/theology-expansion.patch');patch.write_text(package['patch'])
            actual={line.split('\t')[-1] for line in subprocess.check_output(['git','apply','--numstat',str(patch)],text=True).splitlines()}
            assert actual==allowed,actual
            subprocess.run(['git','apply','--check',str(patch)],check=True)
            subprocess.run(['git','apply',str(patch)],check=True)
            target=Path('theology-wiki/editorial/expansion.cjs');assert not target.exists()
            target.write_text(package['newFile'])
            hashes={
              'editorial/expansion.cjs':'d671e3ec8eb4750a4805fbc52b5e465f41131a419881fc8f3c4323d703d328c2',
              'tools/build.cjs':'6118f8956421f4c64403d622a928e55918441d4731e6e6ea346223039aec5e7b',
              'assets/js/research-tools.js':'2c83425d922ec4375e8b3e09cec3c496de9aba799da4192d0a4a5776392d4efa',
              'assets/css/research.css':'aead43cc8320f18da0185673af9c0736479f1024311fa4e4a532bdebb06ba634',
              'tests/research.test.cjs':'7cf43ad00fca0075debb5ea646afcada9b042354c3e40d1103c621e986545f0f',
              'tests/browser.py':'05b48959d7876253baafe2bd39743f4545458ce9d93c3845fc107568da6079d1',
              'README.md':'f3c27d00e168fd2e6f067260f644c26cf60416ae8ad535c226a78b0aad5bf9e2'
            }
            for name,expected in hashes.items():assert hashlib.sha256((Path('theology-wiki')/name).read_bytes()).hexdigest()==expected,name
            for p in parts:p.unlink()
            print('Source delta and all seven materialized files match the locally checked edition.')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test source integrity and wiki connections
        run: |
          mkdir -p theology-test-output
          node theology-wiki/tools/build.cjs | tee theology-test-output/build-report.txt
          node --check theology-wiki/assets/js/research-tools.js
          node --test theology-wiki/tests/research.test.cjs | tee theology-test-output/node-tests.txt
          git diff --exit-code -- theology-sources san-wiki-shell scripts
      - name: Preserve readable generated source on the isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- theology-wiki
          if ! git diff --cached --quiet; then git commit -m 'Develop six source-linked Theology investigations and dated forecast ledger'; git push origin HEAD:${GITHUB_REF_NAME}; fi
      - name: Install native browser test tooling
        run: |
          python -m pip install --quiet playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium > /tmp/theology-browser-install.log 2>&1 || { tail -100 /tmp/theology-browser-install.log; exit 1; }
      - name: Verify bundled image provenance
        run: python theology-wiki/tools/media.py
      - name: Test native HTTP reader and interactive forecast ledger
        run: |
          python -m http.server 4174 --bind 127.0.0.1 >/tmp/theology-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python theology-wiki/tests/browser.py
      - name: Save reproducible review evidence
        if: always()
        run: |
          mkdir -p theology-test-output
          git rev-parse HEAD > theology-test-output/tested-commit.txt
          git diff --stat > theology-test-output/uncommitted-diff.txt
          cp /tmp/theology-http.log theology-test-output/ 2>/dev/null || true
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('theology-test-output/review-source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for f in Path('theology-wiki').rglob('*'):
              if f.is_file() and '__pycache__' not in f.parts and f.suffix.lower() not in {'.ttf','.otf','.woff','.woff2'} and not f.name.startswith('expansion-transfer-'):z.write(f,f.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theology-expansion-review
          path: theology-test-output/
          retention-days: 14
