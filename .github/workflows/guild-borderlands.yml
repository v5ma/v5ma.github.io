name: Guild Borderlands
on:
  push:
    branches: [guild/borderlands-20260912]
    paths: ['leonardos-guild/**', '.github/workflows/guild-borderlands.yml']
  pull_request:
    paths: ['leonardos-guild/**', '.github/workflows/guild-borderlands.yml']
permissions:
  contents: read
concurrency:
  group: guild-borderlands-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: One-time audited Borderlands integration on the isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'guild/borderlands-20260912'
          if test ! -f leonardos-guild/frontier-core.mjs; then
            BEFORE=$(git rev-parse HEAD)
            cat \
              leonardos-guild/scripts/borderlands.patch.gz.b64.a00 \
              leonardos-guild/scripts/borderlands.patch.gz.b64.a01 \
              leonardos-guild/scripts/borderlands.patch.gz.b64.01 \
              leonardos-guild/scripts/borderlands.patch.gz.b64.04 \
              leonardos-guild/scripts/borderlands.patch.gz.b64.03 \
              leonardos-guild/scripts/borderlands.patch.gz.b64.04full \
              leonardos-guild/scripts/borderlands.patch.gz.b64.05 \
              leonardos-guild/scripts/borderlands.patch.gz.b64.06 \
              | base64 -d | gzip -d > /tmp/borderlands.patch
            git apply --check /tmp/borderlands.patch
            git apply /tmp/borderlands.patch
            for f in leonardos-guild/*.mjs; do node --check "$f"; done
            npm --prefix leonardos-guild test
            python - <<'PY'
          import json,subprocess
          from pathlib import Path
          before=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          value={
            'version':'0.11.0',
            'preparationSource':before,
            'method':'One-time concatenated base64+gzip unified patch in an explicit verified chunk order. git apply --check ran before application. Native acceptance reads the subsequently committed ordinary files and never reapplies this patch.',
            'scope':'Steady Steps retained; adds safe Vinci, Cinder Hollow badlands, peaceful migration of prior town combat, and future Farmlands roadmap only.'
          }
          Path('leonardos-guild/BORDERLANDS-INTEGRATION.json').write_text(json.dumps(value,indent=2)+'\n')
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- leonardos-guild
            git commit -m 'Integrate Leo’s Guild Borderlands v0.11.0 safe-town and badlands source'
            git push origin HEAD:refs/heads/guild/borderlands-20260912
          fi
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  frontier:
    needs: prepare
    if: always() && !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate ordinary committed source and all model regressions
        run: |
          set -euo pipefail
          mkdir -p leonardos-guild/frontier-output
          git rev-parse HEAD | tee leonardos-guild/frontier-output/tested-commit.txt
          for f in leonardos-guild/*.mjs; do node --check "$f"; done
          npm --prefix leonardos-guild test | tee leonardos-guild/frontier-output/model-tests.txt
      - name: Install native Chromium
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Fresh Xbox-input safe-town, gate, monster, salvage and reload journey
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/frontier-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python -u leonardos-guild/tests/frontier-browser.py
      - name: Preserve actual screenshots, reports and immutable source identity
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,subprocess,tarfile
          from pathlib import Path
          out=Path('leonardos-guild/frontier-output');out.mkdir(exist_ok=True)
          names=subprocess.check_output(['git','ls-files','leonardos-guild','.github/workflows'],text=True).splitlines()
          files={name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in names if Path(name).is_file()}
          (out/'source-hashes.json').write_text(json.dumps(files,indent=2))
          (out/'tested-commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          diff=subprocess.check_output(['git','diff','--stat'],text=True)
          (out/'uncommitted-diff.txt').write_text(diff)
          with tarfile.open(out/'source.tgz','w:gz') as t:
            for name in files:t.add(name,arcname=name)
          assert not diff,'Native acceptance must read ordinary committed source without rewriting it'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guild-borderlands-acceptance
          path: leonardos-guild/frontier-output/
          retention-days: 10
