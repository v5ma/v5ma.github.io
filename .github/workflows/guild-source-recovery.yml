name: Guild committed source recovery
on:
  push:
    branches: ['guild/vinci-desk-20260920']
    paths: ['leonardos-guild/**', '.github/workflows/guild-source-recovery.yml']
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package the unmodified public game source
        run: |
          mkdir -p /tmp/guild-source
          git rev-parse HEAD > /tmp/guild-source/commit.txt
          git ls-files -z leonardos-guild level-design-library .github/workflows tests | tar --null -T - -czf /tmp/guild-source/source.tgz
          git ls-files -z leonardos-guild level-design-library .github/workflows tests | xargs -0 sha256sum > /tmp/guild-source/hashes.txt
          test -z "$(git diff --stat)"
      - uses: actions/upload-artifact@v4
        with:
          name: guild-committed-source
          path: /tmp/guild-source/
          retention-days: 7
