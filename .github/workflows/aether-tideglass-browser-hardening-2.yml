name: Apply Tideglass browser hardening
on:
  push:
    branches: [feat/aether-tideglass-reservoir-20260912]
    paths: ['.github/workflows/aether-tideglass-browser-hardening-2.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aether-tideglass-reservoir-20260912
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic browser-test updates
        run: python aether-reach/tools/harden-tideglass-browser-tests.py
      - name: Regress complete model and manifest
        run: |
          for f in aether-reach/*.mjs; do node --check "$f"; done
          node --test aether-reach/tests/*.test.mjs
          node aether-reach/tests/release-manifest.mjs
      - name: Commit test hardening
        run: |
          rm .github/workflows/aether-tideglass-browser-hardening.yml
          rm .github/workflows/aether-tideglass-browser-hardening-2.yml
          rm aether-reach/tools/harden-tideglass-browser-tests.py
          git add -A -- aether-reach/tests aether-reach/tools/harden-tideglass-browser-tests.py .github/workflows/aether-tideglass-browser-hardening.yml .github/workflows/aether-tideglass-browser-hardening-2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden Aether legacy browser journeys for current homepage and slow WebGL'
          git push origin HEAD:feat/aether-tideglass-reservoir-20260912
