name: Rainward XR repair compositor acceptance
on:
  pull_request:
    paths: ['rainward/**','.github/workflows/rainward-xr-repair.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rainward-xr-repair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        view: [first-person,first-person-ar,diorama-vr,diorama-ar]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Model, input, save and canonical roadmap regression
        run: |
          mkdir -p test-output
          node --test rainward/tests/*.test.mjs > test-output/node-tests.txt
          python -m compileall -q rainward/tests
          python rainward/tools/build-production-plan.py
          git diff --exit-code -- rainward/AAA_CHECKLIST.md
      - name: Install native HTTP WebGL browser
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Both actual compositor paths and normal-start gameplay
        env:
          XR_VIEW: ${{ matrix.view }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/rainward-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          RESULT=0
          for LAYER in projection base; do
            XR_LAYER="$LAYER" timeout 600 python -u rainward/tests/xr-repair-browser.py || RESULT=1
          done
          exit "$RESULT"
      - name: Preserve exact checkout, compositor images and failed evidence
        if: always()
        run: |
          mkdir -p test-output
          python rainward/tests/release.py
          git rev-parse HEAD > test-output/tested-commit.txt
          git diff > test-output/uncommitted.diff
          tar -czf test-output/rainward-source.tgz rainward index.html projects.css
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainward-xr-repair-${{ matrix.view }}
          path: test-output/
          retention-days: 14
