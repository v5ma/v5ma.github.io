name: Verify the optional Cloudpost relay
on:
  push:
    branches: [feat/cloudpost-relay-20260906]
  pull_request:
    branches: [master]
    paths: ['mario-maker-clone/svgn-paper-route/**','tests/sky_relay*','tests/campaign_loading_browser.py','tests/helpers/relay-fixture.cjs','.github/workflows/sky-relay.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudpost-complete-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve the exact source used by this run
        run: |
          mkdir -p test-output
          tar -czf test-output/runtime.tgz mario-maker-clone/svgn-paper-route tests scripts .github/workflows
          git rev-parse HEAD > test-output/source-commit.txt
          find . -name AGENTS.md -not -path './.git/*' > test-output/repository-instructions.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cloudpost-runtime-source
          path: test-output/
          retention-days: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify registration, carried routes, authoring, grip and rehearsal invariants
        run: |
          python scripts/check-rail-release.py
          node --check mario-maker-clone/svgn-paper-route/sky-relay.js
          node --check mario-maker-clone/svgn-paper-route/release-status.js
          node --test tests/sky_relay.test.cjs tests/flow_routes.test.cjs tests/sky_network.test.cjs tests/hookline_release_window.test.cjs tests/rail_repair.test.cjs tests/rail_yard.test.cjs tests/workshop_live.test.cjs tests/sky_routes.test.mjs tests/grapple_core.test.cjs tests/grapple_tolerance.test.cjs tests/adventure_score.test.cjs tests/depth_geometry.test.mjs tests/ride_lab.test.cjs tests/ride_guide_state.test.cjs tests/hookline_receiver.test.cjs tests/hookline_feedback.test.cjs tests/rail_hookline_flow.test.cjs
          git diff --exit-code
  native:
    needs: model
    strategy:
      fail-fast: false
      matrix:
        mode: [ride, startup, coast, editor, road, canal, recover, reentry, grip, bezier, expert, whip, lab, guide]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Play the actual HTTP application with ordinary controls
        env:
          SUITE: ${{ matrix.mode }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/sky-relay.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          case "$SUITE" in
            ride|coast|editor) RELAY_SUITE="$SUITE" timeout 1320 python -u tests/sky_relay_browser.py ;;
            startup) timeout 1320 python -u tests/campaign_loading_browser.py ;;
            road|canal|recover|reentry) FLOW_SUITE="$SUITE" timeout 1320 python -u tests/flow_routes_browser.py ;;
            grip) RAIL_SUITE=ride timeout 1320 python -u tests/rail_editor_browser.py ;;
            bezier) RAIL_SUITE=editor timeout 1320 python -u tests/rail_editor_browser.py ;;
            expert) SKY_REPLAY_ROUTE=0 timeout 1320 python -u tests/sky_browser.py ;;
            whip) timeout 1320 python -u tests/grapple_browser.py ;;
            lab) LAB_SUITE=editor timeout 1320 python -u tests/ride_lab_browser.py ;;
            guide) LAB_SUITE=guide timeout 1320 python -u tests/ride_lab_browser.py ;;
            *) exit 2 ;;
          esac
      - name: Retain exact source and failures
        if: always()
        run: |
          mkdir -p test-output
          python scripts/check-rail-release.py
          git rev-parse HEAD > test-output/tested-commit.txt
          git diff --stat > test-output/uncommitted-diff.txt
          cp /tmp/sky-relay.log test-output/http.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-relay-${{ matrix.mode }}
          path: test-output/
          retention-days: 7
