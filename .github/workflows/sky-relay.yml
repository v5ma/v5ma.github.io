name: Verify the optional Cloudpost relay
on:
  pull_request:
    branches: [master]
    paths: ['mario-maker-clone/svgn-paper-route/**','tests/sky_relay*','tests/helpers/relay-fixture.cjs','.github/workflows/sky-relay.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sky-relay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python scripts/check-rail-release.py
          node --check mario-maker-clone/svgn-paper-route/sky-relay.js
          node --test tests/sky_relay.test.cjs tests/flow_routes.test.cjs tests/rail_repair.test.cjs
          git diff --exit-code
  native:
    needs: model
    strategy:
      fail-fast: false
      matrix:
        mode: [ride, coast, editor]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Play the real connected course using normal controls
        env:
          RELAY_SUITE: ${{ matrix.mode }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/sky-relay.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          timeout 1000 python -u tests/sky_relay_browser.py
      - name: Retain exact source and failures
        if: always()
        run: |
          mkdir -p test-output
          python scripts/check-rail-release.py
          git rev-parse HEAD > test-output/tested-commit.txt
          git diff --stat > test-output/uncommitted-diff.txt
          cp /tmp/sky-relay.log test-output/http.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-relay-${{ matrix.mode }}
          path: test-output/
          retention-days: 7
