name: Sky Cycle source review
on:
  push:
    branches: ['sky-cycle/portal-network-0.21']
    paths: ['.github/workflows/sky-cycle-source-review.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            mario-maker-clone/svgn-paper-route
          sparse-checkout-cone-mode: true
      - name: Record source identity and live baseline
        run: |
          mkdir -p sky-cycle-source-evidence
          git rev-parse HEAD > sky-cycle-source-evidence/commit.txt
          git ls-tree -r --name-only HEAD | grep -E '(^|/)AGENTS.md$|sky.cycle|svgn-paper-route' > sky-cycle-source-evidence/source-paths.txt
          curl -fsSL --retry 3 'https://v5ma.github.io/mario-maker-clone/svgn-paper-route/release.json' -o sky-cycle-source-evidence/live-release.json
          tar -czf sky-cycle-source-evidence/source.tar.gz .github mario-maker-clone/svgn-paper-route
          cat sky-cycle-source-evidence/live-release.json
      - uses: actions/upload-artifact@v4
        with:
          name: sky-cycle-exact-source
          path: sky-cycle-source-evidence/
          retention-days: 14
