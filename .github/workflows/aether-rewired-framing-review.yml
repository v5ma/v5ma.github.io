name: Aether Rewired stereo framing review
on:
  push:
    branches: [aether/fixture-repair-20260915]
    paths: ['.github/workflows/aether-rewired-framing-review.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'v5ma/v5ma.github.io' && github.ref == 'refs/heads/aether/fixture-repair-20260915'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 80732867394a2c0b1c8a19b8c02fb618c49042b1
          persist-credentials: false
          sparse-checkout: |
            aether-reach
      - name: Install native browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Inspect existing source without changing runtime or game state
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/aether-framing-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          cat >/tmp/aether-framing.py <<'PY'
          from pathlib import Path
          import json
          from playwright.sync_api import sync_playwright
          root=Path.cwd();out=root/'aether-reach/test-output';out.mkdir(exist_ok=True)
          fixture=(root/'aether-reach/tests/fake-devices.js').read_text()
          old="const h=transform(devices.headX,1.65,0,-devices.headYaw);const views=['left','right'].map((eye,i)=>({eye,projectionMatrix:projection,transform:transform(devices.headX+(i?.032:-.032),1.65,0,-devices.headYaw)}));"
          new="""function headPose(dx=0){const a=(devices.headPitch||0)/2,b=-devices.headYaw/2,q={x:Math.sin(a)*Math.cos(b),y:Math.cos(a)*Math.sin(b),z:-Math.sin(a)*Math.sin(b),w:Math.cos(a)*Math.cos(b)},x=q.x,y=q.y,z=q.z,w=q.w,p={x:devices.headX+dx,y:devices.headY??1.65,z:devices.headZ||0};return {position:p,orientation:q,matrix:new Float32Array([1-2*(y*y+z*z),2*(x*y+z*w),2*(x*z-y*w),0,2*(x*y-z*w),1-2*(x*x+z*z),2*(y*z+x*w),0,2*(x*z+y*w),2*(y*z-x*w),1-2*(x*x+y*y),0,p.x,p.y,p.z,1])};}const h=headPose();const views=['left','right'].map((eye,i)=>({eye,projectionMatrix:projection,transform:headPose(i?.032:-.032)}));"""
          assert fixture.count(old)==1;fixture=fixture.replace(old,new)
          cases=[('both','immersive-vr',.5,1.65,0,-.68),('top','immersive-vr',.35,1.65,-.85,-1.08),('front','immersive-vr',1.15,1.65,0,-.3),('both-ar','immersive-ar',.5,1.65,0,-.68)]
          rows=[];errors=[]
          with sync_playwright() as pw:
            browser=pw.chromium.launch(headless=True,args=['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader'])
            for name,kind,height,eye_y,eye_z,pitch in cases:
              ctx=browser.new_context(viewport={'width':960,'height':640},device_scale_factor=1,service_workers='block')
              ctx.add_init_script(script=fixture)
              ctx.add_init_script("if(location.protocol.startsWith('http'))localStorage.setItem('aether-reach.visual.v1',JSON.stringify({mode:'low'}));navigator.xr.isSessionSupported=async()=>true;const old=navigator.xr.requestSession.bind(navigator.xr);navigator.xr.requestSession=async(m,o)=>{const s=await old(m,o);s.environmentBlendMode=m==='immersive-ar'?'alpha-blend':'opaque';return s;};")
              page=ctx.new_page();page.set_default_timeout(90000);page.on('pageerror',lambda e:errors.append(str(e)))
              page.goto('http://127.0.0.1:4173/aether-reach/index.html',wait_until='domcontentloaded');page.wait_for_function('!!window.AetherReach')
              page.locator('#presentation-button').click();page.locator('#xr-presentation').select_option('diorama-ar' if kind=='immersive-ar' else 'diorama-vr')
              page.locator('#diorama-opening').select_option('both' if name=='both-ar' else name)
              page.locator('#diorama-height').fill(str(height));page.locator('#presentation-back').click();page.locator('#enter-vr').click()
              page.wait_for_function('AetherReach.snapshot().devices.xr&&AetherReach.snapshot().devices.presentation.avatar==="ready"')
              page.evaluate('new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)))')
              before=page.evaluate('AetherReach.snapshot().position')
              page.evaluate('([y,z,pitch])=>Object.assign(TestXR.devices,{headY:y,headZ:z,headPitch:pitch})',[eye_y,eye_z,pitch])
              page.evaluate('new Promise(r=>{let n=16;function tick(){if(--n<=0)r();else requestAnimationFrame(tick)}requestAnimationFrame(tick)})')
              after=page.evaluate('AetherReach.snapshot()')
              assert all(abs(before[k]-after['position'][k])<.08 for k in ['x','y','z'])
              assert after['devices']['presentation']['topOpen'] or after['devices']['presentation']['frontOpen']
              page.locator('#world').screenshot(path=str(out/('stereo-'+name+'.png')))
              rows.append({'case':name,'head':{'height':eye_y,'z':eye_z,'pitch':pitch},'snapshot':after})
              ctx.close()
            browser.close()
          assert not errors,errors
          (out/'stereo-framing-review.json').write_text(json.dumps({'source':'80732867394a2c0b1c8a19b8c02fb618c49042b1','cases':rows,'errors':errors,'scope':'Native stereo software WebGL render. Only input fixture supplies deliberate head tilt/lean. Runtime and simulation source unchanged. Top-only is inspected by leaning over the open top; front-only with user-adjusted table height. Images require visual review. No physical passthrough, tracking, comfort or performance certification.'},indent=2))
          PY
          python -u /tmp/aether-framing.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-rewired-stereo-framing
          path: aether-reach/test-output/
          retention-days: 30
