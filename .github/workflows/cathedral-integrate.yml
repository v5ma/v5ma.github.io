name: Integrate Living Cathedral source
on:
  push:
    branches: [feat/vesperfall-living-cathedral]
    paths: [.github/workflows/cathedral-integrate.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vesperfall-living-cathedral
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python scripts/integrate-living-cathedral.py
          node --check vesperfall/app.js
          node --check vesperfall/cathedral-art.js
          node --test vesperfall/tests/*.test.cjs
          python scripts/check-vesperfall.py
          python -m py_compile vesperfall/tests/cathedral-browser.py
          git config user.name 'Vesperfall cathedral integration'
          git config user.email 'cathedral@users.noreply.github.com'
          git add vesperfall scripts/check-vesperfall.py
          git commit -m 'Integrate Living Cathedral floorplans, physical high routes, material art and scaled atlas'
          git push origin HEAD:feat/vesperfall-living-cathedral
      - if: always()
        run: |
          mkdir -p output
          git rev-parse HEAD > output/source-sha.txt
          tar czf output/source.tgz vesperfall index.html projects.css gloamward/index.html scripts/check-vesperfall.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cathedral-integrated-source
          path: output/
          retention-days: 14
