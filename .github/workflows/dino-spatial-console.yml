name: Dino Atlas Field Rotunda
on:
  push:
    branches: [master]
    paths: ['dino-atlas/**', '.github/workflows/dino-spatial-console.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dino-spatial-${{ github.ref }}
  cancel-in-progress: true
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            dino-atlas
            .github
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: source
        name: Record exact tested source and complete model evidence
        run: |
          mkdir -p spatial-evidence
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > spatial-evidence/source-commit.txt
          tar -czf spatial-source.tgz dino-atlas .github/workflows/dino-spatial-console.yml
          npm --prefix dino-atlas run check
          python -m py_compile dino-atlas/tests/spatial-console-browser.py
          set -o pipefail
          npm --prefix dino-atlas test | tee spatial-evidence/unit-tests.tap
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          paths=subprocess.check_output(['git','ls-files','dino-atlas'],text=True).splitlines()
          files=[p for p in paths if not p.startswith(('dino-atlas/tests/','dino-atlas/verification/','dino-atlas/scripts/')) and Path(p).suffix in ('.js','.mjs','.wasm','.html','.css','.png','.jpg','.webp','.glb','.ogg','.mp3')]
          m={'build':'living-reserve-20260922.1','commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files}}
          Path('spatial-evidence/manifest.json').write_text(json.dumps(m,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dino-spatial-model-${{ github.run_id }}
          path: |
            spatial-evidence/
            spatial-source.tgz
          retention-days: 30
  browser:
    needs: model
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scene: [classic, tidegate]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.model.outputs.source }}
          persist-credentials: false
          sparse-checkout: dino-atlas
      - name: Install native browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Actual spatial menus, input capture, motion and exit
        env:
          SPATIAL_SCENE: ${{ matrix.scene }}
        run: |
          python dino-atlas/tests/field-feedback-browser.py
          python dino-atlas/tests/spatial-console-browser.py
      - name: Preserve full-world portal and vehicle controls
        env:
          PORTAL_SCENE: ${{ matrix.scene }}
          EXPRESS_SCENE: ${{ matrix.scene }}
        run: |
          python dino-atlas/tests/portal-game-browser.py
          python dino-atlas/tests/express-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dino-spatial-${{ matrix.scene }}-${{ github.run_id }}
          path: |
            feedback-evidence/
            spatial-evidence/
            portal-evidence/
            express-evidence/
          retention-days: 30
  entry:
    needs: model
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.model.outputs.source }}
          persist-credentials: false
          sparse-checkout: dino-atlas
      - name: Install native browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Preserve regular-game entry and original hand-tool path
        run: |
          python dino-atlas/tests/classic-xr-entry-browser.py
          python dino-atlas/tests/grounded-xr-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dino-spatial-entry-${{ github.run_id }}
          path: |
            xr-entry-evidence/
            dino-atlas/verification/grounded-xr/
          retention-days: 30
  story:
    needs: model
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.model.outputs.source }}
          persist-credentials: false
          sparse-checkout: dino-atlas
      - name: Install native browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Play First Light with real movement, dialogue and saved return
        run: |
          python dino-atlas/tests/living-reserve-browser.py
          LIVING_XR=1 python dino-atlas/tests/living-reserve-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dino-spatial-story-${{ github.run_id }}
          path: living-evidence/
          retention-days: 30
  published:
    needs: [model, browser, entry, story]
    if: always() && github.ref == 'refs/heads/master' && needs.model.result == 'success' && needs.browser.result == 'success' && needs.entry.result == 'success' && needs.story.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: dino-atlas
      - uses: actions/download-artifact@v4
        with:
          name: dino-spatial-model-${{ github.run_id }}
          path: model
      - name: Match served runtime separately from source and candidate success
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,urllib.request,concurrent.futures,time
          m=json.loads(Path('model/spatial-evidence/manifest.json').read_text());pending=dict(m['files']);matched={}
          def fetch(item):
              path,wanted=item
              try:
                  req=urllib.request.Request('https://v5ma.github.io/'+path+'?rotunda='+m['commit']+'&try='+str(attempt),headers={'Cache-Control':'no-cache'})
                  actual=hashlib.sha256(urllib.request.urlopen(req,timeout=30).read()).hexdigest()
                  return path,actual if actual==wanted else None
              except Exception:return path,None
          for attempt in range(24):
              with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
                  for path,digest in pool.map(fetch,list(pending.items())):
                      if digest:matched[path]=digest;pending.pop(path,None)
              print('Public matched',len(matched),'pending',len(pending),flush=True)
              if not pending:break
              time.sleep(15)
          assert not pending,'Public mismatch: '+str(list(pending))
          out=Path('spatial-evidence');out.mkdir(exist_ok=True)
          (out/'public-verification.json').write_text(json.dumps({'build':m['build'],'commit':m['commit'],'files':matched,'allMatched':True,'physicalHardwareVerified':False},indent=2))
          PY
      - name: Install native browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Play published Classic and Tidegate with real UI handlers and explicit XR mocks
        env:
          DINO_TEST_BASE: https://v5ma.github.io/dino-atlas/
        run: |
          python dino-atlas/tests/living-reserve-browser.py
          LIVING_XR=1 python dino-atlas/tests/living-reserve-browser.py
          SPATIAL_SCENE=classic python dino-atlas/tests/field-feedback-browser.py
          SPATIAL_SCENE=tidegate python dino-atlas/tests/field-feedback-browser.py
          SPATIAL_SCENE=classic python dino-atlas/tests/spatial-console-browser.py
          SPATIAL_SCENE=tidegate python dino-atlas/tests/spatial-console-browser.py
          PORTAL_SCENE=classic python dino-atlas/tests/portal-game-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dino-spatial-published-${{ github.run_id }}
          path: |
            living-evidence/
            feedback-evidence/
            spatial-evidence/
            portal-evidence/
          retention-days: 30
  release:
    needs: published
    if: always() && github.ref == 'refs/heads/master' && needs.published.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: dino-atlas
      - uses: actions/download-artifact@v4
        with:
          pattern: dino-spatial-*-${{ github.run_id }}
          path: evidence
      - name: Archive verified playtest without replacing historical releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view dino-living-reserve-20260922.1 >/dev/null 2>&1; then
            tar -czf dino-spatial-console-evidence.tgz -C evidence .
            gh release create dino-living-reserve-20260922.1 --target '${{ github.sha }}' --title 'Dino Atlas: The Living Reserve / First Light' --prerelease --notes-file dino-atlas/LIVING-RESERVE.md dino-spatial-console-evidence.tgz
          fi
