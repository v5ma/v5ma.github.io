name: Aether Bellwether district journey
on:
  push:
    branches: [feat/aether-bellwether-blackout-20260912]
    paths: ['aether-reach/**', '.github/workflows/aether-blackout.yml']
  pull_request:
    paths: ['aether-reach/**', '.github/workflows/aether-blackout.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aether-blackout-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  district:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate actual game source, saves, routes and canonical plan
        run: |
          set -euo pipefail
          mkdir -p aether-reach/test-output
          for f in aether-reach/*.mjs; do node --check "$f"; done
          node --test aether-reach/tests/*.test.mjs | tee aether-reach/test-output/blackout-node.log
          python aether-reach/tools/render-production-plan.py
          git diff --exit-code -- aether-reach/planning/AAA-ROADMAP.md
          node aether-reach/tests/release-manifest.mjs
      - name: Install actual test browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Play the street, Arcade, roof and return route through controller inputs
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/blackout-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python -u aether-reach/tests/bellwether-browser.py | tee aether-reach/test-output/blackout-browser.log
      - name: Preserve exact reviewed source and evidence
        if: always()
        run: |
          mkdir -p aether-reach/test-output
          git rev-parse HEAD > aether-reach/test-output/tested-commit.txt
          git diff --stat > aether-reach/test-output/uncommitted-diff.txt
          git archive --format=zip HEAD aether-reach index.html projects.css .github/workflows > aether-reach/test-output/blackout-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-bellwether-review
          path: aether-reach/test-output
          retention-days: 14
