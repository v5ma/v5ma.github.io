name: Prepare isolated Prism Tidal source
on:
  push:
    branches: [feat/prism-tidal-bloom-v040]
    paths: ['prism-current/tools/release-v040.py']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: prism-current
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the guarded game-only source changes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'feat/prism-tidal-bloom-v040'
          python prism-current/tools/release-v040.py
          mkdir -p test-output prism-current/qa
          node --test prism-current/tests/*.test.cjs > test-output/core.tap
          node prism-current/tests/audio-audit.cjs
          cp test-output/tidal-audio-audit.json prism-current/qa/tidal-v040-audio.json
          python prism-current/tests/verify.py
          git diff --name-only | grep -v '^prism-current/' > /tmp/outside-prism || true
          test ! -s /tmp/outside-prism
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prism-current
          git commit -m 'Integrate Tidal Bloom source, preserve legacy records and update the production checklist'
          git push origin HEAD:feat/prism-tidal-bloom-v040
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-tidal-preparation
          path: test-output/
          retention-days: 14
