name: Guild Open Doors HUD acceptance
on:
  pull_request:
    paths: ['leonardos-guild/doors.css','leonardos-guild/tests/doors-layout-browser.py','.github/workflows/guild-open-doors-layout.yml']
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix leonardos-guild test
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Committed-source native HUD regression
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/layout-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python -u leonardos-guild/tests/doors-layout-browser.py
          test -z "$(git diff --stat)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guild-open-doors-hud
          path: leonardos-guild/doors-layout-output/
          retention-days: 10
