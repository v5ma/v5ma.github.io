name: Sky Cycle paginated XR audit
on:
  push:
    branches: ['sky-cycle/waterwheel-xr-audit-0.23']
    paths:
      - 'mario-maker-clone/svgn-paper-route/tests/waterwheel-xr-browser.py'
      - '.github/workflows/sky-cycle-xr-page-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve source identity and compile the revised test
        run: |
          git rev-parse HEAD
          python -m py_compile mario-maker-clone/svgn-paper-route/tests/waterwheel-xr-browser.py
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise every pause page with the unchanged released game
        env:
          ARTIFACT_DIR: /tmp/waterwheel-paged-xr
        run: python mario-maker-clone/svgn-paper-route/tests/waterwheel-xr-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: waterwheel-paged-xr-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/waterwheel-paged-xr/
          retention-days: 30
          if-no-files-found: error
