name: Record Homecoming release evidence
on:
  push:
    branches: [neighborhood-homecoming-20260911]
    paths: ['.github/workflows/neighborhood-homecoming-record.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify completed acceptance and preserve exact reports
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os,json,time,re,io,zipfile,subprocess,urllib.request,urllib.error
          from pathlib import Path
          repo=os.environ['GH_REPO'];run_id=34674273108
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          base='https://api.github.com/repos/'+repo+'/'
          def api(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers),timeout=30) as r:return json.load(r)
          for _ in range(45):
              run=api('actions/runs/'+str(run_id))
              if run['status']=='completed':break
              time.sleep(10)
          assert run['status']=='completed' and run['conclusion']=='success', 'No evidence is recorded from a failed or unfinished run.'
          assert run['head_branch']=='neighborhood-homecoming-20260911'
          artifacts=api('actions/runs/'+str(run_id)+'/artifacts')['artifacts']
          artifact=next(a for a in artifacts if a['name']=='neighborhood-homecoming-evidence' and not a['expired'])
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,hdrs,newurl):return None
          opener=urllib.request.build_opener(NoRedirect)
          try:
              response=opener.open(urllib.request.Request(artifact['archive_download_url'],headers=headers),timeout=30)
              archive=response.read()
          except urllib.error.HTTPError as e:
              assert e.code in (301,302,303,307,308)
              # The GitHub token is deliberately NOT sent to the artifact storage host.
              with urllib.request.urlopen(e.headers['Location'],timeout=60) as r:archive=r.read()
          z=zipfile.ZipFile(io.BytesIO(archive))
          chapter=json.loads(z.read('homecoming-browser.json'))
          regression=json.loads(z.read('browser-release-report.json'))
          unit=z.read('model-tests.log').decode()
          tested=z.read('tested-commit.txt').decode().strip()
          assert re.fullmatch('[0-9a-f]{40}',tested)
          assert chapter['success'] and regression['success'] and not chapter['errors'] and not regression['errors']
          assert '# fail 0' in unit and '# pass 91' in unit
          if subprocess.run(['git','cat-file','-e',tested],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode:
              subprocess.run(['git','fetch','--depth=1','origin',tested],check=True)
          changes=subprocess.check_output(['git','diff','--name-only',tested,'HEAD'],text=True).splitlines()
          allowed=lambda p:p.startswith('.github/') or p.startswith('svgn-planet/production/') or p in ['svgn-planet/AAA_ROADMAP.md','svgn-planet/README.md']
          assert all(allowed(p) for p in changes), 'Untested gameplay changes cannot receive a release receipt: '+str(changes)
          P=Path('svgn-planet');E=P/'production/evidence';E.mkdir(parents=True,exist_ok=True)
          for name in ['homecoming-browser.json','browser-release-report.json','model-tests.log']:
              (E/('v0.8.0-'+name)).write_bytes(z.read(name))
          for name in ['plaza.jpg','journal.jpg','checklist.jpg','frame-report.jpg','roadmap-page.jpg']:
              if name in z.namelist():(E/('v0.8.0-'+name)).write_bytes(z.read(name))
          receipt={'version':'0.8.0','name':'Homecoming','testedCommit':tested,'acceptanceRun':run['html_url'],'automatedAcceptance':'passed','unitTests':91,'homecomingBrowserChecks':len(chapter['checks']),'coastalRegressionChecks':len(regression['checks']),'standaloneChecklist':chapter.get('standaloneChecklist',False),'uncaughtBrowserErrors':0,'physicalHardwareTested':False,'fpsTargetCertified':False,'publication':'Awaiting separate master/Pages deployment confirmation','testScope':'Pure model tests execute chapter progression. Browser tests use explicit local save fixtures for the finale and visual states, then verify real rendered UI, controller interactions and reloads. Gameplay checks run in Chromium with software WebGL, not a physical Xbox or gaming GPU.','priorFailedRuns':[{'run':34673687717,'reason':'Fixed-wall-time brake assertion did not allow the slow software simulation to stop.'},{'run':34673990286,'reason':'Holding D-pad down to open jobs leaked navigation into the menu. Added release-to-neutral entry handling and atomic test input edges.'}],'qualityBoundary':'Incremental stylized vertical slice. Hero models, fully playable interiors, art/fun approval and real-device frame targets remain open.'}
          (E/'v0.8.0.json').write_text(json.dumps(receipt,indent=2)+'\n')
          road=json.loads((P/'production/roadmap.json').read_text())
          completed={'MOVE-02','PERF-01','SLICE-01','SLICE-03'}
          for item in road['items']:
              if item['id'] in completed:item['status']='verified'
              if item['id']=='SLICE-02':
                  item['status']='partial'
                  item['next']='Automated state transitions passed and actual plaza captures are retained. Human art approval, useful interiors and richer authored assets remain open.'
              if item['id'] in completed|{'SLICE-02','MOVE-01','INPUT-01','SAVE-01','QA-01','ACCESS-01'}:
                  item['evidence'].append('evidence/v0.8.0.json')
              if item['id']=='QA-01':
                  item['acceptance']='Homecoming has 91 passing model/regression tests, '+str(len(chapter['checks']))+' Homecoming browser checks and '+str(len(regression['checks']))+' retained-game regression checks. These are emulated-controller software-WebGL results, not physical hardware approval.'
                  item['next']='Retain these permanent reports and add real-device, failure-recovery and soak evidence.'
              if item['id']=='INPUT-01':item['next']='Held directions now require neutral before navigating new menus. Complete Windows/browser plus physical Xbox USB and Bluetooth sessions.'
              if item['id']=='SLICE-01':item['next']='Measure actual duration with fresh players and improve the authored flow; 15 minutes remains a target, not a measured result.'
              if item['id']=='SLICE-03':item['next']='Retain exactly-once reward and reload checks in every future release.'
          road['releaseEvidence']='evidence/v0.8.0.json'
          (P/'production/roadmap.json').write_text(json.dumps(road,indent=2)+'\n')
          subprocess.run(['python','svgn-planet/production/render-roadmap.py'],check=True)
          print(json.dumps(receipt,indent=2))
          PY
      - name: Commit only evidence and generated checklist
        run: |
          git config user.name 'Micah Blumberg'
          git config user.email '60057241+v5ma@users.noreply.github.com'
          git add svgn-planet/production svgn-planet/AAA_ROADMAP.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record verified Homecoming acceptance and remaining AAA production gates'
            git push origin HEAD:neighborhood-homecoming-20260911
          fi
