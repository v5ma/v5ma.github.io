name: Rainward roadmap and cross-chat handoff
on:
  push:
    branches: [docs/rainward-resume-handoff-20260913]
    paths: ['rainward/**','.github/workflows/rainward-resume-handoff.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: rainward-resume-handoff
  cancel-in-progress: false
jobs:
  document:
    if: github.ref == 'refs/heads/docs/rainward-resume-handoff-20260913'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/rainward-resume-handoff-20260913
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve original Undertow publication documents before artifact expiry
        uses: actions/download-artifact@v4
        with:
          name: rainward-publication
          run-id: 34738570590
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/rainward-historical-receipt
      - name: Verify historical bytes and update the canonical checklist
        run: |
          python - <<'PY'
          import json,hashlib,shutil
          from pathlib import Path
          dest=Path('rainward/evidence/undertow-v0.13.0');summary=json.loads((dest/'summary.json').read_text())
          for name,key in [('rainward-publication.json','receipt_sha256'),('rainward-source-manifest.json','manifest_sha256')]:
              p=Path('/tmp/rainward-historical-receipt')/name
              assert hashlib.sha256(p.read_bytes()).hexdigest()==summary['publication'][key]
              shutil.copyfile(p,dest/name)
          PY
          python rainward/tools/update-resume-handoff.py
      - name: Verify source and all current model/doc regressions
        run: |
          set -o pipefail
          mkdir -p test-output
          python -m compileall -q rainward/tools rainward/tests
          for f in rainward/*.mjs; do node --check "$f"; done
          node --test rainward/tests/*.test.mjs | tee test-output/rainward-handoff-tests.txt
          cp rainward/AAA_CHECKLIST.md /tmp/rainward-checklist-before.md
          python rainward/tools/build-production-plan.py
          cmp /tmp/rainward-checklist-before.md rainward/AAA_CHECKLIST.md
      - name: Test the actual roadmap interface
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/rainward-doc-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          python -u rainward/tests/handoff-board.py
      - name: Prove game runtime and sibling applications are untouched
        run: |
          git fetch --no-tags --depth=1 origin a43d01ddd75ac7c07280e660f7dcba2282214c8f
          python - <<'PY'
          import subprocess
          base='a43d01ddd75ac7c07280e660f7dcba2282214c8f'
          changed=set(subprocess.check_output(['git','diff','--name-only',base],text=True).splitlines())
          changed.update(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          changed={n for n in changed if not n.startswith('test-output/')}
          allowed={'rainward/AGENTS.md','rainward/DEVELOPMENT-HANDOFF.md','rainward/CONTROLLER.md','rainward/README.md','rainward/AAA_CHECKLIST.md','rainward/production-plan.json','rainward/roadmap.html','rainward/roadmap.mjs','rainward/tools/roadmap.html.template','rainward/tools/build-production-plan.py','rainward/tools/update-resume-handoff.py','rainward/tests/handoff.test.mjs','rainward/tests/handoff-board.py','.github/workflows/rainward-resume-handoff.yml'}
          assert all(n in allowed or n.startswith('rainward/evidence/undertow-v0.13.0/') for n in changed),sorted(changed-allowed)
          print('Scoped documentation-only changes:',len(changed))
          PY
      - name: Commit the verified documentation and archive only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rainward
          if ! git diff --cached --quiet; then
            git commit -m 'Update Rainward roadmap, current controls and durable cross-chat handoff'
            git push origin HEAD:docs/rainward-resume-handoff-20260913
          fi
          git rev-parse HEAD > test-output/tested-documentation-commit.txt
      - name: Preserve documentation acceptance evidence
        if: always()
        run: |
          mkdir -p test-output
          python rainward/tests/release.py
          tar -czf test-output/rainward-handoff-source.tgz rainward
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainward-resume-handoff
          path: test-output/
          retention-days: 14
