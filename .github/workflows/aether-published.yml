name: Verify published Aether Reach
on:
  push:
    branches: [master]
    paths: ['aether-reach/**','index.html','projects.css','.github/workflows/aether-published.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate explicit public runtime contract
        run: node aether-reach/tests/release-manifest.mjs
      - name: Compare hosted application with committed source
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,time,urllib.request,subprocess
          expected=json.loads(Path('aether-reach/test-output/runtime-manifest.json').read_text())['files'];result={}
          revision=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          for attempt in range(45):
            for n in expected:
              if result.get(n,{}).get('match'):continue
              try:
                with urllib.request.urlopen('https://v5ma.github.io/'+n+'?aether='+revision[:12],timeout=15) as r:
                  got=hashlib.sha256(r.read()).hexdigest();result[n]={'status':r.status,'sha256':got,'match':got==expected[n]}
              except Exception as e:result[n]={'match':False,'error':str(e)}
            if len(result)==len(expected) and all(x.get('match') for x in result.values()):break
            time.sleep(6)
          passed=len(result)==len(expected) and all(x.get('match') for x in result.values())
          Path('aether-publication.json').write_text(json.dumps({'source':revision,'all_match':passed,'files':result},indent=2))
          assert passed,result
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-publication
          path: |
            aether-publication.json
            aether-reach/test-output/runtime-manifest.json
          retention-days: 14
