name: Integrate Aether Bellwether Blackout
on:
  push:
    branches: [feat/aether-bellwether-blackout-20260912]
    paths: ['.github/workflows/aether-blackout-integrate.yml']
permissions:
  contents: write
concurrency:
  group: aether-blackout-integration
  cancel-in-progress: true
jobs:
  integrate:
    if: github.repository == 'v5ma/v5ma.github.io' && github.ref == 'refs/heads/feat/aether-bellwether-blackout-20260912'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aether-bellwether-blackout-20260912
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and apply the source integration
        run: python aether-reach/tools/apply-blackout.py
      - name: Regress the complete game
        run: |
          set -euo pipefail
          for f in aether-reach/*.mjs; do node --check "$f"; done
          node --test aether-reach/tests/*.test.mjs | tee aether-reach/test-output/blackout-node.log
          node aether-reach/tests/release-manifest.mjs
      - name: Commit only the tested integration and remove bootstrap transport
        run: |
          set -euo pipefail
          rm aether-reach/tools/blackout-patch-{0,1}.json aether-reach/tools/apply-blackout.py .github/workflows/aether-blackout-integrate.yml
          git add -A -- aether-reach .github/workflows/aether-blackout-integrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement Aether Reach 0.9.0 Bellwether Blackout and current production plan'
          git push origin HEAD:feat/aether-bellwether-blackout-20260912
      - name: Record the exact tested revision
        if: always()
        run: |
          mkdir -p aether-reach/test-output
          git rev-parse HEAD > aether-reach/test-output/tested-commit.txt
          git diff --stat > aether-reach/test-output/uncommitted-diff.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-blackout-integration
          path: aether-reach/test-output
          retention-days: 14
