name: Verify Cloudview art and sky gameplay
on:
  push:
    branches: [feat/cloudview-art-20260904]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cloudview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  art-and-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Integrate owned renderer changes
        run: |
          python scripts/prepare-cloudview.py
          python scripts/polish-cloudview.py
          python scripts/guard-cloudview.py
      - name: Record integrated source on the art branch
        if: github.ref == 'refs/heads/feat/cloudview-art-20260904'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- mario-maker-clone/svgn-paper-route/index.html mario-maker-clone/svgn-paper-route/sky-game.js mario-maker-clone/svgn-paper-route/sw.js mario-maker-clone/svgn-paper-route/cloudview-world.js mario-maker-clone/svgn-paper-route/delivery-upgrade.js tests/cloudview_visual.py
          if ! git diff --cached --quiet; then git commit -m 'Integrate Cloudview art, camera and HUD'; git push origin HEAD:${GITHUB_REF_NAME}; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and existing source tests
        run: |
          node --check mario-maker-clone/svgn-paper-route/cloudview-world.js
          node --check mario-maker-clone/svgn-paper-route/cloudview-ui.js
          node --test dino-atlas/tests/unit.test.mjs tests/interactive.test.mjs tests/sky_routes.test.mjs
      - name: Install visual test browser
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Capture art and replay a real loop transfer
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/cloudview-server.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python tests/cloudview_visual.py
      - name: Record tested source
        if: always()
        run: |
          mkdir -p test-output/cloudview
          git rev-parse HEAD > test-output/cloudview/tested-commit.txt
          git diff --stat > test-output/cloudview/uncommitted-diff.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudview-visual
          path: test-output/cloudview/
          retention-days: 7
      - name: Replay all original sky courses in 3D
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/cloudview-replay-server.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python tests/sky_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudview-sky-replays
          path: test-output/sky/
          retention-days: 7
