name: Verify published Dino AAA Vertical Slice
on:
  push:
    branches: [master]
    paths: ['dino-atlas/**', '.github/workflows/dino-aaa-published.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dino-aaa-live
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            dino-atlas
          persist-credentials: false
      - name: Match the deployed story modules against the checked-out source
        run: |
          python - <<'PY'
          from pathlib import Path
          import time,urllib.request,os,hashlib,json
          files=['dino-atlas/aaa-director.js','dino-atlas/storm-mission.js']
          expected={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files}
          for _ in range(42):
              bad=[]
              for path,digest in expected.items():
                  try:
                      url='https://v5ma.github.io/'+path+'?verify='+os.environ['GITHUB_SHA']
                      request=urllib.request.Request(url,headers={'Cache-Control':'no-cache'})
                      actual=urllib.request.urlopen(request,timeout=25).read()
                      if hashlib.sha256(actual).hexdigest()!=digest:bad.append(path)
                  except Exception:bad.append(path)
              if not bad:break
              print('Waiting for current story module bytes:',bad,flush=True);time.sleep(8)
          else:raise SystemExit('Story modules did not match the checked-out source')
          Path('aaa-evidence').mkdir(exist_ok=True)
          Path('aaa-evidence/public-story-bytes.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'sha256':expected},indent=2))
          print('Current director and mission modules match GitHub Pages')
          PY
      - name: Install native browser runner
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Exercise live published Storm Response
        env:
          DINO_TEST_BASE: https://v5ma.github.io/dino-atlas/
        run: python dino-atlas/tests/aaa-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dino-aaa-live-evidence
          path: aaa-evidence
          retention-days: 7
