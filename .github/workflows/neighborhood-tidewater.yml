name: Neighborhood Missions Tidewater acceptance
on:
  push:
    branches: [neighborhood-tidewater-20260913]
    paths: ['svgn-planet/**', '.github/workflows/neighborhood-tidewater.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: neighborhood-tidewater-candidate
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate only the existing Neighborhood Missions game
        run: |
          python svgn-planet/tools/integrate-tidewater.py
          python svgn-planet/production/render-roadmap.py
          git config user.name 'Micah Blumberg'
          git config user.email '60057241+v5ma@users.noreply.github.com'
          git add svgn-planet
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate playable Tidewater pool, skiff and boardwalk missions'
            git push origin HEAD:neighborhood-tidewater-20260913
          fi
      - name: Model, shader, saved-progress and old-game tests
        run: |
          mkdir -p tidewater-results
          git rev-parse HEAD > tidewater-results/tested-commit.txt
          for file in svgn-planet/*.mjs; do node --check "$file"; done
          set -o pipefail
          node --test svgn-planet/tests/*.test.mjs | tee tidewater-results/model-tests.log
      - name: Install native browser test tools
        run: |
          python -m pip install playwright==1.55.0 pillow
          python -m playwright install --with-deps chromium
      - name: Water mission and shader controller journey
        run: |
          python -m http.server 8765 >/tmp/tidewater-server.log 2>&1 &
          sleep 2
          set -o pipefail
          python svgn-planet/tests/tidewater-browser.py | tee tidewater-results/water-browser.log
          COASTAL_OUTPUT=tidewater-results python svgn-planet/tests/coastal_browser_release.py | tee tidewater-results/coastal-regression.log
          HOMECOMING_OUTPUT=tidewater-results python svgn-planet/tests/homecoming_browser.py | tee tidewater-results/homecoming-regression.log
      - name: Preserve tested source, reports and actual scene captures
        if: always()
        run: |
          mkdir -p tidewater-results/source
          cp svgn-planet/*.mjs svgn-planet/*.css svgn-planet/index.html svgn-planet/TIDEWATER.md svgn-planet/release.json tidewater-results/source/
          cp -r svgn-planet/tests svgn-planet/production tidewater-results/source/
          python - <<'PY'
          from pathlib import Path
          try:
              from PIL import Image
              for p in Path('tidewater-results').glob('*.png'):
                  im=Image.open(p).convert('RGB');im.thumbnail((1120,840));im.save(p.with_suffix('.jpg'),quality=86)
          except ImportError:pass
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neighborhood-tidewater-evidence
          path: tidewater-results
          retention-days: 30
