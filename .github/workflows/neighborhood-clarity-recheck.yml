name: Neighborhood clarity independent verification
on:
  push:
    branches: [neighborhood-missions/clarity-verification-20260920]
    paths: ['.github/workflows/neighborhood-clarity-recheck.yml']
permissions:
  contents: read
concurrency:
  group: neighborhood-clarity-independent
  cancel-in-progress: true
env:
  SOURCE: d222c62b326a9f2d847789984f2e345fb7706a94
  PYTHONIOENCODING: utf-8
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
jobs:
  source:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d222c62b326a9f2d847789984f2e345fb7706a94
          persist-credentials: false
          sparse-checkout: |
            svgn-planet
            little-planet
            level-design-library/applied
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Archive exact source and run all models without altering game state
        shell: python
        run: |
          import glob,hashlib,json,os,pathlib,subprocess,zipfile
          root=pathlib.Path('svgn-planet')
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert commit==os.environ['SOURCE']
          pathlib.Path('SOURCE-COMMIT.txt').write_text(commit+'\n')
          with zipfile.ZipFile('clarity-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for folder in ['svgn-planet','little-planet','level-design-library/applied','.github/workflows']:
                  for p in pathlib.Path(folder).rglob('*'):
                      if p.is_file():z.write(p,p.as_posix())
              z.write('SOURCE-COMMIT.txt')
          files=[]
          for pattern in ['svgn-planet/tests/*.test.mjs','svgn-planet/design/chapter-contract.test.mjs','svgn-planet/lantern/*.test.mjs','svgn-planet/*.test.mjs']:files.extend(glob.glob(pattern))
          with open('clarity-model.txt','w',encoding='utf-8') as log:
              subprocess.run(['node','--test',*files],stdout=log,stderr=subprocess.STDOUT,check=True)
          legacy=json.loads((root/'legacy-layout.json').read_text())
          for row in legacy['files']:assert hashlib.sha256((root/row['path']).read_bytes()).hexdigest()==row['sha256'],row['path']
          print('All',len(legacy['files']),'legacy file hashes match')
      - name: Install real browser
        shell: python
        run: |
          import subprocess,sys
          subprocess.run([sys.executable,'-m','pip','install','playwright==1.55.0','pillow'],check=True)
          subprocess.run([sys.executable,'-m','playwright','install','chromium'],check=True)
      - name: Actual native mission card, controls, map and exit journey
        shell: python
        env:
          CONSOLE_MODE: diorama-third-ar
        run: |
          import subprocess,sys,time,urllib.request
          with open('server.log','w',encoding='utf-8') as log:
              server=subprocess.Popen([sys.executable,'-u','-m','http.server','8765','--bind','127.0.0.1'],stdout=log,stderr=subprocess.STDOUT)
              try:
                  for attempt in range(30):
                      try:
                          with urllib.request.urlopen('http://127.0.0.1:8765/svgn-planet/',timeout=2) as r:assert r.status==200
                          break
                      except Exception:
                          if attempt==29:raise
                          time.sleep(1)
                  subprocess.run([sys.executable,'svgn-planet/console-browser.py'],check=True)
              finally:server.terminate();server.wait(timeout=10)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clarity-independent-source
          path: |
            clarity-source.zip
            clarity-model.txt
            SOURCE-COMMIT.txt
            console-results/
            server.log
          retention-days: 30
  public:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d222c62b326a9f2d847789984f2e345fb7706a94
          persist-credentials: false
          sparse-checkout: |
            svgn-planet
            level-design-library/applied
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently compare the complete served game closure
        shell: python
        run: |
          import concurrent.futures,hashlib,json,os,pathlib,time,urllib.request
          root=pathlib.Path('svgn-planet');base='https://v5ma.github.io/';commit=os.environ['SOURCE']
          paths=sorted(p for p in root.rglob('*') if p.is_file() and not any(x.startswith('.') or x in ('tests','tools','node_modules','__pycache__') for x in p.relative_to(root).parts) and p.suffix not in ('.py','.pyc'))
          paths.extend(pathlib.Path('level-design-library/applied')/name for name in ['NEIGHBORHOOD-MISSIONS-WORKING-QUAY.md','NEIGHBORHOOD-MISSIONS-LIVING-PORTAL.md','NEIGHBORHOOD-MISSIONS-NIGHT-WATCH.md','NEIGHBORHOOD-MISSIONS-NIGHT-WATCH-CAMPAIGN.md'])
          expected={p.as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in paths};rows={}
          out=pathlib.Path('clarity-public');out.mkdir(exist_ok=True)
          def check(path):
              row={'path':path,'expected':expected[path],'matches':False}
              try:
                  req=urllib.request.Request(base+path+'?source='+commit+'&nocache='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=20) as response:
                      assert response.status==200
                      data=response.read()
                  row.update(sha256=hashlib.sha256(data).hexdigest(),bytes=len(data));row['matches']=row['sha256']==row['expected']
              except Exception as e:row['error']=str(e)
              return row
          def record():
              receipt={'commit':commit,'version':'0.16.1','revision':'mission-clarity','scope':'Exact main game, district, legacy and applied design closure. No sibling paths.','files':[rows[k] for k in sorted(rows)],'success':len(rows)==len(paths) and all(r['matches'] for r in rows.values())}
              (out/'bytes.json').write_text(json.dumps(receipt,indent=2),encoding='utf-8')
              return receipt['success']
          deadline=time.monotonic()+1500
          while time.monotonic()<deadline:
              pending=[p for p in expected if not rows.get(p,{}).get('matches')]
              if not pending:break
              with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
                  for row in pool.map(check,pending):rows[row['path']]=row
              print('Verified',sum(r['matches'] for r in rows.values()),'of',len(paths),flush=True)
              if record():break
              time.sleep(10)
          assert record(),'Actual served files still differ; do not claim publication'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clarity-independent-public
          path: clarity-public/
          retention-days: 30
