name: Neighborhood mission focus independent verification
on:
  push:
    branches: [neighborhood-missions/mission-focus-verify-20260921]
    paths: ['.github/workflows/neighborhood-clarity-recheck.yml']
permissions:
  contents: read
concurrency:
  group: neighborhood-focus-independent
  cancel-in-progress: true
env:
  SOURCE: b38d54f58f98acc9b39c8c9fbd809cfa577ae759
  PYTHONIOENCODING: utf-8
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
jobs:
  source:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b38d54f58f98acc9b39c8c9fbd809cfa577ae759
          persist-credentials: false
          sparse-checkout: |
            svgn-planet
            little-planet
            level-design-library/applied
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Archive exact source and run all model and legacy checks
        shell: python
        run: |
          import glob,hashlib,json,os,pathlib,subprocess,zipfile
          root=pathlib.Path('svgn-planet')
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert commit==os.environ['SOURCE']
          pathlib.Path('SOURCE-COMMIT.txt').write_text(commit+'\n')
          with zipfile.ZipFile('focus-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for folder in ['svgn-planet','little-planet','level-design-library/applied','.github/workflows']:
                  for p in pathlib.Path(folder).rglob('*'):
                      if p.is_file():z.write(p,p.as_posix())
              z.write('SOURCE-COMMIT.txt');z.write('index.html')
          files=[]
          for pattern in ['svgn-planet/tests/*.test.mjs','svgn-planet/design/chapter-contract.test.mjs','svgn-planet/lantern/*.test.mjs','svgn-planet/*.test.mjs']:files.extend(glob.glob(pattern))
          with open('focus-model.txt','w',encoding='utf-8') as log:
              subprocess.run(['node','--test',*files],stdout=log,stderr=subprocess.STDOUT,check=True)
          legacy=json.loads((root/'legacy-layout.json').read_text())
          for row in legacy['files']:assert hashlib.sha256((root/row['path']).read_bytes()).hexdigest()==row['sha256'],row['path']
          print('All',len(legacy['files']),'legacy file hashes match')
      - name: Install browser
        shell: python
        run: |
          import subprocess,sys
          subprocess.run([sys.executable,'-m','pip','install','playwright==1.55.0','pillow'],check=True)
          subprocess.run([sys.executable,'-m','playwright','install','chromium'],check=True)
      - name: Real renderer, focus, controller and hand console journey
        shell: python
        env:
          CONSOLE_MODE: diorama-third-ar
        run: |
          import hashlib,pathlib,subprocess,sys,time,urllib.request
          with open('server.log','w',encoding='utf-8') as log:
              server=subprocess.Popen([sys.executable,'-u','svgn-planet/tests/serve-modules.py','--port','8765'],stdout=log,stderr=subprocess.STDOUT)
              try:
                  for attempt in range(30):
                      try:
                          with urllib.request.urlopen('http://127.0.0.1:8765/svgn-planet/',timeout=2) as r:assert r.status==200
                          break
                      except Exception:
                          if attempt==29:raise
                          time.sleep(1)
                  with urllib.request.urlopen('http://127.0.0.1:8765/svgn-planet/native-menu-focus.mjs',timeout=5) as r:
                      assert r.headers.get_content_type() in ('text/javascript','application/javascript')
                      assert r.read()==pathlib.Path('svgn-planet/native-menu-focus.mjs').read_bytes()
                  subprocess.run([sys.executable,'svgn-planet/console-browser.py'],check=True)
              finally:server.terminate();server.wait(timeout=10)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focus-independent-source
          path: |
            focus-source.zip
            focus-model.txt
            SOURCE-COMMIT.txt
            console-results/
            server.log
          retention-days: 30
  public:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b38d54f58f98acc9b39c8c9fbd809cfa577ae759
          persist-credentials: false
          sparse-checkout: |
            svgn-planet
            level-design-library/applied
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare all served files and actual revisioned entry URLs
        shell: python
        run: |
          import concurrent.futures,hashlib,json,os,pathlib,re,time,urllib.request
          root=pathlib.Path('svgn-planet');base='https://v5ma.github.io/';commit=os.environ['SOURCE']
          paths=sorted(p for p in root.rglob('*') if p.is_file() and not any(x.startswith('.') or x in ('tests','tools','node_modules','__pycache__') for x in p.relative_to(root).parts) and p.suffix not in ('.py','.pyc'))
          paths.extend(pathlib.Path('level-design-library/applied')/name for name in ['NEIGHBORHOOD-MISSIONS-WORKING-QUAY.md','NEIGHBORHOOD-MISSIONS-LIVING-PORTAL.md','NEIGHBORHOOD-MISSIONS-NIGHT-WATCH.md','NEIGHBORHOOD-MISSIONS-NIGHT-WATCH-CAMPAIGN.md'])
          expected={p.as_posix():{'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'sourcePath':p.as_posix(),'kind':'file'} for p in paths}
          html=(root/'index.html').read_text(encoding='utf-8');imports=json.loads(re.search(r'<script type="importmap">(.*?)</script>',html,re.S).group(1))['imports']
          expected['svgn-planet/?build=mission-focus-1']={**expected['svgn-planet/index.html'],'kind':'entry-alias'}
          for target in imports.values():
              if 'rev=mission-focus-1' not in target:continue
              path='svgn-planet/'+target.removeprefix('./');sourcePath=path.split('?',1)[0]
              expected[path]={**expected[sourcePath],'kind':'revision-alias'}
          rows={};out=pathlib.Path('focus-public');out.mkdir(exist_ok=True)
          def check(path):
              spec=expected[path];row={'path':path,**spec,'matches':False}
              try:
                  sep='&' if '?' in path else '?'
                  req=urllib.request.Request(base+path+sep+'source='+commit+'&nocache='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=20) as response:
                      assert response.status==200
                      data=response.read();mime=response.headers.get_content_type()
                  row.update(actualSHA256=hashlib.sha256(data).hexdigest(),bytes=len(data),contentType=mime)
                  row['matches']=row['actualSHA256']==spec['sha256'] and (not spec['sourcePath'].endswith('.mjs') or mime in ('text/javascript','application/javascript'))
              except Exception as e:row['error']=str(e)
              return row
          def record():
              ok=len(rows)==len(expected) and all(r['matches'] for r in rows.values())
              receipt={'commit':commit,'version':'0.16.1','revision':'mission-focus-1','scope':'Exact current game, legacy and applied design closure plus main URL and revisioned UI modules. No sibling paths.','fileCount':len(paths),'aliasCount':len(expected)-len(paths),'files':[rows[k] for k in sorted(rows)],'success':ok}
              (out/'bytes.json').write_text(json.dumps(receipt,indent=2),encoding='utf-8');return ok
          deadline=time.monotonic()+1500
          while time.monotonic()<deadline:
              pending=[p for p in expected if not rows.get(p,{}).get('matches')]
              if not pending:break
              with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
                  for row in pool.map(check,pending):rows[row['path']]=row
              print('Verified',sum(r['matches'] for r in rows.values()),'of',len(expected),flush=True)
              if record():break
              time.sleep(10)
          assert record(),'Served files or module MIME differ; publication is not verified'
      - name: Install public browser harness
        shell: python
        run: |
          import subprocess,sys
          subprocess.run([sys.executable,'-m','pip','install','playwright==1.55.0','pillow'],check=True)
          subprocess.run([sys.executable,'-m','playwright','install','chromium'],check=True)
      - name: Run the same complete console journey on the public main URL
        shell: python
        env:
          CONSOLE_MODE: diorama-third-ar
          CONSOLE_BASE: https://v5ma.github.io/svgn-planet/?build=mission-focus-1
          CONSOLE_OUT: focus-public/console-results
        run: |
          import subprocess,sys
          subprocess.run([sys.executable,'svgn-planet/console-browser.py'],check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focus-independent-public
          path: focus-public/
          retention-days: 30
