name: Rainward Wayfinder scoped preparation
on:
  push:
    branches: [feat/rainward-wayfinder-20260915]
    paths: ['rainward/tools/apply-wayfinder.py', '.github/workflows/rainward-wayfinder-prepare.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rainward-wayfinder-20260915
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the locally checked scoped patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-output
          python rainward/tools/apply-wayfinder.py
          node --test rainward/tests/*.test.mjs | tee test-output/node-models.txt
          python -m py_compile rainward/tests/wayfinder-browser.py rainward/tests/recut-browser.py
      - name: Commit source and remove this one-time preparation tool
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rainward/xr-input.mjs rainward/xr-panel.mjs rainward/quest-xr.mjs rainward/hud.mjs rainward/floodgate-recut-art.mjs rainward/tests/recut-browser.py rainward/world.mjs rainward/index.html rainward/tests/aquatic.test.mjs rainward/tests/reclaimed.test.mjs rainward/tests/handoff.test.mjs rainward/release.json rainward/production-plan.json rainward/README.md rainward/CONTROLLER.md rainward/DEVELOPMENT-HANDOFF.md rainward/AAA_CHECKLIST.md
          git rm rainward/tools/apply-wayfinder.py .github/workflows/rainward-wayfinder-prepare.yml
          git commit -m 'Integrate Wayfinder v0.14.1 route cues and owned XR holds; remove preparation tooling'
          git push origin HEAD:feat/rainward-wayfinder-20260915
          git rev-parse HEAD > test-output/tested-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainward-wayfinder-models
          path: test-output/
          retention-days: 14
