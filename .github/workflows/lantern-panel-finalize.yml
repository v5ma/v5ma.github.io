name: Lantern spatial sightline verification
on:
  push:
    branches: [neighborhood-missions/lantern-ward-playable-20260915]
    paths: ['.github/workflows/lantern-panel-finalize.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            svgn-planet
            little-planet
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: source
        name: Apply scoped reviewed presentation fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          root=Path('svgn-planet/lantern')
          before={'xr.mjs':'0f9b8f600120ab218bf2a62228c3dc2cca0eba995de30e5daeeae46c8e2e355f','xr-fixture.js':'020ae86cafaabb84e08f46290a8551167eed67b9e51c317d405aaecf0785d3bf','browser.py':'41e6384af8a6d519d02e91dbd78a3e0ac70416306fe9fb5e810ee3317ea2f1d8'}
          after={'xr.mjs':'926ab1b0c18ffaa05ec4a70b101b411f3636062fddb353803fe0a5f4ed5a11b6','xr-fixture.js':'df8e553cc330a10f0e86ea71b59936bfb2c6087b02fe03810b76528e0b0d3f09','browser.py':'9f375957e62d8f6533146496aaed6a4bacb56edca7df543bc19b04d99b4efac1'}
          for f,sha in before.items():assert hashlib.sha256((root/f).read_bytes()).hexdigest()==sha,f
          edits=[
          ('xr.mjs','panel.position.set(0,paused?-.1:-.65,paused?-1.6:-1.5);panel.scale.setScalar(paused?1:.73);','panel.visible=paused||Array.from(session.inputSources).some(s=>s.hand);panel.position.set(paused?0:-.72,paused?-.1:-.28,paused?-1.6:-1.2);panel.scale.setScalar(paused?1:.45);'),
          ('xr.mjs','const hit=caster.intersectObject(panel)[0]','const hit=panel.visible?caster.intersectObject(panel)[0]:null'),
          ('xr.mjs','input:{...input},headBoundary:','input:{...input},actionPanelVisible:panel.visible,headBoundary:'),
          ('xr-fixture.js',"const frame={getViewerPose:()=>data.viewer?{transform:ident(),views:[{eye:'left',transform:ident(-.032),projectionMatrix:projection},{eye:'right',transform:ident(.032),projectionMatrix:projection}]}:null","const head=(x=0)=>{const a=data.viewerPitch||0,c=Math.cos(a),s=Math.sin(a);return {position:{x,y:0,z:0,w:1},orientation:{x:Math.sin(a/2),y:0,z:0,w:Math.cos(a/2)},matrix:new Float32Array([1,0,0,0,0,c,s,0,0,-s,c,0,x,0,0,1])};};\n const frame={getViewerPose:()=>data.viewer?{transform:head(),views:[{eye:'left',transform:head(-.032),projectionMatrix:projection},{eye:'right',transform:head(.032),projectionMatrix:projection}]}:null"),
          ('browser.py',"await choose('Resume');await xrframes();await shot('xr-world');","await choose('Resume');await xrframes();assert not (await state())['xr']['actionPanelVisible'];await page.evaluate('__xrFixture.viewerPitch=-.45');await xrframes();await shot('xr-world');await page.evaluate('__xrFixture.viewerPitch=0');await xrframes();ok('Controller play keeps the miniature clear; native head tilt reveals its depth');"),
          ('browser.py',"ok('Joint-pinch UI resumes without a controller');before=","ok('Joint-pinch UI resumes without a controller');assert (await state())['xr']['actionPanelVisible'];await shot('xr-hand-actions');before="),
          ('browser.py',"if ROUTE=='canal':\n     for x,z in [[0,18]","if ROUTE=='street':\n     for x,z in [[0,18],[5,18],[6,-8]]:await pilot(x,z)\n     await press(2);assert (await state())['state']['hoist'];await pilot(6.8,.5);await press(2);await wait('LanternWard.inspect().state.lift===null&&LanternWard.inspect().state.y>4.3');await pilot(10,.5);await shot('hoist-loft');ok('Repaired open-shaft hoist carries the courier and exits onto the real loft')\n    if ROUTE=='canal':\n     for x,z in [[0,18]")]
          for name,a,b in edits:
              p=root/name;s=p.read_text();assert s.count(a)==1,(name,a);p.write_text(s.replace(a,b))
          for f,sha in after.items():assert hashlib.sha256((root/f).read_bytes()).hexdigest()==sha,f
          paths=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert set(paths)=={'svgn-planet/lantern/'+p for p in before},paths
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',*paths],check=True)
          subprocess.run(['git','commit','-m','fix(neighborhood): keep controller diorama view clear and place hand actions beside the world'],check=True)
          subprocess.run(['git','push','origin','HEAD:neighborhood-missions/lantern-ward-playable-20260915'],check=True)
          PY
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          set -o pipefail
          node --test svgn-planet/tests/*.test.mjs svgn-planet/design/chapter-contract.test.mjs svgn-planet/lantern/*.test.mjs | tee lantern-model.txt
          git rev-parse HEAD > SOURCE-COMMIT.txt
          tar -czf lantern-source.tar.gz svgn-planet little-planet index.html SOURCE-COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lantern-final-source
          path: |
            lantern-source.tar.gz
            lantern-model.txt
          retention-days: 30
  browser:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        route: [street, xr]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
          sparse-checkout: |
            svgn-planet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.55.0 pillow
          python -m playwright install --with-deps chromium
      - env:
          WARD_ROUTE: ${{ matrix.route }}
        run: |
          python -m http.server 8765 > server.log 2>&1 &
          python svgn-planet/lantern/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lantern-final-${{ matrix.route }}
          path: |
            ward-results/
            server.log
          retention-days: 30
