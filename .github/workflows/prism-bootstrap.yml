name: Finalize isolated Prism Current homepage entry
on:
  push:
    branches: [feat/prism-current-ar-rhythm]
    paths: [.github/workflows/prism-bootstrap.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prism-current-ar-rhythm
          sparse-checkout: |
            prism-current
            .github
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add one card without changing existing homepage content
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('index.html')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='9294c2e191f585ccc13841c3eb451e79eed0732f','Homepage changed: review before integration'
          old=p.read_text()
          marker='<section class="projects" aria-label="Interactive projects">\n'
          assert old.count(marker)==1 and 'id="prism-launch"' not in old
          card='<article class="project prism-current"><a class="art" href="./prism-current/index.html" tabindex="-1" aria-hidden="true" style="background:#111e32"><img src="./prism-current/cover.svg" width="640" height="360" alt="" style="display:block;width:100%;height:auto"><span class="art-label">TWO BLADES. YOUR ROOM. YOUR RHYTHM.</span></a><div class="project-copy"><p class="eyebrow">NEW / A-FRAME RHYTHM + PASSTHROUGH AR PREVIEW</p><h2>Prism<br>Current</h2><p>Slice luminous notes to original music. Find your flow in a browser, or try a stationary mixed-reality stage with tracked controllers. Quest 3 physical testing remains open.</p><a id="prism-launch" class="primary-link" href="./prism-current/index.html">Play Prism Current <span aria-hidden="true">&rarr;</span></a><a class="secondary-link" href="./prism-current/ROADMAP.md">Roadmap, controls and headset-testing boundaries</a></div></article>\n'
          new=old.replace(marker,marker+card,1)
          assert new.replace(card,'',1)==old
          p.write_text(new)
          for n in ['.github/workflows/prism-source-audit.yml','.github/workflows/prism-bootstrap.yml']:
            Path(n).unlink(missing_ok=True)
          PY
          node --test prism-current/tests/core.test.cjs
          python prism-current/tests/verify.py
      - name: Commit only the verified entry and removal of one-time setup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/prism-bootstrap.yml .github/workflows/prism-source-audit.yml
          git commit -m 'Link Prism Current from the public collection; remove one-time setup'
          git push origin HEAD:feat/prism-current-ar-rhythm
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
