name: Apply reviewed Waterwheel chapter preview
on:
  push:
    branches: ['sky-cycle/waterwheel-chapter-0.23']
    paths: ['.github/workflows/sky-cycle-waterwheel-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact patch and preserve the scoped branch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, lzma, hashlib
          encoded=''.join(Path(f'.github/waterwheel-design-{i}.b64').read_text().strip() for i in range(3))
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest() == '498dc9efcee5fb336f4496f2bc2acfceb147a62f71070fa7364d5004662c0be5'
          for line in patch.decode().splitlines():
              if line.startswith('diff --git '):
                  for name in line.split()[2:]:
                      assert name[2:].startswith('mario-maker-clone/svgn-paper-route/'), name
          Path('/tmp/waterwheel-reviewed.patch').write_bytes(patch)
          print('Verified patch:',hashlib.sha256(patch).hexdigest())
          PY
          git apply --check --unidiff-zero /tmp/waterwheel-reviewed.patch
          git apply --index --unidiff-zero /tmp/waterwheel-reviewed.patch
          git rm .github/waterwheel-design-{0,1,2}.b64 .github/workflows/sky-cycle-waterwheel-apply.yml
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(sky-cycle): authored Waterwheel preview and canonical chapter methodology'
          git push origin HEAD:refs/heads/sky-cycle/waterwheel-chapter-0.23
          git rev-parse HEAD
