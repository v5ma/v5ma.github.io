name: Sky Cycle design source snapshot
on:
  push:
    branches: ['sky-cycle/quiet-water-0.22']
    paths: ['.github/workflows/sky-cycle-design-source.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '8675f34d85ec3999e9a1279948d2e0d099578ecf'
          persist-credentials: false
          sparse-checkout: |
            .github
            tests
            mario-maker-clone
      - name: Retain pinned runtime, authoring tools and test contracts
        run: |
          mkdir -p /tmp/sky-cycle-design-source
          git rev-parse HEAD > /tmp/sky-cycle-design-source/commit.txt
          git ls-tree -r --name-only HEAD | grep -E '(^|/)AGENTS.md$' > /tmp/sky-cycle-design-source/agent-paths.txt || true
          git archive HEAD .github tests mario-maker-clone | gzip > /tmp/sky-cycle-design-source/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sky-cycle-design-source-8675f34
          path: /tmp/sky-cycle-design-source/
          retention-days: 30
