name: Rainward spatial candidate
on:
  push:
    branches: [feat/rainward-quest-fieldwork-20260915]
    paths: ['rainward/**','.github/workflows/rainward-spatial-candidate.yml']
permissions:
  contents: write
concurrency:
  group: rainward-spatial-candidate
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rainward-quest-fieldwork-20260915
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply image-review corrections without rebuilding earlier integrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-output
          python rainward/tools/review-spatial.py
          node --test rainward/tests/*.test.mjs | tee test-output/node-models.txt
          python -m compileall -q rainward/tests
      - name: Commit the exact visual candidate before testing
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rainward/scene.mjs rainward/quest-xr.mjs rainward/floodgate-recut.mjs rainward/task-art.mjs rainward/floodgate-recut-art.mjs rainward/quest-xr.css rainward/tests/diorama-browser.py rainward/DIORAMA.md
          if ! git diff --cached --quiet; then
            git commit -m 'Apply native visual review: readable cutaways, unobstructed terrace cues and survivor-origin firing checks'
            git push origin HEAD:feat/rainward-quest-fieldwork-20260915
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainward-spatial-models
          path: test-output/
          retention-days: 14
  browser:
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - view: diorama-vr
            kind: controllers
          - view: diorama-vr
            kind: hands
          - view: diorama-ar
            kind: controllers
          - view: diorama-ar
            kind: hands
          - view: recut
            kind: xbox
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.review.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native WebGL browser
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Real game with labeled XR or dry-shelter fixture
        env:
          XR_VIEW: ${{ matrix.view }}
          QUEST_KIND: ${{ matrix.kind }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/rainward-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          if [ "$XR_VIEW" = recut ]; then
            timeout 1100 python -u rainward/tests/recut-browser.py
          else
            timeout 1100 python -u rainward/tests/diorama-browser.py
          fi
      - name: Preserve exact source, images and failed evidence
        if: always()
        run: |
          mkdir -p test-output
          python rainward/tests/release.py
          git rev-parse HEAD > test-output/tested-commit.txt
          git diff > test-output/uncommitted.diff
          tar -czf test-output/rainward-source.tgz rainward index.html projects.css
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainward-spatial-${{ matrix.view }}-${{ matrix.kind }}
          path: test-output/
          retention-days: 14
