name: Rainward spatial candidate
on:
  push:
    branches: [feat/rainward-quest-fieldwork-20260915]
    paths: ['rainward/**','.github/workflows/rainward-spatial-candidate.yml']
permissions:
  contents: write
concurrency:
  group: rainward-spatial-candidate
  cancel-in-progress: true
jobs:
  integrated-native-review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rainward-quest-fieldwork-20260915
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply scoped corrections and production metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-output
          python rainward/tools/apply-spatial.py
          python rainward/tools/refine-spatial.py
          node --test rainward/tests/*.test.mjs | tee test-output/node-models.txt
          python -m compileall -q rainward/tests
      - name: Commit exact source before browser acceptance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rainward/app.mjs rainward/quest-xr.mjs rainward/xr-panel.mjs rainward/scene.mjs rainward/world.mjs rainward/state.mjs rainward/district.mjs rainward/field-tasks.mjs rainward/diorama-view.mjs rainward/tests/reclaimed.test.mjs rainward/tests/quest-device-mock.js rainward/tests/terminus.py rainward/tests/diorama.test.mjs rainward/tests/diorama-browser.py rainward/SPATIAL-INTEGRATION.json rainward/release.json rainward/production-plan.json rainward/AAA_CHECKLIST.md rainward/README.md rainward/CONTROLLER.md rainward/DEVELOPMENT-HANDOFF.md rainward/AGENTS.md rainward/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Harden spatial view entry and preserve the authored replacement production contract'
            git push origin HEAD:feat/rainward-quest-fieldwork-20260915
          fi
      - name: Install native WebGL browser
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: All four diorama combinations and physical graybox routes
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/rainward-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          RESULT=0
          for VIEW in diorama-vr diorama-ar; do
            for KIND in controllers hands; do
              XR_VIEW="$VIEW" QUEST_KIND="$KIND" timeout 390 python -u rainward/tests/diorama-browser.py || RESULT=1
            done
          done
          timeout 800 python -u rainward/tests/recut-browser.py || RESULT=1
          exit "$RESULT"
      - name: Preserve exact source and all failures
        if: always()
        run: |
          mkdir -p test-output
          python rainward/tests/release.py
          git rev-parse HEAD > test-output/tested-commit.txt
          git diff > test-output/uncommitted.diff
          tar -czf test-output/rainward-source.tgz rainward index.html projects.css
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainward-spatial-integrated
          path: test-output/
          retention-days: 14
