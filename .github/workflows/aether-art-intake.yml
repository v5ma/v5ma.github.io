name: Aether public art intake
on:
  push:
    branches: [feat/aether-quay-art-pass]
    paths: [.github/workflows/aether-art-intake.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture public source, instructions and selected external artwork
        run: |
          mkdir -p /tmp/quay-review
          git rev-parse HEAD > /tmp/quay-review/source-sha.txt
          for p in AGENTS.md aether-reach/AGENTS.md .github/AGENTS.md .github/workflows/AGENTS.md; do if test -f "$p"; then printf '\n--- %s ---\n' "$p"; cat "$p"; fi; done > /tmp/quay-review/instructions.txt
          find aether-reach -name AGENTS.md -exec cat {} \; >> /tmp/quay-review/instructions.txt
          tar --exclude='aether-reach/test-output' -czf /tmp/quay-review/source.tgz aether-reach index.html projects.css .github/workflows
          python - <<'PY'
          from pathlib import Path
          import urllib.request,urllib.parse,json,time,hashlib
          root=Path('/tmp/quay-review');records=[]
          headers={'User-Agent':'AetherReach-ArtIntake/1.0 (public CC0 game-art review)','Referer':'https://v5ma.github.io/aether-reach/'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=50) as r:return r.read()
          ids=['street_lamp_01','potted_plant_01','tree_small_02','pavement_03','red_brick_03','sandstone_blocks_04','kloofendal_48d_partly_cloudy']
          for asset in ids:
              try:
                  info=json.loads(get('https://api.polyhaven.com/info/'+asset));files=json.loads(get('https://api.polyhaven.com/files/'+asset))
                  (root/(asset+'-metadata.json')).write_text(json.dumps({'info':info,'files':files},indent=2))
                  entries=[]
                  if 'gltf' in files:
                      obj=files['gltf']['1k']['gltf'];entries=[('model.gltf',obj)]
                      entries += [(p,v) for p,v in obj.get('include',{}).items()]
                  elif 'hdri' in files:
                      obj=files['hdri']['1k']['hdr'];entries=[('environment.hdr',obj)]
                  else:
                      for channel in ['diff','nor_gl','arm']:
                          obj=files[channel]['1k']['jpg'];entries.append((channel+'.jpg',obj))
                  folder=root/'assets'/asset;folder.mkdir(parents=True,exist_ok=True)
                  for path,entry in entries:
                      dest=folder/path;assert dest.resolve().is_relative_to(folder.resolve())
                      url=entry['url'];assert urllib.parse.urlparse(url).hostname in ['dl.polyhaven.org','dl.polyhaven.com']
                      raw=get(url);assert len(raw)<40000000
                      if 'md5' in entry:assert hashlib.md5(raw).hexdigest()==entry['md5']
                      dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(raw)
                      records.append({'asset':asset,'path':str(dest.relative_to(root)),'url':url,'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),'license':'CC0-1.0'})
                  print(asset,len(entries),'files')
              except Exception as e:
                  print(asset,'INTAKE ERROR',e);(root/(asset+'-error.txt')).write_text(str(e))
              time.sleep(.5)
          for name,url in [('polyhaven-license.html','https://polyhaven.com/license'),('quaternius-download.html','https://quaternius.itch.io/downtown-city-megakit/purchase')]:
              try:(root/name).write_bytes(get(url))
              except Exception as e:print(name,e)
          for path in ['loaders/GLTFLoader.js','loaders/RGBELoader.js','utils/BufferGeometryUtils.js']:
              raw=get('https://raw.githubusercontent.com/mrdoob/three.js/r177/examples/jsm/'+path)
              dest=root/'vendor'/path;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(raw)
          (root/'intake-manifest.json').write_text(json.dumps(records,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-quay-art-intake
          path: /tmp/quay-review/
          retention-days: 7
