name: Publish Aether Skyward Dispatch candidate
on:
  push:
    branches: [feat/aether-skyward-expedition-20260911]
    paths: ['.github/workflows/aether-skyward-bootstrap.yml']
permissions:
  contents: write
jobs:
  publish-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aether-skyward-expedition-20260911
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild verified Skyward Dispatch payload
        shell: bash
        run: |
          set -euo pipefail
          cat .aether-skyward-payload/chunk-* | base64 -d > /tmp/aether-skyward-publish.tar.xz
          echo 'b58032c34d13b973b105af7905b9d8810e648bd44758157ad2df5d530755847b  /tmp/aether-skyward-publish.tar.xz' | sha256sum -c -
          tar -xJf /tmp/aether-skyward-publish.tar.xz
          test -f aether-reach/expedition-world.mjs
          test -f aether-reach/expedition-core.mjs
          test -f aether-reach/expedition-scene.mjs
          test -f aether-reach/expedition-ui.mjs
          test -f aether-reach/expedition.css
      - name: Syntax and complete model regression suite
        shell: bash
        run: |
          set -euo pipefail
          for f in aether-reach/*.mjs; do node --check "$f"; done
          node --test aether-reach/tests/*.test.mjs
      - name: Validate release manifest includes expansion runtime
        shell: bash
        run: |
          set -euo pipefail
          node aether-reach/tests/release-manifest.mjs
          manifest='aether-reach/test-output/runtime-manifest.json'
          test -f "$manifest"
          grep -q 'expedition-world.mjs' "$manifest"
          grep -q 'expedition-core.mjs' "$manifest"
          grep -q 'expedition-scene.mjs' "$manifest"
          grep -q 'expedition-ui.mjs' "$manifest"
          grep -q 'expedition.css' "$manifest"
      - name: Commit tested candidate and remove transport scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -rf aether-reach/test-output
          rm -rf .aether-skyward-payload
          rm -f .github/workflows/aether-skyward-bootstrap.yml
          git add -A
          git diff --cached --check
          git status --short
          git config user.name 'Micah Blumberg'
          git config user.email '60057241+v5ma@users.noreply.github.com'
          git commit -m 'Publish Aether Reach Skyward Dispatch expansion'
          git push origin HEAD:feat/aether-skyward-expedition-20260911
