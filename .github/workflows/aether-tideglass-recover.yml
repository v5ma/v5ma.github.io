name: Recover Aether Tideglass source
on:
  push:
    branches: [feat/aether-tideglass-reservoir-20260912]
    paths: ['.github/workflows/aether-tideglass-recover.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve the complete existing game and partial integration
        run: |
          mkdir -p /tmp/tideglass-recovery
          git archive --format=zip HEAD aether-reach index.html projects.css .github/workflows > /tmp/tideglass-recovery/source.zip
          git rev-parse HEAD > /tmp/tideglass-recovery/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tideglass-recovered-source
          path: /tmp/tideglass-recovery
          retention-days: 14
