name: Apply scoped Sky Cycle recovery test correction
on:
  push:
    branches: ['sky-cycle/xr-menu-recovery-0.26.1']
    paths: ['.github/workflows/sky-cycle-recovery-resume.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply checksum-bound test-only changes
        env:
          PATCH: ''
        run: |
          python - <<'PY'
          import os,base64,lzma,hashlib
          from pathlib import Path
          patch=lzma.decompress(base64.b64decode(os.environ['PATCH'],validate=True))
          assert hashlib.sha256(patch).hexdigest()=='b74c5eee9e6559cab978e066a960b4f01ec3bd3e71c786a26e13b446f8cbe81e'
          allowed={'mario-maker-clone/svgn-paper-route/tests/xr-workspace-browser.py','mario-maker-clone/svgn-paper-route/tests/waterwheel-deliveries-browser.py'}
          for line in patch.decode().splitlines():
            if line.startswith('diff --git '):
              assert all(x[2:] in allowed for x in line.split()[2:])
          Path('/tmp/resume.patch').write_bytes(patch)
          PY
          git apply --check /tmp/resume.patch
          git apply --index /tmp/resume.patch
          python -m py_compile mario-maker-clone/svgn-paper-route/tests/xr-workspace-browser.py mario-maker-clone/svgn-paper-route/tests/waterwheel-deliveries-browser.py
          git rm .github/workflows/sky-cycle-recovery-resume.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(sky-cycle): use real B shortcut and frame-coherent delivery inputs'
          git push origin HEAD:refs/heads/sky-cycle/xr-menu-recovery-0.26.1
