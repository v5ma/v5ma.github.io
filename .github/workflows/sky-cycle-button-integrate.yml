name: Integrate Sky Cycle menu buttons
on:
  push:
    branches: ['sky-cycle/xr-buttons-0.26.2']
    paths: ['.github/workflows/sky-cycle-button-integrate.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed runtime patch only inside Sky Cycle
        env:
          PATCH: '?'
        run: |
          python - <<'PY'
          raise SystemExit('Staging placeholder: no runtime mutation. Complete checksum-bound patch before execution.')
          PY
