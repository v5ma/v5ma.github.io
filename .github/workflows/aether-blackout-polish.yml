name: Finish Bellwether review corrections
on:
  push:
    branches: [feat/aether-bellwether-blackout-20260912]
    paths: ['.github/workflows/aether-blackout-polish.yml']
permissions:
  contents: write
jobs:
  polish:
    if: github.repository == 'v5ma/v5ma.github.io' && github.ref == 'refs/heads/feat/aether-bellwether-blackout-20260912'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aether-bellwether-blackout-20260912
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only exact reviewed edits
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('aether-reach')
          edits=[
          ('bellwether-world.mjs','1091058771855ddc373d19e0cd04b1bee7c6831f3222d1fc04da34278b2354bb','9b7c33cda83e8e51f86a3bdc212204595ef6cd4d691c62eb4541c1f0da6278e1',[("guardian:[{x:-103,y:27.5,z:-5,","guardian:[{x:-103,y:27.5,z:-8,")]),
          ('bellwether-scene.mjs','c24da139b903b693e08eabc90e4164c34257ce7b4a7d5afd300ca5918f5d2b9d','ba8c96a2f98a91e6f28c328180d94518af266212d3911cf5908227e8f8dcb934',[("g.position.set(q.x,q.y,q.z);","g.position.set(q.x,q.y,q.z-(q.kind==='signal'?.7:0));"),("add('cylinder','brass',[0,2,0]","add('cylinder','brass',[-.65,2,0]"),("add('ring','brass',[0,3,0]","add('ring','brass',[-.65,3,0]"),("add('sphere','glow',[0,3,0]","add('sphere','glow',[-.65,3,0]")]),
          ('model.mjs','5bbf3502acae99a5aa57b7b2b7a0d05e7089b08afcaefd3645e242927a9d363f','8a844f7d85387449d0e93884cdfe5c31294baa5cd57ad12d1a9a63554780e104',[("p.reload-=dt;","p.reload=Math.max(0,p.reload-dt);")]),
          ('tests/bellwether-input.js','f28b5776f1c8b072c38c3eb448695b6ec886b1b8920352a3dc81383f76a60bf7','29659782ae70e391b08b2fb0ac2268de19ec95ca17cb1e7e3bcf2ef84fcb5a23',[("s.reload===0","s.reload<=0")]),
          ('index.html','9fdc421dad0780770c3a1262a2ab1c76639abc8ff558fbf55b3cb1a0d313efd7','2e25e37c7489b03dcb17d067bba801941b0c2f1d7de5c7112dead98f0378ff47',[("EXPEDITION 04 <span>CROSSWIND ARSENAL</span>","EXPEDITION 06 <span>BELLWETHER BLACKOUT</span>"),("and complete the existing 13 side adventures.","and complete 14 side adventures including the connected Bellwether Blackout route."),("THE CROSSWIND ARSENAL EXPANSION.","THE BELLWETHER BLACKOUT ADVENTURE.")]),
          ('tests/bellwether.test.mjs','875250826d5afa848347eccd490ca4c65269a68e3af0d08c577aa670307f40e3','795f7ea7ae85cf689bc103eecede6bb668cd9a36bfe0b162c3063262c984d6cf',[])]
          extra="\nimport {CACHES} from '../arsenal.mjs';\ntest('New mission enemies do not emerge inside existing exploration supply caches',()=>{for(const enemy of Object.values(BELL_WAVES).flat())for(const cache of CACHES){if(Math.abs(enemy.y-cache.y)<1)assert.ok(Math.hypot(enemy.x-cache.x,enemy.z-cache.z)>1.4,JSON.stringify({enemy,cache}));}});\n\nimport {reloadWeapon} from '../model.mjs';\ntest('Reload completion clamps its timer to zero and allows another normal shot',()=>{const s=fresh();fire(s);assert.ok(reloadWeapon(s));run(s,2);assert.equal(s.p.reload,0);assert.ok(fire(s));});\n"
          sha=lambda v:hashlib.sha256(v).hexdigest()
          pending=[]
          for name,before,after,pairs in edits:
            p=root/name;data=p.read_bytes();assert sha(data)==before,('Before',name)
            text=data.decode()
            for old,new in pairs:
              assert old in text,(name,old)
              text=text.replace(old,new)
            if name=='tests/bellwether.test.mjs':text+=extra
            data=text.encode();assert sha(data)==after,('After',name,sha(data))
            pending.append((p,data))
          for p,data in pending:p.write_bytes(data)
          print('All six reviewed files match expected hashes.')
          PY
      - name: Regress the full game and commit the corrections
        run: |
          set -euo pipefail
          mkdir -p aether-reach/test-output
          node --test aether-reach/tests/*.test.mjs | tee aether-reach/test-output/blackout-polish-tests.log
          node aether-reach/tests/release-manifest.mjs
          rm .github/workflows/aether-blackout-polish.yml
          git add -A -- aether-reach .github/workflows/aether-blackout-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix reload completion and rooftop prop clearance after full district review'
          git push origin HEAD:feat/aether-bellwether-blackout-20260912
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blackout-polish-tests
          path: aether-reach/test-output
          retention-days: 14
