name: Integrate Aether Crosswind Arsenal cleanly
on:
  push:
    branches: [feat/aether-crosswind-arsenal-20260911]
    paths: ['.github/workflows/aether-crosswind-clean.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aether-crosswind-clean
  cancel-in-progress: true
jobs:
  integrate:
    if: github.repository == 'v5ma/v5ma.github.io' && github.ref == 'refs/heads/feat/aether-crosswind-arsenal-20260911'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aether-crosswind-arsenal-20260911
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct exact Crosswind candidate
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,zlib,json
          root=Path.cwd().resolve()
          names=['aether-reach/tools/cw64safe-00a.txt',
                 'aether-reach/tools/cw64safe-00b.txt',
                 *[f'aether-reach/tools/cw64safe-{i:02d}.txt' for i in range(1,6)],
                 'aether-reach/tools/cw64safe-06a.txt',
                 'aether-reach/tools/cw64safe-06b.txt',
                 'aether-reach/tools/cw64safe-06c.txt']
          packed=''.join((root/n).read_text() for n in names)
          assert len(packed)==68760, len(packed)
          files=json.loads(zlib.decompress(base64.b64decode(packed)))
          assert len(files)==17, len(files)
          for name,text in files.items():
              p=(root/name).resolve()
              assert p.is_relative_to(root/'aether-reach'), name
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(text)
          print('Installed',len(files),'Crosswind files from',len(packed),'base64 characters')
          PY
      - name: Validate all Aether regressions and public manifest
        run: |
          set -euo pipefail
          for f in aether-reach/*.mjs; do node --check "$f"; done
          node --test aether-reach/tests/*.test.mjs | tee /tmp/crosswind-tests.log
          node aether-reach/tests/release-manifest.mjs
      - name: Commit exact tested game source and remove transport
        run: |
          set -euo pipefail
          rm -f aether-reach/tools/cw64safe-*.txt
          rm -f .github/workflows/aether-crosswind-clean.yml
          git add -A -- aether-reach .github/workflows/aether-crosswind-clean.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement Aether Reach 0.7.0 Crosswind Arsenal'
          git push origin HEAD:feat/aether-crosswind-arsenal-20260911
      - name: Preserve exact validation report
        if: always()
        run: |
          mkdir -p aether-reach/test-output
          cp /tmp/crosswind-tests.log aether-reach/test-output/crosswind-tests.log 2>/dev/null || true
          git rev-parse HEAD > aether-reach/test-output/tested-commit.txt
          git diff --stat > aether-reach/test-output/uncommitted-diff.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-crosswind-clean-validation
          path: aether-reach/test-output
          retention-days: 30
