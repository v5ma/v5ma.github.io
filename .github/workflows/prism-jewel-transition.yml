name: Settle Jewelbox presentation transitions
on:
  push:
    branches: [feat/prism-jewelbox-graphics]
    paths: [.github/workflows/prism-jewel-transition.yml]
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prism-jewelbox-graphics
          sparse-checkout: prism-current
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve track position and guard while allowing visual startup lead
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          guards={
          'prism-current/audio.js':('c51767f82c863456ec17790d1f6d42817c30dc767fd99e3677bee813444f0feb','ba4006414db556ae577dc38bc1fa3d49df88856430a638c5df6573da150b5a9d'),
          'prism-current/app.js':('9d100d5f5f5be27750007c6b8ab4a21d3f640c2d294d4cabcb7459912596ddf9','87b29b95ebeaa087f84843eeb21c50add0d2c8213a49d8a6fd0872611c33b2af'),
          'prism-current/graphics/materials.js':('e2264c5718ccf5cf1b3e0b618c0e95da20e71c3ddcf6529b415e85f14c166b12','8b117f84bc0602f2b23bdeb1017fba945a56b03792777a8a92cf66d1bf0dfb0f'),
          'prism-current/tests/browser.py':('c70f75252f3cdd0785fc4fc1c456a909029bfb2fa4245a5f6cab0490e1413018','6dc7a41d8fad9b47ec30963d278eb20bf5f32c1978e2bdb90e7c84bfa6bf8fd0')}
          prepared={}
          for n,(before,after) in guards.items():
            s=Path(n).read_text();assert hashlib.sha256(s.encode()).hexdigest()==before,n
            if n.endswith('audio.js'):s=s.replace('this.startAt=a.currentTime+.10;','this.startAt=a.currentTime+.65;')
            elif n.endswith('app.js'):s=s.replace('else if(t-this.lastTime>.3){this.pauseRun(','else if(t-this.lastTime>.3){this.lastStall={gap:t-this.lastTime,audio:t,previous:this.lastTime};this.pauseRun(')
            elif n.endswith('materials.js'):s=s.replace('color:0x172335,metalness:.72,roughness:.21,clearcoat:1,clearcoatRoughness:.13','color:0x172335,metalness:.72,roughness:.26,clearcoat:.38,clearcoatRoughness:.25')
            else:
              a=s.index('def device_button(');b=s.index('with sync_playwright()',a)
              s=s[:a]+'''def device_button(page,hand,index):
           # Sample a controller edge across actual device frames; a fixed 90 ms pulse
           # can disappear entirely on software-rendered stereo frames.
           page.evaluate("""async ([h,i])=>{const scene=AFRAME.scenes[0];async function frames(){let prev=scene.frame,n=0;await new Promise((resolve,reject)=>{const began=performance.now(),timer=setInterval(()=>{if(scene.frame!==prev){prev=scene.frame;n++;}if(n>=3){clearInterval(timer);resolve();}else if(performance.now()-began>12000){clearInterval(timer);reject(Error('XR frames stalled'));}},4);});}TestXR.button(h,i,true);await frames();TestXR.button(h,i,false);await frames();}""",[hand,index])
          '''+s[b:]
            assert hashlib.sha256(s.encode()).hexdigest()==after,n+' output mismatch'
            prepared[n]=s
          for n,s in prepared.items():Path(n).write_text(s)
          PY
          node --test prism-current/tests/*.test.cjs
          python prism-current/tests/verify.py
      - name: Commit bounded content changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prism-current
          git commit -m 'Add a silent visual lead before audio start without seeking; retain the stall guard'
          git push origin HEAD:feat/prism-jewelbox-graphics
