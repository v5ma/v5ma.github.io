name: Sky Cycle scoped candidate correction
on:
  push:
    branches: ['sky-cycle/portal-network-0.21']
    paths: ['.github/workflows/sky-cycle-repair.yml']
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed bounded corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('mario-maker-clone/svgn-paper-route')
          p=root/'tests/portal-network-browser.py'
          s=p.read_text()
          assert s.count("choose('Resume')")==2
          s=s.replace("choose('Resume')","choose('Back to the route')")
          s=s.replace('__cloudview?.hero?.pose','window.__cloudview?.hero?.pose')
          p.write_text(s)
          p=root/'xr-play.js';s=p.read_text()
          old="if(r.action==='use')SkyCycleBathhouse?.interact();else if(r.action==='portal')SkyCyclePortals?.show();"
          assert s.count(old)==1
          s=s.replace(old,"if(r.action==='use')window.SkyCycleBathhouse?.interact();else if(r.action==='portal')window.SkyCyclePortals?.show();")
          old="status('XR could not start: '+e.message);try{await acquired?.end();}catch{}await finish();"
          assert s.count(old)==1
          s=s.replace(old,"const reason='XR could not start: '+e.message;try{await acquired?.end();}catch{}await finish();status(reason);")
          p.write_text(s)
          PY
          node --check mario-maker-clone/svgn-paper-route/xr-play.js
          python3 -m py_compile mario-maker-clone/svgn-paper-route/tests/portal-network-browser.py
          git add mario-maker-clone/svgn-paper-route/xr-play.js mario-maker-clone/svgn-paper-route/tests/portal-network-browser.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(sky-cycle): preserve denied XR explanation and use actual resume control'
          git push origin HEAD:refs/heads/sky-cycle/portal-network-0.21
          git rev-parse HEAD
