name: Sky Cycle Sunrise
on:
  push:
    branches: [master, 'sky-cycle-sunrise-*']
    paths:
      - 'mario-maker-clone/svgn-paper-route/**'
      - '.github/workflows/sky-cycle-sunrise.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sky-cycle-sunrise-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source, geometry and rule regression
        run: |
          git rev-parse HEAD
          node --check mario-maker-clone/svgn-paper-route/sunrise.js
          node --check mario-maker-clone/svgn-paper-route/release-status.js
          node --check mario-maker-clone/svgn-paper-route/route-compass.js
          node --test mario-maker-clone/svgn-paper-route/tests/sunrise.test.mjs
          node --test mario-maker-clone/svgn-paper-route/tests/route-compass-core.test.mjs mario-maker-clone/svgn-paper-route/tests/flight-deck-core.test.mjs
      - name: Install browser dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Native Sunrise play and controller evidence
        run: python mario-maker-clone/svgn-paper-route/tests/sunrise-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-cycle-sunrise-${{ github.sha }}
          path: /tmp/sky-cycle-sunrise/
          if-no-files-found: warn
          retention-days: 30
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install browser dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Existing Flight Deck fixture and native 3D controller coverage
        run: |
          python mario-maker-clone/svgn-paper-route/tests/flight-deck-browser.py --fixture
          python mario-maker-clone/svgn-paper-route/tests/flight-deck-browser.py
      - name: Existing Compass fixture and native controller coverage
        run: |
          python mario-maker-clone/svgn-paper-route/tests/route-compass-browser.py --fixture
          python mario-maker-clone/svgn-paper-route/tests/route-compass-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-cycle-sunrise-regression-${{ github.sha }}
          path: |
            /tmp/sky-cycle-flight-deck/
            /tmp/sky-cycle-compass/
          retention-days: 30
  published:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare live runtime with exact source
        run: python mario-maker-clone/svgn-paper-route/tests/sunrise-published.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-cycle-sunrise-public-${{ github.sha }}
          path: /tmp/sky-cycle-sunrise/publication.json
          retention-days: 30
