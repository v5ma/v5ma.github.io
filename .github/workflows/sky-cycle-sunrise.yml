name: Sky Cycle Sunrise
on:
  push:
    branches: [master, 'sky-cycle-sunrise-*']
    paths:
      - 'mario-maker-clone/svgn-paper-route/**'
      - '.github/workflows/sky-cycle-sunrise.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sky-cycle-sunrise-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package exact game and test source for offline regression
        run: |
          mkdir -p /tmp/sky-cycle-source
          git rev-parse HEAD > /tmp/sky-cycle-source/commit.txt
          tar -czf /tmp/sky-cycle-source/source.tar.gz mario-maker-clone/svgn-paper-route tests
      - uses: actions/upload-artifact@v4
        with:
          name: sky-cycle-source-${{ github.sha }}
          path: /tmp/sky-cycle-source/
          retention-days: 14
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sunrise tests when implementation is present
        if: hashFiles('mario-maker-clone/svgn-paper-route/tests/sunrise.test.mjs') != ''
        run: |
          node --test mario-maker-clone/svgn-paper-route/tests/sunrise.test.mjs
          node --test mario-maker-clone/svgn-paper-route/tests/route-compass-core.test.mjs mario-maker-clone/svgn-paper-route/tests/flight-deck-core.test.mjs
      - name: Install browser dependencies
        if: hashFiles('mario-maker-clone/svgn-paper-route/tests/sunrise-browser.py') != ''
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Native Sunrise play and controller evidence
        if: hashFiles('mario-maker-clone/svgn-paper-route/tests/sunrise-browser.py') != ''
        run: python mario-maker-clone/svgn-paper-route/tests/sunrise-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-cycle-sunrise-${{ github.sha }}
          path: /tmp/sky-cycle-sunrise/
          if-no-files-found: ignore
          retention-days: 30
