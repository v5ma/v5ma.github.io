name: Refine software-renderer verification inputs
on:
  push:
    branches: [feat/prism-jewelbox-graphics]
    paths: [.github/workflows/prism-jewel-input-review.yml]
permissions:
  contents: write
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prism-jewelbox-graphics
          sparse-checkout: prism-current
      - name: Keep optical features and game timing guard; reduce only test pixels
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          guards={
          'prism-current/tests/browser.py':('6dc7a41d8fad9b47ec30963d278eb20bf5f32c1978e2bdb90e7c84bfa6bf8fd0','fb23b86d8e8bd730bdcd95c3c8db585c2c189459ff67006a8b6d04538fe8bb6f'),
          'prism-current/tests/pointer.py':('22f27cae5d2f467aa219dcb714914f4f560af1578ed98e347c5438317a737c01','cf8a0cb5d32272cc3105f9aeae784597f737c72d5c74af3be2140bd747d0041d'),
          'prism-current/tests/jewel-browser.py':('ff08e99a7ffee706be2574229fe65d6a059e0ee67eb9eb5f27daaa3ce4610d8d','8f6860b3e43e961e0328370e6f0ef8fc9d348cc59126adec39107a1ce85e9317')}
          prepared={}
          for n,(before,after) in guards.items():
            s=Path(n).read_text();assert hashlib.sha256(s.encode()).hexdigest()==before,n
            if n.endswith('/browser.py'):
              a=s.index('   page.evaluate("""async()=>{const first=Prism.snapshot().notes[0];');b=s.index('\n',a)
              s=s[:a]+'''   page.evaluate("""async()=>{const note=Prism.snapshot().notes[0],center=PrismCore.position(note,note.time);await new Promise((resolve,reject)=>{const began=performance.now(),timer=setInterval(()=>{const state=Prism.snapshot();if(state.phase!=='playing'||performance.now()-began>20000){clearInterval(timer);reject(Error('Saber input could not reach its audio cue'));return;}if(state.time<note.time-.18)return;const f=Math.max(0,Math.min(1,(state.time-note.time+.15)/.30));TestXR.pose('left',[center[0],center[1]+.28-.56*f,-.41]);if(f>=1){clearInterval(timer);resolve();}},4);});}""")'''+s[b:]
              s=s.replace('device_scale_factor=.5','device_scale_factor=.25').replace('at half pixel ratio','at quarter pixel ratio')
            elif n.endswith('/pointer.py'):
              s=s.replace('device_scale_factor=.5','device_scale_factor=.25').replace('Native HTTP A-Frame; actual pointerdown','Native HTTP A-Frame at quarter pixel ratio; actual pointerdown')
            else:
              s=s.replace("p.locator('#input').select_option('keys');p.locator('#start').click()", "p.set_viewport_size({'width':400,'height':300});p.locator('#input').select_option('keys');p.locator('#start').click()")
              s=s.replace('Prism.snapshot().time>4','Prism.snapshot().time>5')
              s=s.replace("p.locator('#back').click()", "p.locator('#back').click();p.set_viewport_size({'width':1440,'height':1050})")
              s=s.replace('full-resolution before/after menu frames and ordinary play.', 'full-resolution 1440x1050 before/after menus; 400x300 ordinary running-play observation. Lower drawing-buffer size makes CPU rendering tractable; materials stay Cinematic.')
            assert hashlib.sha256(s.encode()).hexdigest()==after,n+' output mismatch'
            prepared[n]=s
          for n,s in prepared.items():Path(n).write_text(s)
          PY
          python -m py_compile prism-current/tests/*.py
      - name: Commit test scope changes without touching runtime physics or materials
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prism-current/tests
          git commit -m 'Keep optical shader settings; run CPU playthroughs at a documented lower pixel budget'
          git push origin HEAD:feat/prism-jewelbox-graphics
