name: Verify First Bell coach repair
on:
  push:
    branches: [vesperfall-first-bell-coach-repair-20260912]
    paths: ['.github/workflows/vesperfall-coach-repair.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply checksummed source and remove this temporary intake
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,pathlib
          root=pathlib.Path.cwd()
          encoded=''
          packed=base64.b64decode(encoded,validate=True)
          sha=lambda b:hashlib.sha256(b).hexdigest()
          assert sha(packed)=='a2f9a20cafc2238c9c114233700196c562358239eaf555d6eef380250e407c4f'
          data=json.loads(lzma.decompress(packed))
          allowed={'vesperfall/first-bell.js','vesperfall/index.html','vesperfall/tests/first-bell-browser.py','vesperfall/tests/first-bell-coach.test.cjs'}
          assert set(data)==allowed
          planned=[]
          for name,d in data.items():
              p=root/name
              assert not p.is_symlink() and p.resolve().is_relative_to(root/'vesperfall')
              before=p.read_bytes();assert sha(before)==d['before'],name
              text=before.decode('utf-8')
              for start,end,replacement in reversed(d['edits']):text=text[:start]+replacement+text[end:]
              b=text.encode('utf-8');assert sha(b)==d['after'],name
              planned.append((p,b))
          for p,b in planned:p.write_bytes(b)
          (root/'.github/workflows/vesperfall-coach-repair.yml').unlink()
          print('Applied exactly four verified coaching and test changes.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- vesperfall .github/workflows/vesperfall-coach-repair.yml
          git commit -m 'Fix First Bell quiver lesson from actual event receipts and test an entire gesture between frames'
          git push origin HEAD:vesperfall-first-bell-coach-repair-20260912
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  lessons:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all models, workbook and release boundary
        run: |
          set -euo pipefail
          mkdir -p test-output
          node --test vesperfall/tests/*.test.cjs | tee test-output/models.tap
          python vesperfall/tests/production-workbook.py
          python scripts/check-vesperfall.py
      - name: Install native renderer
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Complete every lesson including same-turn quiver input
        env:
          BELL_SUITE: lessons
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 > test-output/server.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          timeout 850 python -u vesperfall/tests/functional-runner.py first-bell-browser.py | tee test-output/browser.log
          test -s test-output/first-bell-lessons/report.json
          test ! -e test-output/first-bell-lessons/failure.json
      - name: Preserve actual diagnostics and tested source
        if: always()
        run: |
          mkdir -p test-output
          git rev-parse HEAD > test-output/source-revision.txt
          tar czf test-output/source.tgz vesperfall
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-bell-coach-repair
          path: test-output/
          retention-days: 14
