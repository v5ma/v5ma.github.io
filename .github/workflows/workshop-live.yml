name: Verify live Route Workshop
on:
  push:
    branches: [feat/route-workshop-live-20260905]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workshop-live-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/integrate-workshop-live.py
      - name: Commit only explicit editor integration files
        if: github.ref == 'refs/heads/feat/route-workshop-live-20260905'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- mario-maker-clone/svgn-paper-route/workshop-core.js mario-maker-clone/svgn-paper-route/route-workshop.js mario-maker-clone/svgn-paper-route/workshop.css mario-maker-clone/svgn-paper-route/workshop-input.js mario-maker-clone/svgn-paper-route/index.html mario-maker-clone/svgn-paper-route/sky-network-runtime.js mario-maker-clone/svgn-paper-route/sw.js tests/workshop_live.test.cjs tests/workshop_browser.py
          if git ls-files .workshop-incoming | grep -q .; then git add -u -- .workshop-incoming; fi
          if ! git diff --cached --quiet; then git commit -m 'Integrate readable live Route Workshop source and preserve all world metadata'; git push origin HEAD:${GITHUB_REF_NAME}; fi
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Archive exact integrated runtime
        run: |
          mkdir -p test-output
          tar -czf test-output/source.tgz mario-maker-clone/svgn-paper-route tests scripts
          git rev-parse HEAD > test-output/source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: workshop-source
          path: test-output/
          retention-days: 3
  verify:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        suite: [authoring, playtest, campaign]
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native metadata and editing-operation tests
        run: |
          node --check mario-maker-clone/svgn-paper-route/workshop-core.js
          node --check mario-maker-clone/svgn-paper-route/route-workshop.js
          node --test tests/workshop_live.test.cjs tests/sky_network.test.cjs tests/adventure_score.test.cjs tests/grapple_core.test.cjs tests/depth_geometry.test.mjs
      - name: Install native test browser
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Drive editor and game through ordinary UI input
        env:
          WORKSHOP_SUITE: ${{ matrix.suite }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/workshop-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          if [ "$WORKSHOP_SUITE" = campaign ]; then
            NETWORK_SUITE=flight timeout 1200 python -u tests/sky_network_browser.py
          else
            timeout 1200 python -u tests/workshop_browser.py
          fi
      - name: Record exact source and diagnostics
        if: always()
        run: |
          mkdir -p test-output
          git rev-parse HEAD > test-output/tested-commit.txt
          git diff --stat > test-output/uncommitted-diff.txt
          cp /tmp/workshop-http.log test-output/http.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workshop-${{ matrix.suite }}
          path: test-output/
          retention-days: 7
