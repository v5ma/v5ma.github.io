name: Review connected Theology foundations
on:
  push:
    branches: [feat/theology-connected-foundations-20260906]
    paths: ['theology-wiki/**', '.github/workflows/theology-connected-review.yml']
permissions:
  contents: write
concurrency:
  group: theology-connected-${{ github.ref }}
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Recover only the preserved Theology authorial delta and integrate checked sources
        run: |
          set -euo pipefail
          if [ -f theology-wiki/connected-transfer-01.txt ]; then
            git fetch --no-tags --depth=1 origin b559e477e69ffe38ab48f3fca0d32e796c697964 9847fbbfc0c1b9cce6727faea6aa62f5191dbdae
            git diff --exit-code 9847fbbfc0c1b9cce6727faea6aa62f5191dbdae HEAD -- theology-wiki ':(exclude)theology-wiki/connected-transfer-*.txt'
            git diff --binary 9847fbbfc0c1b9cce6727faea6aa62f5191dbdae b559e477e69ffe38ab48f3fca0d32e796c697964 -- theology-wiki > /tmp/theology-authorial.patch
            git apply --check /tmp/theology-authorial.patch
            git apply /tmp/theology-authorial.patch
          fi
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,base64,lzma,zipfile,io
          root=Path('theology-wiki');parts=sorted(root.glob('connected-transfer-*.txt'))
          if parts:
            assert len(parts)==3
            digest,payload=''.join(p.read_text().strip() for p in parts).split(':',1)
            assert digest=='22f4dd0bb5fbe063166141d808bf92c7acbc70d52a095589481d1bc65f829431'
            packed=base64.b64decode(payload,validate=True)
            assert hashlib.sha256(packed).hexdigest()==digest,'Source transfer mismatch'
            decoded=lzma.decompress(packed);assert len(decoded)<400000
            data=json.loads(decoded);assert data['schema']=='theology-connected-delta/v1'
            assert data['baseCommit']=='b559e477e69ffe38ab48f3fca0d32e796c697964'
            assert len(data['files'])==24
            assert set(data['files'])==set(data['baseHashes'])==set(data['finalHashes'])
            def apply_ops(base,ops):
              result=[]
              for op in ops:
                if len(op)==2 and type(op[0]) is int:
                  assert type(op[1]) is int and 0<=op[0]<=op[1]<=len(base)
                  result.extend(base[op[0]:op[1]])
                else:
                  assert all(isinstance(v,str) for v in op)
                  result.extend(op)
              return result
            for name,ops in data['files'].items():
              assert '..' not in Path(name).parts
              assert name.startswith(('theology-wiki/editorial/','theology-wiki/tools/','theology-wiki/tests/')) or name in {'theology-wiki/README.md','theology-wiki/planning/workbook-manifest.json'}
              p=Path(name);expected=data['baseHashes'][name]
              if expected:
                raw=p.read_bytes();assert hashlib.sha256(raw).hexdigest()==expected,name
              else:
                assert not p.exists(),name
                raw=b''
              text=''.join(apply_ops(raw.decode().splitlines(keepends=True),ops))
              assert hashlib.sha256(text.encode()).hexdigest()==data['finalHashes'][name],name
              p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
            target=root/'planning/Theology-Research-Plan.xlsx';old=target.read_bytes()
            assert hashlib.sha256(old).hexdigest()==data['workbook']['baseSha256']
            out=io.BytesIO()
            with zipfile.ZipFile(io.BytesIO(old)) as a,zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as b:
              names=set()
              for part in data['workbook']['parts']:
                name=part['name'];assert not name.startswith('/') and '..' not in Path(name).parts and name not in names;names.add(name)
                raw=a.read(name) if name in a.namelist() else b''
                assert hashlib.sha256(raw).hexdigest()==part['base']
                value='>'.join(apply_ops(raw.decode().split('>'),part['ops'])).encode()
                assert hashlib.sha256(value).hexdigest()==part['sha256']
                info=zipfile.ZipInfo(name,(1980,1,1,0,0,0));info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=0o600<<16
                b.writestr(info,value,compress_type=zipfile.ZIP_DEFLATED,compresslevel=6)
            assert hashlib.sha256(out.getvalue()).hexdigest()==data['workbook']['sha256']=='983eaf6f05fbd428dc27863a456a614b265c7287af3402b954a39f41cd43acc9'
            target.write_bytes(out.getvalue())
            for p in parts:p.unlink()
            print('Recovered only Theology; verified 24 source changes and the nine-sheet workbook.')
          PY
          if [ -f theology-wiki/tools/connected-review-fix.py ]; then python theology-wiki/tools/connected-review-fix.py; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check complete build, source links, authorial voice, workbook and recorded media
        run: |
          set -o pipefail
          mkdir -p theology-test-output
          node theology-wiki/tools/build.cjs | tee theology-test-output/build-report.txt
          node --test theology-wiki/tests/research.test.cjs | tee theology-test-output/node-tests.txt
          git diff --exit-code -- theology-sources san-wiki-shell scripts theology-wiki/content/sources ':(exclude)theology-wiki/content/sources/index.md'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- theology-wiki
          if ! git diff --cached --quiet; then git commit -m 'Integrate authorial Theology, computational argument map and flood-inheritance research'; git push origin HEAD:${GITHUB_REF_NAME}; fi
      - name: Install native Chromium and image verification tools
        run: |
          python -m pip install --quiet playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium > /tmp/theology-browser-install.log 2>&1 || { tail -100 /tmp/theology-browser-install.log; exit 1; }
          python theology-wiki/tools/media.py
      - name: Exercise native reader, sources, museum trails and actual audio/video
        run: |
          python -m http.server 4174 --bind 127.0.0.1 > /tmp/theology-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python theology-wiki/tests/browser.py
      - name: Preserve exact tested source and review evidence
        if: always()
        run: |
          mkdir -p theology-test-output
          git rev-parse HEAD > theology-test-output/tested-commit.txt
          git diff --stat > theology-test-output/uncommitted-diff.txt
          cp /tmp/theology-http.log theology-test-output/ 2>/dev/null || true
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('theology-test-output/review-source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in Path('theology-wiki').rglob('*'):
              if p.is_file() and '__pycache__' not in p.parts and p.suffix.lower() not in {'.ttf','.otf','.woff','.woff2'} and not p.name.startswith('connected-transfer-'):z.write(p,p.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theology-connected-review
          path: theology-test-output/
          retention-days: 14
