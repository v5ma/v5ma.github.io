name: Integrate Rainward Living Light on feature branch
on:
  push:
    branches: [feat/rainward-living-light]
    paths: ['rainward/tools/apply_living_light.py','.github/workflows/rainward-integrate-light.yml']
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'v5ma/v5ma.github.io' && github.ref == 'refs/heads/feat/rainward-living-light'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert and apply readable local source transformations
        run: |
          python rainward/tools/apply_living_light.py
          for file in rainward/*.mjs; do node --check "$file"; done
          node --test rainward/tests/*.test.mjs
          git rm rainward/tools/apply_living_light.py .github/workflows/rainward-integrate-light.yml
      - name: Commit only game changes and retire this one-time writer
        run: |
          git fetch origin feat/rainward-living-light
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git add rainward .github/workflows/rainward.yml
          git diff --cached --name-only | python -c "import sys; p=sys.stdin.read().splitlines(); assert all(x.startswith('rainward/') or x in ['.github/workflows/rainward.yml','.github/workflows/rainward-integrate-light.yml'] for x in p)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Wire Living Light shaders, fixed-step timing and experimental XR overlook into the existing Rainward runtime'
          git push origin HEAD:feat/rainward-living-light
      - name: Preserve generated source for exact review
        if: always()
        run: |
          mkdir -p /tmp/rw6-integration
          git rev-parse HEAD > /tmp/rw6-integration/commit.txt
          tar -czf /tmp/rw6-integration/source.tgz rainward .github/workflows/rainward.yml index.html projects.css
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainward-light-integration
          path: /tmp/rw6-integration
          retention-days: 7
