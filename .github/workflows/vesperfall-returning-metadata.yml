name: Vesperfall Returning Bell complete regression
on:
  push:
    branches: [vesperfall-returning-bell-20260915]
    paths: ['.github/vesper-meta*', '.github/workflows/vesperfall-returning-metadata.yml']
permissions:
  contents: read
jobs:
  prepare:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      source: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: commit
        run: |
          set -euo pipefail
          python .github/vesper-meta-apply.py
          python .github/vesper-meta-refine.py
          for f in vesperfall/*.js; do node --check "$f"; done
          mkdir -p test-output
          node --test vesperfall/tests/*.test.cjs | tee test-output/all-model.tap
          python vesperfall/tests/production-workbook.py | tee test-output/workbook.log
          python scripts/check-vesperfall.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vesperfall
          git add -u .github
          if ! git diff --cached --quiet; then
            git commit -m 'Complete Returning Bell release metadata, canonical workbook, VR handover and retained-mode acceptance'
            git push origin HEAD:vesperfall-returning-bell-20260915
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > test-output/source-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: returning-bell-model-workbook
          path: test-output/
          retention-days: 14
  browsers:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite: [returning-bell, surestep, dominions, pilgrim, first-bell, rosefire, resonant]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source }}
      - name: Install native browser and imaging dependencies
        run: |
          python -m pip install playwright==1.57.0 pillow
          python -m playwright install --with-deps chromium
      - name: Native rendered journey
        run: |
          set -euo pipefail
          mkdir -p test-output
          python -m http.server 4173 --bind 127.0.0.1 > test-output/server.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          timeout 2100 python -u vesperfall/tests/${{ matrix.suite }}-browser.py | tee test-output/browser.log
      - name: Retain exact source and diagnostics
        if: always()
        run: |
          mkdir -p test-output
          git rev-parse HEAD > test-output/source-revision.txt
          git diff --stat > test-output/uncommitted-diff.txt
          tar -czf test-output/vesperfall-source.tgz vesperfall scripts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: returning-bell-${{ matrix.suite }}
          path: test-output/
          retention-days: 14
