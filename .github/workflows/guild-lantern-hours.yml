name: Verify Guild Lantern Hours and restored services
on:
  push:
    branches: [feat/guild-lantern-hours-20260908]
  pull_request:
    paths: ['leonardos-guild/**','.github/workflows/guild-lantern-hours.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guild-hours-${{ github.ref }}
  cancel-in-progress: true
jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        mode: [nearby, circuit, services]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check retained mechanics, additive saves, circuit and services
        run: |
          set -euo pipefail
          for f in leonardos-guild/*.mjs; do node --check "$f"; done
          mkdir -p leonardos-guild/city-output/${{ matrix.mode }}
          npm --prefix leonardos-guild test | tee leonardos-guild/city-output/${{ matrix.mode }}/model-tests.txt
      - name: Install native browser
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Exercise actual keyboard, touch, modal handoffs and scene lighting
        env:
          CITY_SUITE: ${{ matrix.mode }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/guild-hours-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python -u leonardos-guild/tests/city-browser.py
      - name: Record exact source and preserve evidence
        if: always()
        env:
          CITY_SUITE: ${{ matrix.mode }}
        run: |
          python - <<'PY'
          import os,json,hashlib,subprocess,tarfile
          from pathlib import Path
          root=Path('leonardos-guild');out=root/'city-output'/os.environ['CITY_SUITE'];out.mkdir(parents=True,exist_ok=True)
          (out/'tested-commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          (out/'uncommitted-diff.txt').write_text(subprocess.check_output(['git','diff','--stat'],text=True))
          excluded={'city-output','life-output','test-output','touch-output','street-output','__pycache__'}
          files={str(f.relative_to(root)):hashlib.sha256(f.read_bytes()).hexdigest() for f in root.rglob('*') if f.is_file() and not excluded.intersection(f.parts) and f.suffix in ['.js','.mjs','.css','.html','.json','.webp','.png','.bin','.gltf','.md','.txt','.py']}
          (out/'source-hashes.json').write_text(json.dumps(files,indent=2))
          with tarfile.open(out/'source.tgz','w:gz') as tar:
            for name in files:tar.add(root/name,arcname='leonardos-guild/'+name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guild-hours-${{ matrix.mode }}
          path: leonardos-guild/city-output/${{ matrix.mode }}/
          retention-days: 7
