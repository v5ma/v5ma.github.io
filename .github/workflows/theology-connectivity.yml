name: Validate explained wiki connections
on:
  push:
    paths:
      - 'theology-wiki/connections/**'
      - 'scripts/theology-connectivity-artifact*'
      - 'scripts/theology-release-sync*'
      - 'theology-wiki/discover/**'
      - 'theology-wiki/evidence-review-20261109/**'
      - '.github/workflows/theology-connectivity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate graph, original sources, all routes and reproducible output
        run: node --test theology-wiki/connections/test.cjs scripts/theology-connectivity-artifact.test.cjs scripts/theology-release-sync.test.cjs theology-wiki/discover/test.cjs theology-wiki/evidence-review-20261109/test.cjs
      - name: Verify strict publication byte normalization
        run: python -m unittest discover -s scripts -p 'test_theology_publication_bytes.py'
      - name: Verify the prior evidence and reading editions remain intact
        run: node --test theology-wiki/clouds-and-millennium-20261109/test.cjs theology-wiki/rppa-power-20261109/test.cjs theology-wiki/latest/test.cjs theology-wiki/jesus-ethics-20261105/integration.test.cjs theology-wiki/purpose/test.cjs theology-wiki/prophecy-patterns-20261105/integration.test.cjs theology-wiki/alternative-inheritances-20261109/test.cjs
      - name: Build and verify the exact publication artifact
        run: node scripts/theology-connectivity-artifact.cjs .pages-connectivity > connectivity-artifact-report.json
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Test desktop, mobile, archive preservation, search and no-JavaScript fallback
        run: python theology-wiki/connections/browser_test.py
      - name: Test discovery and evidence feature in Chromium
        run: |
          python -m http.server 8766 --directory .pages-connectivity >/tmp/discovery-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          DISCOVERY_URL=http://127.0.0.1:8766/theology-wiki/discover/index.html python theology-wiki/discover/browser_test.py
          python theology-wiki/evidence-review-20261109/browser-test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wiki-connectivity-${{ github.run_id }}
          path: |
            connectivity-qa/
            connectivity-artifact-report.json
          retention-days: 14
