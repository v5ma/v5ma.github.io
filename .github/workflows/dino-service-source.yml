name: Dino service-loop candidate
on:
  push:
    branches: ['dino-atlas/service-loop-20260915']
    paths: ['.github/workflows/dino-service-source.yml']
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source: ${{ steps.apply.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dino-atlas/service-loop-20260915
          sparse-checkout: |
            dino-atlas
            .github
            level-design-library
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: apply
        name: Apply exact checksum and remove temporary transport
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,json,hashlib,lzma,base64,os
          expected={'.github/workflows/dino-tidegate.yml':'3dcaa2639b87c388a40a466ee686df895fb95903','dino-atlas/AAA-ROADMAP.md':'b22b0182b241565df30486ac07b7506857c1c5cb','dino-atlas/AGENTS.md':'84bd1ebc3c02962ac498056f8633037b8fe532ae','dino-atlas/tests/tidegate-browser.py':'1cda98dd7c535da1e2a422ad34ca0430796e4762','dino-atlas/tests/tidegate-view-browser.py':'d8bdb1c51ace0f940fc6afaa2313a1be0e43ba83','dino-atlas/tidegate-core.js':'4806721eeaf3d41d75e07e12821c084e05e3676c','dino-atlas/tidegate-world.js':'38872778c990f51dbc0633690a7f41dfc4a9b83c','dino-atlas/tidegate.html':'7705726356b4600b7efdc15ed1752e51ec10394c','dino-atlas/tidegate.js':'9c2d3d1f628989692a0be40b9c4fc4b3f3a106f0'}
          for p,sha in expected.items():assert subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip()==sha,'Baseline changed: '+p
          parts=sorted(Path('.github/patches').glob('dino-service-loop.*.b64'));assert len(parts)==3
          patch=lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='96a689531ff4232b2dd5531335d25cb8673c86a3210cced41f2fae1a78f89452'
          f=Path('/tmp/dino-service.patch');f.write_bytes(patch)
          names=subprocess.check_output(['git','apply','--numstat',str(f)],text=True)
          assert all(line.split('\t')[-1].startswith('dino-atlas/') or line.split('\t')[-1] in ['.github/workflows/dino-tidegate.yml','level-design-library/DINO-ATLAS-CURRENT.md'] for line in names.splitlines())
          subprocess.run(['git','apply','--unidiff-zero','--check',str(f)],check=True)
          subprocess.run(['git','apply','--unidiff-zero','--index',str(f)],check=True)
          subprocess.run(['bash','-c','node --test dino-atlas/tests/*.test.mjs'],check=True)
          subprocess.run(['git','rm',*[str(p) for p in parts],'.github/workflows/dino-service-source.yml'],check=True)
          subprocess.run(['git','config','user.name','Dino Atlas Build'],check=True)
          subprocess.run(['git','config','user.email','noreply@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','Refine Tidegate service loop: real maintenance access, honest routes, local resupply and clearance signals'],check=True)
          subprocess.run(['git','push','origin','HEAD:dino-atlas/service-loop-20260915'],check=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'],'a') as o:o.write('source='+sha+'\n')
          PY
  model:
    needs: integrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.source }}
          persist-credentials: false
          sparse-checkout: |
            dino-atlas
            .github
            level-design-library
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          mkdir -p model-evidence
          git rev-parse HEAD > model-evidence/source-commit.txt
          tar -czf model-evidence/source.tgz dino-atlas .github/workflows/dino-tidegate.yml level-design-library/DINO-ATLAS-CURRENT.md
          find dino-atlas -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          set -o pipefail
          node --test dino-atlas/tests/*.test.mjs | tee model-evidence/unit-tests.tap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-model-${{ github.run_id }}
          path: model-evidence/
          retention-days: 30
  browser:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: tidegate, script: tidegate-browser.py, approach: ''}
          - {name: harbor, script: service-loop-browser.py, approach: harbor}
          - {name: maintenance, script: service-loop-browser.py, approach: maintenance}
          - {name: grounded, script: grounded-xr-browser.py, approach: ''}
          - {name: herds, script: living-herds-browser.py, approach: ''}
          - {name: storm, script: aaa-browser.py, approach: ''}
          - {name: pelagic, script: aquatics-browser.py, approach: ''}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.source }}
          persist-credentials: false
          sparse-checkout: dino-atlas
      - run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Native actual-input journey
        env:
          SERVICE_APPROACH: ${{ matrix.approach }}
        run: python dino-atlas/tests/${{ matrix.script }}
      - name: Miniature views with explicit mock eye poses
        if: matrix.name == 'tidegate' && success()
        run: python dino-atlas/tests/tidegate-view-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-${{ matrix.name }}-${{ github.run_id }}
          path: |
            tidegate-evidence/
            service-loop-evidence/
            dino-atlas/verification/grounded-xr/
            herds-evidence/
            aaa-evidence/
            aquatics-evidence/
          retention-days: 30
