name: Dino Atlas Tidegate
on:
  push:
    branches: ['dino-atlas/tidegate-diorama-20260915']
    paths: ['dino-atlas/**', '.github/workflows/dino-tidegate.yml', '.github/patches/tidegate-fixes.b64']
permissions:
  contents: read
concurrency:
  group: dino-tidegate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source: ${{ steps.apply.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dino-atlas/tidegate-diorama-20260915
          sparse-checkout: |
            dino-atlas
            .github
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: apply
        name: Apply audited audio and roof correction once
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,lzma,hashlib,subprocess,os
          p=Path('.github/patches/tidegate-fixes.b64')
          if p.exists():
              expected={'dino-atlas/tidegate.js':'31f7d5cedfea64b3e910836642e2132822580452','dino-atlas/tidegate-world.js':'962cf6f237ec1de9f6f57af0d670d29bc8bd6baa','dino-atlas/tests/tidegate-browser.py':'926e5ae25b4844f604361894de07e1197c413ecb','dino-atlas/tests/tidegate-physics.test.mjs':'1d404198bc252d12789a5871350199cdbdf08711'}
              for name,want in expected.items():assert subprocess.check_output(['git','hash-object',name],text=True).strip()==want,'Review changed source: '+name
              patch=lzma.decompress(base64.b64decode(p.read_text().strip(),validate=True))
              assert hashlib.sha256(patch).hexdigest()=='3036ab8fa8be0555890949ba844ab86f319f984b67f823ec267d33b62e4ee9fd'
              target=Path('/tmp/tidegate-fixes.patch');target.write_bytes(patch)
              names=subprocess.check_output(['git','apply','--numstat',str(target)],text=True)
              assert set(line.split('\t')[-1] for line in names.splitlines())==set(expected)
              subprocess.run(['git','apply','--check',str(target)],check=True)
              subprocess.run(['git','apply','--index',str(target)],check=True)
              subprocess.run(['bash','-c','node --test dino-atlas/tests/*.test.mjs'],check=True)
              subprocess.run(['git','rm',str(p)],check=True)
              subprocess.run(['git','config','user.name','Dino Atlas Build'],check=True)
              subprocess.run(['git','config','user.email','60057241+v5ma@users.noreply.github.com'],check=True)
              subprocess.run(['git','commit','-m','Repair Tidegate audio state adapter and roof approach; test actual boat and helicopter access'],check=True)
              subprocess.run(['git','push','origin','HEAD:dino-atlas/tidegate-diorama-20260915'],check=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('source='+sha+'\n')
          PY
  native:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.source }}
          persist-credentials: false
          sparse-checkout: |
            dino-atlas
            .github
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Archive exact source and verify all model and physics tests
        run: |
          mkdir -p tidegate-evidence
          git rev-parse HEAD > tidegate-evidence/source-commit.txt
          tar -czf tidegate-source.tgz dino-atlas .github
          find dino-atlas -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          set -o pipefail
          node --test dino-atlas/tests/*.test.mjs | tee tidegate-evidence/unit-tests.tap
      - name: Install native browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Walk authored routes with real collision and synthetic Xbox; exercise explicit XR mocks
        run: python dino-atlas/tests/tidegate-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tidegate-native-${{ github.run_id }}
          path: |
            tidegate-evidence/
            tidegate-source.tgz
          retention-days: 30
