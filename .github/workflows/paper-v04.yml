name: Paper Delivery v0.4 noticeable-world acceptance
on:
  push:
    branches: [feat/paper-delivery-v0-4-neighborhood]
    paths: ['svgn-planet/**','.github/workflows/paper-v04.yml']
  pull_request:
    paths: ['svgn-planet/**','.github/workflows/paper-v04.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paper-v04-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test expanded world, boost and save compatibility
        run: |
          set -o pipefail
          mkdir -p evidence
          node --test svgn-planet/tests/*.test.mjs | tee evidence/model-tests.txt
          for f in svgn-planet/*.mjs; do node --check "$f"; done
      - name: Install native browser
        run: |
          python -m pip install playwright==1.57.0 pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Drive the branch streets and high-speed boost
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/v04-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python -u svgn-planet/tests/v04_browser.py
      - name: Preserve exact source and actual screenshots
        if: always()
        run: |
          mkdir -p evidence
          cp -r svgn-planet/test-output/v04 evidence/ 2>/dev/null || true
          git rev-parse HEAD > evidence/source-sha.txt
          git diff --stat > evidence/uncommitted-diff.txt
          tar --exclude='test-output' --exclude='__pycache__' -czf evidence/source.tgz svgn-planet index.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-v04-noticeable-world
          path: evidence/
          retention-days: 14
