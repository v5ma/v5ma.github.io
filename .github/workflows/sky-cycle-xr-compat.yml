name: Sky Cycle XR framebuffer correction
on:
  push:
    branches: ['sky-cycle/portal-network-0.21']
    paths: ['.github/workflows/sky-cycle-xr-compat.yml']
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded XR compatibility correction and regression tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('mario-maker-clone/svgn-paper-route')
          module='''/* Pinned Three r177 WebGL compatibility. Browser-owned XRWebGLLayer
           * attachments must never be replaced. Normal and projection targets delegate.
           * https://www.w3.org/TR/webxr/#opaque-framebuffer
           */
          export function protectOpaqueXRFramebuffer(renderer) {
            const backend = renderer?.backend;
            if (!backend?.isWebGLBackend || typeof backend._setFramebuffer !== 'function') {
              throw new Error('The pinned WebGL XR backend is unavailable');
            }
            const original = backend._setFramebuffer;
            function bind(descriptor) {
              const target = descriptor.renderTarget;
              if (descriptor.textures !== null && target?.isXRRenderTarget === true &&
                  target.hasExternalTextures !== true && target.samples === 0 &&
                  backend._xrFramebuffer != null) {
                backend.state.bindFramebuffer(backend.gl.FRAMEBUFFER, backend._xrFramebuffer);
                return;
              }
              return original.call(this, descriptor);
            }
            backend._setFramebuffer = bind;
            return () => {
              if (backend._setFramebuffer === bind) backend._setFramebuffer = original;
            };
          }
          '''
          p=root/'xr-webgl-compat.mjs';assert not p.exists();p.write_text(module)
          tests='''import test from 'node:test';
          import assert from 'node:assert/strict';
          import {protectOpaqueXRFramebuffer} from '../xr-webgl-compat.mjs';
          function fixture(){
            const bound=[],delegated=[];
            const backend={isWebGLBackend:true,gl:{FRAMEBUFFER:36160},_xrFramebuffer:{opaque:true},state:{bindFramebuffer:(...v)=>bound.push(v)},_setFramebuffer(d){delegated.push([this,d]);return 42;}};
            const original=backend._setFramebuffer,restore=protectOpaqueXRFramebuffer({backend});
            return {backend,bound,delegated,original,restore};
          }
          test('Opaque native XR framebuffer is bound without replacing any attachment',()=>{
            const f=fixture(),d={textures:[{}],renderTarget:{isXRRenderTarget:true,hasExternalTextures:false,samples:0}};
            f.backend._setFramebuffer(d);assert.deepEqual(f.bound,[[36160,f.backend._xrFramebuffer]]);assert.equal(f.delegated.length,0);
            f.restore();assert.equal(f.backend._setFramebuffer,f.original);
          });
          test('Projection textures and ordinary rendering delegate to the pinned backend',()=>{
            for(const renderTarget of [{isXRRenderTarget:true,hasExternalTextures:true,samples:0},{isXRRenderTarget:false,samples:0},null,{isXRRenderTarget:true,hasExternalTextures:false,samples:4}]){
              const f=fixture(),d={textures:[{}],renderTarget};assert.equal(f.backend._setFramebuffer(d),42);assert.equal(f.delegated[0][0],f.backend);assert.equal(f.bound.length,0);f.restore();
            }
          });
          test('Default framebuffer and missing XR handles do not enter compatibility path',()=>{
            const f=fixture(),d={textures:null,renderTarget:{isXRRenderTarget:true,samples:0}};f.backend._setFramebuffer(d);f.backend._xrFramebuffer=null;f.backend._setFramebuffer({...d,textures:[{}]});assert.equal(f.delegated.length,2);assert.equal(f.bound.length,0);
          });
          test('Restore is idempotent and does not overwrite a later owner',()=>{
            const f=fixture(),other=()=>{};f.backend._setFramebuffer=other;f.restore();f.restore();assert.equal(f.backend._setFramebuffer,other);
          });
          test('Unsupported backend fails before installing any adapter',()=>{
            assert.throws(()=>protectOpaqueXRFramebuffer({backend:{isWebGPUBackend:true}}),/unavailable/);
          });
          '''
          p=root/'tests/xr-webgl-compat.test.mjs';assert not p.exists();p.write_text(tests)
          p=root/'xr-play.js';s=p.read_text()
          changes={"import * as T from './vendor/three.webgpu.js';":"import * as T from './vendor/three.webgpu.js';\nimport {protectOpaqueXRFramebuffer} from './xr-webgl-compat.mjs';\nlet restoreFramebuffer=()=>{};",'presenting=false;starting=false;release();if(renderer)':'presenting=false;starting=false;release();restoreFramebuffer();restoreFramebuffer=()=>{};if(renderer)','originalRender=renderer.render;oldView=':'originalRender=renderer.render;restoreFramebuffer=protectOpaqueXRFramebuffer(renderer);oldView='}
          for old,new in changes.items():assert s.count(old)==1,old;s=s.replace(old,new)
          p.write_text(s)
          p=root/'tests/portal-network-published.py';s=p.read_text();old="'xr-play.js']";assert s.count(old)==1;s=s.replace(old,"'xr-play.js','xr-webgl-compat.mjs']");p.write_text(s)
          p=root/'tests/portal-network-browser.py';s=p.read_text();old="'route:window.__delivery";s=s.replace('__cloudview?.hero?.pose','window.__cloudview?.hero?.pose') if 'window.__cloudview?.hero?.pose' not in s else s
          old="checks=[];errors=[];logs=[];passed=False;diagnostics={}";assert s.count(old)==1;s=s.replace(old,old+';failure=None')
          old="print('FAIL:',str(exc),flush=True)";assert s.count(old)==1;s=s.replace(old,"failure=str(exc);"+old)
          old='route:window.__delivery?.state.route})';assert s.count(old)==1;s=s.replace(old,'route:window.__delivery?.state.route,capture:window.xrEmulator?.lastCapture})')
          old="'passed':passed,'checks':checks";assert s.count(old)==1;s=s.replace(old,"'passed':passed,'failure':failure,'checks':checks");p.write_text(s)
          p=root/'tests/sunrise-browser.py';s=p.read_text();old="'commit':os.getenv('GITHUB_SHA')";assert s.count(old)==1;s=s.replace(old,"'commit':__import__('subprocess').check_output(['git','rev-parse','HEAD'],cwd=ROOT,text=True).strip()");p.write_text(s)
          PY
          node --check mario-maker-clone/svgn-paper-route/xr-play.js
          node --test mario-maker-clone/svgn-paper-route/tests/*.test.mjs
          git add mario-maker-clone/svgn-paper-route/xr-webgl-compat.mjs mario-maker-clone/svgn-paper-route/xr-play.js mario-maker-clone/svgn-paper-route/tests/xr-webgl-compat.test.mjs mario-maker-clone/svgn-paper-route/tests/portal-network-published.py mario-maker-clone/svgn-paper-route/tests/portal-network-browser.py mario-maker-clone/svgn-paper-route/tests/sunrise-browser.py
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(sky-cycle): preserve browser-owned XR framebuffer attachments'
          git push origin HEAD:refs/heads/sky-cycle/portal-network-0.21
          git rev-parse HEAD
