name: Vesperfall Goldwind public acceptance
on:
  push:
    branches: [master]
    paths: ['vesperfall/**', '.github/workflows/vesperfall-goldwind.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vesperfall-goldwind-public
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      verify: ${{ steps.manifest.outputs.verify }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: manifest
        name: Freeze source manifest and separate evidence-only updates
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('.');app=root/'vesperfall';out=root/'test-output';out.mkdir(exist_ok=True)
          paths=[p for p in app.iterdir() if p.suffix in ('.js','.css','.html','.json','.xlsx','.md')]
          paths += [p for folder in ['assets','vendor'] for p in (app/folder).rglob('*') if p.is_file()]
          manifest={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(paths)}
          digest=hashlib.sha256(json.dumps(manifest,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          receipt=app/'tests/evidence/goldwind-0.16.0/publication.json'
          previous=json.loads(receipt.read_text()) if receipt.exists() else {}
          verify=json.loads((app/'release.json').read_text())['version']=='0.16.0' and (os.getenv('MANUAL')=='true' or previous.get('manifestDigest')!=digest)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          (out/'source-manifest.json').write_text(json.dumps({'commit':sha,'manifestDigest':digest,'files':manifest},indent=2))
          (out/'source-revision.txt').write_text(sha+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('verify='+str(verify).lower()+'\n')
          print('Goldwind verification required:',verify,'commit:',sha,'manifest:',digest)
          PY
      - name: Validate original model, save and workbook contracts
        if: steps.manifest.outputs.verify == 'true'
        run: |
          set -euo pipefail
          for f in vesperfall/*.js; do node --check "$f"; done
          node --test vesperfall/tests/*.test.cjs | tee test-output/model.tap
          python vesperfall/tests/production-workbook.py | tee test-output/workbook.log
          python scripts/check-vesperfall.py
      - name: Require matching served bytes before public play
        if: steps.manifest.outputs.verify == 'true'
        run: python -u vesperfall/tests/verify-live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goldwind-public-source
          path: test-output/
          retention-days: 14
  play:
    needs: source
    if: needs.source.outputs.verify == 'true'
    strategy:
      fail-fast: false
      matrix:
        suite: [goldwind, returning-bell, interface]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install production browser
        run: |
          python -m pip install playwright==1.57.0 pillow
          python -m playwright install --with-deps chromium
      - name: Exercise the actual published game and device-input paths
        env:
          TEST_BASE_URL: https://v5ma.github.io
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          mkdir -p test-output
          if [ "$SUITE" = interface ]; then
            timeout 300 python -u vesperfall/tests/launch.py | tee test-output/launch.log
            timeout 300 python -u vesperfall/tests/production-browser.py | tee test-output/production.log
          else
            timeout 2100 python -u vesperfall/tests/${SUITE}-browser.py | tee test-output/${SUITE}.log
            test -s test-output/${SUITE}/report.json
            test ! -e test-output/${SUITE}/failure.json
          fi
      - name: Require matching public bytes after the journey
        run: python -u vesperfall/tests/verify-live.py
      - name: Retain exact source and unsuccessful evidence
        if: always()
        run: |
          mkdir -p test-output
          git rev-parse HEAD > test-output/source-revision.txt
          git diff --stat > test-output/uncommitted-diff.txt
          tar -czf test-output/vesperfall-source.tgz vesperfall scripts index.html level-design-library/applied/VESPERFALL-GOLDWIND.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goldwind-public-${{ matrix.suite }}
          path: test-output/
          retention-days: 14
