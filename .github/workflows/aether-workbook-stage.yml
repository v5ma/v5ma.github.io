name: Preserve the existing public planning workbook
on:
  push:
    branches: [feat/aether-glide-and-release-backups]
    paths: [.github/workflows/aether-workbook-stage.yml]
permissions:
  contents: write
jobs:
  archive-workbook:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify workbook XML package before reconstructing its XLSX container
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma,zipfile,shutil
          text=''.join(Path(f'.workbook-incoming/part-{i}.txt').read_text() for i in range(4))
          raw=lzma.decompress(base64.b64decode(text,validate=True))
          assert len(raw)==150254
          assert hashlib.sha256(raw).hexdigest()=='c8956b4e19883a01db1f17819ee0fdfd2f19ad83d76acd1e717f52425969f5b0'
          members=json.loads(raw);assert len(members)==29
          dest=Path('aether-reach/planning/Aether-Reach-Development-Roadmap-v0.3.xlsx');dest.parent.mkdir(exist_ok=True)
          with zipfile.ZipFile(dest,'w') as z:
            for e in members:
              assert not e['name'].startswith('/') and '..' not in Path(e['name']).parts
              i=zipfile.ZipInfo(e['name'],tuple(e['date']));i.compress_type=e['type'];i.create_system=e['system'];i.external_attr=e['external'];i.internal_attr=e['internal'];i.extra=base64.b64decode(e['extra']);i.comment=base64.b64decode(e['comment']);z.writestr(i,e['text'])
          with zipfile.ZipFile(dest) as z:
            for e in members:assert z.read(e['name'])==e['text'].encode('utf-8')
          Path('aether-reach/planning/WORKBOOK-MANIFEST.json').write_text(json.dumps({'workbook':dest.name,'scope':'Archived v0.3 roadmap, weapon balance and review workbook. All 29 original XML members preserved; ZIP container recompressed. Current roadmap remains roadmap.json.','sourcePackageSha256':hashlib.sha256(raw).hexdigest(),'sha256':hashlib.sha256(dest.read_bytes()).hexdigest(),'members':{e['name']:hashlib.sha256(e['text'].encode()).hexdigest() for e in members}},indent=2)+'\n')
          shutil.rmtree('.workbook-incoming')
          print('Preserved complete eight-sheet workbook with matching XML, formulas and styles.')
          PY
      - name: Commit the actual workbook and remove transport fragments
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aether-reach/planning .workbook-incoming
          git commit -m 'Back up the complete public v0.3 development workbook and its member manifest'
          git push origin HEAD:feat/aether-glide-and-release-backups
