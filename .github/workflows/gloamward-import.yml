name: Import checked Gloamward source
on:
  push:
    branches: [feat/publish-gloamward-browser-demo]
    paths: [.gloamward-import/**, .github/workflows/gloamward-import.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/publish-gloamward-browser-demo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source and isolate writes
        run: |
          python - <<'PY'
          from pathlib import Path,PurePosixPath
          import lzma,hashlib,json
          data=b''.join(Path(f'.gloamward-import/part-{i}').read_bytes() for i in range(4))
          assert hashlib.sha256(data).hexdigest()=='705b43b1f43b7ee52c4ef344c5c1ee78b852dbbe37a97c60e0a593cb7bb63f1e'
          files=json.loads(lzma.decompress(data));assert len(files)==14
          for name,text in files.items():
            p=PurePosixPath(name)
            assert not p.is_absolute() and '..' not in p.parts
            assert name.startswith('gloamward/') or name in ('scripts/check-gloamward.py','scripts/integrate-gloamward.py')
            out=Path(name);assert not out.exists(),name
            out.parent.mkdir(parents=True,exist_ok=True);out.write_bytes(text.encode())
          PY
          python scripts/integrate-gloamward.py
          node --test gloamward/tests/core.test.mjs
          python scripts/check-gloamward.py
      - name: Commit readable source without workflow changes
        run: |
          git config user.name 'Gloamward source publisher'
          git config user.email 'gloamward@users.noreply.github.com'
          rm -rf .gloamward-import
          git add gloamward index.html scripts/check-gloamward.py scripts/integrate-gloamward.py
          git add -u .gloamward-import
          git commit -m 'Publishable Gloamward source, self-hosted A-Frame and sixth homepage card'
          git push origin HEAD:feat/publish-gloamward-browser-demo
