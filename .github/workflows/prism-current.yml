name: Verify Prism Current rhythm and AR
on:
  pull_request:
    paths: ['prism-current/**', 'index.html', '.github/workflows/prism-current.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prism-current-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [desktop, xr]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            prism-current
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify manifests and pure rhythm/audio rules
        run: |
          python prism-current/tests/verify.py
          node --test prism-current/tests/core.test.cjs > test-output/core.tap
      - name: Install native browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise the actual game
        env:
          PRISM_SUITE: ${{ matrix.suite }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/prism-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          timeout 360 python -u prism-current/tests/browser.py
      - if: always()
        run: |
          mkdir -p test-output
          git rev-parse HEAD > test-output/tested-commit.txt
          git diff --stat > test-output/uncommitted-diff.txt
          tar czf test-output/source.tgz prism-current index.html projects.css project-shortcuts.css
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-${{ matrix.suite }}
          path: test-output/
          retention-days: 14
