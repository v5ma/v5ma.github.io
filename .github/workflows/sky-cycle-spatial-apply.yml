name: Apply reviewed Sky Cycle spatial workspace
on:
  push:
    branches: ['sky-cycle/spatial-workspace-0.26']
    paths: ['.github/workflows/sky-cycle-spatial-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply exact scoped patch
        run: |
          python3 - <<'PY'
          import base64,lzma,hashlib
          from pathlib import Path
          encoded=''.join(Path(f'.github/spatial-{i}.b64').read_text().strip() for i in range(2))
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='1a8f97770a380ef8a7f0158f0f8694305b72e3a95b171c6956486dce4ae3cf86'
          for line in patch.decode().splitlines():
            if line.startswith('diff --git '):
              for value in line.split()[2:]:
                assert value[2:].startswith('mario-maker-clone/svgn-paper-route/'),value
          Path('/tmp/spatial.patch').write_bytes(patch)
          PY
          git apply --check /tmp/spatial.patch
          git apply --index /tmp/spatial.patch
          git rm .github/spatial-{0,1}.b64 .github/workflows/sky-cycle-spatial-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(sky-cycle): native AR VR workspace, live editor and headset menus'
          git push origin HEAD:refs/heads/sky-cycle/spatial-workspace-0.26
          git rev-parse HEAD
