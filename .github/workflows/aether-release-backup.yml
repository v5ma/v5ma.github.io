name: Archive verified Aether release
on:
  workflow_run:
    workflows: ['Verify published Aether Reach']
    types: [completed]
    branches: [master]
  workflow_call:
    inputs:
      source:
        required: true
        type: string
      publication_run:
        required: true
        type: string
permissions:
  contents: read
jobs:
  scope:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) || (inputs.source != '' && inputs.publication_run != '')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source || github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        name: Ignore unrelated homepage-only publications
        run: |
          if git diff --quiet HEAD^ HEAD -- aether-reach .github/workflows/aether-release-backup.yml; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
  archive:
    needs: scope
    if: needs.scope.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE: ${{ inputs.source || github.event.workflow_run.head_sha }}
      PUBLICATION_RUN: ${{ inputs.publication_run || github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source || github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate trusted published revision and latest receipt
        run: |
          git merge-base --is-ancestor "$SOURCE" origin/master
          node aether-reach/tests/release-manifest.mjs
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,os,subprocess,io,zipfile,re
          repo=os.environ['GH_REPO'];source=os.environ['SOURCE'];run_id=os.environ['PUBLICATION_RUN']
          assert re.fullmatch('[0-9a-f]{40}',source) and run_id.isdecimal()
          def api(path):return json.loads(subprocess.check_output(['gh','api',path],text=True))
          run=api(f'repos/{repo}/actions/runs/{run_id}')
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['event']=='push' and run['head_branch']=='master' and run['head_sha']==source
          assert run['path']=='.github/workflows/aether-published.yml'
          assert run['repository']['full_name']==repo and run['head_repository']['full_name']==repo
          pages=json.loads(subprocess.check_output(['gh','api','--paginate','--slurp',f'repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100'],text=True))
          choices=[a for page in pages for a in page['artifacts'] if a['name']=='aether-publication' and not a['expired']]
          assert choices,'No publication receipt exists for the successful run.'
          # Artifact IDs and API ordering do not identify the newest retry.
          chosen=max(choices,key=lambda a:(a['created_at'],a['updated_at'],a['id']))
          assert chosen['workflow_run']['head_sha']==source
          assert chosen['size_in_bytes']<1048576
          raw=subprocess.check_output(['gh','api',f"repos/{repo}/actions/artifacts/{chosen['id']}/zip"])
          if chosen.get('digest'):assert chosen['digest']=='sha256:'+hashlib.sha256(raw).hexdigest()
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
            info=archive.getinfo('aether-publication.json');assert info.file_size<1048576
            receipt=archive.read(info)
          r=json.loads(receipt)
          assert r['all_match'] and r['source']==source,'The newest receipt does not certify this source.'
          expected=json.loads(Path('aether-reach/test-output/runtime-manifest.json').read_text())['files']
          assert set(r['files'])==set(expected),'The receipt must cover the complete runtime contract.'
          for name,item in r['files'].items():
            assert item['status']==200 and item['match']
            assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==item['sha256']==expected[name],name
          folder=Path('/tmp/aether-publication');folder.mkdir(exist_ok=True)
          (folder/'aether-publication.json').write_bytes(receipt)
          (folder/'receipt-selection.json').write_text(json.dumps({'source':source,'publicationRun':int(run_id),'runAttempt':run['run_attempt'],'artifact':chosen['id'],'createdAt':chosen['created_at'],'runtimeFiles':len(expected)},indent=2)+'\n')
          print('All published runtime bytes match; selected artifact',chosen['id'],'from',chosen['created_at'])
          PY
      - name: Build public backup and verify its clean restoration
        run: |
          python aether-reach/tools/backup.py --out /tmp/aether-release
          ZIP=$(find /tmp/aether-release -name '*source.zip' -print -quit)
          python aether-reach/tools/backup.py --restore "$ZIP" --destination /tmp/aether-release-restore
          (cd /tmp/aether-release-restore && node --test aether-reach/tests/*.test.mjs) > /tmp/aether-release/restore-check.txt
          python - <<'PY'
          """Collect native review artifacts by creation time and verify their identities."""
          from pathlib import Path, PurePosixPath
          import hashlib, io, json, os, re, subprocess, zipfile

          def choose_artifact(items, name, head):
              candidates = [a for a in items if a['name'] == name and not a['expired']
                            and a.get('workflow_run', {}).get('head_sha') == head]
              if not candidates:
                  raise ValueError('No matching, unexpired artifact: ' + name)
              return max(candidates, key=lambda a: (a['created_at'], a['updated_at'], a['id']))

          def inspect_artifact(raw, selected, expected, report_name, minimum):
              digest = hashlib.sha256(raw).hexdigest()
              if selected.get('digest') != 'sha256:' + digest:
                  raise ValueError('Artifact digest mismatch')
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  names = z.namelist()
                  if len(names) != len(set(names)) or len(names) > 1000:
                      raise ValueError('Duplicate or excessive artifact members')
                  if sum(i.file_size for i in z.infolist()) > 128 * 1024 * 1024:
                      raise ValueError('Artifact exceeds expanded-size limit')
                  for i in z.infolist():
                      p = PurePosixPath(i.filename)
                      if p.is_absolute() or '..' in p.parts or '\\' in i.filename or ((i.external_attr >> 16) & 0o170000) == 0o120000:
                          raise ValueError('Unsafe artifact member')
                  if z.read('uncommitted-diff.txt').strip():
                      raise ValueError('Uncommitted changes in native review')
                  if json.loads(z.read('runtime-manifest.json'))['files'] != expected:
                      raise ValueError('Native review does not match the complete source contract')
                  tested = z.read('tested-commit.txt').decode().strip()
                  if not re.fullmatch('[0-9a-f]{40}', tested):
                      raise ValueError('Invalid tested commit identity')
                  report = json.loads(z.read(report_name))
                  if report['passed'] < minimum or len(report['checks']) != report['passed'] or report.get('errors') or report.get('shaderErrors') or report.get('nativeDialogs'):
                      raise ValueError('Incomplete or unsuccessful native report: ' + report_name)
                  files = {n: z.read(n) for n in names if len(PurePosixPath(n).parts) == 1 and PurePosixPath(n).suffix in {'.json', '.png', '.txt', '.log'}}
                  return files, {'artifact': selected['id'], 'createdAt': selected['created_at'],
                                 'sha256': digest, 'testedCommit': tested, 'passed': report['passed']}

          def main():
              source = os.environ['SOURCE']; repo = os.environ['GH_REPO']
              if not re.fullmatch('[0-9a-f]{40}', source):
                  raise ValueError('Invalid release source')
              version = json.loads(Path('aether-reach/release.json').read_text())['version']
              numbers = tuple(map(int, version.split('.')))
              if numbers < (0, 11, 0):
                  subprocess.run(['python', 'aether-reach/tools/collect_release_evidence.py'], check=True)
                  return
              def api(path):
                  return json.loads(subprocess.check_output(['gh', 'api', path], text=True))
              pr = next(p for p in api(f'repos/{repo}/commits/{source}/pulls')
                        if p.get('merged_at') and p.get('merge_commit_sha') == source and p['base']['ref'] == 'master')
              head = pr['head']['sha']
              if not re.fullmatch('[0-9a-f]{40}', head):
                  raise ValueError('Invalid accepted head')
              rewired = numbers >= (0, 12, 0)
              workflow = '.github/workflows/aether-rewired.yml' if rewired else '.github/workflows/aether-grounded.yml'
              prefix = 'aether-rewired-' if rewired else 'aether-grounded-'
              if numbers == (0, 15, 0):
                  workflow = '.github/workflows/aether-rotunda.yml'
                  prefix = 'aether-rotunda-'
              runs = api(f'repos/{repo}/actions/runs?head_sha={head}&status=success&per_page=100')['workflow_runs']
              candidates = [r for r in runs if r['path'] == workflow and r['head_sha'] == head
                            and r['status'] == 'completed' and r['conclusion'] == 'success'
                            and r['repository']['full_name'] == repo and r['head_repository']['full_name'] == repo]
              run = max(candidates, key=lambda r: (r['updated_at'], r['id']))
              pages = json.loads(subprocess.check_output(['gh', 'api', '--paginate', '--slurp', f"repos/{repo}/actions/runs/{run['id']}/artifacts?per_page=100"], text=True))
              items = [a for page in pages for a in page['artifacts']]
              reports = {'grounded':'grounded-browser.json','xr':'xr-report.json','controller':'controller-journey-report.json','blackout':'bellwether-browser.json','skyglass':'skyglass-browser.json','foundry':'foundry-browser.json','glide':'glide-report.json','tactics-tools':'tools-tactics-report.json','tactics-recovery':'recovery-tactics-report.json'}
              if rewired:
                  reports = {'diorama':'diorama-browser.json','rewired':'rewired-browser.json','grounded':'grounded-browser.json','controller':'controller-journey-report.json','expedition':'expedition-report.json','glide':'glide-report.json'}
              if numbers >= (0, 13, 0):
                  reports['windbreak'] = 'windbreak-browser.json'
              minima = {'diorama':25,'rewired':29,'grounded':21,'controller':29,'expedition':16,'glide':10,'windbreak':40} if numbers >= (0,13,0) else {}
              if numbers >= (0, 14, 0):
                  reports.update({'portal-render':'portal-render.json','portal-game':'portal-browser.json'})
                  minima.update({'portal-render':7,'portal-game':23})
              if numbers == (0, 15, 0):
                  reports = {'rotunda':'rotunda-browser.json','window':'window-browser.json','portal':'portal-browser.json','render':'portal-render.json','grounded':'grounded-browser.json','controller':'controller-journey-report.json'}
                  minima = {'rotunda':28,'window':59,'portal':23,'render':9,'grounded':21,'controller':29}
              expected = json.loads(Path('aether-reach/test-output/runtime-manifest.json').read_text())['files']
              for name, digest in expected.items():
                  if hashlib.sha256(Path(name).read_bytes()).hexdigest() != digest:
                      raise ValueError('Source changed after manifest creation: ' + name)
              out = Path('/tmp/aether-release'); out.mkdir(exist_ok=True)
              selections = {}
              with zipfile.ZipFile(out / f'Aether-Reach-v{version}-native-grounded-evidence.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
                  for suite, name in reports.items():
                      selected = choose_artifact(items, prefix + suite, head)
                      if selected['size_in_bytes'] > 32 * 1024 * 1024:
                          raise ValueError('Artifact exceeds compressed-size limit')
                      raw = subprocess.check_output(['gh', 'api', f"repos/{repo}/actions/artifacts/{selected['id']}/zip"])
                      files, receipt = inspect_artifact(raw, selected, expected, name, minima.get(suite, 1))
                      selections[suite] = receipt
                      for filename, contents in files.items():
                          archive.writestr(suite + '/' + filename, contents)
                  scope = {'source':source,'head':head,'workflow':run['id'],'suites':reports,'artifacts':selections,
                           'scope':'Latest-created, digest-verified artifacts from a successful exact-head native workflow. All runtime files match the release source. Software WebGL and synthetic device inputs only; no physical Xbox/Quest or player-quality approval.'}
                  archive.writestr('scope.json', json.dumps(scope, indent=2))
              (out / 'native-artifact-selection.json').write_text(json.dumps(scope, indent=2) + '\n')
              print('Archived latest exact-source native reports from', run['id'])

          if __name__ == '__main__':
              main()
          PY
          cp aether-reach/planning/*.xlsx /tmp/aether-release/
          cp /tmp/aether-publication/*.json /tmp/aether-release/
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          folder=Path('/tmp/aether-release');m=json.loads(Path('aether-reach/planning/WORKBOOK-MANIFEST.json').read_text())
          assert hashlib.sha256((folder/m['workbook']).read_bytes()).hexdigest()==m['sha256']
          names=sorted(p for p in folder.iterdir() if p.is_file() and p.name!='SHA256SUMS.txt')
          (folder/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in names))
          PY
      - name: Create a versioned release without overwriting history
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('aether-reach/release.json')).version")
          TAG="aether-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" --pattern BACKUP-MANIFEST.json --dir /tmp/aether-existing
            python - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads(Path('/tmp/aether-existing/BACKUP-MANIFEST.json').read_text())
          assert m['source']==os.environ['SOURCE'],'This version already belongs to a different commit; refusing replacement.'
          PY
          else
            printf 'Verified public Aether Reach %s. Source: %s.\n\nIncludes the public game source, archived v0.3 workbook, checksums, clean-restore model tests, exact-source native browser evidence and verified deployment receipt. Physical Xbox/Quest acceptance and unfamiliar-player design approval remain open. No private narrative or player browser saves. This is a game snapshot, not a full Git mirror or independent off-site backup. See aether-reach/BACKUPS.md.\n' "$VERSION" "$SOURCE" >/tmp/aether-release-notes.md
            gh release create "$TAG" /tmp/aether-release/* --target "$SOURCE" --title "Aether Reach $VERSION - verified source backup" --notes-file /tmp/aether-release-notes.md --latest=false
          fi
          echo "$TAG" > /tmp/aether-release-tag.txt
      - name: Download the published assets and verify the backup actually exists
        run: |
          TAG=$(cat /tmp/aether-release-tag.txt)
          gh release download "$TAG" --dir /tmp/aether-release-roundtrip
          (cd /tmp/aether-release-roundtrip && sha256sum --check SHA256SUMS.txt)
          python - <<'PY'
          from pathlib import Path
          import os,json,hashlib
          root=Path('/tmp/aether-release-roundtrip');manifest=json.loads((root/'BACKUP-MANIFEST.json').read_text())
          assert manifest['source']==os.environ['SOURCE']
          report={'source':manifest['source'],'version':manifest['version'],'releaseTag':Path('/tmp/aether-release-tag.txt').read_text().strip(),'downloadedAndVerified':True,'sourceFiles':len(manifest['files']),'assets':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir() if p.is_file()},'scope':'Public game only. No browser saves, private story, full Git history or off-site mirroring.'}
          Path('/tmp/aether-backup-receipt.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-release-backup-receipt
          path: |
            /tmp/aether-backup-receipt.json
            /tmp/aether-release/restore-check.txt
            /tmp/aether-publication/receipt-selection.json
          retention-days: 30
