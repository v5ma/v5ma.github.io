name: Prepare Vesperfall pinned dependency
on:
  push:
    branches: [feat/vesperfall-quest-archery]
    paths: [.github/workflows/vesperfall-bootstrap.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vesperfall-quest-archery
      - name: Vendor the exact published A-Frame build
        run: |
          mkdir -p vesperfall/vendor
          curl --fail --retry 2 -L 'https://raw.githubusercontent.com/aframevr/releases/6dd37629cb24b378ea925820d0c9605f8907a1b1/1.8.0/aframe.min.js' -o vesperfall/vendor/aframe-1.8.0.min.js
          curl --fail --retry 2 -L 'https://raw.githubusercontent.com/aframevr/aframe/v1.8.0/LICENSE' -o vesperfall/vendor/AFRAME-LICENSE.txt
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('vesperfall/vendor/aframe-1.8.0.min.js')
          assert p.stat().st_size>500000 and b'AFRAME' in p.read_bytes()
          Path('vesperfall/vendor/manifest.json').write_text(json.dumps({'library':'A-Frame','version':'1.8.0','upstream_commit':'6dd37629cb24b378ea925820d0c9605f8907a1b1','sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'source':'https://github.com/aframevr/releases/blob/6dd37629cb24b378ea925820d0c9605f8907a1b1/1.8.0/aframe.min.js'},indent=2)+'\n')
          PY
          git config user.name 'Vesperfall dependency setup'
          git config user.email 'vesperfall@users.noreply.github.com'
          git add vesperfall/vendor
          if ! git diff --cached --quiet; then git commit -m 'Vendor A-Frame 1.8.0 from pinned upstream revision'; git push origin HEAD:feat/vesperfall-quest-archery; fi
      - name: Collect exact public baseline and dependency for local review
        run: |
          mkdir -p output
          find . -name AGENTS.md -not -path './.git/*' -print > output/agent-files.txt
          while IFS= read -r file; do printf '\n--- %s ---\n' "$file"; cat "$file"; done < output/agent-files.txt > output/agent-instructions.txt
          tar -czf output/baseline.tgz index.html projects.css vesperfall/vendor
          git rev-parse HEAD > output/source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vesperfall-baseline
          path: output/
          retention-days: 7
