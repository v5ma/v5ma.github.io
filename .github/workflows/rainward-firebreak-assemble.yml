name: Assemble scoped Rainward firebreak
on:
  push:
    branches: [feat/rainward-freight-firebreak-20260915]
    paths: ['rainward/tools/assemble-firebreak.py','.github/workflows/rainward-firebreak-assemble.yml']
permissions:
  contents: write
concurrency:
  group: rainward-firebreak-assembly
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rainward-freight-firebreak-20260915
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble against the inspected source and remove temporary tools
        run: |
          python rainward/tools/assemble-firebreak.py
          mkdir -p test-output
          node --test rainward/tests/*.test.mjs > test-output/model-tests.txt
          python -m compileall -q rainward/tests
      - name: Commit declared scope before any native acceptance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rainward .github/workflows/rainward-firebreak-assemble.yml
          git commit -m 'Integrate Freight Firebreak and remove one-time assembly before acceptance'
          git push origin HEAD:feat/rainward-freight-firebreak-20260915
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainward-firebreak-assembly
          path: test-output/
          retention-days: 14
