name: Finalize Vesperfall input transitions
on:
  push:
    branches: [feat/vesperfall-quest-archery]
    paths: [.github/workflows/vesperfall-input-review.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vesperfall-quest-archery
      - run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          assert subprocess.check_output(['git','rev-parse','HEAD:vesperfall/app.js'],text=True).strip()=='ad36b7b46afefa43a530eba76731f644c57d1fcd'
          p=Path('vesperfall/app.js');s=p.read_text()
          s=s.replace('if(e.button===0){this.drawHeld=true;', 'if(e.button===0){this.drawArmed=true;this.drawHeld=true;')
          s=s.replace("if(e.code==='Space')this.drawHeld=true;", "if(e.code==='Space'){if(!e.repeat)this.drawArmed=true;this.drawHeld=true;}")
          s=s.replace('draw.setPointerCapture(e.pointerId);this.drawHeld=true;', 'draw.setPointerCapture(e.pointerId);this.drawArmed=true;this.drawHeld=true;')
          s=s.replace('this.xr=true;document.body', 'this.xr=true;this.pendingPanel=true;document.body')
          s=s.replace('processXR(dt,head){this.tracked(this.scene.frame);', 'processXR(dt,head){this.tracked(this.scene.frame);if(this.pendingPanel&&head.y>.4&&Object.keys(this.hands).length){this.placePanel();this.pendingPanel=false;}')
          s=s.replace("g.fillText(this.paused?'Use the spatial menu':s.portalReady?", "g.fillText(this.paused?'Use the spatial menu':this.practice?'Practice: '+s.targets.size+' / 3 targets':s.portalReady?")
          s=s.replace("if(e.type==='gate-open')this.toast", "if(e.type==='gate-open'&&!this.practice)this.toast")
          p.write_text(s)
          p=Path('vesperfall/index.html');p.write_text(p.read_text().replace('RENOWN THIS RUN','SCORE THIS RUN'))
          p=Path('vesperfall/tests/browser.py');s=p.read_text()
          s=s.replace("{'width':1280,'height':840}", "{'width':1024,'height':720}").replace('>75000','>160000').replace('time.monotonic()+480','time.monotonic()+680')
          s=s.replace("page.wait_for_timeout(200);page.evaluate(\"TestXR.button('right',0,true)\");page.wait_for_function('Vesperfall.component.latch.drawing')", "page.wait_for_function('Vesperfall.component.latch.armed&&Vesperfall.component.hands.right&&VesperCore.len(VesperCore.sub(Vesperfall.component.hands.left.p,Vesperfall.component.hands.right.p))<.2');page.evaluate(\"TestXR.button('right',0,true)\");page.wait_for_function('Vesperfall.component.latch.drawing')")
          s=s.replace("page.evaluate(\"TestXR.pose('right',[-.23,1.35,-.26])\");page.wait_for_timeout(200);", "page.evaluate(\"TestXR.pose('right',[-.23,1.35,-.26])\");page.wait_for_function('Vesperfall.component.latch.armed');")
          p.write_text(s)
          PY
          node --check vesperfall/app.js
          node --test vesperfall/tests/core.test.cjs
          python -m py_compile vesperfall/tests/browser.py
          git config user.name 'Vesperfall input verification'
          git config user.email 'vesperfall@users.noreply.github.com'
          git add vesperfall/app.js vesperfall/index.html vesperfall/tests/browser.py
          git commit -m 'Accept fresh draw presses after menus and place XR panels after tracked frames'
          git push origin HEAD:feat/vesperfall-quest-archery
