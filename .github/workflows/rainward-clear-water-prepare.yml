name: Rainward Clear Water candidate
on:
  push:
    branches: [feat/rainward-clear-water-20260913]
    paths: ['rainward/**', '.github/workflows/rainward-clear-water-prepare.yml']
permissions:
  contents: write
concurrency:
  group: rainward-clear-water-candidate
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rainward-clear-water-20260913
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate bounded UI patch and retain model regressions
        run: |
          python rainward/tools/prepare-clear-water.py
          python -m compileall -q rainward/tests
          node --test rainward/tests/*.test.mjs
      - name: Commit only the three integrated Rainward paths
        id: source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rainward/app.mjs rainward/aquatic.mjs rainward/aquatic.css
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate Rainward preset-aware water controls and low-air guidance'
            git push origin HEAD:feat/rainward-clear-water-20260913
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  journey:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        preset: [survival, classic]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native WebGL browser
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Normal-start living-enemy controller mission
        env:
          RAINWARD_PRESET: ${{ matrix.preset }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/rainward-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          timeout 960 python -u rainward/tests/natatorium-journey.py
      - name: Preserve exact source, failures, video and snapshots
        if: always()
        run: |
          mkdir -p test-output
          python rainward/tests/release.py
          git rev-parse HEAD > test-output/tested-commit.txt
          git diff > test-output/uncommitted.diff
          tar -czf test-output/rainward-source.tgz rainward index.html projects.css
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainward-clear-water-${{ matrix.preset }}
          path: test-output/
          retention-days: 14
