name: Rainward Field Desk saved-source staging
on:
  push:
    branches: [feat/rainward-field-desk-20260921]
    paths: ['rainward/**','.github/workflows/rainward-field-desk-stage.yml']
permissions:
  contents: write
concurrency:
  group: rainward-field-desk-stage
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rainward-field-desk-20260921
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize exact reviewed changes and model checks
        run: |
          mkdir -p test-output
          python rainward/tools/stage-field-desk.py
          node --test rainward/tests/*.test.mjs > test-output/node-tests.txt
          python -m compileall -q rainward/tests
      - name: Save exact source before browser acceptance
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rainward/*.mjs rainward/*.md rainward/index.html rainward/release.json rainward/production-plan.json rainward/tests/*.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate exact Field Desk source before actual compositor acceptance'
            git push origin HEAD:feat/rainward-field-desk-20260921
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Keep exact evidence
        if: always()
        run: |
          mkdir -p test-output
          git diff > test-output/uncommitted.diff
          tar -czf test-output/rainward-source.tgz rainward
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainward-field-desk-models
          path: test-output/
          retention-days: 14
  browser:
    needs: integrate
    runs-on: ubuntu-22.04
    timeout-minutes: 14
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - view: first-person
            kind: controllers
            layer: projection
          - view: first-person-ar
            kind: controllers
            layer: base
          - view: diorama-vr
            kind: controllers
            layer: base
          - view: diorama-ar
            kind: controllers
            layer: projection
          - view: diorama-ar
            kind: hands
            layer: projection
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install actual browser
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Normal-start actual spatial interface and reentry
        env:
          XR_VIEW: ${{ matrix.view }}
          QUEST_KIND: ${{ matrix.kind }}
          XR_LAYER: ${{ matrix.layer }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/rainward-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          timeout 660 python -u rainward/tests/field-desk-browser.py
      - name: Preserve captures and actual checkout
        if: always()
        run: |
          mkdir -p test-output
          python rainward/tests/release.py
          git rev-parse HEAD > test-output/tested-commit.txt
          git diff > test-output/uncommitted.diff
          tar -czf test-output/rainward-source.tgz rainward
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainward-field-desk-${{ matrix.view }}-${{ matrix.kind }}-${{ matrix.layer }}
          path: test-output/
          retention-days: 14
