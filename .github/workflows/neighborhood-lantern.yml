name: Lantern Ward acceptance
on:
  push:
    branches: [master, neighborhood-missions/lantern-ward-playable-20260915]
    paths: ['svgn-planet/lantern/**', 'svgn-planet/lantern-ward.html', 'svgn-planet/index.html', 'svgn-planet/legacy.html', 'svgn-planet/legacy-layout.json', '.github/workflows/neighborhood-lantern.yml']
  pull_request:
    paths: ['svgn-planet/lantern/**', 'svgn-planet/lantern-ward.html', 'svgn-planet/index.html', 'svgn-planet/legacy.html', '.github/workflows/neighborhood-lantern.yml']
permissions:
  contents: read
concurrency:
  group: lantern-${{ github.ref }}
  cancel-in-progress: true
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            svgn-planet
            little-planet
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retain exact source
        run: |
          git rev-parse HEAD > SOURCE-COMMIT.txt
          tar -czf lantern-source.tar.gz svgn-planet little-planet index.html .github/workflows SOURCE-COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lantern-source
          path: lantern-source.tar.gz
          retention-days: 14
      - name: Legacy, chapter, save, collision and aperture regressions
        run: |
          set -o pipefail
          node --test svgn-planet/tests/*.test.mjs svgn-planet/design/chapter-contract.test.mjs svgn-planet/lantern/*.test.mjs | tee lantern-model.txt
          for f in svgn-planet/lantern/*.mjs; do node --check "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lantern-model
          path: lantern-model.txt
          retention-days: 30
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        suite: [street, roof, canal, xr, coastal_browser_release, homecoming_browser, atmosphere-browser, tidewater-browser, grounded-browser]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            svgn-planet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.55.0 pillow
          python -m playwright install --with-deps chromium
      - name: Exercise real renderer and simulation through emulated inputs
        env:
          WARD_ROUTE: ${{ matrix.suite }}
        run: |
          python -m http.server 8765 > server.log 2>&1 &
          case "$WARD_ROUTE" in
            street|roof|canal|xr) python svgn-planet/lantern/browser.py ;;
            *) python "svgn-planet/tests/$WARD_ROUTE.py" ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lantern-${{ matrix.suite }}
          path: |
            *-results/
            server.log
          retention-days: 30
  gate:
    needs: [model, browser]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Exact source ${{ github.sha }} passed model, all three delivery approaches, native synthetic XR and all five legacy browser suites.' >> "$GITHUB_STEP_SUMMARY"
