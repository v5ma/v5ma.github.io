name: Vesperfall Living Cathedral acceptance
on:
  pull_request:
    paths: ['vesperfall/**','scripts/check-vesperfall.py','.github/workflows/vesperfall-cathedral.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cathedral-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        suite: [visual, routes]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pure geometry and preserved combat tests
        run: |
          set -o pipefail
          node --test vesperfall/tests/*.test.cjs | tee model-tests.tap
          python scripts/check-vesperfall.py
      - name: Check out exact previous art for matching before-view
        uses: actions/checkout@v4
        with:
          ref: 221844c60d56202bddadeba2bbec1cd204535e7f
          path: baseline
          sparse-checkout: vesperfall
          persist-credentials: false
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise real HTTP A-Frame and capture actual frames
        env:
          CATHEDRAL_SUITE: ${{ matrix.suite }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/cathedral-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          timeout 1100 python -u vesperfall/tests/functional-runner.py cathedral-browser.py
      - if: always()
        run: |
          mkdir -p test-output
          cp model-tests.tap test-output/ || true
          git rev-parse HEAD > test-output/tested-commit.txt
          git diff --stat > test-output/uncommitted-diff.txt
          tar czf test-output/source.tgz vesperfall scripts/check-vesperfall.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cathedral-${{ matrix.suite }}
          path: test-output/
          retention-days: 14
