name: Refine reviewed Vesperfall materials
on:
  push:
    branches: [feat/vesperfall-jewelglass]
    paths: ['.jewelglass-refinement.json','.jewelglass-finish.json','.github/workflows/jewelglass-refine.yml']
permissions:
  contents: write
concurrency:
  group: jewelglass-source-refinement
  cancel-in-progress: false
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vesperfall-jewelglass
          sparse-checkout: |
            /vesperfall/
            /scripts/
            /gloamward/
            /index.html
            /projects.css
            /.jewelglass-refinement.json
            /.jewelglass-finish.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact visual refinements and keep the gallery headspace clear
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          staged={}
          packages=[('.jewelglass-refinement.json',{'jewelglass.js','JEWELGLASS.md','tests/jewelglass-browser.py','tests/jewelglass.test.cjs','roadmap.json'}),('.jewelglass-finish.json',{'jewelglass.js','JEWELGLASS.md','tests/jewelglass-browser.py','tests/browser.py'})]
          for package,allow in packages:
            src=Path(package)
            if not src.exists():
              assert package=='.jewelglass-refinement.json','Final refinement package must exist'
              continue
            changes=json.loads(src.read_text());assert set(changes)=={'vesperfall/'+n for n in allow}
            for name,d in changes.items():
              p=Path(name);assert not p.is_symlink()
              raw=staged.get(name,p.read_bytes());assert hashlib.sha256(raw).hexdigest()==d['before'],name
              s=raw.decode();last=len(s)+1
              for a,b,text in reversed(d['edits']):
                assert 0<=a<=b<last
                s=s[:a]+text+s[b:];last=a+1
              raw=s.encode();assert hashlib.sha256(raw).hexdigest()==d['after'],name
              staged[name]=raw
          for n,raw in staged.items():Path(n).write_bytes(raw)
          for name,_ in packages:Path(name).unlink(missing_ok=True)
          PY
          node --check vesperfall/jewelglass.js
          node --test vesperfall/tests/*.test.cjs
          python -m py_compile vesperfall/tests/browser.py vesperfall/tests/jewelglass-browser.py
          python scripts/check-vesperfall.py
      - name: Commit final visual source and input-driven regression improvement
        run: |
          git config user.name 'Vesperfall material refinement'
          git config user.email 'vesperfall@users.noreply.github.com'
          git add vesperfall
          git add -u -- .jewelglass-refinement.json .jewelglass-finish.json
          git commit -m 'Refine jewel materials and batching, preserve gallery clearance, and track targets during test draws'
          git push origin HEAD:feat/vesperfall-jewelglass
