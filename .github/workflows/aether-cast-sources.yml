name: Aether character source review
on:
  push:
    branches: [feat/aether-aurora-cast-20260912]
    paths: ['.github/workflows/aether-cast-sources.yml']
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download selected data files from the author's public folders
        run: |
          python -m pip install gdown==5.2.0
          mkdir -p sources
          python - <<'PY'
          from pathlib import Path
          import gdown,json,hashlib
          files=[('guard.gltf','1VGmU5f8a43NBT22JWB507NDSLbmNxzF9'),('worker.gltf','14d8n7IDnnlnGt_uiATnNg3uvi_4dyd9V'),('courier.gltf','1uxAFnDp73NO1c16LvHHjAYh1-deMNk5I'),('men-license.txt','1TTvylHa1CsiJuHFWWiv6PFGhLM-aAH5z'),('women-license.txt','1lIFL16xEpoPbr0j_HUATgmcEnAmYoIK2'),('how-to-use.txt','1FOD3BMs7o0VzdgRrDwBRBUiwyt7syauC')]
          report=[]
          for name,id in files:
            p=Path('sources')/name
            gdown.download(id=id,output=str(p),quiet=False)
            data=p.read_bytes();assert len(data)<35_000_000
            row=dict(file=name,id=id,bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
            if name.endswith('.gltf'):
              j=json.loads(data)
              row.update(animations=[a.get('name') for a in j.get('animations',[])],skins=len(j.get('skins',[])),meshes=[m.get('name') for m in j.get('meshes',[])],buffers=[{'byteLength':b['byteLength'],'embedded':b.get('uri','').startswith('data:')} for b in j.get('buffers',[])])
            else:row['text']=data.decode()
            report.append(row);print(json.dumps(row))
          Path('sources/report.json').write_text(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-character-sources
          path: sources
          retention-days: 14
