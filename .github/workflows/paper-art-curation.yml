name: Curate Paper Delivery licensed art
on:
  push:
    branches: [art/paper-city-visual-first-20260907]
    paths: ['.github/workflows/paper-art-curation.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  curate:
    if: github.ref == 'refs/heads/art/paper-city-visual-first-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/paper-city-visual-first-20260907
      - name: Derive desktop and phone sky images from the official CC0 asset
        run: |
          python -m pip install pillow==11.3.0
          python - <<'PY'
          import urllib.request,pathlib,json,hashlib,io
          from PIL import Image
          root=pathlib.Path('svgn-planet/assets/street-art')
          url='https://dl.polyhaven.org/file/ph-assets/HDRIs/extra/Tonemapped%20JPG/kloppenheim_06_puresky.jpg'
          with urllib.request.urlopen(url,timeout=60) as response:
              data=response.read(30*1024*1024)
          assert len(data)<30*1024*1024
          source=Image.open(io.BytesIO(data));entry={'type':'sky','author':'Greg Zaal / Jarod Guest / Poly Haven','source':'https://polyhaven.com/a/kloppenheim_06_puresky','sourceUrl':url,'license':'CC0-1.0','sourceSha256':hashlib.sha256(data).hexdigest(),'modification':'Resized official tonemapped JPEG; not an unclipped HDR lighting file.','files':[]}
          for size,name in [(4096,'sky-desktop.jpg'),(2048,'sky-mobile.jpg')]:
              im=source.copy();im.thumbnail((size,size//2),Image.Resampling.LANCZOS);p=root/name;im.convert('RGB').save(p,quality=89,optimize=True)
              entry['files'].append({'file':name,'size':list(im.size),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          p=root/'asset-register.json';registry=json.loads(p.read_text());registry['sources']=[s for s in registry['sources'] if s.get('type')!='sky']+[entry];p.write_text(json.dumps(registry,indent=2))
          print(json.dumps(entry,indent=2))
          PY
      - name: Commit only licensed art to the art branch
        run: |
          git config user.name 'SVGN Art Pipeline'
          git config user.email '60057241+v5ma@users.noreply.github.com'
          git add -- svgn-planet/assets/street-art/sky-desktop.jpg svgn-planet/assets/street-art/sky-mobile.jpg svgn-planet/assets/street-art/asset-register.json
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --name-only | python -c 'import sys; assert all(p.startswith("svgn-planet/assets/street-art/") for p in sys.stdin.read().splitlines())'
          git commit -m 'Import CC0 pure-sky photographs as bounded local desktop and mobile game textures'
          git push origin HEAD:refs/heads/art/paper-city-visual-first-20260907
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curated-sky-art
          path: svgn-planet/assets/street-art/sky-*.jpg
          retention-days: 7
