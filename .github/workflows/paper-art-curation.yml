name: Curate Paper Delivery licensed art
on:
  push:
    branches: [art/paper-city-visual-first-20260907]
    paths: ['.github/workflows/paper-art-curation.yml','svgn-planet/tools/prepare-street-art.py']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  curate:
    if: github.ref == 'refs/heads/art/paper-city-visual-first-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/paper-city-visual-first-20260907
      - uses: actions/download-artifact@v4
        with:
          name: paper-licensed-art-intake
          run-id: 34170720948
          github-token: ${{ github.token }}
          path: art-intake
      - name: Curate static GLTF and shared images
        run: |
          python -m pip install pillow==11.3.0
          python svgn-planet/tools/prepare-street-art.py art-intake
          mkdir -p svgn-planet/vendor/loaders svgn-planet/vendor/utils
          python - <<'PY'
          import urllib.request,pathlib
          # Same r177 as the committed renderer. Never replace the engine.
          for part in ['loaders/GLTFLoader.js','utils/BufferGeometryUtils.js']:
              url='https://raw.githubusercontent.com/mrdoob/three.js/r177/examples/jsm/'+part
              data=urllib.request.urlopen(url,timeout=30).read().decode().replace("from 'three'","from '../three.module.js'")
              pathlib.Path('svgn-planet/vendor/'+part).write_text(data)
          PY
      - name: Commit only curated art and the matching loader to the art branch
        run: |
          git config user.name 'SVGN Art Pipeline'
          git config user.email '60057241+v5ma@users.noreply.github.com'
          git add -- svgn-planet/assets/street-art svgn-planet/vendor/loaders/GLTFLoader.js svgn-planet/vendor/utils/BufferGeometryUtils.js
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --name-only | python -c 'import sys; assert all(p.startswith(("svgn-planet/assets/street-art/","svgn-planet/vendor/loaders/","svgn-planet/vendor/utils/")) for p in sys.stdin.read().splitlines())'
          git commit -m 'Import CC0 architectural modules, foliage and surface maps with source licenses and asset hashes'
          git push origin HEAD:refs/heads/art/paper-city-visual-first-20260907
      - name: Preserve curated outputs for visual inspection
        if: always()
        run: |
          mkdir -p art-result
          cp -r svgn-planet/assets svgn-planet/vendor art-result/ 2>/dev/null || true
          git rev-parse HEAD > art-result/source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curated-street-art
          path: art-result/
          retention-days: 7
