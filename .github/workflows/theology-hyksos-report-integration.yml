name: Theology one-shot Hyksos report integration
on:
  push:
    branches: ['theology/hyksos-report-20260922']
    paths:
      - 'theology-wiki/research-reports/hyksos-avaris-20260922/**'
      - '.github/workflows/theology-hyksos-report-integration.yml'
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'v5ma/v5ma.github.io' && github.ref == 'refs/heads/theology/hyksos-report-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: theology/hyksos-report-20260922
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read preservation baseline and renderer
        run: |
          git fetch --no-tags --depth=1 origin c31dd6c56a101aec7c8a890768ae1f845494b294
          python -m pip install mistune==3.2.1
      - name: Verify supplied report and build actual article links
        run: |
          set -o pipefail
          mkdir -p theology-test-output/hyksos
          node theology-wiki/research-reports/hyksos-avaris-20260922/decode.cjs | tee theology-test-output/hyksos/decode.json
          python theology-wiki/research-reports/hyksos-avaris-20260922/render.py
          node theology-wiki/research-reports/hyksos-avaris-20260922/integrate.cjs
          node theology-wiki/tools/build.cjs | tee theology-test-output/hyksos/main-build.log
          python theology-wiki/research-reports/hyksos-avaris-20260922/test_report.py 2>&1 | tee theology-test-output/hyksos/contracts.log
          git diff --stat > theology-test-output/hyksos/changed-files.txt
      - name: Capture broad legacy regression results separately
        continue-on-error: true
        run: |
          set -o pipefail
          node --test theology-wiki/tests/research.test.cjs 2>&1 | tee theology-test-output/hyksos/main-tests.log
      - name: Save verified source and generated Wiki changes only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add theology-wiki/
          if git diff --cached --name-only | grep -Ev '^theology-wiki/'; then exit 1; fi
          git diff --cached --quiet && exit 0
          git commit -m 'Archive exact Hyksos report and regenerate linked Exodus chronology and Kenite articles'
          git push origin HEAD:refs/heads/theology/hyksos-report-20260922
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theology-hyksos-integration
          path: |
            theology-test-output/hyksos/
            theology-wiki/research-reports/hyksos-avaris-20260922/
          if-no-files-found: error
