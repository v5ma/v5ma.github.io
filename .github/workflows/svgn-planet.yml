name: 3D Paper Delivery acceptance
on:
  pull_request:
    paths: ['svgn-planet/**','.github/workflows/svgn-planet.yml','index.html']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paper-3d-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        suite: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Model, geometry and safe graphics defaults
        run: |
          node --test svgn-planet/tests/*.test.mjs
          for f in svgn-planet/*.mjs; do node --check "$f"; done
      - name: Install browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Ride and recover through browser controls
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/paper-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python -u svgn-planet/tests/browser.py
      - name: Save exact source and actual rendered evidence
        if: always()
        run: |
          mkdir -p evidence
          cp -r svgn-planet/test-output evidence/ 2>/dev/null || true
          git rev-parse HEAD > evidence/source-sha.txt
          git diff --stat > evidence/uncommitted-diff.txt
          tar --exclude='test-output' --exclude='__pycache__' -czf evidence/source.tgz svgn-planet index.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-3d-${{ matrix.suite }}
          path: evidence/
          retention-days: 14
