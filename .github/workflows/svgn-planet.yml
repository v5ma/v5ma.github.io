name: Neighborhood legacy compatibility
on:
  workflow_dispatch:
  pull_request:
    paths: ['svgn-planet/**', '.github/workflows/svgn-planet.yml']
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            svgn-planet
            little-planet
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original game and frozen layout
        run: node --test svgn-planet/tests/*.test.mjs svgn-planet/lantern/legacy.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.55.0 pillow
          python -m playwright install --with-deps chromium
      - name: Original live renderer, save, Xbox and theater behavior
        run: |
          python -m http.server 8765 > server.log 2>&1 &
          python svgn-planet/tests/grounded-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-compatibility
          path: |
            grounded-results/
            server.log
          retention-days: 30
# The historical tests/browser.py assumes an obsolete 110m calibration globe
# and launch title. It remains in source, but is superseded here by supported
# v0.11 behavioral/save/render tests. The comprehensive nine-suite retained and
# new-chapter gate is neighborhood-lantern.yml, not this compatibility smoke.
