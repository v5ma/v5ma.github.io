name: Finalize Vesperfall browser verification and controls
on:
  push:
    branches: [feat/vesperfall-arrows-unchained]
    paths: [.github/workflows/unchained-refine.yml]
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vesperfall-arrows-unchained
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the exact input-driver correction, never game-state changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('vesperfall/tests/unchained-browser.py');s=p.read_text();assert hashlib.sha256(s.encode()).hexdigest()=='c37ba8854f438055701c59e5dab713e4f72d2b378cbbc5a7aa4cf1586f469fc9'
          edits=[[1818,1821,'64'],[1832,1833,''],[1834,1834,'8'],[2168,2169,'15'],[7817,7817,"pose('right',[.1,1.9,-.4])\");page.wait_for_function('Vesperfall.component.menuSelection===0');page.evaluate(\"TestXR."],[8012,8012,");page.evaluate(\"TestXR.pose('right',[.23,1.35,-.4])\""],[11386,11386,'simulationTime:window.Vesperfall?.state.time,']]
          for a,b,v in reversed(edits):s=s[:a]+v+s[b:]
          assert hashlib.sha256(s.encode()).hexdigest()=='4c42cf622f0c783ac056b3dea986af6bf9ef179bd6a30be168289191cfb8a5c5'
          p.write_text(s)
          p=Path('vesperfall/README.md');s=p.read_text();s=s.replace('# Vesperfall — The Bellward Trials','# Vesperfall — Arrows Unchained')
          s+='''

          ## Arrows Unchained / v0.3.0

          This continues the live browser game at https://v5ma.github.io/vesperfall/index.html . Existing renown, purchases and local best scores are migrated in place. The homepage route and earlier-name redirect are retained.

          **Combat tools:** V switches bow/crossbow; R manually reloads the crossbow; hold H raises the directional Wardglass shield; B spends a regenerating shard for a short supported-ground step; 5 selects three-arrow Volley. Clickable controls expose the same actions. Bow charge remains physical/held input; crossbow fires once per fresh press, with a real empty state and manual timed reload. Switching weapons cannot refill it.

          **Defend, then shoot:** the shield has a front-facing disk, not omnidirectional invulnerability. It drains guard while held and on a hit, breaks under pressure, and regenerates after recovery. You cannot shoot through your own raised guard. Wardens commit their projectile aim at windup so dodging is meaningful. Shard steps stop before walls, enemies or unsupported edges. They are directional microdashes, not simulated physical thrown-shard gestures.

          **Blink:** the displayed arc now uses exactly the same fixed-step projectile and first-hit collision as the fired arrow. A green marker means a clear landing at the current draw; coral shows a blocked/invalid destination. This is not auto-aim: releasing at a different charge changes the trajectory, and moving enemies may occupy the destination before impact. The starting gallery has a widened marked central landing. A light pull, rather than maximum range, is useful for nearby upper floors. The underside still blocks arrows.

          **Chronicle:** banked totals unlock Choirbreaker (five kills, four Volley charges in new runs), Steady Hand (three precision hits, faster crossbow reload), Unbroken (five blocks, more guard), Wayfarer (five blinks, a third step charge), and Beyond the Bell (one sector, optional Nightfall). Practice offers trial arrows but never advances achievements. Scores are local editable client records, not a secure online leaderboard. This is not full-run save/resume.

          **Quest preview additions:** bow-hand grip holds the shield; draw-hand grip performs one shard step; bow-hand stick click switches weapons; draw-hand stick click reloads. Crossbow aim follows the bow controller, fired by the draw-hand trigger. A fresh neutral trigger is required after tracking returns. Existing two-hand bow, face-button arrow selection, snap turning and spatial menus remain. For standard gamepads: LT shield, X reload, RB step, right-stick click weapon; RT fires/draws, A interacts and Y cycles arrows. Physical controller and Quest 3 calibration, frame time, comfort and thermal testing remain open.

          Original shield/crossbow geometry, pooled embers, a twilight/daylight option and an opt-in quiet synthetic choir drone accompany the mechanics. There are no ripped sounds, recorded Gregorian chants, franchise characters, private narrative imports or remote credentials. Source existence and emulated tests do not establish commercial-quality graphics or physical-headset acceptance.

          New modules are `chronicle.js` (bounded local progression) and `arsenal.js` (equipment presentation and input integration). `tests/unchained.test.cjs` contains 17 new pure regression scenarios; `unchained-browser.py` and `unchained-combat.py` drive the actual A-Frame app through ordinary UI/keyboard events or emulated device poses. Native source manifests and failures are preserved by the read-only acceptance workflow. Publication is confirmed only by the separate served-file receipt.
          '''
          p.write_text(s)
          p=Path('vesperfall/roadmap.json');d=json.loads(p.read_text());d['version']='0.3.0';d['project']='Vesperfall: Arrows Unchained'
          for t in d['tasks']:
            if t['id']=='V12':t.update(title='Crossbow, deliberate timed reload and independent weapon model',status='Implemented',gate='Real loaded/empty state and button/stick-click reload. A physical reload gesture remains future work; hardware comfort is unverified.')
            if t['id']=='V04':t['gate']='Shared projectile/preview first-hit collision; a widened upper-gallery target. A clear preview is not automatic aiming or permission to pass through solids.'
            if t['id']=='V11':t['gate']='The first room has stairs and a real upper gallery. Extend this into more room families and vertically connected route choices; not all towers are traversable.'
          d['tasks'] += [
            {'id':'V18','area':'Combat','title':'Directional Wardglass shield, break and recovery','status':'Implemented','gate':'Front-face swept blocking before body impact; side/rear exposure, guard cost, tracking cancellation and no simultaneous firing.'},
            {'id':'V19','area':'Traversal','title':'Regenerating supported-ground shard steps','status':'Implemented','gate':'Short unobstructed microdashes, no cliff crossing or tunneling. Physical thrown-shard gestures are not implemented.'},
            {'id':'V20','area':'Archery','title':'Limited three-arrow Volley and precision hits','status':'Implemented','gate':'Three independent projectiles consume one charge; actual weak-point hits earn counters.'},
            {'id':'V21','area':'Progression','title':'Permanent Chronicle milestones and optional Nightfall','status':'Implemented','gate':'Idempotent run-counter banking, retained legacy purchases, no practice farming and new-run application.'},
            {'id':'V22','area':'Presentation','title':'Twilight/daylight, original equipment and quiet synthetic ambience','status':'Implemented','gate':'Local reused geometry and opt-in sound. No borrowed audio or hardware performance claim.'},
            {'id':'V23','area':'Testing','title':'Complete scored expedition and new-device acceptance','status':'Planned','gate':'Preserve exact native reports and full-beacon/blessing/reload progression evidence; passing models alone are insufficient.'},
            {'id':'V24','area':'Traversal','title':'Physical thrown shard and richer vertical route families','status':'Planned','gate':'Readable trajectories, safe valid landings, comfortable two-handed controls and alternative routes; no forced headset motion.'},
            {'id':'V25','area':'Archery','title':'Physical crossbow wind/reload gesture','status':'Planned','gate':'Separate comfortable interaction for both handedness settings, with an accessible button alternative.'}
          ];p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          node --test vesperfall/tests/*.test.cjs
          python -m py_compile vesperfall/tests/unchained-browser.py vesperfall/tests/unchained-combat.py
          git config user.name 'Vesperfall release refinement'
          git config user.email 'vesperfall@users.noreply.github.com'
          git add vesperfall/tests/unchained-browser.py vesperfall/README.md vesperfall/roadmap.json
          git commit -m 'Correct XR test pointing, allow CPU-rendered input timing and document the real upgrade scope'
          git push origin HEAD:feat/vesperfall-arrows-unchained
