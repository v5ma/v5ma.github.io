name: Theology public origin diagnosis
on:
  push:
    branches: [theology/public-origin-verification-2026-10-03]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c6e2b09f79c0bb3bd0a0e45b54b72c35d1ca1852
          persist-credentials: false
      - name: Install native browser
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Match actual public files and test visible conditional framing
        run: |
          mkdir -p conjecture-hosted
          python - <<'PY'
          import json,hashlib,time,urllib.request
          from pathlib import Path
          from playwright.sync_api import sync_playwright,expect
          rev='c6e2b09f79c0bb3bd0a0e45b54b72c35d1ca1852'
          origin='https://v5ma.github.io'
          paths=['theology-wiki/san-reader.html','theology-wiki/data/page-index.json','theology-wiki/assets/js/publication-tools.js','theology-wiki/public-corpus/snapshot.json']
          for slug in ['computational-god-capabilities-bridge','computational-god-consciousness-and-theodicy']:
              paths += ['theology-wiki/content/developed/'+slug+'.md','theology-wiki/public-corpus/pages/'+slug+'.md']
          matched=[]
          for name in paths:
              digest=hashlib.sha256(Path(name).read_bytes()).hexdigest()
              for attempt in range(12):
                  try:
                      request=urllib.request.Request(origin+'/'+name+'?edition='+rev,headers={'User-Agent':'TheologyWiki-publication-verification'})
                      with urllib.request.urlopen(request,timeout=25) as r:actual=hashlib.sha256(r.read()).hexdigest()
                      assert digest==actual,name
                      matched.append({'path':name,'sha256':actual});break
                  except Exception:
                      if attempt==11:raise
                      time.sleep(5)
          cfg=json.loads(Path('theology-wiki/editorial/publication.json').read_text());checked=[]
          with sync_playwright() as p:
              browser=p.chromium.launch();page=browser.new_page(viewport={'width':1440,'height':1000});errors=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              for slug in cfg['conditionalScope']['pages']:
                  page.goto(origin+'/theology-wiki/san-reader.html?page='+slug)
                  expect(page.locator('#conjecture-scope')).to_contain_text('does not know for sure',timeout=20000)
                  expect(page.locator('#conjecture-scope')).to_contain_text('required belief')
                  checked.append(slug)
              for slug in ['computational-god-consciousness-and-theodicy','computational-god-capabilities-bridge']:
                  page.goto(origin+'/theology-wiki/san-reader.html?page='+slug)
                  expect(page.locator('#article-summary')).to_contain_text('conditional conjecture',timeout=20000)
                  expect(page.locator('#article-body')).to_contain_text('I do not know for sure.')
                  expect(page.locator('#article-body')).to_contain_text('not advising readers')
                  expect(page.locator('#article-body')).to_contain_text('Computational-Tomographic Proof of God')
              page.screenshot(path='conjecture-hosted/desktop.png')
              page.set_viewport_size({'width':390,'height':844})
              assert page.evaluate('document.documentElement.scrollWidth <= innerWidth+1')
              page.screenshot(path='conjecture-hosted/mobile.png')
              assert not errors,errors
              browser.close()
          Path('conjecture-hosted/report.json').write_text(json.dumps({'deploymentRevision':rev,'origin':origin,'matchedFiles':matched,'visibleScopePages':checked,'errors':errors,'mobileOverflow':False},indent=2)+'\n')
          print('Matched',len(matched),'public files and verified conditional framing on',len(checked),'live pages.')
          PY
          THEOLOGY_READER_URL=https://v5ma.github.io/theology-wiki/san-reader.html PUBLICATION_TEST_OUTPUT=conjecture-hosted/full-reader python theology-wiki/tests/publication_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theology-conjecture-hosted-verification
          path: conjecture-hosted
          retention-days: 14
