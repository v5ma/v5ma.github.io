name: Theology public origin diagnosis
on:
  push:
    branches: [theology/public-origin-verification-2026-10-03]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 43351c1cee30ed198125c543f61300f17e54ca44
          persist-credentials: false
      - name: Install native browser
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Inspect each public origin separately
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,json,subprocess,hashlib
          from playwright.sync_api import sync_playwright
          out=Path('origin-diagnosis');out.mkdir()
          origins=[('cloudflare','https://wiki.onlyonedevil.com/theology-wiki/san-reader'),('github-pages','https://v5ma.github.io/theology-wiki/san-reader.html')]
          results=[]
          with sync_playwright() as pw:
            browser=pw.chromium.launch(headless=True)
            for label,url in origins:
              dest=out/label;dest.mkdir()
              record={'origin':label,'reader':url,'deployedRevisionToCompare':'43351c1cee30ed198125c543f61300f17e54ca44'}
              page=browser.new_page()
              try:
                response=page.goto(url,wait_until='domcontentloaded',timeout=30000)
                record['httpStatus']=response.status if response else None
                record['finalUrl']=page.url
                record['title']=page.title()
                record['bodyExcerpt']=page.locator('body').inner_text(timeout=5000)[:1500]
                page.screenshot(path=str(dest/'entry.png'),full_page=False)
                if not response or response.status!=200:raise RuntimeError('Public reader did not return HTTP 200')
                env=os.environ.copy();env['THEOLOGY_READER_URL']=url;env['PUBLICATION_TEST_OUTPUT']=str(dest)
                run=subprocess.run(['python','theology-wiki/tests/publication_browser.py'],env=env,text=True,capture_output=True,timeout=120)
                (dest/'browser.log').write_text(run.stdout+'\n'+run.stderr)
                record['readerTestExitCode']=run.returncode
                if run.returncode:raise RuntimeError('Native public reader tests failed')
                base=url.split('/theology-wiki/')[0]
                paths=['theology-wiki/data/page-index.json','theology-wiki/public-corpus/snapshot.json','theology-wiki/public-corpus/page-index.json','theology-wiki/assets/js/publication-tools.js','theology-wiki/assets/js/research-tools.js','theology-wiki/assets/css/publication.css']
                for slug in ['computational-god-consciousness-and-theodicy','computational-god-capabilities-bridge','cosmic-thought-and-transcendence','publication-history']:
                  paths += ['theology-wiki/content/developed/'+slug+'.md','theology-wiki/public-corpus/pages/'+slug+'.md']
                matched=[]
                for path in paths:
                  response=page.request.get(base+'/'+path,timeout=30000)
                  assert response.status==200,path
                  digest=hashlib.sha256(response.body()).hexdigest()
                  assert digest==hashlib.sha256(Path(path).read_bytes()).hexdigest(),'Hosted bytes differ: '+path
                  matched.append({'path':path,'sha256':digest})
                record['matchedFiles']=matched;record['verified']=True
              except Exception as exc:
                record['verified']=False;record['error']=str(exc)
              finally:
                page.close();results.append(record)
                (dest/'origin.json').write_text(json.dumps(record,indent=2)+'\n')
          (out/'results.json').write_text(json.dumps(results,indent=2)+'\n')
          print(json.dumps(results,indent=2))
          if not any(r['verified'] for r in results):raise SystemExit('No public origin was independently verified. Repository publication and localhost checks remain separate.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theology-public-origin-diagnosis
          path: origin-diagnosis
          retention-days: 14
