name: Dino Express source integration
on:
  push:
    branches: ['dino-atlas/express-guidance-20260917']
    paths: ['.github/workflows/dino-express-integrate.yml']
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      source: ${{ steps.apply.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dino-atlas/express-guidance-20260917
          sparse-checkout: |
            dino-atlas
            .github
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: apply
        name: Exact source transport with before and after hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,lzma,json,hashlib,subprocess,os
          files=sorted(Path('.github/patches').glob('dino-express.*.b64'))
          assert len(files)==2
          encoded=''.join(p.read_text().strip() for p in files)
          # Repair a known duplicated pair in text transport; decoded hash is authoritative.
          assert encoded.count('WfXLOCOCOOMs')==1
          encoded=encoded.replace('WfXLOCOCOOMs','WfXLOCOOMs')
          data=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(data).hexdigest()=='82dcceeac3b9266e4e1bea952de901a1c34acb5b67289757cc5ebe69c1abdd82'
          entries=json.loads(data);assert len(entries)==27
          for e in entries:
              p=Path(e['path'])
              assert not p.is_absolute() and '..' not in p.parts
              assert str(p).startswith('dino-atlas/') or str(p)=='.github/workflows/dino-tidegate.yml'
              if e['before'] is None:
                  assert not p.exists(),str(p)
                  text=e['content']
              else:
                  old=p.read_bytes();assert hashlib.sha256(old).hexdigest()==e['before'],str(p)+' baseline changed'
                  text=old.decode()
                  for start,end,replacement in reversed(e['edits']):
                      assert 0<=start<=end<=len(text)
                      text=text[:start]+replacement+text[end:]
              assert hashlib.sha256(text.encode()).hexdigest()==e['after'],str(p)+' result mismatch'
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(text.encode())
          subprocess.run(['bash','-c','node --test dino-atlas/tests/*.test.mjs'],check=True)
          subprocess.run(['git','add',*[e['path'] for e in entries]],check=True)
          subprocess.run(['git','rm',*[str(p) for p in files],'.github/workflows/dino-express-integrate.yml'],check=True)
          subprocess.run(['git','config','user.name','Dino Atlas Build'],check=True)
          subprocess.run(['git','config','user.email','60057241+v5ma@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','Dino Atlas: sustained Express vehicles, active controls and destination guidance'],check=True)
          subprocess.run(['git','push','origin','HEAD:dino-atlas/express-guidance-20260917'],check=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('source='+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()+'\n')
          PY
  native:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scene: [classic, tidegate]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.source }}
          persist-credentials: false
          sparse-checkout: dino-atlas
      - name: Install native browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Run real input and production physics with explicit XR mocks
        env:
          EXPRESS_SCENE: ${{ matrix.scene }}
        run: python dino-atlas/tests/express-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dino-express-first-${{ matrix.scene }}-${{ github.run_id }}
          path: express-evidence/
          retention-days: 30
