name: Rainward native craft readability
on:
  pull_request:
    paths: ['rainward/**','.github/workflows/rainward-readability.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rainward-readability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source without changing it
        run: |
          mkdir -p test-output
          node --test rainward/tests/*.test.mjs > test-output/node-models.txt
          python -m compileall -q rainward/tests
      - name: Install native browser
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Keyboard, Classic and virtual Xbox crafting
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/rainward-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          timeout 480 python -u rainward/tests/readability-browser.py
      - name: Preserve source and all failures
        if: always()
        run: |
          mkdir -p test-output
          python rainward/tests/release.py
          git rev-parse HEAD > test-output/tested-commit.txt
          git diff > test-output/uncommitted.diff
          tar -czf test-output/rainward-source.tgz rainward index.html projects.css
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainward-readability
          path: test-output/
          retention-days: 14
