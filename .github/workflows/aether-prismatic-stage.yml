name: Integrate reviewed prismatic art on development branch
on:
  push:
    branches: [feat/aether-quay-art-pass]
    paths: [.github/workflows/aether-prismatic-stage.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/aether-quay-art-pass'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify base and final bytes before integration
        run: |
          python aether-reach/tools/finish-prismatic.py
          for f in aether-reach/*.mjs; do node --check "$f"; done
          python -m compileall -q aether-reach/tests
          node --test aether-reach/tests/*.test.mjs
      - name: Commit only the twelve checked public files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aether-reach/app.mjs aether-reach/combat-scene.mjs aether-reach/quay-art.mjs aether-reach/release.json aether-reach/scene.mjs aether-reach/tests/arsenal_browser.py aether-reach/tests/browser.py aether-reach/tests/public-build.test.mjs aether-reach/tests/quay_plate.py aether-reach/tests/release-manifest.mjs aether-reach/tests/tactics_browser.py aether-reach/tools/collect_art_evidence.py
          git diff --cached --stat
          git commit -m 'Finish luminous glass, faceted jewels, polished equipment and selectable rendering profiles'
          git push origin HEAD:feat/aether-quay-art-pass
