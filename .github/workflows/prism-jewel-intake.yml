name: Materialize verified Jewelbox graphics source
on:
  push:
    branches: [feat/prism-jewelbox-graphics]
    paths: [.github/workflows/prism-jewel-intake.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prism-jewelbox-graphics
          sparse-checkout: |
            prism-current
            .github
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate every input and output before isolated content changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,zlib,shutil
          payload=b''.join((Path('.github/prism-jewel-intake')/(str(i)+'.bin')).read_bytes() for i in range(7))
          assert hashlib.sha256(payload).hexdigest()=='904dd3696971a00207f9dcca7b4c5e52574f48f4eae7c0ab7726bfbd64226a45'
          files=json.loads(zlib.decompress(payload));prepared={}
          for n,d in files.items():
            p=Path(n)
            assert not p.is_absolute() and '..' not in p.parts
            if n=='.github/workflows/prism-jewels.yml':
              assert hashlib.sha256(p.read_bytes()).hexdigest()==d['after'],'The authorized connector must pre-create this unchanged workflow'
              continue
            assert n.startswith('prism-current/')
            if d['before'] is None:
              assert not p.exists(),n
              text=d['text']
            else:
              old=p.read_bytes();assert hashlib.sha256(old).hexdigest()==d['before'],n+' has changed; do not overwrite'
              text=old.decode()
              for start,end,replacement in reversed(d['edits']):text=text[:start]+replacement+text[end:]
            assert hashlib.sha256(text.encode()).hexdigest()==d['after'],n+' output mismatch'
            prepared[p]=text
          # Two reviewed refinements after the original package: all decorative
          # gems honor quality settings, and range controls use valid DOM events.
          p=Path('prism-current/art.js');s=prepared[p]
          s=s.replace('const petals=new T.Group();','const orbitJewels=[];const petals=new T.Group();').replace('o.g.scale.setScalar(.75);}','o.g.scale.setScalar(.75);orbitJewels.push(o);}').replace('of[exhibitLeft,exhibitRight])','of[exhibitLeft,exhibitRight,...orbitJewels])')
          assert hashlib.sha256(s.encode()).hexdigest()=='d7e206f6305c0a31423a0826a9cb99e28122479f964740641d0f2c8111c28ad9'
          prepared[p]=s
          p=Path('prism-current/tests/jewel-browser.py');s=prepared[p]
          for value in ['45','72']:
            old="p.locator('#effect-strength').fill('"+value+"');p.locator('#effect-strength').dispatch_event('change')"
            new="p.locator('#effect-strength').evaluate('(e)=>{e.value="+value+";e.dispatchEvent(new Event(\"input\",{bubbles:true}));e.dispatchEvent(new Event(\"change\",{bubbles:true}));}')"
            assert old in s;s=s.replace(old,new)
          assert hashlib.sha256(s.encode()).hexdigest()=='ff08e99a7ffee706be2574229fe65d6a059e0ee67eb9eb5f27daaa3ce4610d8d'
          prepared[p]=s
          for p,text in prepared.items():p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
          shutil.rmtree('.github/prism-jewel-intake')
          PY
          node --test prism-current/tests/*.test.cjs
          python prism-current/tests/verify.py
      - name: Commit content only; workflow cleanup stays with connector
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prism-current .github/prism-jewel-intake
          git diff --cached --name-only | grep -vE '^(prism-current/|.github/prism-jewel-intake/)' && exit 1 || true
          git commit -m 'Build Jewelbox graphics from hash-verified source; remove intake data'
          git push origin HEAD:feat/prism-jewelbox-graphics
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
