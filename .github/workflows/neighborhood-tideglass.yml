name: Neighborhood Missions Tideglass acceptance
on:
  push:
    branches: [neighborhood-tideglass-20260912]
    paths: ['svgn-planet/**', '.github/workflows/neighborhood-tideglass.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: neighborhood-tideglass-candidate
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate the existing game without overwriting sibling projects
        run: |
          python svgn-planet/tools/integrate-tideglass.py
          python svgn-planet/production/render-roadmap.py
          git config user.name 'Micah Blumberg'
          git config user.email '60057241+v5ma@users.noreply.github.com'
          git add svgn-planet
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate Tideglass swimming, water rendering and controller missions'
            git push origin HEAD:neighborhood-tideglass-20260912
          fi
      - name: Model, shader, mission and save regression tests
        run: |
          mkdir -p tideglass-results
          git rev-parse HEAD > tideglass-results/tested-commit.txt
          for file in svgn-planet/*.mjs; do node --check "$file"; done
          set -o pipefail
          node --test svgn-planet/tests/*.test.mjs 2>&1 | tee tideglass-results/model-tests.log
      - name: Install rendered-browser acceptance tools
        run: |
          python -m pip install playwright==1.55.0 pillow
          python -m playwright install --with-deps chromium
      - name: Swim the three missions and test the water renderer
        run: |
          python -m http.server 8765 >/tmp/tideglass-server.log 2>&1 &
          sleep 2
          set -o pipefail
          python svgn-planet/tests/aquatics-browser.py 2>&1 | tee tideglass-results/browser.log
      - name: Retained city and Homecoming controller journeys
        run: |
          python -m http.server 8765 >/tmp/tideglass-regression-server.log 2>&1 &
          sleep 2
          set -o pipefail
          COASTAL_OUTPUT=tideglass-results python svgn-planet/tests/coastal_browser_release.py 2>&1 | tee tideglass-results/coastal-regression.log
          HOMECOMING_OUTPUT=tideglass-results python svgn-planet/tests/homecoming_browser.py 2>&1 | tee tideglass-results/homecoming-regression.log
      - name: Preserve exact source and actual game captures
        if: always()
        run: |
          mkdir -p tideglass-results/source
          cp svgn-planet/*.mjs tideglass-results/source/
          cp svgn-planet/index.html svgn-planet/release.json svgn-planet/TIDEGLASS.md svgn-planet/aquatics.css tideglass-results/source/
          cp -r svgn-planet/tests svgn-planet/production tideglass-results/source/
          python - <<'PY'
          from pathlib import Path
          try:
              from PIL import Image
              for p in Path('tideglass-results').glob('*.png'):
                  im=Image.open(p).convert('RGB');im.thumbnail((1280,900));im.save(p.with_suffix('.jpg'),quality=87)
          except ImportError:
              pass
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neighborhood-tideglass-evidence
          path: tideglass-results
          retention-days: 30
