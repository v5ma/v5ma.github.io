name: Recover Night Watch campaign source
on:
  push:
    branches: [neighborhood-missions/night-watch-recovery-20260917]
    paths: ['.github/upgrades/campaign-*', '.github/workflows/neighborhood-campaign-recovery.yml']
permissions:
  contents: read
concurrency:
  group: neighborhood-campaign-source
  cancel-in-progress: true
jobs:
  integrate:
    if: github.repository == 'v5ma/v5ma.github.io' && github.ref == 'refs/heads/neighborhood-missions/night-watch-recovery-20260917'
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          sparse-checkout: |
            svgn-planet
            little-planet
            level-design-library/applied
            .github/upgrades
            .github/workflows
            index.html
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and integrate exact campaign source
        run: python3 .github/upgrades/campaign-install.py
      - name: Archive exact source and evidence
        run: |
          git rev-parse HEAD > SOURCE-COMMIT.txt
          tar -czf neighborhood-campaign-source.tar.gz svgn-planet little-planet index.html level-design-library/applied SOURCE-COMMIT.txt campaign-model.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neighborhood-campaign-source
          path: |
            neighborhood-campaign-source.tar.gz
            campaign-model.txt
          retention-days: 30
