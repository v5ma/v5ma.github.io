name: Dino Atlas Ranch and Coast
on:
  push:
    branches: [dino-ranch-coast-20260911]
    paths: ['dino-atlas/**', 'scripts/dino-ranch-*.py', 'scripts/dino_roof_guard.py', '.github/workflows/dino-ranch-coast.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dino-ranch-coast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dino-ranch-coast-20260911
          sparse-checkout: |
            dino-atlas
            scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply isolated source integration
        run: |
          python scripts/dino-ranch-coast.py
          python scripts/dino-ranch-polish.py
          python scripts/dino-ranch-stability.py
          python scripts/dino_roof_guard.py
          git add dino-atlas
          if ! git diff --cached --quiet; then
            git config user.name 'Dino Atlas Build'
            git config user.email '60057241+v5ma@users.noreply.github.com'
            git commit -m 'Integrate Ranch and Coast gameplay and regression tests'
            git push origin HEAD:dino-ranch-coast-20260911
          fi
      - name: Unit and syntax checks
        run: |
          find dino-atlas -maxdepth 1 -name '*.js' -exec node --check {} \;
          node --test dino-atlas/tests/*.test.mjs
      - name: Install rendered test runner
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Render and exercise Ranch and Coast
        run: python dino-atlas/tests/ranch-browser.py
      - name: Record tested source
        if: always()
        run: |
          mkdir -p ranch-evidence
          git rev-parse HEAD > ranch-evidence/tested-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dino-ranch-source-and-evidence
          path: |
            dino-atlas
            ranch-evidence
          retention-days: 7
