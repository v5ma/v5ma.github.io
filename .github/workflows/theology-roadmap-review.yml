name: Review Theology roadmap and textual comparison
on:
  push:
    branches: [feat/theology-roadmap-20260905]
    paths: ['theology-wiki/**', '.github/workflows/theology-roadmap-review.yml']
permissions:
  contents: write
concurrency:
  group: theology-roadmap-${{ github.ref }}
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Materialize integrity-checked roadmap source and workbook
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma,subprocess
          root=Path('theology-wiki')
          parts=sorted(root.glob('roadmap-transfer-*.txt'))
          if parts:
            assert len(parts)==12
            digest,payload=''.join(p.read_text().strip() for p in parts).split(':',1)
            assert digest=='59b91db6fcbc6ba02c43728cff8abcdfde9155364658a54af83f5ed5b9f5810f'
            packed=base64.b64decode(payload,validate=True)
            assert hashlib.sha256(packed).hexdigest()==digest,'Source package differs'
            decoded=lzma.decompress(packed)
            assert len(decoded)<2000000
            package=json.loads(decoded)
            modified={'theology-wiki/README.md','theology-wiki/tools/build.cjs','theology-wiki/assets/js/research-tools.js','theology-wiki/editorial/foundations.json','theology-wiki/tests/research.test.cjs','theology-wiki/tests/foundations.test.cjs','theology-wiki/tests/browser.py','theology-wiki/tests/foundation_checks.py'}
            added={'theology-wiki/editorial/roadmap.json','theology-wiki/editorial/roadmap.cjs','theology-wiki/editorial/roadmap-articles/melchizedek-priesthood-and-transmission.md','theology-wiki/tools/roadmap.cjs','theology-wiki/assets/js/roadmap-tools.js','theology-wiki/assets/css/roadmap.css','theology-wiki/tests/roadmap.test.cjs','theology-wiki/tests/roadmap_checks.py','theology-wiki/tools/export_roadmap_workbook.py','theology-wiki/planning/workbook-manifest.json'}
            assert set(package['files'])==added
            patch=Path('/tmp/theology-roadmap.patch');patch.write_text(package['patch'])
            actual={line.split('\t')[-1] for line in subprocess.check_output(['git','apply','--numstat',str(patch)],text=True).splitlines()}
            assert actual==modified,actual
            subprocess.run(['git','apply','--check',str(patch)],check=True)
            subprocess.run(['git','apply',str(patch)],check=True)
            for name,text in package['files'].items():
              p=Path(name);assert not p.exists();p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
            workbook=base64.b64decode(package['workbook'],validate=True)
            assert len(workbook)==105034
            expected='00d32805c937d96641186ddf83cc05114bcddaefc518e78f74404aa8abea5d61'
            manifest=json.loads((root/'planning/workbook-manifest.json').read_text())
            assert hashlib.sha256(workbook).hexdigest()==manifest['sha256']==expected,'Workbook does not match its verified manifest'
            target=root/'planning/Theology-Research-Plan.xlsx';assert not target.exists();target.write_bytes(workbook)
            for p in parts:p.unlink()
            print('Source delta and nine-sheet Excel plan verified and materialized.')
          PY
          if [ -f theology-wiki/tools/roadmap-review-fix.py ]; then python theology-wiki/tools/roadmap-review-fix.py; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test roadmap, sources, links and workbook integrity
        run: |
          set -o pipefail
          mkdir -p theology-test-output
          node theology-wiki/tools/build.cjs | tee theology-test-output/build-report.txt
          node --check theology-wiki/assets/js/roadmap-tools.js
          node --check theology-wiki/assets/js/research-tools.js
          node --test theology-wiki/tests/research.test.cjs | tee theology-test-output/node-tests.txt
          git diff --exit-code -- theology-sources san-wiki-shell scripts theology-wiki/content/sources
      - name: Preserve generated source on the isolated review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- theology-wiki
          if ! git diff --cached --quiet; then git commit -m 'Add durable Theology roadmap, source coverage, Melchizedek comparison and Excel plan'; git push origin HEAD:${GITHUB_REF_NAME}; fi
      - name: Install native browser and image tooling
        run: |
          python -m pip install --quiet playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium > /tmp/theology-browser-install.log 2>&1 || { tail -100 /tmp/theology-browser-install.log; exit 1; }
      - name: Verify preserved museum pictures
        run: python theology-wiki/tools/media.py
      - name: Exercise real HTTP reader, roadmap graph and workbook delivery
        run: |
          python -m http.server 4174 --bind 127.0.0.1 > /tmp/theology-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python theology-wiki/tests/browser.py
      - name: Preserve review evidence
        if: always()
        run: |
          mkdir -p theology-test-output
          git rev-parse HEAD > theology-test-output/tested-commit.txt
          git diff --stat > theology-test-output/uncommitted-diff.txt
          cp /tmp/theology-http.log theology-test-output/ 2>/dev/null || true
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('theology-test-output/review-source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in Path('theology-wiki').rglob('*'):
              if p.is_file() and '__pycache__' not in p.parts and p.suffix.lower() not in {'.ttf','.otf','.woff','.woff2'} and not p.name.startswith('roadmap-transfer-'):z.write(p,p.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theology-roadmap-review
          path: theology-test-output/
          retention-days: 14
