name: Rainward Clear Water living mission
on:
  pull_request:
    paths: ['rainward/**', '.github/workflows/rainward-clear-water.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rainward-clear-water-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        preset: [survival, classic]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retain model and source assertions
        run: |
          node --test rainward/tests/*.test.mjs
          python -m compileall -q rainward/tests
      - name: Install native WebGL browser
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Normal-start living-enemy Xbox-standard mission
        env:
          RAINWARD_PRESET: ${{ matrix.preset }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/rainward-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          timeout 960 python -u rainward/tests/natatorium-journey.py
      - name: Record exact-source evidence
        if: always()
        run: |
          mkdir -p test-output
          python rainward/tests/release.py
          git rev-parse HEAD > test-output/tested-commit.txt
          git diff > test-output/uncommitted.diff
          tar -czf test-output/rainward-source.tgz rainward index.html projects.css
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainward-living-${{ matrix.preset }}
          path: test-output/
          retention-days: 14
