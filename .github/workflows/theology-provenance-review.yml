name: Theology provenance review
on:
  push:
    branches: [master, theology/public-corpus-and-god-bridge-2026-10-03]
    paths: ['theology-wiki/**', 'theology-sources/**', 'scripts/cloudflare-theology-build.mjs', '.github/workflows/theology-provenance-review.yml']
  pull_request:
    branches: [master]
    paths: ['theology-wiki/**', 'theology-sources/**', 'scripts/cloudflare-theology-build.mjs', '.github/workflows/theology-provenance-review.yml']
  workflow_run:
    workflows: ['Publish the Theology Wiki to Cloudflare (wiki.onlyonedevil.com)']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: theology-provenance-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the public corpus and reader data without writing repository files
        run: |
          mkdir -p publication-test-output
          node theology-wiki/tools/publication.cjs --check | tee publication-test-output/corpus-check.json
          node --test theology-wiki/tests/research.test.cjs > publication-test-output/node-tests.log 2>&1 || { cat publication-test-output/node-tests.log; exit 1; }
          tail -12 publication-test-output/node-tests.log
          if find theology-wiki -name 'publication-transfer-*.b64' | grep -q .; then echo 'Temporary transfer file remains'; exit 1; fi
          git diff --exit-code
      - name: Verify original source preservation
        run: |
          git fetch origin 9e5fd3f205015c84b0973061f0aec54ef81dd794 --depth=1
          python - <<'PY'
          import subprocess,json
          from pathlib import Path
          base='9e5fd3f205015c84b0973061f0aec54ef81dd794'
          prefixes=['theology-sources/','theology-wiki/content/','theology-wiki/editorial/authorial-articles/','theology-wiki/research-notes/','theology-wiki/authority/manuscripts/','theology-wiki/products/media/','theology-wiki/planning/']
          checked=[]
          for item in subprocess.check_output(['git','ls-tree','-r',base],text=True).splitlines():
            info,p=item.split('\t',1)
            if not any(p.startswith(x) for x in prefixes):continue
            assert Path(p).is_file(),p
            assert info.split()[2]==subprocess.check_output(['git','hash-object',p],text=True).strip(),'Original changed: '+p
            checked.append(p)
          Path('publication-test-output/preservation.json').write_text(json.dumps({'baseline':base,'unchangedFiles':len(checked),'paths':checked},indent=2)+'\n')
          print('Verified',len(checked),'unchanged original files.')
          PY
      - name: Build the actual Cloudflare distribution
        run: node scripts/cloudflare-theology-build.mjs cf-validation
      - name: Install native browser dependencies
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Exercise the real reader on desktop and mobile
        run: |
          python -m http.server 4174 --bind 127.0.0.1 > /tmp/theology-server.log 2>&1 &
          python theology-wiki/tests/publication_browser.py
      - name: Compare the published files with this exact deployment revision
        if: github.event_name == 'workflow_run'
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,time,urllib.request,subprocess
          revision=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          paths=['theology-wiki/data/page-index.json','theology-wiki/public-corpus/snapshot.json','theology-wiki/public-corpus/page-index.json','theology-wiki/assets/js/publication-tools.js','theology-wiki/assets/js/research-tools.js','theology-wiki/assets/css/publication.css']
          for slug in ['computational-god-consciousness-and-theodicy','computational-god-capabilities-bridge','cosmic-thought-and-transcendence','publication-history']:
            paths += ['theology-wiki/content/developed/'+slug+'.md','theology-wiki/public-corpus/pages/'+slug+'.md']
          checked=[]
          for p in paths:
            expected=hashlib.sha256(Path(p).read_bytes()).hexdigest()
            for attempt in range(6):
              try:
                url='https://wiki.onlyonedevil.com/'+p+'?revision='+revision
                with urllib.request.urlopen(url,timeout=30) as response:data=response.read()
                actual=hashlib.sha256(data).hexdigest()
                assert actual==expected,'Hosted bytes differ: '+p
                checked.append({'path':p,'sha256':actual});break
              except Exception:
                if attempt==5:raise
                time.sleep(3)
          Path('publication-test-output/hosted-bytes.json').write_text(json.dumps({'deploymentRevision':revision,'origin':'https://wiki.onlyonedevil.com','matchedFiles':checked},indent=2)+'\n')
          print('Matched',len(checked),'actual hosted files to the deployed checkout.')
          PY
      - name: Verify the live interactive Wiki after publication
        if: github.event_name == 'workflow_run'
        env:
          THEOLOGY_READER_URL: https://wiki.onlyonedevil.com/theology-wiki/san-reader
          PUBLICATION_TEST_OUTPUT: publication-test-output/hosted
        run: python theology-wiki/tests/publication_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theology-publication-validation
          path: publication-test-output
          retention-days: 14
