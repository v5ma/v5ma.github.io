name: Theology provenance review
on:
  push:
    branches: [master, theology/public-corpus-and-god-bridge-2026-10-03]
    paths: ['theology-wiki/**', 'theology-sources/**', 'scripts/cloudflare-theology-build.mjs', '.github/workflows/theology-provenance-review.yml']
  pull_request:
    branches: [master]
    paths: ['theology-wiki/**', 'theology-sources/**', 'scripts/cloudflare-theology-build.mjs', '.github/workflows/theology-provenance-review.yml']
  workflow_run:
    workflows: ['Publish the Theology Wiki to Cloudflare (wiki.onlyonedevil.com)']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: theology-provenance-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the public corpus and reader data without writing repository files
        run: |
          set -o pipefail
          mkdir -p publication-test-output
          node theology-wiki/gospel-synthesis-20261011/publication.cjs --check | tee publication-test-output/gospel-synthesis-check.json
          node theology-wiki/tools/publication.cjs --check | tee publication-test-output/corpus-check.json
          node --test theology-wiki/tests/research.test.cjs > publication-test-output/node-tests.log 2>&1 || { cat publication-test-output/node-tests.log; exit 1; }
          tail -12 publication-test-output/node-tests.log
          if find theology-wiki -name 'publication-transfer-*.b64' | grep -q .; then echo 'Temporary transfer file remains'; exit 1; fi
          git diff --exit-code
      - name: Verify original source preservation
        run: |
          git fetch origin 9e5fd3f205015c84b0973061f0aec54ef81dd794 --depth=1
          node - <<'JS'
          const revision=require('./theology-wiki/research-expansion-20260918/teacher-revision.cjs');
          const prior=require('./theology-wiki/research-expansion-20260918/revision-receipt.json');
          revision.applyDerivativeRevision(Object.fromEntries(Object.entries(prior.files).map(([p,v])=>[p,v.after])));
          JS
          python - <<'PY'
          import subprocess,json,hashlib
          from pathlib import Path
          base='9e5fd3f205015c84b0973061f0aec54ef81dd794'
          prefixes=['theology-sources/','theology-wiki/content/','theology-wiki/editorial/authorial-articles/','theology-wiki/research-notes/','theology-wiki/authority/manuscripts/','theology-wiki/products/media/','theology-wiki/planning/']
          receipt=json.loads(Path('theology-wiki/research-expansion-20260918/teacher-revision-20261011.json').read_text())
          canonical='theology-wiki/editorial/authorial-articles/jesus-teacher-of-righteousness-hypothesis.md'
          developed='theology-wiki/content/developed/jesus-teacher-of-righteousness-hypothesis.md'
          assert canonical=='theology-wiki/'+receipt['canonical']['path']
          approved={canonical:receipt['canonical']['sha256'],developed:receipt['files'][developed.removeprefix('theology-wiki/')]['after']}
          # Recognize only the already-recorded October 23/24 appendices. Pin the
          # receipts themselves; a new edit cannot manufacture a wider exception.
          def digest(data): return hashlib.sha256(data).hexdigest()
          def pinned_receipt(path,blob):
            assert subprocess.check_output(['git','hash-object',path],text=True).strip()==blob,'Amendment receipt changed: '+path
            return json.loads(Path(path).read_text())
          displaced=pinned_receipt('theology-wiki/editorial/displaced-biography-20261024.json','6f6b62620d3927bd89f90a6e8dc66bcabd524801')
          joseph=pinned_receipt('theology-wiki/editorial/joseph-revision-20261023.json','74a072666ba39ee937daad3267bd4ef5c5d0455c')
          slugs={'jesus-teacher-of-righteousness-hypothesis','daniel-jubilee-and-the-teachers-time','sacred-inheritance-and-rival-continuations'}
          assert displaced['schema']==1 and displaced['reviewBase']=='7e40a2b0fb95bfe487539d8f72fa8d51100cfe51'
          assert {a['slug'] for a in displaced['articles']}==slugs and len(displaced['articles'])==3
          assert joseph['schema_version']==1 and joseph['slug']=='exodus-to-temple-competing-chronologies'
          assert joseph['review_base_commit']=='247c0f7679797ce98669026c37da74440c9b5e85'
          amendments={}
          for a in displaced['articles']:
            c=a['canonical'];slug=a['slug'];p='theology-wiki/'+c['path']
            assert p=='theology-wiki/editorial/authorial-articles/'+slug+'.md'
            amendments[p]={'before':c['before'],'after':c['after'],'prefixBytes':c['beforeBytes']}
            d='content/developed/'+slug+'.md'
            amendments['theology-wiki/'+d]=displaced['files'][d]
          c=joseph['canonical'];slug=joseph['slug'];p='theology-wiki/'+c['path']
          assert p=='theology-wiki/editorial/authorial-articles/'+slug+'.md'
          amendments[p]={'before':c['preserved_sha256'],'after':c['sha256'],'prefixBytes':c['preserved_bytes']}
          d='content/developed/'+slug+'.md'
          amendments['theology-wiki/'+d]=joseph['files'][d]
          assert len(amendments)==8
          # Prove each present body and every preserved canonical prefix before
          # comparing its predecessor with the older immutable source baseline.
          for p,a in amendments.items():
            current=Path(p).read_bytes()
            assert digest(current)==a['after'],'Unapproved appendix bytes: '+p
            if 'prefixBytes' in a:
              assert digest(current[:a['prefixBytes']])==a['before'],'Original canonical prefix changed: '+p
          assert amendments[canonical]['before']==approved[canonical]
          assert amendments[developed]['before']==approved[developed]
          gospel=json.loads(Path('theology-wiki/gospel-comparison-20261011/publication-receipt.json').read_text())
          gospel_navigation=gospel['navigation']
          synthesis=json.loads(Path('theology-wiki/gospel-synthesis-20261011/publication-receipt.json').read_text())
          assert synthesis['baseline']=='70bf669b241ae51fbca864742dfd086b79f662bf'
          synthesis_navigation=synthesis['navigation']
          assert set(synthesis_navigation)==set(gospel_navigation)
          for p,nav in synthesis_navigation.items():
            assert nav['before']==gospel_navigation[p]['after'],'Broken navigation successor chain: '+p
            assert synthesis['previousNavigation'][nav['slug']]['record']['sourceSha256']==nav['before']

          assert set(gospel_navigation)=={'theology-wiki/content/home.md','theology-wiki/content/developed/topic-jesus.md'}
          assert gospel['baseline']=='22dd281d9296e5ca5794a8cd83c3dde47147337f'
          checked=[];revised=[];navigation_revised=[];appendix_revised=[]
          for item in subprocess.check_output(['git','ls-tree','-r',base],text=True).splitlines():
            info,p=item.split('\t',1)
            if not any(p.startswith(x) for x in prefixes):continue
            assert Path(p).is_file(),p
            if p in approved:
              assert amendments[p]['before']==approved[p],'Unapproved Teacher revision chain: '+p
              appendix_revised.append(p)
              if p==canonical:
                archived='theology-wiki/'+receipt['historical_canonical']['path']
                assert info.split()[2]==receipt['historical_canonical']['git_blob']==subprocess.check_output(['git','hash-object',archived],text=True).strip(),'Historical canonical changed'
              else:
                prior=subprocess.check_output(['git','show',base+':'+p])
                assert hashlib.sha256(prior).hexdigest()==receipt['files'][p.removeprefix('theology-wiki/')]['before'],'Unexpected Teacher baseline'
              revised.append(p)
            elif p in amendments:
              a=amendments[p]
              original=subprocess.check_output(['git','show',base+':'+p])
              assert digest(original)==a['before'],'Unexpected appendix baseline: '+p
              if 'prefixBytes' in a:
                assert Path(p).read_bytes()[:a['prefixBytes']]==original,'Original canonical bytes changed: '+p
              appendix_revised.append(p)
            elif p in gospel_navigation:
              nav=gospel_navigation[p]
              assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==synthesis_navigation[p]['after'],'Unapproved Gospel synthesis navigation: '+p
              assert hashlib.sha256(subprocess.check_output(['git','show',base+':'+p])).hexdigest()==nav['before'],'Unexpected navigation baseline: '+p
              navigation_revised.append(p)
            else:
              assert info.split()[2]==subprocess.check_output(['git','hash-object',p],text=True).strip(),'Original changed: '+p
              checked.append(p)
          assert sorted(revised)==sorted(approved),'Both approved Teacher paths must exist in the original baseline'
          assert sorted(appendix_revised)==sorted(amendments),'Exactly four recorded article appendices must retain their predecessors'
          assert sorted(navigation_revised)==sorted(gospel_navigation),'Both Gospel navigators must retain their original baselines'
          Path('publication-test-output/preservation.json').write_text(json.dumps({'baseline':base,'unchangedFiles':len(checked),'paths':checked,'approvedTeacherRevision':{'pullRequest':receipt['pull_request'],'sha256':approved},'recordedArticleAppendices':amendments,'gospelNavigationAddition':gospel_navigation,'gospelSynthesisNavigationAddition':synthesis_navigation},indent=2)+'\n')
          print('Verified',len(checked),'unchanged original files, exactly two approved Teacher revision paths, four recorded article appendices and two source-pinned Gospel navigators.')
          PY
      - name: Build the actual Cloudflare distribution
        run: node scripts/cloudflare-theology-build.mjs cf-validation
      - name: Install native browser dependencies
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Exercise the real reader on desktop and mobile
        run: |
          python -m http.server 4174 --bind 127.0.0.1 > /tmp/theology-server.log 2>&1 &
          python theology-wiki/tests/publication_browser.py
      - name: Compare the published files with this exact deployment revision
        if: github.event_name == 'workflow_run'
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,time,urllib.request,subprocess
          revision=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          paths=['theology-wiki/data/page-index.json','theology-wiki/public-corpus/snapshot.json','theology-wiki/public-corpus/page-index.json','theology-wiki/assets/js/publication-tools.js','theology-wiki/assets/js/research-tools.js','theology-wiki/assets/css/publication.css']
          for slug in ['computational-god-consciousness-and-theodicy','computational-god-capabilities-bridge','cosmic-thought-and-transcendence','publication-history','gnostic-canonical-gospels-telling-the-truth']:
            paths += ['theology-wiki/content/developed/'+slug+'.md','theology-wiki/public-corpus/pages/'+slug+'.md']
          checked=[]
          for p in paths:
            expected=hashlib.sha256(Path(p).read_bytes()).hexdigest()
            for attempt in range(6):
              try:
                url='https://wiki.onlyonedevil.com/'+p+'?revision='+revision
                with urllib.request.urlopen(url,timeout=30) as response:data=response.read()
                actual=hashlib.sha256(data).hexdigest()
                assert actual==expected,'Hosted bytes differ: '+p
                checked.append({'path':p,'sha256':actual});break
              except Exception:
                if attempt==5:raise
                time.sleep(3)
          Path('publication-test-output/hosted-bytes.json').write_text(json.dumps({'deploymentRevision':revision,'origin':'https://wiki.onlyonedevil.com','matchedFiles':checked},indent=2)+'\n')
          print('Matched',len(checked),'actual hosted files to the deployed checkout.')
          PY
      - name: Verify the live interactive Wiki after publication
        if: github.event_name == 'workflow_run'
        env:
          THEOLOGY_READER_URL: https://wiki.onlyonedevil.com/theology-wiki/san-reader
          PUBLICATION_TEST_OUTPUT: publication-test-output/hosted
        run: python theology-wiki/tests/publication_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theology-publication-validation
          path: publication-test-output
          retention-days: 14
