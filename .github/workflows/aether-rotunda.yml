name: Aether Field Rotunda playtest
on:
  push:
    branches: [master]
    paths: ['aether-reach/**', '.github/workflows/aether-rotunda.yml', '.github/workflows/aether-release-backup.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aether-rotunda-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: [rotunda, window, portal, render, grounded, controller]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            aether-reach
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Model, input, save and exact source contract
        run: |
          set -euo pipefail
          mkdir -p aether-reach/test-output
          node --test aether-reach/tests/*.test.mjs > aether-reach/test-output/rotunda-node.log
          python aether-reach/tests/backup_test.py
          python aether-reach/tests/release_evidence_test.py
          for f in aether-reach/*.mjs; do node --check "$f"; done
          node aether-reach/tests/release-manifest.mjs
          python aether-reach/tools/render-production-plan.py
          git diff --exit-code -- aether-reach/planning/AAA-ROADMAP.md
      - name: Source backup and clean restore
        if: matrix.suite == 'rotunda'
        run: |
          python aether-reach/tools/backup.py --out /tmp/aether-rotunda-source
          python aether-reach/tools/backup.py --restore /tmp/aether-rotunda-source/*source.zip --destination /tmp/aether-rotunda-clean
          (cd /tmp/aether-rotunda-clean && node --test aether-reach/tests/*.test.mjs) > aether-reach/test-output/rotunda-restore.log
      - name: Install native browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Actual HTTP WebGL and input journey
        timeout-minutes: 28
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/aether-rotunda-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          case "$SUITE" in
            rotunda) python -u aether-reach/tests/rotunda-browser.py ;;
            window) python -u aether-reach/tests/window-browser.py ;;
            portal) python -u aether-reach/tests/portal-browser.py ;;
            render) python -u aether-reach/tests/portal-render-browser.py ;;
            grounded) python -u aether-reach/tests/grounded-browser.py ;;
            controller) python -u aether-reach/tests/controller-journey.py ;;
          esac
      - name: Evidence and source identity
        if: always()
        run: |
          git rev-parse HEAD > aether-reach/test-output/tested-commit.txt
          git diff --stat > aether-reach/test-output/uncommitted-diff.txt
          if [ '${{ matrix.suite }}' = rotunda ]; then git archive --format=zip HEAD aether-reach index.html projects.css .github/workflows > aether-reach/test-output/rotunda-source.zip; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-rotunda-${{ matrix.suite }}
          path: aether-reach/test-output/
          retention-days: 30
