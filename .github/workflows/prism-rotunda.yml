name: Verify Prism Rotunda
on:
  push:
    branches: [master]
    paths: ['prism-current/**', '.github/workflows/prism-rotunda.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prism-rotunda-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Checked-out Prism source
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: prism-current
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact-source model and integration tests
        run: |
          set -euo pipefail
          mkdir -p test-output
          python prism-current/tests/verify.py
          node --test prism-current/tests/*.test.cjs | tee test-output/core.tap
      - name: Install native Chromium
        id: browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Source difficulty, healing and late bosses
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        env:
          PRISM_URL: http://127.0.0.1:4173/prism-current/
        run: |
          set -euo pipefail
          python prism-current/tests/playability-objects.py
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/playability-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          timeout 300 python -u prism-current/tests/playability-browser.py
      - name: Canvas reuse and coherent shoreline
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        env:
          PRISM_URL: http://127.0.0.1:4173/prism-current/
        run: |
          set -euo pipefail
          python prism-current/tests/coherence-objects.py
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/coherence-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          timeout 180 python -u prism-current/tests/render-policy-browser.py
      - name: Trees ownership and actual source scenery
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        env:
          PRISM_URL: http://127.0.0.1:4173/prism-current/
        run: |
          set -euo pipefail
          python prism-current/tests/environment-trees-objects.py
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/trees-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          timeout 240 python -u prism-current/tests/environment-trees-browser.py
      - name: Fire ownership and actual source effects
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        env:
          PRISM_URL: http://127.0.0.1:4173/prism-current/
        run: |
          set -euo pipefail
          python prism-current/tests/environment-fire-objects.py
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/fire-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          timeout 240 python -u prism-current/tests/environment-fire-browser.py
      - name: Water ownership and actual source gameplay
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        env:
          PRISM_URL: http://127.0.0.1:4173/prism-current/
        run: |
          set -euo pipefail
          python prism-current/tests/environment-water-objects.py
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/water-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          timeout 240 python -u prism-current/tests/environment-water-browser.py
      - name: Source interruption recovery
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        env:
          PRISM_URL: http://127.0.0.1:4173/prism-current/
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/transport-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          timeout 180 python -u prism-current/tests/transport-browser.py
      - name: Source menus and complete battles
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        env:
          PRISM_URL: http://127.0.0.1:4173/prism-current/
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/rotunda-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          timeout 720 python -u prism-current/tests/rotunda-browser.py
      - name: Archive exact source and actual outcomes
        if: always()
        run: |
          mkdir -p test-output
          git rev-parse HEAD > test-output/tested-commit.txt
          tar czf test-output/source.tgz prism-current
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-rotunda-source-${{ github.sha }}
          path: test-output/
          retention-days: 14
  public:
    name: Published Prism bytes and gameplay
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 43
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: prism-current
          persist-credentials: false
      - name: Build expected manifest from this exact commit
        run: python prism-current/tests/verify.py
      - name: Verify exact public Prism files
        run: |
          python - <<'PYCODE'
          import json,urllib.request,hashlib,time
          from pathlib import Path
          m=json.loads(Path('test-output/prism-manifest.json').read_text())
          files={p:h for p,h in m['files'].items() if p.startswith('prism-current/')};out={}
          for attempt in range(50):
            for p,h in files.items():
              if out.get(p)==h:continue
              try:
                with urllib.request.urlopen('https://v5ma.github.io/'+p+'?rotunda='+m['source'][:12],timeout=12) as r:out[p]=hashlib.sha256(r.read()).hexdigest()
              except Exception as e:out[p]=str(e)
            if out==files:break
            time.sleep(6)
          receipt={'source':m['source'],'version':m['version'],'expected':files,'actual':out,'all_match':out==files}
          Path('test-output/rotunda-publication.json').write_text(json.dumps(receipt,indent=2))
          assert out==files,receipt
          PYCODE
      - name: Install native Chromium after matching the publication
        id: browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Public difficulty, healing and late bosses
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        env:
          PRISM_URL: https://v5ma.github.io/prism-current/
        run: timeout 300 python -u prism-current/tests/playability-browser.py
      - name: Public canvas reuse and coherence
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        env:
          PRISM_URL: https://v5ma.github.io/prism-current/
        run: timeout 180 python -u prism-current/tests/render-policy-browser.py
      - name: Public trees and reusable geometry fixtures
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        env:
          PRISM_URL: https://v5ma.github.io/prism-current/
        run: timeout 240 python -u prism-current/tests/environment-trees-browser.py
      - name: Public fire effects and reusable shader fixtures
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        env:
          PRISM_URL: https://v5ma.github.io/prism-current/
        run: timeout 240 python -u prism-current/tests/environment-fire-browser.py
      - name: Public water graphics and battle
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        env:
          PRISM_URL: https://v5ma.github.io/prism-current/
        run: timeout 240 python -u prism-current/tests/environment-water-browser.py
      - name: Public interruption recovery
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        env:
          PRISM_URL: https://v5ma.github.io/prism-current/
        run: timeout 180 python -u prism-current/tests/transport-browser.py
      - name: Public menus and complete battles
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        env:
          PRISM_URL: https://v5ma.github.io/prism-current/
        run: timeout 720 python -u prism-current/tests/rotunda-browser.py
      - name: Archive checked manifest and actual public outcomes
        if: always()
        run: |
          mkdir -p test-output
          git rev-parse HEAD > test-output/tested-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-rotunda-public-${{ github.sha }}
          path: test-output/
          retention-days: 14
