name: Integrate Aether Afterlight
# Review iteration 2: reload countdown completion uses the model's <= 0 condition.
on:
  push:
    branches: [feat/aether-afterlight-20260912]
    paths: ['.github/workflows/aether-afterlight-integrate.yml']
permissions:
  contents: write
concurrency:
  group: aether-afterlight-integrate
  cancel-in-progress: true
jobs:
  integrate:
    if: github.repository == 'v5ma/v5ma.github.io' && github.ref == 'refs/heads/feat/aether-afterlight-20260912'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aether-afterlight-20260912
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original and resulting source hashes
        run: python aether-reach/tools/apply-afterlight.py apply
      - name: Validate all game regressions and release contract
        run: |
          set -euo pipefail
          for f in aether-reach/*.mjs; do node --check "$f"; done
          node --test aether-reach/tests/*.test.mjs | tee aether-reach/test-output/afterlight-node.log
          python aether-reach/tests/backup_test.py
          node aether-reach/tests/release-manifest.mjs
      - name: Install test browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Play the connected district episode without simulation-state writes
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/afterlight-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python -u aether-reach/tests/afterlight-browser.py | tee aether-reach/test-output/afterlight-browser.log
      - name: Commit verified implementation and remove temporary transport
        run: |
          set -euo pipefail
          python aether-reach/tools/apply-afterlight.py stage
          python aether-reach/tools/apply-afterlight.py archive
          rm aether-reach/tools/afterlight-package-*.json aether-reach/tools/apply-afterlight.py .github/workflows/aether-afterlight-integrate.yml
          git add -u -- aether-reach/tools .github/workflows/aether-afterlight-integrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement Aether Reach 0.9.0 Bellwether Afterlight district episode'
          git push origin HEAD:feat/aether-afterlight-20260912
      - name: Preserve tested source and actual results
        if: always()
        run: |
          mkdir -p aether-reach/test-output
          if [ -f aether-reach/tools/apply-afterlight.py ]; then python aether-reach/tools/apply-afterlight.py archive; fi
          git rev-parse HEAD > aether-reach/test-output/tested-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-afterlight-integration
          path: aether-reach/test-output
          retention-days: 30
