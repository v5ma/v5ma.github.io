name: Validate Theology comparative religion
on:
  pull_request:
    paths:
      - 'theology-wiki/comparative-religion/**'
      - 'theology-wiki/editorial/authorial-articles/apocalyptic-repair-theology.md'
      - '.github/workflows/theology-comparative-validation.yml'
  push:
    branches: [master]
    paths:
      - 'theology-wiki/comparative-religion/**'
      - 'theology-wiki/editorial/authorial-articles/apocalyptic-repair-theology.md'
      - '.github/workflows/theology-comparative-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      INTEGRATED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deterministic rebuild and precise preservation checks
        run: |
          set -o pipefail
          mkdir -p theology-test-output/comparative
          node theology-wiki/comparative-religion/build.cjs
          node theology-wiki/comparative-religion/integrate.cjs
          node theology-wiki/tools/build.cjs
          node theology-wiki/comparative-religion/reconcile.cjs
          git diff --exit-code -- theology-wiki/
          python theology-wiki/comparative-religion/check_pages.py | tee theology-test-output/comparative/structure.json
          node --test theology-wiki/comparative-religion/comparative.test.cjs | tee theology-test-output/comparative/contracts.log
      - name: Install real browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise thirteen pages and the integrated main article over HTTP
        run: python theology-wiki/comparative-religion/browser_checks.py --report theology-test-output/comparative/browser.json --screenshot theology-test-output/comparative/mobile.png
      - name: Verify actual public file bytes after deployment
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: python theology-wiki/comparative-religion/hosted_checks.py --report theology-test-output/comparative/hosted-content.json
      - name: Exercise the published comparative series and main article
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: python theology-wiki/comparative-religion/browser_checks.py --url https://v5ma.github.io/theology-wiki/comparative-religion/index.html --report theology-test-output/comparative/hosted-browser.json --screenshot theology-test-output/comparative/hosted-mobile.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theology-comparative-validation
          path: |
            theology-test-output/comparative/
            theology-wiki/comparative-religion/
          if-no-files-found: error
