name: Vesperfall release metadata verification
on:
  push:
    branches: [vesperfall-surestep-20260914]
    paths: ['.github/vesperfall-release-*', '.github/workflows/vesperfall-release-metadata.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact release and workbook bytes before committing
        run: |
          set -euo pipefail
          mkdir -p test-output
          python .github/vesperfall-release-apply.py
          node --test vesperfall/tests/*.test.cjs | tee test-output/release-model.tap
          python vesperfall/tests/production-workbook.py
          python scripts/check-vesperfall.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vesperfall .github/vesperfall-release-[0-9][0-9].txt
          if ! git diff --cached --quiet; then
            git commit -m 'Synchronize Surestep 0.13.0 release, continuation record and artifact-authored production workbook'
            git push origin HEAD:vesperfall-surestep-20260914
          fi
      - name: Preserve source and validation receipt
        if: always()
        run: |
          mkdir -p test-output
          git rev-parse HEAD > test-output/source-revision.txt
          tar -czf test-output/vesperfall-source.tgz vesperfall scripts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vesperfall-surestep-metadata
          path: test-output/
          retention-days: 14
