name: Rainward v0.8 interaction hotfix
on:
  push:
    branches: [feat/rainward-reclaimed-city-20260911]
    paths: ['.github/workflows/rainward-v08-hotfix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Separate glasshouse task from critical objective
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('rainward/expeditions.mjs')
          s=p.read_text()
          old="task('garden-seeds',39,-19,'A garden for tomorrow'"
          new="task('garden-seeds',31,-3,'A garden for tomorrow'"
          if old not in s:
              raise SystemExit('expected garden task position not found')
          p.write_text(s.replace(old,new,1))
          PY
          for file in rainward/*.mjs; do node --check "$file"; done
          node --test rainward/tests/*.test.mjs
          python rainward/tests/release.py
      - name: Commit gameplay fix
        run: |
          git config user.name 'Micah Blumberg'
          git config user.email '60057241+v5ma@users.noreply.github.com'
          git add rainward/expeditions.mjs
          git rm .github/workflows/rainward-v08-hotfix.yml
          git commit -m 'Separate glasshouse field task from mission objective'
          git push origin HEAD:feat/rainward-reclaimed-city-20260911
