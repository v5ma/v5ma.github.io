name: Prepare curated CC0 Guild art on the development branch
on:
  push:
    branches: [feat/guild-market-life-20260907]
    paths: ['leonardos-guild/scripts/import-curated-art.py','.github/workflows/guild-art-prepare.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    if: github.ref == 'refs/heads/feat/guild-market-life-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/guild-market-life-20260907
      - run: python -m pip install Pillow==11.3.0
      - name: Download only hashed Standard archives and prepare selected redistributable files
        run: python leonardos-guild/scripts/import-curated-art.py
      - name: Commit only declared art and pinned loader files, never gameplay source
        run: |
          git config user.name 'SVGN asset build'
          git config user.email 'actions@users.noreply.github.com'
          git add leonardos-guild/assets/quaternius leonardos-guild/ASSET-REGISTER.json leonardos-guild/vendor/GLTFLoader.js leonardos-guild/vendor/BufferGeometryUtils.js leonardos-guild/vendor/THREE-LICENSE.txt leonardos-guild/vendor/gltf-provenance.json
          if ! git diff --cached --quiet; then
            git commit -m 'Vendor 32 curated CC0 Standard models, shared reduced textures, provenance and matching glTF loader'
            git push origin HEAD:feat/guild-market-life-20260907
          fi
      - name: Capture reusable source and optimization receipt
        if: always()
        run: |
          mkdir -p prepared-art
          git rev-parse HEAD > prepared-art/source-sha.txt
          tar -czf prepared-art/source.tgz leonardos-guild .github/workflows
          cp leonardos-guild/ASSET-REGISTER.json prepared-art/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guild-curated-art-source
          path: prepared-art/
          retention-days: 7
