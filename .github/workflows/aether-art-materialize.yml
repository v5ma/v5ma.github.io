name: Materialize reviewed CC0 game art
on:
  push:
    branches: [feat/aether-quay-art-pass]
    paths: [.github/workflows/aether-art-materialize.yml]
permissions:
  contents: write
  actions: read
jobs:
  pack:
    if: github.ref == 'refs/heads/feat/aether-quay-art-pass'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve only the already-reviewed free art and toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34170757084 --name aether-art-prepared --dir /tmp/art-prepared
          mkdir -p /tmp/art-tools
          npm install --prefix /tmp/art-tools --no-audit --no-fund @gltf-transform/core@4.2.1 @gltf-transform/functions@4.2.1 @gltf-transform/extensions@4.2.1 meshoptimizer@0.22.0 sharp@0.33.5
          cp aether-reach/tools/pack-quay-art.mjs /tmp/art-tools/pack.mjs
          node /tmp/art-tools/pack.mjs /tmp/art-prepared aether-reach/art
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,shutil
          source=Path('/tmp/art-prepared');meta=json.loads((source/'downtown-source.json').read_text())
          assert meta['edition']=='Standard' and meta['license']=='CC0-1.0'
          assert meta['archiveSha256']=='5b1a945576d54cdbb4ccc9c3d52711e6d530da74c74c586407ecc28b165335da'
          for name in ['loaders/GLTFLoader.js','loaders/RGBELoader.js','utils/BufferGeometryUtils.js']:
            p=Path('aether-reach/vendor')/name;p.parent.mkdir(parents=True,exist_ok=True);shutil.copy(source/'vendor'/name,p)
          manifest=json.loads(Path('aether-reach/art/manifest.json').read_text());assert manifest['totalBytes']<14000000
          for f in manifest['files']:
            p=Path('aether-reach/art')/f['file'];assert p.stat().st_size==f['bytes'];assert hashlib.sha256(p.read_bytes()).hexdigest()==f['sha256']
          print('Stored only runtime variants, pinned loaders and license/source register.')
          PY
      - name: Commit only the generated artwork and pinned loaders
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aether-reach/art aether-reach/vendor/loaders aether-reach/vendor/utils
          git diff --cached --stat
          git commit -m 'Vendor CC0 modular facades, modeled lamps and foliage, PBR paving and sky with lighter variants'
          git push origin HEAD:feat/aether-quay-art-pass
      - name: Archive materialized art for visual review
        if: always()
        run: |
          mkdir -p /tmp/art-output
          tar -czf /tmp/art-output/art.tgz aether-reach/art aether-reach/vendor/loaders aether-reach/vendor/utils
          cp aether-reach/art/manifest.json /tmp/art-output/manifest.json
          git rev-parse HEAD > /tmp/art-output/source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-materialized-art
          path: /tmp/art-output/
          retention-days: 7
