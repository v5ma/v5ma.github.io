name: Guild Grounded Actions
on:
  push:
    branches: [guild/grounded-actions-20260914]
    paths: ['leonardos-guild/**', '.github/workflows/guild-grounded-actions.yml']
  pull_request:
    paths: ['leonardos-guild/**', '.github/workflows/guild-grounded-actions.yml']
permissions:
  contents: read
concurrency:
  group: guild-grounded-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate once, validate, and commit ordinary source before testing
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'guild/grounded-actions-20260914'
          if test ! -f leonardos-guild/GROUNDED-INTEGRATED.json; then
            python leonardos-guild/scripts/prepare-grounded.py
            npm --prefix leonardos-guild test
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- leonardos-guild
            git commit -m 'Integrate Grounded Actions v0.13: quick tools, stance IK and seated XR'
            git push origin HEAD:refs/heads/guild/grounded-actions-20260914
          fi
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  native:
    needs: prepare
    if: always() && !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        journey: [grounded, xr, steady]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate ordinary source and all model regressions
        run: |
          set -euo pipefail
          for f in leonardos-guild/*.mjs; do node --check "$f"; done
          npm --prefix leonardos-guild test | tee /tmp/grounded-tests.txt
      - name: Install pinned native Chromium tools
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Run real HTTP WebGL journey with only declared hardware inputs
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/grounded-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python -u leonardos-guild/tests/${{ matrix.journey }}-browser.py
      - name: Archive exact tested source, reports and actual renderer captures
        if: always()
        env:
          JOURNEY: ${{ matrix.journey }}
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess,tarfile,shutil
          from pathlib import Path
          out=Path('leonardos-guild')/(os.environ['JOURNEY']+'-output');out.mkdir(exist_ok=True)
          names=subprocess.check_output(['git','ls-files','leonardos-guild','.github/workflows'],text=True).splitlines()
          hashes={n:hashlib.sha256(Path(n).read_bytes()).hexdigest() for n in names if Path(n).is_file()}
          (out/'source-hashes.json').write_text(json.dumps(hashes,indent=2))
          (out/'tested-commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          diff=subprocess.check_output(['git','diff','--stat'],text=True);(out/'uncommitted-diff.txt').write_text(diff)
          if Path('/tmp/grounded-tests.txt').exists():shutil.copy('/tmp/grounded-tests.txt',out/'model-tests.txt')
          with tarfile.open(out/'source.tgz','w:gz') as tar:
            for n in hashes:tar.add(n,arcname=n)
          assert not diff,'Native tests must not rewrite committed runtime source'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guild-grounded-${{ matrix.journey }}
          path: leonardos-guild/${{ matrix.journey }}-output/
          retention-days: 14
