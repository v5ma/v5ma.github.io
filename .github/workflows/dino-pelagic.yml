name: Dino Atlas Pelagic Recovery
on:
  push:
    branches: [dino-pelagic-recovery-20260912, master]
    paths: ['dino-atlas/**', '.github/workflows/dino-pelagic.yml', '.github/patches/pelagic.*.b64']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dino-pelagic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrate:
    if: github.ref == 'refs/heads/dino-pelagic-recovery-20260912'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source: ${{ steps.apply.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dino-pelagic-recovery-20260912
          sparse-checkout: |
            dino-atlas
            .github
      - id: apply
        name: Apply the checksummed reviewed source exactly once
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,lzma,hashlib,subprocess,os
          parts=sorted(Path('.github/patches').glob('pelagic.*.b64'))
          if parts:
              assert len(parts)==4
              actual=subprocess.check_output(['git','rev-parse','HEAD:dino-atlas'],text=True).strip()
              assert actual=='3c99a2e3c8a6d99c21f8495c140821a702cd8d62','Review changed Dino baseline before applying'
              patch=lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True))
              assert hashlib.sha256(patch).hexdigest()=='06a26bafb5807e8cb4e942f74ef7f34dafe4c2080389df6e9304f13aab2c202e','Patch transport mismatch'
              target=Path('/tmp/pelagic.patch');target.write_bytes(patch)
              names=subprocess.check_output(['git','apply','--numstat',str(target)],text=True)
              assert all(line.split('\t')[-1].startswith('dino-atlas/') for line in names.splitlines())
              subprocess.run(['git','apply','--check',str(target)],check=True)
              subprocess.run(['git','apply','--index',str(target)],check=True)
              subprocess.run(['git','rm',*[str(p) for p in parts]],check=True)
              subprocess.run(['git','config','user.name','Dino Atlas Build'],check=True)
              subprocess.run(['git','config','user.email','60057241+v5ma@users.noreply.github.com'],check=True)
              subprocess.run(['git','commit','-m','Implement Pelagic Recovery: physical tiled pool, pump puzzle and boat sample mission'],check=True)
              subprocess.run(['git','push','origin','HEAD:dino-pelagic-recovery-20260912'],check=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('source='+sha+'\n')
          PY
  verify:
    needs: [integrate]
    if: always() && (needs.integrate.result == 'success' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.source || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            dino-atlas
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax, state, saves and actual physical routes
        run: |
          mkdir -p aquatics-evidence
          find dino-atlas -maxdepth 1 -name '*.js' -exec node --check {} \;
          set -o pipefail
          node --test dino-atlas/tests/*.test.mjs | tee aquatics-evidence/model-tests.tap
      - name: Install native browser runner
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Render the pool and complete the controller mission
        if: github.ref != 'refs/heads/master'
        run: |
          python dino-atlas/tests/aquatics-browser.py
          cp aquatics-evidence/report.json aquatics-evidence/candidate-report.json
      - name: Preserve the Living Herds controller field study
        run: python dino-atlas/tests/living-herds-browser.py
      - name: Preserve the full Storm Response controller journey
        run: python dino-atlas/tests/aaa-browser.py
      - name: Record exact runtime and roadmap hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          root=Path('dino-atlas')
          files=[p for p in root.iterdir() if p.suffix in ('.js','.html','.css')]+[root/'AAA-ROADMAP.md',root/'PELAGIC-RECOVERY.md']
          manifest={'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files}}
          Path('aquatics-evidence/runtime-hashes.json').write_text(json.dumps(manifest,indent=2))
          PY
      - name: Compare the real public runtime to this reviewed commit
        if: github.ref == 'refs/heads/master'
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen,Request
          from concurrent.futures import ThreadPoolExecutor
          import hashlib,json,time
          m=json.loads(Path('aquatics-evidence/runtime-hashes.json').read_text())
          def check(item):
              p,sha=item
              try:
                  url='https://v5ma.github.io/'+p+'?verify='+m['commit']
                  data=urlopen(Request(url,headers={'Cache-Control':'no-cache'}),timeout=25).read()
                  return p if hashlib.sha256(data).hexdigest()!=sha else None
              except Exception:return p
          for _ in range(30):
              with ThreadPoolExecutor(max_workers=8) as pool:bad=[p for p in pool.map(check,m['files'].items()) if p]
              if not bad:break
              print('Waiting for reviewed public files:',bad,flush=True);time.sleep(10)
          assert not bad,bad
          Path('aquatics-evidence/public-bytes.json').write_text(json.dumps({'commit':m['commit'],'matched':len(m['files'])},indent=2))
          PY
      - name: Complete Pelagic Recovery on the actual published website
        if: github.ref == 'refs/heads/master'
        env:
          DINO_TEST_BASE: https://v5ma.github.io/dino-atlas/
        run: |
          python dino-atlas/tests/aquatics-browser.py
          cp aquatics-evidence/report.json aquatics-evidence/published-report.json
      - name: Record tested source
        if: always()
        run: |
          mkdir -p aquatics-evidence
          git rev-parse HEAD > aquatics-evidence/tested-commit.txt
          git status --short > aquatics-evidence/worktree-status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dino-pelagic-source-and-evidence
          path: |
            dino-atlas/
            aquatics-evidence/
            herds-evidence/
            aaa-evidence/
          retention-days: 14
