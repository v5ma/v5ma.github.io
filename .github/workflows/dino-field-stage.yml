name: Dino field source and first journeys
on:
  push:
    branches: ['dino-atlas/field-operations-20260917']
    paths: ['.github/workflows/dino-field-stage.yml']
permissions:
  contents: read
concurrency:
  group: dino-field-stage
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source: ${{ steps.apply.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dino-atlas/field-operations-20260917
          sparse-checkout: |
            dino-atlas
            .github
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: apply
        name: Apply only exact checked Dino files
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,lzma,json,hashlib,subprocess,os
          parts=sorted(Path('.github/patches').glob('dino-field-ops.*.b64'))
          assert len(parts)==3,'Expected exactly three source transport parts'
          data=lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True))
          assert hashlib.sha256(data).hexdigest()=='1d297e0665a70461580d04b5f1bfd7c54342d77c5d00eab2f391266e3778280c','Payload checksum mismatch'
          entries=json.loads(data);assert len(entries)==24
          for e in entries:
              p=Path(e['path']);assert not p.is_absolute() and '..' not in p.parts and str(p).startswith('dino-atlas/')
              if e['before'] is None:
                  assert not p.exists(),str(p)+' already exists'
                  text=e['content']
              else:
                  old=p.read_bytes();assert hashlib.sha256(old).hexdigest()==e['before'],str(p)+' baseline changed'
                  text=old.decode()
                  for start,end,replacement in reversed(e['edits']):
                      assert 0<=start<=end<=len(text)
                      text=text[:start]+replacement+text[end:]
              assert hashlib.sha256(text.encode()).hexdigest()==e['after'],str(p)+' result mismatch'
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(text.encode())
          with open('/tmp/field-unit-tests.tap','w') as f:
              subprocess.run(['bash','-c','node --test dino-atlas/tests/*.test.mjs'],stdout=f,stderr=subprocess.STDOUT,check=True)
          subprocess.run(['bash','-c',"find dino-atlas -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check"],check=True)
          subprocess.run(['git','add',*[e['path'] for e in entries]],check=True)
          subprocess.run(['git','rm',*[str(p) for p in parts]],check=True)
          subprocess.run(['git','config','user.name','Dino Atlas Build'],check=True)
          subprocess.run(['git','config','user.email','60057241+v5ma@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','Dino Atlas: twelve field assignments and mounted vehicle utilities'],check=True)
          subprocess.run(['git','push','origin','HEAD:dino-atlas/field-operations-20260917'],check=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('source='+sha+'\n')
          print('Checked source committed:',sha)
          PY
      - name: Archive source and unit transcript
        if: always()
        run: |
          mkdir -p stage-evidence
          tar -czf stage-evidence/field-source.tgz dino-atlas .github/workflows/dino-tidegate.yml
          if test -f /tmp/field-unit-tests.tap; then cp /tmp/field-unit-tests.tap stage-evidence/; fi
          git rev-parse HEAD > stage-evidence/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-source-${{ github.run_id }}
          path: stage-evidence/
          retention-days: 30
  native:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        case: [classic, tidegate, air]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.source }}
          persist-credentials: false
          sparse-checkout: dino-atlas
      - name: Install native browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Exercise production missions through real movement and synthetic controller inputs
        env:
          FIELD_CASE: ${{ matrix.case }}
        run: python dino-atlas/tests/field-operations-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-first-${{ matrix.case }}-${{ github.run_id }}
          path: field-ops-evidence/
          retention-days: 30
