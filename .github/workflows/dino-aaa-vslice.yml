name: Dino Atlas AAA Vertical Slice 01
on:
  push:
    branches: [dino-aaa-roadmap-vslice-20260911]
    paths: ['dino-atlas/**', 'scripts/dino-aaa-vslice.py', '.github/workflows/dino-aaa-vslice.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dino-aaa-vslice-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dino-aaa-roadmap-vslice-20260911
          sparse-checkout: |
            dino-atlas
            scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate Vertical Slice 01 into the branch
        run: |
          python scripts/dino-aaa-vslice.py
          git add dino-atlas
          if ! git diff --cached --quiet; then
            git config user.name 'Dino Atlas Build'
            git config user.email '60057241+v5ma@users.noreply.github.com'
            git commit -m 'Integrate AAA Vertical Slice 01 Storm Response'
            git push origin HEAD:dino-aaa-roadmap-vslice-20260911
          fi
      - name: Syntax and model regression suite
        run: |
          find dino-atlas -maxdepth 1 -name '*.js' -exec node --check {} \;
          node --test dino-atlas/tests/*.test.mjs
      - name: Install native browser runner
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Exercise Storm Response through WebGL and Xbox input
        run: python dino-atlas/tests/aaa-browser.py
      - name: Record tested source
        if: always()
        run: |
          mkdir -p aaa-evidence
          git rev-parse HEAD > aaa-evidence/tested-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dino-aaa-vslice-source-and-evidence
          path: |
            dino-atlas
            aaa-evidence
          retention-days: 7
