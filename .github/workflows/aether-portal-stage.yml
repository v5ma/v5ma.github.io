name: Stage reviewed Aether World Portal
on:
  push:
    branches: [aether/world-portal-20260917]
    paths: ['aether-reach/tools/portal-transfer-3.b64', '.github/workflows/aether-portal-stage.yml']
permissions:
  contents: read
jobs:
  stage:
    if: github.repository == 'v5ma/v5ma.github.io' && github.ref == 'refs/heads/aether/world-portal-20260917'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            aether-reach
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply hash-guarded source review
        run: |
          mkdir -p /tmp/aether-portal-stage
          python - <<'PY'
          import base64,zlib,json,hashlib
          from pathlib import Path
          encoded=''.join(Path(f'aether-reach/tools/portal-transfer-{i}.b64').read_text().strip() for i in range(4))
          Path('/tmp/aether-portal-stage/received.b64').write_text(encoded)
          # Remove a known duplicated transfer character; original SHA-256 remains mandatory.
          encoded=encoded.replace('ZZzh1+eWkXB','ZZzh1+WkXB')
          raw=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='dfb2375985dabb25939e5c6fc70e39a08efb28965a25b440497325735fabf32d'
          data=json.loads(raw)
          assert data['base']=='dd4a9d2a35ea667fd33f3ed2b597aeda15cb27e5'
          for name,item in data['changes'].items():
            p=Path(name)
            assert name.startswith('aether-reach/') and not p.is_absolute() and '..' not in p.parts and not p.is_symlink()
            assert (hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None)==item['before'],name
            text=p.read_text() if p.exists() else ''
            for start,end,replacement in reversed(item['edits']):
              assert 0<=start<=end<=len(text),name
              text=text[:start]+replacement+text[end:]
            assert hashlib.sha256(text.encode()).hexdigest()==item['after'],name
            p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
          Path('/tmp/aether-portal-stage/changes.json').write_text(json.dumps(data))
          PY
          git diff --check
      - name: Validate exact candidate
        run: |
          set -euo pipefail
          for f in aether-reach/*.mjs; do node --check "$f"; done
          python -m compileall -q aether-reach/tests
          node --test aether-reach/tests/*.test.mjs | tee /tmp/aether-portal-stage/node-tests.log
          python aether-reach/tests/backup_test.py
          python aether-reach/tools/render-production-plan.py
          node aether-reach/tests/release-manifest.mjs
      - name: Create content-only commit object without changing branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          data=json.loads(Path('/tmp/aether-portal-stage/changes.json').read_text())
          def post(endpoint,payload):
            p=Path('/tmp/aether-portal-stage/request.json');p.write_text(json.dumps(payload))
            return json.loads(subprocess.check_output(['gh','api','--method','POST','repos/'+os.environ['GH_REPO']+'/'+endpoint,'--input',str(p)],text=True))
          tree=[{'path':n,'mode':'100644','type':'blob','content':Path(n).read_text()} for n in data['changes']]
          tree += [{'path':f'aether-reach/tools/portal-transfer-{i}.b64','mode':'100644','type':'blob','sha':None} for i in range(4)]
          assert all(t['path'].startswith('aether-reach/') for t in tree)
          t=post('git/trees',{'base_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'tree':tree})
          c=post('git/commits',{'message':'feat(aether): player-centered full-depth portal, stable XR panels, goal guidance and first-person AR','tree':t['sha'],'parents':[os.environ['GITHUB_SHA']]})
          Path('/tmp/aether-portal-stage/candidate.json').write_text(json.dumps({'parent':os.environ['GITHUB_SHA'],'commit':c['sha'],'tree':t['sha'],'files':list(data['changes']),'scope':'268 model/input tests and six backup-input tests passed. Native GPU, physical devices and publication still require verification.'},indent=2))
          print('Created reviewed commit object without changing refs:',c['sha'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-portal-candidate
          path: |
            /tmp/aether-portal-stage/candidate.json
            /tmp/aether-portal-stage/node-tests.log
            /tmp/aether-portal-stage/received.b64
          retention-days: 14
