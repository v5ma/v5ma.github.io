name: Vesperfall Surestep acceptance
on:
  push:
    branches: [vesperfall-surestep-20260914]
    paths: ['vesperfall/**', '.github/vesperfall-surestep*', '.github/workflows/vesperfall-surestep.yml']
permissions:
  contents: write
concurrency:
  group: vesperfall-surestep-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: source
        run: |
          set -euo pipefail
          python .github/vesperfall-surestep-apply.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vesperfall
          if ! git diff --cached --quiet; then
            git commit -m 'Exercise the actual Xbox water-settings disclosure before editing its controls'
            git push origin HEAD:vesperfall-surestep-20260914
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  acceptance:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        suite: [surestep, dominions, pilgrim]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, mechanics and workbook regressions
        if: matrix.suite == 'surestep'
        run: |
          set -euo pipefail
          mkdir -p test-output
          for f in vesperfall/*.js; do node --check "$f"; done
          node --test vesperfall/tests/*.test.cjs | tee test-output/surestep-model.tap
          python vesperfall/tests/production-workbook.py
          python scripts/check-vesperfall.py
      - name: Install browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise the rendered input and preservation journey
        run: |
          set -euo pipefail
          mkdir -p test-output
          python -m http.server 4173 > test-output/server.log 2>&1 &
          timeout 1200 python -u vesperfall/tests/${{ matrix.suite }}-browser.py | tee test-output/${{ matrix.suite }}-browser.log
      - name: Retain exact tested source and diagnostics
        if: always()
        run: |
          mkdir -p test-output
          git rev-parse HEAD > test-output/source-revision.txt
          tar -czf test-output/vesperfall-source.tgz vesperfall scripts .github/workflows/vesperfall-*.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vesperfall-surestep-${{ matrix.suite }}
          path: test-output/
          retention-days: 14
