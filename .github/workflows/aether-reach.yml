name: Aether Reach validation
on:
  push:
    branches: [feat/aether-reach-first-expedition]
    paths: ['aether-reach/**','index.html','projects.css','.github/workflows/aether-reach.yml']
  pull_request:
    paths: ['aether-reach/**','index.html','projects.css','.github/workflows/aether-reach.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aether-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [expedition, interface]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check model and source syntax
        run: |
          for f in aether-reach/*.mjs; do node --check "$f"; done
          node --test aether-reach/tests/model.test.mjs
      - name: Install the actual browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise the actual HTTP WebGL expedition
        env:
          AETHER_SUITE: ${{ matrix.suite }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/aether-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python -u aether-reach/tests/browser.py
          if [ "$AETHER_SUITE" = interface ]; then python -u aether-reach/tests/launch.py; fi
      - name: Record the exact tested version
        if: always()
        run: |
          mkdir -p aether-reach/test-output
          git rev-parse HEAD > aether-reach/test-output/tested-commit.txt
          git diff --stat > aether-reach/test-output/uncommitted-diff.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-${{ matrix.suite }}
          path: aether-reach/test-output
          retention-days: 7
