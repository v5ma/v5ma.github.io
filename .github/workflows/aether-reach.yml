name: Materialize checked Aether Reach source
on:
  push:
    branches: [feat/aether-reach-first-expedition]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    if: github.ref == 'refs/heads/feat/aether-reach-first-expedition'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and remove temporary transport
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,shutil
          from pathlib import Path
          data=''.join(Path(f'.aether-incoming/part-{i}.txt').read_text() for i in range(9))
          raw=lzma.decompress(base64.b64decode(data,validate=True))
          assert len(raw)==119903
          assert hashlib.sha256(raw).hexdigest()=='b67e8a118ea91a875f056d20e4aac0db65adf017422721553fcc5635d00d4c3d'
          files=json.loads(raw)
          allowed={'index.html','projects.css','.github/workflows/aether-reach.yml','.github/workflows/aether-published.yml','aether-reach/cover.svg','aether-reach/model.mjs','aether-reach/.gitignore','aether-reach/release.json','aether-reach/ROADMAP.md','aether-reach/index.html','aether-reach/scene.mjs','aether-reach/style.css','aether-reach/app.mjs','aether-reach/README.md','aether-reach/tests/browser.py','aether-reach/tests/model.test.mjs','aether-reach/vendor/LICENSE'}
          assert set(files)==allowed
          for name,item in files.items():
              assert hashlib.sha256(item['text'].encode('utf-8')).hexdigest()==item['sha256'],name
          for name,item in files.items():
              if name.startswith('.github/'):continue
              p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(item['text'].encode('utf-8'))
          shutil.rmtree('.aether-incoming')
          print('Application and homepage source verified. Workflow updates are handled separately.')
          PY
          node --test aether-reach/tests/model.test.mjs
      - name: Commit only application source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html projects.css aether-reach .aether-incoming
          git diff --cached --stat
          git commit -m 'Implement Aether Reach original first-person sky-city expedition and homepage launch'
          git push origin HEAD:feat/aether-reach-first-expedition
          git rev-parse HEAD > materialized-source.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aether-materialized-source
          path: materialized-source.txt
          retention-days: 3
