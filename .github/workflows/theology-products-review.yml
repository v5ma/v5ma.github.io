name: Review Theology listening and media products
on:
  push:
    branches: [feat/theology-listening-products-20260906]
    paths: ['theology-wiki/**', '.github/workflows/theology-products-review.yml']
permissions:
  contents: write
concurrency:
  group: theology-products-${{ github.ref }}
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Materialize integrity-checked public source delta
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma,subprocess
          root=Path('theology-wiki')
          parts=sorted(root.glob('products-transfer-*.txt'))
          if parts:
            assert len(parts)==4
            digest,payload=''.join(p.read_text().strip() for p in parts).split(':',1)
            assert digest=='fc187c86076e703ca5279e775db38c037c591cec1247d7b04f23533ba7014097'
            packed=base64.b64decode(payload,validate=True)
            assert hashlib.sha256(packed).hexdigest()==digest,'Transfer differs from checked source'
            decoded=lzma.decompress(packed);assert len(decoded)<400000
            package=json.loads(decoded)
            modified={'theology-wiki/README.md','theology-wiki/tools/build.cjs','theology-wiki/assets/js/research-tools.js','theology-wiki/tests/research.test.cjs','theology-wiki/tests/foundations.test.cjs','theology-wiki/tests/roadmap.test.cjs','theology-wiki/tests/atlas.test.cjs','theology-wiki/tests/browser.py'}
            added={'theology-wiki/assets/js/listening-core.js','theology-wiki/assets/js/products-tools.js','theology-wiki/assets/css/products.css','theology-wiki/editorial/products.json','theology-wiki/editorial/product-guide.md','theology-wiki/tools/products.cjs','theology-wiki/tools/render_product_media.py','theology-wiki/tools/requirements-media.txt','theology-wiki/tests/products.test.cjs','theology-wiki/tests/products_checks.py'}
            assert set(package['files'])==added
            assert set(package['hashes'])==modified|added
            patch=Path('/tmp/theology-products.patch');patch.write_text(package['patch'])
            actual={line.split('\t')[-1] for line in subprocess.check_output(['git','apply','--numstat',str(patch)],text=True).splitlines()}
            assert actual==modified
            subprocess.run(['git','apply','--check',str(patch)],check=True)
            subprocess.run(['git','apply',str(patch)],check=True)
            for name,text in package['files'].items():
              p=Path(name);assert not p.exists();p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
            for name,expected in package['hashes'].items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==expected,name
            for p in parts:p.unlink()
          PY
          if [ -f theology-wiki/tools/products-review-fix.py ]; then python theology-wiki/tools/products-review-fix.py; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build source-pinned narration and preserve readable implementation
        run: |
          node theology-wiki/tools/build.cjs
          git diff --exit-code -- theology-sources san-wiki-shell scripts theology-wiki/content/sources
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- theology-wiki
          if ! git diff --cached --quiet; then git commit -m 'Implement full-study listening and source-linked media production workspace'; git push origin HEAD:${GITHUB_REF_NAME}; fi
      - name: Produce synthetic recordings and captioned video when absent
        run: |
          set -o pipefail
          mkdir -p theology-test-output
          if [ ! -f theology-wiki/products/media/manifest.json ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq espeak-ng ffmpeg fonts-dejavu-core
            python -m pip install --quiet torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
            python -m pip install --quiet -r theology-wiki/tools/requirements-media.txt
            python -u theology-wiki/tools/render_product_media.py | tee theology-test-output/media-production.txt
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('theology-wiki/products/media/manifest.json').read_text())
          assert m['production']['engine']=='Kokoro 0.9.4'
          assert len(m['assets'])==2
          assert {a['kind'] for a in m['assets']}=={'episode','article'}
          PY
      - name: Verify source, media bytes, playback state and preserved workbook
        run: |
          set -o pipefail
          node theology-wiki/tools/build.cjs | tee theology-test-output/build-report.txt
          node --check theology-wiki/assets/js/listening-core.js
          node --check theology-wiki/assets/js/products-tools.js
          node --test theology-wiki/tests/research.test.cjs | tee theology-test-output/node-tests.txt
          git diff --exit-code -- theology-sources san-wiki-shell scripts theology-wiki/content/sources theology-wiki/planning/Theology-Research-Plan.xlsx
          git add -- theology-wiki
          if ! git diff --cached --quiet; then git commit -m 'Record complete Theology study and captioned pilot with measured cue timing'; git push origin HEAD:${GITHUB_REF_NAME}; fi
      - name: Install native browser and verify retained images
        run: |
          python -m pip install --quiet playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium > /tmp/theology-browser-install.log 2>&1 || { tail -100 /tmp/theology-browser-install.log; exit 1; }
          python theology-wiki/tools/media.py
      - name: Play actual audio and video and exercise native HTTP reader
        run: |
          python -m http.server 4174 --bind 127.0.0.1 > /tmp/theology-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python theology-wiki/tests/browser.py
      - name: Preserve review source and evidence
        if: always()
        run: |
          mkdir -p theology-test-output
          git rev-parse HEAD > theology-test-output/tested-commit.txt
          git diff --stat > theology-test-output/uncommitted-diff.txt
          cp /tmp/theology-http.log theology-test-output/ 2>/dev/null || true
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('theology-test-output/review-source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in Path('theology-wiki').rglob('*'):
              if p.is_file() and '__pycache__' not in p.parts and p.suffix.lower() not in {'.ttf','.otf','.woff','.woff2'} and not p.name.startswith('products-transfer-'):z.write(p,p.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theology-products-review
          path: theology-test-output/
          retention-days: 14
