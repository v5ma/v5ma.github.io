name: Sky Cycle Canal Choice
on:
  push:
    branches: ['sky-cycle/canal-choice-0.25', master]
    paths: ['mario-maker-clone/svgn-paper-route/**', '!mario-maker-clone/svgn-paper-route/development/**', '.github/workflows/sky-cycle-canal-choice.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sky-cycle-canal-choice-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  rules:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --test mario-maker-clone/svgn-paper-route/tests/*.test.mjs
          node --test tests/adventure_score.test.cjs
          mkdir -p /tmp/source
          git rev-parse HEAD > /tmp/source/commit.txt
          git archive --format=tar.gz HEAD mario-maker-clone tests level-design-library .github/workflows > /tmp/source/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: canal-choice-source-${{ github.sha }}
          path: /tmp/source/
          retention-days: 30
  fork:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        grip: [forgiving, precision]
        case: [high, lower, early, coast]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - run: python mario-maker-clone/svgn-paper-route/tests/waterwheel-fork-browser.py
        env:
          FORK_CASE: ${{ matrix.case }}
          FORK_GRIP: ${{ matrix.grip }}
          ARTIFACT_DIR: /tmp/fork
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canal-choice-${{ matrix.grip }}-${{ matrix.case }}-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/fork/
          retention-days: 30
          if-no-files-found: error
  preview:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        route: [road, ground-only, porch, express]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - run: python mario-maker-clone/svgn-paper-route/tests/waterwheel-preview-browser.py
        env:
          WATERWHEEL_SUITE: ${{ matrix.route }}
          ARTIFACT_DIR: /tmp/preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canal-choice-preview-${{ matrix.route }}-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/preview/
          retention-days: 30
          if-no-files-found: error
  regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        script: [waterwheel-deliveries-browser.py, waterwheel-xr-browser.py, portal-network-browser.py, bathhouse-browser.py, sunrise-browser.py]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - run: python mario-maker-clone/svgn-paper-route/tests/${{ matrix.script }}
        env: {ARTIFACT_DIR: /tmp/regression}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canal-choice-regression-${{ matrix.script }}-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/regression/
          retention-days: 30
          if-no-files-found: error
  published:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python mario-maker-clone/svgn-paper-route/tests/waterwheel-published.py
        env: {ARTIFACT_DIR: /tmp/public}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canal-choice-public-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/public/
          retention-days: 30
  live:
    needs: published
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - run: python mario-maker-clone/svgn-paper-route/tests/waterwheel-fork-browser.py
        env:
          TEST_ORIGIN: https://v5ma.github.io
          FORK_CASE: lower
          FORK_GRIP: forgiving
          ARTIFACT_DIR: /tmp/live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canal-choice-live-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/live/
          retention-days: 30
