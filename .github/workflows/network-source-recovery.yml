name: Preserve connected-world source checkpoint
on:
  push:
    branches: [feat/connected-sky-network-20260905]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p network-checkpoint
          cp .network-transfer/*.b64 network-checkpoint/
          tar -czf network-checkpoint/runtime.tgz mario-maker-clone/svgn-paper-route tests scripts
          git rev-parse HEAD > network-checkpoint/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: network-source-checkpoint
          path: network-checkpoint/
          retention-days: 3
