name: Materialize isolated City source and verify
on:
  push:
    branches: [feat/svgn-city-first-dispatch]
    paths: ['svgn-city/.incoming/**','.github/workflows/svgn-city-materialize.yml']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/svgn-city-first-dispatch
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and materialize the exact authored files
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,lzma,json,shutil
          data=b''.join(Path(f'svgn-city/.incoming/{i}.bin').read_bytes() for i in range(7))
          assert len(data)==30896
          assert hashlib.sha256(data).hexdigest()=='bcca8458235a926401079bee2c64b6556be5f9b267bd23ff32494729d751f79c'
          decoder=lzma.LZMADecompressor(); raw=decoder.decompress(data,max_length=2000000)
          assert decoder.eof and not decoder.unused_data
          files=json.loads(raw)
          allowed={'svgn-city/'+n for n in ['art.mjs','app.mjs','index.html','style.css','package.json','README.md','ROADMAP.md','.gitignore','scene.mjs','model.mjs','release.json','tests/browser.py','tests/model.test.mjs']}
          allowed|={'.github/workflows/svgn-city.yml','.github/workflows/svgn-city-published.yml'}
          assert set(files)==allowed
          for name,text in files.items():
            p=Path(name)
            assert name=='.github/workflows/svgn-city.yml' or not p.exists(),name
            p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(text.encode('utf-8'))
          shutil.rmtree('svgn-city/.incoming')
          Path('.github/workflows/svgn-city-materialize.yml').unlink()
          PY
          node --test svgn-city/tests/model.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add svgn-city .github/workflows/svgn-city.yml .github/workflows/svgn-city-published.yml .github/workflows/svgn-city-materialize.yml
          git commit -m 'Build SVGN City First Dispatch: original neighborhood, bicycle, car and mission prototype'
          git push origin HEAD:feat/svgn-city-first-dispatch
      - name: Install browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test the committed prototype with normal input
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/city-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python -u svgn-city/tests/browser.py
      - name: Preserve exact source and native evidence
        if: always()
        run: |
          mkdir -p city-evidence
          cp -r svgn-city/test-output city-evidence/ 2>/dev/null || true
          git rev-parse HEAD > city-evidence/source-sha.txt
          git diff --stat > city-evidence/uncommitted-diff.txt
          tar --exclude='test-output' --exclude='__pycache__' --exclude='.incoming' -czf city-evidence/source.tgz svgn-city
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svgn-city-initial-verification
          path: city-evidence/
          retention-days: 14
