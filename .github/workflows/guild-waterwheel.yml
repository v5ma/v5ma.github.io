name: Guild Waterwheel Quarter and Spatial XR
on:
  push:
    branches: [master]
    paths: ['leonardos-guild/**', '.github/workflows/guild-waterwheel.yml']
  pull_request:
    paths: ['leonardos-guild/**', '.github/workflows/guild-waterwheel.yml']
permissions:
  contents: read
concurrency:
  group: guild-waterwheel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  served:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for exact published runtime before public gameplay acceptance
        run: |
          python - <<'PY'
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          from urllib.parse import quote
          import hashlib,json,time,urllib.request,subprocess
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          root=Path('leonardos-guild')
          paths=[p for p in root.iterdir() if p.is_file() and p.suffix in {'.html','.mjs','.js','.css','.json','.svg'}]
          paths+=list((root/'vendor').rglob('*.js'))
          paths+=[root/'tests'/'portal-graphics.html']
          expected={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}
          found={}
          def inspect(item):
            name,digest=item
            try:
              request=urllib.request.Request('https://v5ma.github.io/'+quote(name,safe='/')+'?waterwheel='+source[:12],headers={'Cache-Control':'no-cache','User-Agent':'SVGN-Waterwheel-acceptance'})
              with urllib.request.urlopen(request,timeout=15) as response:
                actual=hashlib.sha256(response.read()).hexdigest()
                return name,{'status':response.status,'expected':digest,'actual':actual,'match':actual==digest}
            except Exception as e:return name,{'match':False,'error':str(e)}
          with ThreadPoolExecutor(max_workers=6) as pool:
            for attempt in range(48):
              pending=[v for v in expected.items() if not found.get(v[0],{}).get('match')]
              found.update(pool.map(inspect,pending))
              if len(found)==len(expected) and all(v['match'] for v in found.values()):break
              time.sleep(5)
          result={'source':source,'base':'https://v5ma.github.io','files':found,'all_match':len(found)==len(expected) and all(v['match'] for v in found.values()),'scope':'Runtime and local Three modules before native public journeys. The independent published-Guild workflow additionally verifies every asset, audio file and document.'}
          Path('waterwheel-served-source.json').write_text(json.dumps(result,indent=2))
          assert result['all_match'],'Published runtime has not converged to the tested source'
          print('Matched',len(found),'served runtime files:',source)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guild-waterwheel-served-source
          path: waterwheel-served-source.json
          retention-days: 14
  native:
    needs: served
    if: always() && !cancelled() && (needs.served.result == 'success' || needs.served.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        journey: [social, upper, hydraulic, spatial, relay, portal, entry]
    env:
      TEST_BASE_URL: ${{ github.event_name == 'push' && 'https://v5ma.github.io' || 'http://127.0.0.1:4173' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check ordinary committed modules and complete model suite
        run: |
          set -euo pipefail
          test ! -f leonardos-guild/scripts/waterwheel-polish.json
          test ! -f leonardos-guild/scripts/waterwheel-new-hashes.json
          for f in leonardos-guild/*.mjs; do node --check "$f"; done
          npm --prefix leonardos-guild test | tee /tmp/waterwheel-model-tests.txt
          node --test leonardos-guild/design/validate-design.mjs
      - name: Install native browser
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Exercise actual inputs, observations, saved rewards and native rendering
        env:
          QUARTER_ROUTE: ${{ matrix.journey }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/waterwheel-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          if test "$QUARTER_ROUTE" = entry; then
            python -u leonardos-guild/tests/xr-entry-browser.py
          elif test "$QUARTER_ROUTE" = portal; then
            python -u leonardos-guild/tests/portal-browser.py
          elif test "$QUARTER_ROUTE" = spatial; then
            python -u leonardos-guild/tests/spatial-browser.py
          elif test "$QUARTER_ROUTE" = relay; then
            QUARTER_ROUTE=social QUARTER_RELAY=1 python -u leonardos-guild/tests/quarter-browser.py
          else
            python -u leonardos-guild/tests/quarter-browser.py
          fi
      - name: Archive exact source and retain failure evidence
        if: always()
        env:
          JOURNEY: ${{ matrix.journey }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,hashlib,json,tarfile,subprocess,shutil
          name=os.environ['JOURNEY'];out=Path('leonardos-guild')/('spatial-output' if name=='spatial' else 'quarter-'+name+'-output');out.mkdir(exist_ok=True)
          names=subprocess.check_output(['git','ls-files','leonardos-guild','.github/workflows'],text=True).splitlines()
          files={n:hashlib.sha256(Path(n).read_bytes()).hexdigest() for n in names if Path(n).is_file()}
          (out/'source-hashes.json').write_text(json.dumps(files,indent=2));(out/'tested-commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          (out/'served-base.txt').write_text(os.environ['TEST_BASE_URL']+'\n')
          diff=subprocess.check_output(['git','diff','--stat'],text=True);(out/'uncommitted-diff.txt').write_text(diff)
          with tarfile.open(out/'source.tgz','w:gz') as tar:
            for n in files:tar.add(n,arcname=n)
          if Path('/tmp/waterwheel-model-tests.txt').exists():shutil.copy('/tmp/waterwheel-model-tests.txt',out/'model-tests.txt')
          assert not diff,'Acceptance must not rewrite committed source'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guild-waterwheel-${{ matrix.journey }}
          path: |
            leonardos-guild/quarter-${{ matrix.journey }}-output/
            leonardos-guild/spatial-output/
          retention-days: 14
