name: Stage reviewed Aether grounded changes
on:
  push:
    branches: [aether/grounded-motion-20260914]
    paths: ['aether-reach/tools/integrate-grounded.b64']
permissions:
  contents: read
jobs:
  stage:
    if: github.repository == 'v5ma/v5ma.github.io' && github.ref == 'refs/heads/aether/grounded-motion-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record preceding public release
        run: |
          mkdir -p /tmp/aether-stage
          python - <<'PY'
          import json,hashlib,urllib.request
          from pathlib import Path
          result={}
          for name in ['release.json','cast-scene.mjs','xr-session.mjs']:
            p=Path('aether-reach')/name
            try:
              with urllib.request.urlopen('https://v5ma.github.io/aether-reach/'+name+'?grounded-baseline=20260914',timeout=25) as response:
                raw=response.read();result[name]={'http':response.status,'sha256':hashlib.sha256(raw).hexdigest(),'matchesBase':raw==p.read_bytes()}
                if name=='release.json':result[name]['release']=json.loads(raw)
            except Exception as error:result[name]={'error':str(error)}
          Path('/tmp/aether-stage/baseline-publication.json').write_text(json.dumps(result,indent=2))
          PY
      - name: Apply only exact-base reviewed edits
        run: |
          python - <<'PY'
          import base64,zlib,json,hashlib
          from pathlib import Path
          raw=zlib.decompress(base64.b64decode(Path('aether-reach/tools/integrate-grounded.b64').read_text()))
          assert hashlib.sha256(raw).hexdigest()=='69f8ce9357118333e085d6456ad40ab94316d2e75ca7ef67d7edd8182a983c3a'
          data=json.loads(raw)
          assert data['base']=='fb14411441d18085677df0484bbb1de0ca802f4c'
          for name,item in data['changes'].items():
            p=Path(name)
            assert not p.is_absolute() and '..' not in p.parts and not p.is_symlink()
            assert name.startswith('aether-reach/') or name=='.github/workflows/aether-grounded.yml'
            assert (hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None)==item['before'],name
            text=p.read_text() if p.exists() else ''
            for start,end,replacement in reversed(item['edits']):
              assert 0<=start<=end<=len(text),name
              text=text[:start]+replacement+text[end:]
            assert hashlib.sha256(text.encode()).hexdigest()==item['after'],name
            p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
          Path('/tmp/aether-stage/changes.json').write_text(json.dumps(data))
          PY
          git diff --check
      - name: Validate staged source and save compatibility
        run: |
          set -euo pipefail
          for f in aether-reach/*.mjs; do node --check "$f"; done
          node --test aether-reach/tests/*.test.mjs | tee /tmp/aether-stage/node-tests.log
          python aether-reach/tests/backup_test.py
          node aether-reach/tests/release-manifest.mjs
      - name: Create reviewed commit object without updating refs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          data=json.loads(Path('/tmp/aether-stage/changes.json').read_text())
          def post(endpoint,payload):
            p=Path('/tmp/aether-stage/request.json');p.write_text(json.dumps(payload))
            return json.loads(subprocess.check_output(['gh','api','--method','POST','repos/'+os.environ['GH_REPO']+'/'+endpoint,'--input',str(p)],text=True))
          tree=[{'path':name,'mode':'100644','type':'blob','content':Path(name).read_text()} for name in data['changes']]
          for name in ['aether-reach/tools/integrate-grounded.b64','.github/workflows/aether-stage-grounded.yml']:tree.append({'path':name,'mode':'100644','type':'blob','sha':None})
          base_tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          t=post('git/trees',{'base_tree':base_tree,'tree':tree})
          c=post('git/commits',{'message':'feat(aether): Grounded Cast foot locking and tracked hand spatial UI','tree':t['sha'],'parents':[os.environ['GITHUB_SHA']]})
          Path('/tmp/aether-stage/staged-commit.json').write_text(json.dumps({'parent':os.environ['GITHUB_SHA'],'commit':c['sha'],'tree':t['sha'],'files':list(data['changes']),'tests':'224 Node tests and 6 restore-input tests passed; browser publication still pending'},indent=2))
          print('Created commit object',c['sha'],'without moving any branch.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-grounded-staged
          path: |
            /tmp/aether-stage/staged-commit.json
            /tmp/aether-stage/baseline-publication.json
            /tmp/aether-stage/node-tests.log
          retention-days: 7
