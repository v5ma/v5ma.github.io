name: Rainward survival controls and soundscape
on:
  pull_request:
    paths: ['rainward/**','.github/workflows/rainward-survival-sound.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rainward-survival-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        suite: [soundscape,survival-controller]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Model and source regression
        run: |
          for f in rainward/*.mjs; do node --check "$f"; done
          node --test rainward/tests/*.test.mjs
      - name: Install actual browser and audio engine
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Play the actual HTTP build
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/rainward-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          timeout 780 python -u "rainward/tests/$SUITE.py"
      - name: Preserve source and evidence
        if: always()
        run: |
          mkdir -p test-output
          python rainward/tests/release.py
          git rev-parse HEAD > test-output/tested-commit.txt
          tar -czf test-output/rainward-source.tgz rainward index.html projects.css
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainward-${{ matrix.suite }}
          path: test-output/
          retention-days: 7
