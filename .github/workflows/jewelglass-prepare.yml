name: Integrate checked Vesperfall Jewelglass source
on:
  push:
    branches: [feat/vesperfall-jewelglass]
    paths: ['.jewelglass-incoming/**','.github/workflows/jewelglass-prepare.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vesperfall-jewelglass
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact bounded source delta
        run: |
          python - <<'PY'
          import lzma,json,hashlib
          from pathlib import Path
          data=b''.join(Path(f'.jewelglass-incoming/part-{i}').read_bytes() for i in range(3))
          assert hashlib.sha256(data).hexdigest()=='eb9134b603aa1189f56b7766faa9269248733bce550d1660021b710c1b825444'
          changes=json.loads(lzma.decompress(data))
          allowed={'vesperfall/'+n for n in ['jewel-shaders.js','jewelglass.js','jewelglass.css','JEWELGLASS.md','tests/jewelglass-browser.py','tests/jewelglass.test.cjs','index.html','core.js','tests/cathedral-browser.py','release.json','README.md','roadmap.json']}|{'scripts/check-vesperfall.py'}
          assert set(changes)==allowed
          staged={}
          for name,item in changes.items():
            p=Path(name);assert not p.is_symlink()
            if item['before'] is None:
              assert not p.exists(),name
              text=item['text']
            else:
              raw=p.read_bytes();assert hashlib.sha256(raw).hexdigest()==item['before'],name
              text=raw.decode();last=len(text)+1
              for a,b,value in reversed(item['edits']):
                assert 0<=a<=b<last and isinstance(value,str)
                text=text[:a]+value+text[b:];last=a+1
            assert isinstance(text,str)
            raw=text.encode();assert hashlib.sha256(raw).hexdigest()==item['after'],name
            staged[name]=raw
          for name,raw in staged.items():
            p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(raw)
          PY
          node --check vesperfall/jewelglass.js
          node --check vesperfall/jewel-shaders.js
          node --test vesperfall/tests/*.test.cjs
          python -m py_compile vesperfall/tests/jewelglass-browser.py
          python scripts/check-vesperfall.py
      - name: Commit only the reviewed app delta and remove transport
        run: |
          rm -rf .jewelglass-incoming
          git config user.name 'Vesperfall material integration'
          git config user.email 'vesperfall@users.noreply.github.com'
          git add vesperfall scripts/check-vesperfall.py
          git add -u .jewelglass-incoming
          git commit -m 'Implement Jewelglass physical materials, original effect shaders and reversible graphics controls'
          git push origin HEAD:feat/vesperfall-jewelglass
      - if: always()
        run: |
          mkdir -p test-output
          git rev-parse HEAD > test-output/source-sha.txt
          tar czf test-output/source.tgz vesperfall scripts/check-vesperfall.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jewelglass-integrated-source
          path: test-output/
          retention-days: 7
