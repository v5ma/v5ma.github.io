name: Repair Vesperfall game pause lifecycle
on:
  push:
    branches: [feat/vesperfall-quest-archery]
    paths: [.github/workflows/vesperfall-lifecycle-fix.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vesperfall-quest-archery
      - name: Separate game pause from A-Frame component lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          assert subprocess.check_output(['git','rev-parse','HEAD:vesperfall/app.js'],text=True).strip()
          p=Path('vesperfall/app.js');s=p.read_text()
          assert '  pause(yes){' in s and 'this.setPaused(' not in s
          s=s.replace('this.pause(', 'this.setPaused(').replace('  pause(yes){','  setPaused(yes){')
          s=s.replace('  remove(){clearTimeout', '  // A-Frame owns play/pause lifecycle hooks; game menus must not remove tick.\n  pause(){if(this.rendererReady)this.setPaused(true);},\n  remove(){clearTimeout')
          s=s.replace("if(!frame||!session||!ref){this.hands={};return;}","if(!frame||!session||!ref){this.hands={};for(const side of ['left','right'])$(side+'-hand').object3D.visible=false;return;}")
          s=s.replace('if(!pose)continue;', 'if(!pose||pose.emulatedPosition)continue;')
          s=s.replace("this.scene.canvas.addEventListener('pointerup',e=>{if(e.pointerType==='touch')this.touchLook=null;});", "this.scene.canvas.addEventListener('pointerup',e=>{if(e.pointerType==='touch')this.touchLook=null;});this.scene.canvas.addEventListener('pointercancel',()=>{this.touchLook=null;this.cancel();});")
          p.write_text(s)
          p=Path('vesperfall/tests/browser.py');s=p.read_text()
          old="await_pose=snap(page)['player'];page.keyboard.press('KeyP');page.wait_for_function('Vesperfall.component.paused');page.wait_for_timeout(300);check(snap(page)['player']==await_pose"
          new="page.keyboard.press('KeyP');page.wait_for_function('Vesperfall.component.paused');await_pose=snap(page)['player'];page.wait_for_timeout(300);check(snap(page)['player']==await_pose"
          assert old in s
          s=s.replace(old,new).replace("check(len(snap(page)['enemies'])==0,", "check(page.evaluate('Vesperfall.component.isPlaying'),'Starting the run preserves A-Frame tick registration')\n   check(len(snap(page)['enemies'])==0,")
          p.write_text(s)
          PY
          node --check vesperfall/app.js
          node --test vesperfall/tests/core.test.cjs
          python scripts/check-vesperfall.py
      - name: Commit only the repaired runtime and regression assertion
        run: |
          git config user.name 'Vesperfall lifecycle repair'
          git config user.email 'vesperfall@users.noreply.github.com'
          git add vesperfall/app.js vesperfall/tests/browser.py
          git commit -m 'Keep game pauses separate from A-Frame tick lifecycle and reject invalid tracking'
          git push origin HEAD:feat/vesperfall-quest-archery
