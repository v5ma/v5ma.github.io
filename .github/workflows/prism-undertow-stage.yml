name: Stage exact Prism main-rhythm repair
on:
  pull_request:
    paths: ['.github/prism-undertow-apply.py', '.github/prism-undertow-polish.py', '.github/prism-undertow-hilts.py', '.github/workflows/prism-undertow-stage.yml', 'prism-current/undertow.js', 'prism-current/graphics/pool-stage.js', 'prism-current/tests/undertow-browser.py']
permissions:
  contents: write
concurrency:
  group: prism-undertow-stage-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  stage:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/prism-main-rhythm-undertow-v090'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          sparse-checkout: |
            prism-current
            .github
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only hash-verified existing Prism files
        run: |
          mkdir -p test-output
          git rev-parse HEAD > /tmp/prism-start-sha
          python .github/prism-undertow-apply.py
          python .github/prism-undertow-polish.py
          python .github/prism-undertow-hilts.py
          python prism-current/tests/verify.py
          node --test prism-current/tests/*.test.cjs | tee test-output/core.tap
        shell: bash -e -o pipefail {0}
      - name: Install native browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise the changed default before writing the candidate
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/prism.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          timeout 420 python -u prism-current/tests/undertow-browser.py
      - name: Commit the tested runtime only to this isolated branch
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          test "$TARGET_BRANCH" = 'fix/prism-main-rhythm-undertow-v090'
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$(cat /tmp/prism-start-sha)"
          python - <<'PY'
          import json,subprocess
          paths=json.load(open('/tmp/prism-undertow-paths.json'))
          assert len(paths)==20 and all(p.startswith('prism-current/') and '..' not in p.split('/') for p in paths)
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert set(changed)==set(paths), changed
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply hash-verified Undertow main-rhythm repair after native input acceptance'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD > test-output/runtime-commit.txt
      - if: always()
        run: |
          mkdir -p test-output
          git rev-parse HEAD > test-output/checkout-commit.txt
          git diff --stat > test-output/uncommitted-source.txt
          tar czf test-output/source.tgz prism-current
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-undertow-staging
          path: test-output/
          retention-days: 14
