name: Vesperfall Fieldwork candidate
on:
  push:
    branches: [vesperfall-fieldwork-20260918]
    paths: ['.github/workflows/vesperfall-fieldwork-stage.yml']
permissions:
  contents: read
jobs:
  prepare:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: source
        run: |
          set -euo pipefail
          python .github/fieldwork-prepare.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vesperfall
          if ! git diff --cached --quiet; then
            git commit -m 'Require the current campaign checkpoint before an end-to-end reload'
            git push origin HEAD:vesperfall-fieldwork-20260918
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  native:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source }}
      - run: |
          python -m pip install playwright==1.57.0 pillow
          python -m playwright install --with-deps chromium
      - run: |
          set -euo pipefail
          mkdir -p test-output
          python -m http.server 4173 --bind 127.0.0.1 > test-output/server.log 2>&1 &
          timeout 1500 python -u vesperfall/tests/pilgrimage-browser.py | tee test-output/pilgrimage.log
      - if: always()
        run: |
          mkdir -p test-output
          git rev-parse HEAD > test-output/source-revision.txt
          git diff --stat > test-output/uncommitted-diff.txt
          tar -czf test-output/vesperfall-source.tgz vesperfall scripts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fieldwork-campaign-diagnostic
          path: test-output/
          retention-days: 14
