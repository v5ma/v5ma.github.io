name: Rainward Grounded candidate
on:
  push:
    branches: [feat/rainward-grounded-20260914]
    paths: ['rainward/**','.github/workflows/rainward-grounded-prepare.yml']
permissions:
  contents: write
concurrency:
  group: rainward-grounded-candidate
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct bounded candidate issues and retain assertions
        run: |
          mkdir -p test-output
          python rainward/tools/refine-grounded.py
          node --test rainward/tests/*.test.mjs | tee test-output/model-tests.txt
          python -m compileall -q rainward/tests
      - name: Commit only the enumerated correction paths
        id: source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rainward/character-proportions.mjs rainward/rainworn-humans.mjs rainward/grounded-motion.mjs rainward/tests/grounded-motion.test.mjs rainward/tests/rainworn-connections.test.mjs rainward/tests/grounded-harness.html rainward/tests/grounded.py rainward/GROUNDED.md
          if ! git diff --cached --quiet; then
            git commit -m 'Correct downhill foot reach, shared glTF buffers and neck/head balance'
            git push origin HEAD:feat/rainward-grounded-20260914
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainward-grounded-model
          path: test-output/
          retention-days: 14
  motion:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load immutable prior rig for matched comparisons
        run: git fetch --depth=1 origin b87aeacb71d00b73992945daaba2fccdc66ab409
      - name: Install native browser
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Measure and render the actual fitted characters
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/rainward-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          timeout 650 python -u rainward/tests/grounded.py
      - name: Retain exact source and failed evidence
        if: always()
        run: |
          rm -rf rainward/tests/grounded-baseline
          mkdir -p test-output
          python rainward/tests/release.py
          git rev-parse HEAD > test-output/tested-commit.txt
          git diff > test-output/uncommitted.diff
          tar -czf test-output/rainward-source.tgz rainward index.html projects.css
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainward-grounded-motion
          path: test-output/
          retention-days: 14
