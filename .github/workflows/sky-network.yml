name: Verify connected upper world
on:
  push:
    branches: [feat/connected-sky-network-20260905]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: connected-world-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/integrate-sky-network.py
      - name: Record only the integrated game and remove incomplete transport
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- mario-maker-clone/svgn-paper-route/index.html mario-maker-clone/svgn-paper-route/cloudview-world.js mario-maker-clone/svgn-paper-route/cloudview-depth.js mario-maker-clone/svgn-paper-route/ground-runtime.js mario-maker-clone/svgn-paper-route/sky-network-runtime.js mario-maker-clone/svgn-paper-route/sw.js
          git add -u -- .network-transfer
          if ! git diff --cached --quiet; then git commit -m 'Integrate the connected upper world into the playable application'; git push origin HEAD:${GITHUB_REF_NAME}; fi
      - id: identity
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  replay:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        mode: [survey, flight, grapple, road]
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the actual geometry and retained mechanics
        run: |
          node --check mario-maker-clone/svgn-paper-route/sky-network-layout.js
          node --check mario-maker-clone/svgn-paper-route/sky-network-runtime.js
          node --check mario-maker-clone/svgn-paper-route/cloudview-world.js
          node --test tests/sky_network.test.cjs tests/adventure_score.test.cjs tests/grapple_core.test.cjs tests/grapple_tolerance.test.cjs tests/depth_geometry.test.mjs
      - name: Install native browser
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Play through ordinary keyboard and UI input
        env:
          NETWORK_SUITE: ${{ matrix.mode }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/network-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          timeout 1200 python -u tests/sky_network_browser.py
      - name: Record exact tested source
        if: always()
        run: |
          mkdir -p test-output
          git rev-parse HEAD > test-output/tested-commit.txt
          git diff --stat > test-output/uncommitted-diff.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-${{ matrix.mode }}
          path: test-output/
          retention-days: 7
  receipt:
    needs: [prepare, replay]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/connected-sky-network-20260905
      - uses: actions/download-artifact@v4
        with:
          pattern: network-*
          path: /tmp/network-results
      - name: Write a small inspectable verification receipt
        env:
          TESTED_SHA: ${{ needs.prepare.outputs.sha }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          REPLAY_RESULT: ${{ needs.replay.result }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os
          result={'tested_sha':os.environ['TESTED_SHA'],'prepare':os.environ['PREPARE_RESULT'],'replay':os.environ['REPLAY_RESULT'],'reports':{}}
          for name in ['report.json','failure.json']:
            for p in Path('/tmp/network-results').rglob(name):
              d=json.loads(p.read_text());result['reports'][p.parent.name]={'passed':d.get('passed',False),'error':d.get('error'),'checks':d.get('checks'),'state':d.get('state'),'errors':d.get('errors')}
          Path('development').mkdir(exist_ok=True)
          Path('development/connected-world-verification.json').write_text(json.dumps(result,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- development/connected-world-verification.json
          if ! git diff --cached --quiet; then git commit -m 'Record connected-world verification receipt'; git push origin HEAD:feat/connected-sky-network-20260905; fi
