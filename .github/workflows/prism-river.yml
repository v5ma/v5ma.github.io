name: Verify River Prism
on:
  pull_request:
    paths: ['prism-current/**', '.github/workflows/prism-river.yml']
  push:
    branches: [master]
    paths: ['prism-current/**', '.github/workflows/prism-river.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: river-prism-${{ github.ref }}
  cancel-in-progress: true
jobs:
  river:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: prism-current
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source invariants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-output
          python prism-current/tests/verify.py
          node --test prism-current/tests/*.test.cjs | tee test-output/core.tap
      - name: Match the actual published game
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json,urllib.request,hashlib,time
          from pathlib import Path
          m=json.loads(Path('test-output/prism-manifest.json').read_text());files={p:h for p,h in m['files'].items() if p.startswith('prism-current/')};out={}
          for attempt in range(40):
            for p,h in files.items():
              if out.get(p)==h:continue
              try:
                with urllib.request.urlopen('https://v5ma.github.io/'+p+'?river='+m['source'][:12],timeout=12) as r:out[p]=hashlib.sha256(r.read()).hexdigest()
              except Exception as e:out[p]=str(e)
            if out==files:break
            time.sleep(6)
          Path('test-output/river-publication.json').write_text(json.dumps({'source':m['source'],'version':m['version'],'expected':files,'actual':out,'all_match':out==files},indent=2));assert out==files
          PY
      - name: Install native Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Two full battles and tracked input paths
        env:
          PRISM_URL: ${{ github.event_name == 'push' && 'https://v5ma.github.io/prism-current/' || 'http://127.0.0.1:4173/prism-current/' }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/river-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          timeout 600 python -u prism-current/tests/river-browser.py
      - if: always()
        run: |
          mkdir -p test-output
          git rev-parse HEAD > test-output/tested-commit.txt
          tar czf test-output/source.tgz prism-current
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-river-${{ github.event_name }}
          path: test-output/
          retention-days: 14
