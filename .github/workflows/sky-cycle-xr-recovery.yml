name: Sky Cycle XR recovery
on:
  push:
    branches: [master, 'sky-cycle/xr-menu-recovery-0.26.1']
    paths:
      - 'mario-maker-clone/svgn-paper-route/**'
      - '!mario-maker-clone/svgn-paper-route/development/**'
      - '.github/workflows/sky-cycle-xr-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sky-xr-recovery-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          mkdir -p /tmp/recovery-rules
          git rev-parse HEAD > /tmp/recovery-rules/commit.txt
          node --check mario-maker-clone/svgn-paper-route/xr-play.js
          node --test mario-maker-clone/svgn-paper-route/tests/*.test.mjs | tee /tmp/recovery-rules/game.tap
          node --test tests/adventure_score.test.cjs | tee /tmp/recovery-rules/score.tap
          git archive --format=tar.gz HEAD mario-maker-clone tests .github/workflows > /tmp/recovery-rules/source.tar.gz
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-rules-${{ github.sha }}
          path: /tmp/recovery-rules/
          retention-days: 30
  native:
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [ar, vr]
        script: [xr-recovery-browser.py, xr-workspace-browser.py]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Actual renderer with emulated headset input and pose
        env:
          XR_MODE: ${{ matrix.mode }}
          ARTIFACT_DIR: /tmp/recovery-native
        run: python mario-maker-clone/svgn-paper-route/tests/${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-${{ matrix.script }}-${{ matrix.mode }}-${{ github.sha }}
          path: /tmp/recovery-native/
          retention-days: 30
          if-no-files-found: error
  regression:
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        script: [portal-network-browser.py, waterwheel-deliveries-browser.py, xr-aperture-graphics.py]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Preserve earlier gameplay and separately test the fragment mask
        env:
          ARTIFACT_DIR: /tmp/recovery-regression
        run: python mario-maker-clone/svgn-paper-route/tests/${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-${{ matrix.script }}-${{ github.sha }}
          path: /tmp/recovery-regression/
          retention-days: 30
          if-no-files-found: error
  published:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Match 33 public runtime files with the accepted source
        env:
          ARTIFACT_DIR: /tmp/recovery-public
        run: python mario-maker-clone/svgn-paper-route/tests/xr-workspace-published.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-public-${{ github.sha }}
          path: /tmp/recovery-public/
          retention-days: 30
          if-no-files-found: error
  live:
    needs: published
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [ar, vr]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Headset-only input and head movement on the public game
        env:
          XR_MODE: ${{ matrix.mode }}
          TEST_ORIGIN: https://v5ma.github.io
          ARTIFACT_DIR: /tmp/recovery-live
        run: python mario-maker-clone/svgn-paper-route/tests/xr-recovery-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-live-${{ matrix.mode }}-${{ github.sha }}
          path: /tmp/recovery-live/
          retention-days: 30
          if-no-files-found: error
