name: Vesperfall Open Line public acceptance
on:
  push:
    branches: [master]
    paths: ['vesperfall/**', '.github/workflows/vesperfall-open-line.yml']
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vesperfall-open-line-public
  cancel-in-progress: false
jobs:
  source:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      verify: ${{ steps.scope.outputs.verify }}
      sha: ${{ steps.scope.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: scope
        name: Check the deployed release and avoid repeating unchanged sibling publications
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python - <<'PY'
          import json,hashlib,os,subprocess
          from pathlib import Path
          app=Path('vesperfall');out=Path('test-output');out.mkdir(exist_ok=True)
          paths=[p for p in app.iterdir() if p.suffix in ('.js','.css','.html','.json','.xlsx','.md')]
          paths += [p for folder in ['assets','vendor'] for p in (app/folder).rglob('*') if p.is_file()]
          manifest={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(paths)}
          digest=hashlib.sha256(json.dumps(manifest,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          receipt=app/'tests/evidence/open-line-0.15.0/publication.json'
          prior=json.loads(receipt.read_text()) if receipt.exists() else {}
          verify=json.loads((app/'release.json').read_text())['version']=='0.15.0' and (os.getenv('MANUAL')=='true' or prior.get('manifestDigest')!=digest)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          (out/'open-line-source-manifest.json').write_text(json.dumps({'commit':sha,'manifestDigest':digest,'files':manifest},indent=2))
          (out/'source-revision.txt').write_text(sha+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'verify={str(verify).lower()}\nsha={sha}\n')
          print('Open Line verification required:',verify,'source:',sha,'manifest:',digest)
          PY
      - name: Validate exact source, original gates and canonical workbook
        if: steps.scope.outputs.verify == 'true'
        run: |
          set -euo pipefail
          for f in vesperfall/*.js; do node --check "$f"; done
          node --test vesperfall/tests/*.test.cjs | tee test-output/model.tap
          python vesperfall/tests/production-workbook.py | tee test-output/workbook.log
          python scripts/check-vesperfall.py
          # Pages' generated workflow did not start workflow_run acceptance on
          # the first publication. Explicit push is a fallback, not a bypass:
          # actual public bytes must match before any public journey can run.
          ok=0
          for attempt in 1 2 3 4; do
            if python -u vesperfall/tests/verify-live.py | tee test-output/public-bytes-${attempt}.log; then
              ok=1
              break
            fi
            sleep 20
          done
          test "$ok" = 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vesperfall-open-line-public-source
          path: test-output/
          retention-days: 14
  play:
    needs: source
    if: needs.source.outputs.verify == 'true'
    strategy:
      fail-fast: false
      matrix:
        suite: [open-line, returning-bell, interface]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - name: Install public verification browser
        run: |
          python -m pip install playwright==1.57.0 pillow
          python -m playwright install --with-deps chromium
      - name: Play the actual deployed release, without game-state assignments
        env:
          TEST_BASE_URL: https://v5ma.github.io
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          mkdir -p test-output
          if [ "$SUITE" = 'interface' ]; then
            timeout 300 python -u vesperfall/tests/launch.py | tee test-output/launch.log
            timeout 300 python -u vesperfall/tests/production-browser.py | tee test-output/production.log
          else
            timeout 2100 python -u vesperfall/tests/${SUITE}-browser.py | tee test-output/${SUITE}.log
            test -s test-output/${SUITE}/report.json
            test ! -e test-output/${SUITE}/failure.json
          fi
      - name: Preserve exact tested source and unsuccessful evidence
        if: always()
        run: |
          mkdir -p test-output
          git rev-parse HEAD > test-output/source-revision.txt
          git diff --stat > test-output/uncommitted-diff.txt
          tar -czf test-output/vesperfall-source.tgz vesperfall scripts level-design-library/GAME-RECOMMENDATIONS.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vesperfall-open-line-public-${{ matrix.suite }}
          path: test-output/
          retention-days: 14
