name: Theology alternative inheritances validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'theology-wiki/alternative-inheritances-20261109/**'
      - 'theology-wiki/jesus-resurrection-empire-20261109/**'
      - 'theology-wiki/san-reader.html'
      - 'theology-wiki/index.html'
      - '.github/workflows/theology-alternative-inheritances.yml'
  pull_request:
    paths:
      - 'theology-wiki/alternative-inheritances-20261109/**'
      - '.github/workflows/theology-alternative-inheritances.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check sources, routes, preserved prose and generated output
        run: |
          node --test theology-wiki/alternative-inheritances-20261109/test.cjs
          node --test theology-wiki/jesus-resurrection-empire-20261109/test.cjs
          node --test theology-wiki/latest/test.cjs
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Check desktop/mobile guide and reader bridge behavior
        run: python theology-wiki/alternative-inheritances-20261109/browser_check.py
      - name: Wait for exact published bytes and test the live reader
        if: github.ref == 'refs/heads/master'
        env:
          INHERITANCE_BASE: https://v5ma.github.io
          INHERITANCE_REPORT_DIR: qa/live
        run: |
          python theology-wiki/alternative-inheritances-20261109/verify-live.py
          python theology-wiki/alternative-inheritances-20261109/browser_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alternative-inheritances-${{ github.run_id }}
          path: theology-wiki/alternative-inheritances-20261109/qa/
          retention-days: 14
