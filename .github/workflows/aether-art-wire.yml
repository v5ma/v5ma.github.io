name: Wire and visually review Quay artwork
on:
  push:
    branches: [feat/aether-quay-art-pass]
    paths: [.github/workflows/aether-art-wire.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/aether-quay-art-pass'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wire only the reviewed renderer and version changes
        run: |
          python aether-reach/tools/wire-quay-art.py
          for f in aether-reach/*.mjs; do node --check "$f"; done
          node --test aether-reach/tests/*.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aether-reach/scene.mjs aether-reach/model.mjs aether-reach/index.html aether-reach/release.json
          git diff --cached --stat
          git commit -m 'Render the first licensed-asset Quay upgrade while preserving gameplay'
          git push origin HEAD:feat/aether-quay-art-pass
      - name: Prepare the exact previous public renderer for comparison
        run: |
          mkdir -p /tmp/quay-before
          git archive 221844c60d56202bddadeba2bbec1cd204535e7f aether-reach index.html projects.css | tar -x -C /tmp/quay-before
          python - <<'PY'
          from pathlib import Path
          text='''<!doctype html><style>body{margin:0}canvas{display:block}</style><canvas id="plate"></canvas><script type="module">import {makeView} from '../scene.mjs';import {createState} from '../model.mjs';const v=makeView(document.getElementById('plate')),s=createState();v.resize(innerWidth,innerHeight);v.camera.position.set(28,19,28);v.camera.lookAt(0,5,0);let ready=false;function draw(){requestAnimationFrame(draw);v.update(s,0,false,true);v.render();const a=v.stats().art;if(!a||a.settled){window.PlateStats=v.stats();window.PlateReady=true;}}draw();</script>'''
          for root in [Path('.'),Path('/tmp/quay-before')]:
            (root/'aether-reach/tests/quay-plate.html').write_text(text)
          PY
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Review real HTTP WebGL art and movement, not concept images
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/quay-after.log 2>&1 &
          A=$!
          python -m http.server 4174 --bind 127.0.0.1 --directory /tmp/quay-before >/tmp/quay-before.log 2>&1 &
          B=$!
          trap 'kill $A $B' EXIT
          python -u aether-reach/tests/quay_browser.py
      - name: Preserve source and visual review artifacts
        if: always()
        run: |
          mkdir -p aether-reach/test-output
          git rev-parse HEAD > aether-reach/test-output/tested-commit.txt
          git diff --stat > aether-reach/test-output/uncommitted-diff.txt
          tar --exclude='aether-reach/test-output' -czf aether-reach/test-output/art-source.tgz aether-reach .github/workflows index.html projects.css
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-quay-first-review
          path: aether-reach/test-output/
          retention-days: 14
