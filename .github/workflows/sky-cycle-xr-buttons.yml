name: Sky Cycle headset buttons
on:
  push:
    branches: [master, 'sky-cycle/xr-buttons-0.26.2']
    paths:
      - 'mario-maker-clone/svgn-paper-route/**'
      - '!mario-maker-clone/svgn-paper-route/development/**'
      - '.github/workflows/sky-cycle-xr-buttons.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sky-buttons-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source rules and scoped archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/buttons-rules
          git rev-parse HEAD > /tmp/buttons-rules/commit.txt
          node --check mario-maker-clone/svgn-paper-route/xr-play.js
          node --test mario-maker-clone/svgn-paper-route/tests/*.test.mjs | tee /tmp/buttons-rules/game.tap
          node --test tests/adventure_score.test.cjs | tee /tmp/buttons-rules/score.tap
          git archive --format=tar.gz HEAD mario-maker-clone tests .github/workflows > /tmp/buttons-rules/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buttons-rules-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/buttons-rules/
          retention-days: 30
  native:
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [ar, vr]
        script: [xr-buttons-browser.py, xr-workspace-browser.py]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Real rendered menu and editor with explicit emulated hardware
        env:
          XR_MODE: ${{ matrix.mode }}
          ARTIFACT_DIR: /tmp/buttons-native
        run: python mario-maker-clone/svgn-paper-route/tests/${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buttons-${{ matrix.script }}-${{ matrix.mode }}-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/buttons-native/
          retention-days: 30
          if-no-files-found: error
  regression:
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        script: [portal-network-browser.py, waterwheel-deliveries-browser.py]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Preserve existing progression, controller path and deliveries
        env:
          ARTIFACT_DIR: /tmp/buttons-regression
        run: python mario-maker-clone/svgn-paper-route/tests/${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buttons-${{ matrix.script }}-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/buttons-regression/
          retention-days: 30
          if-no-files-found: error
  published:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare every owned public runtime file, including the new menu owner
        env:
          ARTIFACT_DIR: /tmp/buttons-public
        run: python mario-maker-clone/svgn-paper-route/tests/xr-workspace-published.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buttons-public-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/buttons-public/
          retention-days: 30
          if-no-files-found: error
  live:
    needs: published
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [ar, vr]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: All-button matrix and head-movement recovery on the public game
        env:
          XR_MODE: ${{ matrix.mode }}
          TEST_ORIGIN: https://v5ma.github.io
          ARTIFACT_DIR: /tmp/buttons-live
        run: python mario-maker-clone/svgn-paper-route/tests/xr-buttons-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buttons-live-${{ matrix.mode }}-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/buttons-live/
          retention-days: 30
          if-no-files-found: error
