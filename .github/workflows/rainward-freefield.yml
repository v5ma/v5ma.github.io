name: Rainward Freefield acceptance
on:
  pull_request:
    paths: ['rainward/**','.github/workflows/rainward-freefield.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rainward-freefield-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact-source model, save and contract regression
        run: |
          mkdir -p test-output
          node --test rainward/tests/*.test.mjs > test-output/node-tests.txt
          python -m compileall -q rainward/tests
          python rainward/tools/build-production-plan.py
          git diff --exit-code -- rainward/AAA_CHECKLIST.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainward-freefield-source
          path: test-output/
          retention-days: 14
  native:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        case: ['first-person','first-person-ar','diorama-vr','diorama-ar','meridian','graphics']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native HTTP WebGL browser
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Actual game or rendered fixtures without source mutation
        env:
          CASE: ${{ matrix.case }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/rainward-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          case "$CASE" in
            meridian) timeout 1000 python -u rainward/tests/freefield-meridian.py ;;
            graphics) timeout 240 python -u rainward/tests/freefield-graphics.py ;;
            *)
              RESULT=0
              for KIND in controllers hands; do
                XR_VIEW="$CASE" QUEST_KIND="$KIND" timeout 630 python -u rainward/tests/freefield-browser.py || RESULT=1
              done
              exit "$RESULT"
              ;;
          esac
      - name: Preserve source, captures, earned saves and failed attempts
        if: always()
        run: |
          mkdir -p test-output
          python rainward/tests/release.py
          git rev-parse HEAD > test-output/tested-commit.txt
          git diff > test-output/uncommitted.diff
          tar -czf test-output/rainward-source.tgz rainward index.html projects.css
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainward-freefield-${{ matrix.case }}
          path: test-output/
          retention-days: 14
