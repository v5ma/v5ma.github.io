name: Rainward Freight Cut candidate
on:
  push:
    branches: [feat/rainward-freight-cut-20260915]
    paths: ['rainward/**','.github/workflows/rainward-freight-candidate.yml']
permissions:
  contents: write
concurrency:
  group: rainward-freight-candidate
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rainward-freight-cut-20260915
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate exact baseline and run every model test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-output
          python rainward/tools/integrate-freight-cut.py
          node --test rainward/tests/*.test.mjs | tee test-output/node-models.txt
          python -m compileall -q rainward/tests
      - name: Commit only the declared integration before browser tests
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rainward/world.mjs rainward/supplies.mjs rainward/scene.mjs rainward/floodgate-content.mjs rainward/index.html rainward/tests/aquatic.test.mjs rainward/tests/reclaimed.test.mjs rainward/tests/handoff.test.mjs rainward/tests/diorama-browser.py rainward/release.json rainward/production-plan.json rainward/AAA_CHECKLIST.md rainward/README.md rainward/DEVELOPMENT-HANDOFF.md rainward/CONTROLLER.md rainward/FREIGHT-INTEGRATED.json level-design-library/GAME-RECOMMENDATIONS.md
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate Freight Cut: consequential receiver circuit, shared pursuit passage and preserved saves'
            git push origin HEAD:feat/rainward-freight-cut-20260915
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainward-freight-models
          path: test-output/
  native:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [journey,vr-controllers,vr-hands,ar-controllers,ar-hands]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real browser
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Play actual game with virtual input, not assigned player state
        env:
          CASE: ${{ matrix.mode }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/rainward-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          if [ "$CASE" = journey ]; then
            timeout 960 python -u rainward/tests/freight-cut-browser.py
          else
            TEST_CHAPTER=district XR_VIEW="diorama-${CASE%-*}" QUEST_KIND="${CASE#*-}" timeout 960 python -u rainward/tests/diorama-browser.py
          fi
      - name: Preserve actual checkout, failures and captures
        if: always()
        run: |
          mkdir -p test-output
          python rainward/tests/release.py
          git rev-parse HEAD > test-output/tested-commit.txt
          git diff > test-output/uncommitted.diff
          tar -czf test-output/rainward-source.tgz rainward index.html projects.css
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainward-freight-${{ matrix.mode }}
          path: test-output/
          retention-days: 14
