name: Record Lantern Ward candidate
on:
  push:
    branches: [neighborhood-missions/lantern-ward-playable-20260915]
    paths: ['.github/workflows/lantern-candidate-record.yml']
permissions:
  contents: write
  actions: read
jobs:
  record:
    if: github.ref == 'refs/heads/neighborhood-missions/lantern-ward-playable-20260915'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            svgn-planet
            little-planet
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate and retain exact-source reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,io,json,os,pathlib,re,subprocess,time,urllib.error,urllib.request,zipfile
          repo='v5ma/v5ma.github.io';tested='c7635260af059b991ae8454a94304fba6adceadf';run_id=35015525054
          root=pathlib.Path('svgn-planet');out=root/'production/evidence/lantern-0.12.0';out.mkdir(exist_ok=True)
          def api(path):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          for _ in range(80):
              run=api(f'/actions/runs/{run_id}');assert run['head_sha']==tested
              if run['status']=='completed':break
              print('Waiting for exact acceptance',run['status'],flush=True);time.sleep(10)
          assert run['status']=='completed' and run['conclusion']=='success','Candidate not accepted; no records changed'
          jobs=api(f'/actions/runs/{run_id}/jobs?per_page=100')['jobs']
          suites=['street','roof','canal','xr','coastal_browser_release','homecoming_browser','atmosphere-browser','tidewater-browser','grounded-browser']
          required={'model','gate',*(f'browser ({s})' for s in suites)};found={j['name']:j for j in jobs}
          assert required.issubset(found) and all(found[n]['conclusion']=='success' for n in required)
          subprocess.run(['git','diff','--exit-code',tested,'HEAD','--','svgn-planet'],check=True)
          artifacts=api(f'/actions/runs/{run_id}/artifacts?per_page=100')['artifacts']
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args):return None
          def archive(name):
              a=next(a for a in artifacts if a['name']==name and not a['expired'])
              req=urllib.request.Request(a['archive_download_url'],headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
              try:
                  with urllib.request.build_opener(NoRedirect).open(req,timeout=60) as r:data=r.read()
              except urllib.error.HTTPError as e:
                  assert e.code in (301,302,303,307,308)
                  url=e.headers['Location'];assert url.startswith('https://')
                  with urllib.request.urlopen(url,timeout=60) as r:data=r.read()
              return zipfile.ZipFile(io.BytesIO(data)),a['id']
          def report(z,suffix):
              names=[n for n in z.namelist() if n.endswith(suffix)];assert len(names)==1,(suffix,names)
              return z.read(names[0])
          def write(path,data):
              if isinstance(data,dict):data=(json.dumps(data,indent=2)+'\n').encode()
              path.write_bytes(data);return hashlib.sha256(data).hexdigest()
          model,model_id=archive('lantern-model');unit=report(model,'lantern-model.txt')
          assert re.search(rb'^# tests 208\r?$',unit,re.M) and re.search(rb'^# pass 208\r?$',unit,re.M) and re.search(rb'^# fail 0\r?$',unit,re.M)
          model_sha=write(out/'model.txt',unit)
          suffixes={'coastal_browser_release':'browser-release-report.json','homecoming_browser':'homecoming-browser.json','atmosphere-browser':'atmosphere-browser.json','tidewater-browser':'tidewater-browser.json','grounded-browser':'grounded-report.json'}
          records=[]
          for s in suites:
              z,aid=archive('lantern-'+s);raw=report(z,suffixes.get(s,'report.json'));r=json.loads(raw)
              assert r['success'] and r['checks'] and not r.get('errors') and not r.get('shaderErrors') and not r.get('consoleErrors'),s
              digest=write(out/(s+'.json'),raw);records.append({'suite':s,'checks':len(r['checks']),'artifact':aid,'report':s+'.json','sha256':digest})
          runtime=[root/'index.html',root/'lantern-ward.html',*(root/'lantern').glob('*.mjs'),root/'lantern/style.css']
          hashes=[{'path':p.relative_to(root).as_posix(),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(runtime) if not p.name.endswith('.test.mjs')]
          receipt={'version':'0.12.0','edition':'Lantern Ward: The Broken Delivery Loop','date':'2026-09-15','status':'automated-candidate-accepted','published':False,'testedCommit':tested,'acceptanceRun':f'https://github.com/{repo}/actions/runs/{run_id}','unitTestsPassed':208,'unitTestsFailed':0,'browserSuitesPassed':9,'browserChecksPassed':sum(s['checks'] for s in records),'suites':records,'modelReport':'model.txt','modelSHA256':model_sha,'modelArtifact':model_id,'runtimeFiles':hashes,'legacyFilesPinned':102,'legacyEntry':'legacy.html','legacyManifest':'legacy-layout.json','saveIdentity':'svgn.lantern-ward.v1 / lantern-ward-01 / layout 1','legacySaveWrites':False,'xrPresentation':'Native per-eye actual scene geometry; first-person VR, diorama VR and explicit non-opaque AR. Top/front/both apertures. No room scan or hit-test anchoring.','quality':'Authored playable graybox, not approved production art or completed whole-world replacement.','physicalXboxTested':False,'physicalQuest3Tested':False,'hardwareFrameTargetCertified':False,'humanLevelComprehensionTested':False,'publication':'Pending normal merge, Pages deployment and exact public byte/browser verification.'}
          write(out/'candidate.json',receipt);write(root/'lantern/acceptance.json',receipt)
          release=json.loads((root/'release.json').read_text());release.update(acceptance='All 208 model tests and nine browser suites passed; live publication pending.',testedCommit=tested,acceptanceRun=receipt['acceptanceRun'],evidence='production/evidence/lantern-0.12.0/candidate.json')
          release['validation'].update(unitTestsPassed=208,browserSuitesPassed=9,browserChecksPassed=receipt['browserChecksPassed']);write(root/'release.json',release)
          roadmap=json.loads((root/'production/roadmap.json').read_text())
          for item in roadmap['items']:
              if item['id'] in ('LEVEL-01','XR-02','LEGACY-01'):
                  item['status']='verified' if item['id']=='LEGACY-01' else 'needs-playtest'
                  item['evidence'].append('evidence/lantern-0.12.0/candidate.json')
                  item['next']='Publish and verify the exact candidate; then obtain physical device and unfamiliar-player/replay sign-off. Do not expand the map before reviewing spatial understanding.' if item['id']!='LEGACY-01' else 'Keep the 102 frozen legacy file hashes and all five retained browser suites passing in future upgrades.'
          write(root/'production/roadmap.json',roadmap);subprocess.run(['python','svgn-planet/production/render-roadmap.py'],check=True)
          (root/'DEVELOPMENT-HANDOFF.md').write_text('# Lantern Ward / v0.12.0\n\nThe authored chapter and native spatial XR are implemented and accepted by 208 model tests and nine browser suites on '+tested+'. Acceptance: '+receipt['acceptanceRun']+'. Raw reports: production/evidence/lantern-0.12.0/. Publication is pending at this checkpoint; read published.json there when available.\n\nRead lantern/README.md and design/PLACE-MASTERY-REBUILD.md. The new opening is a compact authored graybox with real market, roof and canal approaches, a permanent blue-door shortcut, reversible sluice, open-shaft goods hoist and approach-independent reward. Do not claim this replaces the entire old world or that automated completion proves enjoyable level design.\n\nNative first-person VR and diorama VR/AR render actual geometry separately for each eye. The top/front/both enum never closes both apertures. Controller gameplay hides the action panel; hand-only controls use a small side panel. Manual stand positioning is implemented, not room-scanned anchoring. Physical Quest 3/Touch Plus/hand tracking, comfort and performance remain untested.\n\nThe old neighborhood is retained at legacy.html with its original layout and all 102 frozen file hashes in legacy-layout.json. It retains Homecoming, Tidewater, original rewards, saves and flat XR theater. New chapter progress has its own key and layout; no old planet coordinates or credits are silently migrated.\n\nNext: publish the accepted source and verify public bytes plus live street/hoist and native XR tours. Then gather first-visit/replay comprehension feedback, measure named physical devices, refine camera/character intersections and replace the graybox art deliberately. Broader chapter replacement and richer conversations/audio remain open. Performance work supports this authored place rather than another unstructured map expansion.\n\nRun node --test svgn-planet/tests/*.test.mjs svgn-planet/design/chapter-contract.test.mjs svgn-planet/lantern/*.test.mjs and the nine suites in neighborhood-lantern.yml. Preserve direct actions, backup/confirmation behavior and sibling games. Merge normally, never force-push shared master. Regenerate AAA_ROADMAP.md with production/render-roadmap.py after changing its canonical JSON.\n')
          paths=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines();assert all(p.startswith('svgn-planet/') and p.endswith(('.md','.json')) for p in paths),paths
          PY
          node --test svgn-planet/tests/*.test.mjs svgn-planet/design/chapter-contract.test.mjs svgn-planet/lantern/*.test.mjs > records-model.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add svgn-planet
          git commit -m 'docs(neighborhood): retain exact accepted Lantern Ward source, raw reports and human gates'
          git push origin HEAD:neighborhood-missions/lantern-ward-playable-20260915
          git rev-parse HEAD > RECORD-COMMIT.txt
          tar -czf lantern-candidate-records.tar.gz svgn-planet/production/evidence/lantern-0.12.0 svgn-planet/lantern/acceptance.json svgn-planet/release.json svgn-planet/DEVELOPMENT-HANDOFF.md svgn-planet/production/roadmap.json svgn-planet/AAA_ROADMAP.md RECORD-COMMIT.txt records-model.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lantern-candidate-records
          path: |
            lantern-candidate-records.tar.gz
            records-model.txt
          retention-days: 30
