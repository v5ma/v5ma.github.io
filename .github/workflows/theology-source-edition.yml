name: Validate Theology source edition
on:
  push:
    branches: [feat/theology-source-edition-20260904, master]
    paths: ["theology-wiki/**", "scripts/prepare-interactive-site.py", ".github/workflows/theology-source-edition.yml"]
  pull_request:
    paths: ["theology-wiki/**", "scripts/prepare-interactive-site.py", ".github/workflows/theology-source-edition.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: theology-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deterministic build and original source integrity
        env:
          REVIEW_SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git cat-file -e "$REVIEW_SOURCE_REF^{commit}" || git fetch origin "$REVIEW_SOURCE_REF" --depth=1
          node theology-wiki/tools/build.cjs
          node theology-wiki/gospel-synthesis-20261011/publication.cjs "$REVIEW_SOURCE_REF"
          node theology-wiki/gospel-comparison-20261011/publication.cjs "$REVIEW_SOURCE_REF"
          node theology-wiki/tools/publication.cjs --amend "$REVIEW_SOURCE_REF" jesus-teacher-of-righteousness-hypothesis
          node --check theology-wiki/assets/js/research-tools.js
          node --check theology-wiki/assets/js/theology-reader.js
          node --test theology-wiki/tests/research.test.cjs
          node --test theology-wiki/tests/teacher-depth.test.cjs theology-wiki/tests/teacher-preservation.test.cjs theology-wiki/tests/publication-amendment.test.cjs theology-wiki/gospel-comparison-20261011/publication.test.cjs theology-wiki/gospel-synthesis-20261011/publication.test.cjs
          git diff --stat -- theology-wiki scripts/prepare-interactive-site.py
          git diff --quiet -- theology-wiki scripts/prepare-interactive-site.py
      - name: Report bounded generated text differences for review
        if: always() && github.event_name == 'pull_request'
        run: |
          node <<'JS'
          const fs=require('node:fs'),cp=require('node:child_process'),crypto=require('node:crypto'),zlib=require('node:zlib');
          const tracked=cp.execFileSync('git',['diff','--name-only','--','theology-wiki'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const added=cp.execFileSync('git',['ls-files','--others','--exclude-standard','--','theology-wiki'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const paths=[...new Set([...tracked,...added])].sort();
          const files=[];let bytes=0;
          for(const path of paths){
            if(!/^theology-wiki\/[a-zA-Z0-9_./-]+\.(?:json|md|txt|html|js|css|csv|cjs)$/.test(path)||!fs.existsSync(path)){console.log('Not exported:',path);continue;}
            const data=fs.readFileSync(path);bytes+=data.length;
            if(data.length>12*1024*1024||bytes>32*1024*1024)throw Error('Review output exceeds bounded text limit');
            files.push({path,sha256:crypto.createHash('sha256').update(data).digest('hex'),content:data.toString('utf8')});
          }
          const payload=Buffer.from(JSON.stringify({head:process.env.GITHUB_SHA,files}));
          const compressed=zlib.gzipSync(payload);if(compressed.length>4*1024*1024)throw Error('Compressed review output exceeds limit');
          const encoded=compressed.toString('base64');
          console.log('THEOLOGY_REVIEW_DELTA_BEGIN '+crypto.createHash('sha256').update(compressed).digest('hex'));
          for(let i=0;i<encoded.length;i+=8192)console.log('THEOLOGY_REVIEW_DELTA '+encoded.slice(i,i+8192));
          console.log('THEOLOGY_REVIEW_DELTA_END');
          console.log(JSON.stringify({generatedTextFiles:files.length,uncompressedBytes:payload.length,compressedBytes:compressed.length,paths:files.map(f=>f.path)}));
          JS
      - name: Install browser and image tooling
        run: |
          python -m pip install --quiet playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium > /tmp/theology-browser-install.log 2>&1 || { tail -100 /tmp/theology-browser-install.log; exit 1; }
      - name: Verify bundled public-domain museum images
        run: python theology-wiki/tools/media.py
      - name: Test native HTTP reader and source conversations
        run: |
          python -m http.server 4174 --bind 127.0.0.1 > /tmp/theology-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python theology-wiki/gospel-synthesis-20261011/browser.py
          python theology-wiki/gospel-comparison-20261011/browser.py
          python theology-wiki/tests/teacher_publication_checks.py
          python theology-wiki/tests/browser.py
      - name: Verify actual hosted content after master publication
        if: github.ref == 'refs/heads/master'
        run: |
          cp -r theology-test-output /tmp/theology-native-proof
          trap 'cp -r /tmp/theology-native-proof theology-test-output/native' EXIT
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,time,urllib.request
          files=['theology-wiki/san-reader.html','theology-wiki/assets/js/research-tools.js','theology-wiki/assets/js/theology-reader.js','theology-wiki/data/build-report.json']
          slug='jesus-teacher-of-righteousness-hypothesis'
          files += [f'theology-wiki/content/developed/{slug}.md',f'theology-wiki/public-corpus/pages/{slug}.md',f'theology-wiki/data/listening/{slug}.json','theology-wiki/data/page-index.json']
          expected={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files}
          observed={}
          for attempt in range(36):
            for p in files:
              url='https://v5ma.github.io/'+p+'?review='+os.environ['GITHUB_SHA']
              try:
                with urllib.request.urlopen(url,timeout=15) as response:
                  digest=hashlib.sha256(response.read()).hexdigest()
                  observed[p]={'url':url,'status':response.status,'sha256':digest,'matches_commit':digest==expected[p]}
              except Exception as error:
                observed[p]={'url':url,'error':str(error),'matches_commit':False}
            if all(item['matches_commit'] for item in observed.values()):break
            time.sleep(5)
          Path('theology-test-output/hosted-content.json').write_text(json.dumps(observed,indent=2))
          assert all(item['matches_commit'] for item in observed.values()),observed
          print('Hosted reader HTML, scripts and build report match the published commit.')
          PY
          SITE_ORIGIN=https://v5ma.github.io python theology-wiki/tests/teacher_publication_checks.py
          SITE_ORIGIN=https://v5ma.github.io python theology-wiki/tests/browser.py
      - name: Record source identity and review files
        if: always()
        run: |
          mkdir -p theology-test-output
          git rev-parse HEAD > theology-test-output/tested-commit.txt
          git diff --stat > theology-test-output/uncommitted-diff.txt
          cp /tmp/theology-http.log theology-test-output/ 2>/dev/null || true
          python - <<'PY'
          from pathlib import Path
          import zipfile
          out=Path('theology-test-output')
          with zipfile.ZipFile(out/'reader-review.zip','w',zipfile.ZIP_DEFLATED) as z:
            for f in Path('theology-wiki').rglob('*'):
              if f.is_file() and '__pycache__' not in f.parts and f.suffix.lower() not in {'.ttf','.otf','.woff','.woff2'}:z.write(f,f.as_posix())
            z.write('scripts/prepare-interactive-site.py')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theology-verification
          path: theology-test-output/
          retention-days: 14

  verify-hosted-gospel:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the native Gospel reader browser
        run: |
          python -m pip install --quiet playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Wait for this exact Gospel edition on GitHub Pages
        run: |
          python - <<'PYCODE'
          import hashlib,json,os,time,urllib.request
          from pathlib import Path
          revision=os.environ['GITHUB_SHA']
          slug='living-jesus-thomas-john-and-synoptics'
          paths=[f'theology-wiki/content/developed/{slug}.md',f'theology-wiki/public-corpus/pages/{slug}.md',f'theology-wiki/data/listening/{slug}.json',f'theology-wiki/products/transcripts/{slug}.txt','theology-wiki/data/page-index.json','theology-wiki/data/listening-library.json','theology-wiki/data/search.json']
          expected={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}
          out=Path('theology-test-output');out.mkdir(exist_ok=True)
          deadline=time.monotonic()+600
          report={'commit':revision,'origin':'https://v5ma.github.io','passed':False,'attempts':0,'matchedFiles':[]}
          try:
              while time.monotonic()<deadline:
                  report['attempts']+=1;matched=[]
                  try:
                      for p in paths:
                          remaining=deadline-time.monotonic()
                          if remaining<=0:raise TimeoutError('Exact deployment verification deadline reached')
                          url=report['origin']+'/'+p+'?gospel-revision='+revision
                          with urllib.request.urlopen(url,timeout=min(15,remaining)) as response:data=response.read()
                          actual=hashlib.sha256(data).hexdigest()
                          if actual!=expected[p]:raise AssertionError('Hosted bytes differ: '+p)
                          matched.append({'path':p,'sha256':actual})
                      report['matchedFiles']=matched;report['passed']=True;break
                  except Exception as error:
                      report['lastError']=str(error)
                      time.sleep(min(10,max(0,deadline-time.monotonic())))
              if not report['passed']:raise AssertionError(report.get('lastError','GitHub Pages did not serve this edition within ten minutes'))
              print('Verified exact deployed Gospel article, backup, narration, transcript, page index, listening library and full search index')
          finally:
              (out/'gospel-hosted-bytes.json').write_text(json.dumps(report,indent=2)+'\n')
          PYCODE
      - name: Verify hosted Gospel search, listening, links, history and mobile
        env:
          SITE_ORIGIN: https://v5ma.github.io
        run: python theology-wiki/gospel-comparison-20261011/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theology-gospel-hosted-validation
          path: |
            theology-test-output/gospel-hosted-bytes.json
            theology-test-output/gospel-browser.json
            theology-test-output/gospel-desktop.png
            theology-test-output/gospel-mobile.png
          if-no-files-found: warn
          retention-days: 14

  verify-hosted-gospel-synthesis:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the native Gospel reader browser
        run: |
          python -m pip install --quiet playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Wait for this exact Gospel edition on GitHub Pages
        run: |
          python - <<'PYCODE'
          import hashlib,json,os,time,urllib.request
          from pathlib import Path
          revision=os.environ['GITHUB_SHA']
          slug='gnostic-canonical-gospels-telling-the-truth'
          paths=[f'theology-wiki/content/developed/{slug}.md',f'theology-wiki/public-corpus/pages/{slug}.md',f'theology-wiki/data/listening/{slug}.json',f'theology-wiki/products/transcripts/{slug}.txt','theology-wiki/data/page-index.json','theology-wiki/data/listening-library.json','theology-wiki/data/search.json']
          expected={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}
          out=Path('theology-test-output');out.mkdir(exist_ok=True)
          deadline=time.monotonic()+600
          report={'commit':revision,'origin':'https://v5ma.github.io','passed':False,'attempts':0,'matchedFiles':[]}
          try:
              while time.monotonic()<deadline:
                  report['attempts']+=1;matched=[]
                  try:
                      for p in paths:
                          remaining=deadline-time.monotonic()
                          if remaining<=0:raise TimeoutError('Exact deployment verification deadline reached')
                          url=report['origin']+'/'+p+'?gospel-revision='+revision
                          with urllib.request.urlopen(url,timeout=min(15,remaining)) as response:data=response.read()
                          actual=hashlib.sha256(data).hexdigest()
                          if actual!=expected[p]:raise AssertionError('Hosted bytes differ: '+p)
                          matched.append({'path':p,'sha256':actual})
                      report['matchedFiles']=matched;report['passed']=True;break
                  except Exception as error:
                      report['lastError']=str(error)
                      time.sleep(min(10,max(0,deadline-time.monotonic())))
              if not report['passed']:raise AssertionError(report.get('lastError','GitHub Pages did not serve this edition within ten minutes'))
              print('Verified exact deployed Gospel article, backup, narration, transcript, page index, listening library and full search index')
          finally:
              (out/'gospel-synthesis-hosted-bytes.json').write_text(json.dumps(report,indent=2)+'\n')
          PYCODE
      - name: Verify hosted Gospel search, listening, links, history and mobile
        env:
          SITE_ORIGIN: https://v5ma.github.io
        run: python theology-wiki/gospel-synthesis-20261011/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theology-gospel-synthesis-hosted-validation
          path: |
            theology-test-output/gospel-synthesis-hosted-bytes.json
            theology-test-output/gospel-synthesis-browser.json
            theology-test-output/gospel-synthesis-desktop.png
            theology-test-output/gospel-synthesis-mobile.png
          if-no-files-found: warn
          retention-days: 14
