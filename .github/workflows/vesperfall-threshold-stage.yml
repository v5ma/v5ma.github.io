name: Vesperfall Threshold candidate
on:
  push:
    branches: [vesperfall-threshold-20260921]
    paths: ['.github/workflows/vesperfall-threshold-stage.yml']
permissions:
  contents: write
concurrency:
  group: vesperfall-threshold-candidate
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate recovered source and check original model and workbook gates
        run: |
          set -euo pipefail
          mkdir -p test-output
          if ! grep -Fq "if not page.evaluate('Vesperfall.component.xr'):return" vesperfall/tests/threshold-browser.py; then
            python .github/threshold-prepare.py
          fi
          for f in vesperfall/*.js; do node --check "$f"; done
          node --test vesperfall/tests/*.test.cjs | tee test-output/model.tap
          python vesperfall/tests/production-workbook.py | tee test-output/workbook.log
          python scripts/check-vesperfall.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vesperfall
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate reconciled Threshold walking round trip, stable desk and tracking recovery'
            git push origin HEAD:vesperfall-threshold-20260921
          fi
          git rev-parse HEAD > test-output/source-revision.txt
      - name: Install browser and serve the actual game
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/threshold-server.log 2>&1 &
      - name: VR doorway, desk, hands, room-scale return and actual session exit
        env:
          XR_MODE: vr
        run: |
          set -euo pipefail
          timeout 900 python -u vesperfall/tests/threshold-browser.py | tee test-output/threshold-vr.log
          test -s test-output/threshold-vr/report.json
          test ! -e test-output/threshold-vr/failure.json
      - name: AR doorway, desk, hands and actual session exit
        env:
          XR_MODE: ar
        run: |
          set -euo pipefail
          timeout 900 python -u vesperfall/tests/threshold-browser.py | tee test-output/threshold-ar.log
          test -s test-output/threshold-ar/report.json
          test ! -e test-output/threshold-ar/failure.json
      - name: Retain golden-arrow and crossbow gameplay
        run: |
          set -euo pipefail
          timeout 900 python -u vesperfall/tests/goldwind-browser.py | tee test-output/goldwind.log
          test -s test-output/goldwind/report.json
      - name: Retain complete in-headset chapter progression
        run: |
          set -euo pipefail
          timeout 900 python -u vesperfall/tests/wayfinder-browser.py | tee test-output/wayfinder.log
          test -s test-output/wayfinder-vr/report.json
      - name: Retain exact source and unsuccessful traces
        if: always()
        run: |
          mkdir -p test-output
          git rev-parse HEAD > test-output/source-revision.txt
          git diff --stat > test-output/uncommitted-diff.txt
          cp /tmp/threshold-server.log test-output/server.log 2>/dev/null || true
          tar -czf test-output/vesperfall-source.tgz vesperfall scripts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: threshold-reviewed-candidate
          path: test-output/
          retention-days: 14
