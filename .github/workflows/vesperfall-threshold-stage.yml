name: Vesperfall Threshold candidate
on:
  push:
    branches: [vesperfall-threshold-20260921]
    paths: ['.github/workflows/vesperfall-threshold-stage.yml']
permissions:
  contents: write
concurrency:
  group: vesperfall-threshold-candidate
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate exact source and preserve all original model/workbook gates
        run: |
          set -euo pipefail
          mkdir -p test-output
          python .github/threshold-prepare.py
          for f in vesperfall/*.js; do node --check "$f"; done
          node --test vesperfall/tests/*.test.cjs | tee test-output/model.tap
          python vesperfall/tests/production-workbook.py | tee test-output/workbook.log
          python scripts/check-vesperfall.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vesperfall
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate reviewed Threshold desk, intentional crossings and exact expedition restoration'
            git push origin HEAD:vesperfall-threshold-20260921
          fi
      - name: Install production WebGL browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/threshold-server.log 2>&1 &
      - name: Complete VR walking and hand-menu round trip
        env:
          XR_MODE: vr
        run: timeout 900 python -u vesperfall/tests/threshold-browser.py | tee test-output/threshold-vr.log
      - name: Complete AR walking and hand-menu round trip
        env:
          XR_MODE: ar
        run: timeout 900 python -u vesperfall/tests/threshold-browser.py | tee test-output/threshold-ar.log
      - name: Preserve actual golden-arrow and crossbow input
        run: timeout 900 python -u vesperfall/tests/goldwind-browser.py | tee test-output/goldwind.log
      - name: Preserve complete in-headset chapter progression
        run: timeout 900 python -u vesperfall/tests/wayfinder-browser.py | tee test-output/wayfinder.log
      - name: Require complete reports, not only a zero shell pipeline status
        run: |
          test -s test-output/threshold-vr/report.json
          test -s test-output/threshold-ar/report.json
          test -s test-output/goldwind/report.json
          test -s test-output/wayfinder-vr/report.json
          test ! -e test-output/threshold-vr/failure.json
          test ! -e test-output/threshold-ar/failure.json
      - name: Retain tested source and unsuccessful traces
        if: always()
        run: |
          mkdir -p test-output
          git rev-parse HEAD > test-output/source-revision.txt
          git diff --stat > test-output/uncommitted-diff.txt
          cp /tmp/threshold-server.log test-output/server.log 2>/dev/null || true
          tar -czf test-output/vesperfall-source.tgz vesperfall scripts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: threshold-reviewed-candidate
          path: test-output/
          retention-days: 14
