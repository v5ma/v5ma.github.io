name: Apply Sky Cycle spatial lifecycle correction
on:
  push:
    branches: ['sky-cycle/spatial-workspace-0.26']
    paths: ['.github/workflows/sky-cycle-spatial-followup.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply scoped lifecycle patch
        env:
          PATCH: ''
        run: |
          python3 - <<'PY'
          import os,base64,lzma,hashlib
          from pathlib import Path
          patch=lzma.decompress(base64.b64decode(os.environ['PATCH'],validate=True))
          assert hashlib.sha256(patch).hexdigest()=='9b35b957f2ca9c9edbc70132a357239ad21202481d84a3f4cb6a5e816f560436'
          for line in patch.decode().splitlines():
            if line.startswith('diff --git '):
              for path in line.split()[2:]:
                assert path[2:].startswith('mario-maker-clone/svgn-paper-route/'),path
          Path('/tmp/followup.patch').write_bytes(patch)
          PY
          git apply --check /tmp/followup.patch
          git apply --index /tmp/followup.patch
          git rm .github/workflows/sky-cycle-spatial-followup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(sky-cycle): retain XRManager wrapper and unify native menu activation'
          git push origin HEAD:refs/heads/sky-cycle/spatial-workspace-0.26
