name: Rainward Freight Cut place mastery
on:
  pull_request:
    paths: ['rainward/**','.github/workflows/rainward-freight.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rainward-freight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        mode: [journey,vr-controllers,vr-hands,ar-controllers,ar-hands]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact-source model, save and contract checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-output
          node --test rainward/tests/*.test.mjs | tee test-output/node-models.txt
          node rainward/tests/freight-recovery-preflight.mjs > test-output/freight-recovery-preflight.json
          python -m compileall -q rainward/tests
          python rainward/tools/build-production-plan.py
          git diff --exit-code -- rainward/AAA_CHECKLIST.md
      - name: Install native HTTP WebGL browser
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Real game with virtual Xbox or explicitly simulated XR inputs
        env:
          CASE: ${{ matrix.mode }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/rainward-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          if [ "$CASE" = journey ]; then
            timeout 1080 python -u rainward/tests/freight-cut-browser.py
          else
            TEST_CHAPTER=district XR_VIEW="diorama-${CASE%-*}" QUEST_KIND="${CASE#*-}" timeout 1080 python -u rainward/tests/diorama-browser.py
          fi
      - name: Preserve actual checkout and all failures
        if: always()
        run: |
          mkdir -p test-output
          python rainward/tests/release.py
          git rev-parse HEAD > test-output/tested-commit.txt
          git diff > test-output/uncommitted.diff
          tar -czf test-output/rainward-source.tgz rainward index.html projects.css
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainward-freight-${{ matrix.mode }}
          path: test-output/
          retention-days: 14
