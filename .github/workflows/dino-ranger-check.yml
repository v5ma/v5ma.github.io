name: Dino Atlas ranger verification
on:
  push:
    branches: [master, dino-atlas-ranger-20260911]
    paths: ['dino-atlas/**', '.github/workflows/dino-ranger-check.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dino-ranger-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            dino-atlas
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vendor pinned Rapier once on the development branch
        if: github.ref == 'refs/heads/dino-atlas-ranger-20260911'
        shell: bash
        run: |
          if [ ! -f dino-atlas/vendor/rapier.mjs ]; then
            mkdir -p /tmp/dino-rapier
            cd /tmp/dino-rapier
            npm pack @dimforge/rapier3d-compat@0.17.3
            tar -xzf dimforge-rapier3d-compat-0.17.3.tgz
            test -f package/rapier.mjs
            cp package/rapier.mjs "$GITHUB_WORKSPACE/dino-atlas/vendor/rapier.mjs"
            cp package/LICENSE "$GITHUB_WORKSPACE/dino-atlas/vendor/RAPIER-LICENSE"
            cd "$GITHUB_WORKSPACE"
            git add dino-atlas/vendor/rapier.mjs dino-atlas/vendor/RAPIER-LICENSE
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Vendor Rapier 0.17.3 and preserve its Apache license for Dino Atlas'
            git push origin HEAD:dino-atlas-ranger-20260911
          fi
      - name: Run data and physics tests
        run: |
          npm test --prefix dino-atlas
          if [ -f dino-atlas/tests/ranger.test.mjs ]; then node --test dino-atlas/tests/ranger.test.mjs; fi
      - name: Install browser test runner
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Run rendered browser checks
        run: |
          if [ -f dino-atlas/tests/ranger-browser.py ]; then python dino-atlas/tests/ranger-browser.py; fi
      - name: Save scoped source and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dino-atlas-ranger-evidence
          path: |
            dino-atlas/
            ranger-evidence/
          retention-days: 14
