name: Dino Atlas ranger verification
on:
  push:
    branches: [master, dino-atlas-ranger-20260911]
    paths: ['dino-atlas/**', '.github/workflows/dino-ranger-check.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dino-ranger-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            dino-atlas
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the scoped ranger source transfer on the development branch
        if: github.ref == 'refs/heads/dino-atlas-ranger-20260911'
        shell: bash
        run: |
          if [ -f dino-atlas/ranger-update.py ]; then
            python dino-atlas/ranger-update.py
            git add -A -- dino-atlas
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Build Dino Atlas Wild Frontier: physics jeep, dinosaur reserve, campaign, preserved journal, and tests'
            git push origin HEAD:dino-atlas-ranger-20260911
          fi
      - name: Run data and physics tests
        run: |
          npm test --prefix dino-atlas
          if [ -f dino-atlas/tests/ranger.test.mjs ]; then node --test dino-atlas/tests/ranger.test.mjs; fi
      - name: Install browser test runner
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Run rendered browser checks
        run: |
          if [ -f dino-atlas/tests/ranger-browser.py ]; then python dino-atlas/tests/ranger-browser.py; fi
      - name: Save scoped source and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dino-atlas-ranger-evidence
          path: |
            dino-atlas/
            ranger-evidence/
          retention-days: 14
