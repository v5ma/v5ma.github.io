name: Dino Atlas ranger verification
on:
  push:
    branches: [master, dino-atlas-ranger-expansion-xbox-20260911]
    paths: ['dino-atlas/**', '.github/workflows/dino-ranger-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dino-ranger-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            dino-atlas
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify preserved walking expedition and syntax
        run: |
          echo 'f5be436b64e0c19674a496baf40d775460ea887dcbcc9bb0cf01bdb9903effd6  dino-atlas/walking.html' | sha256sum --check
          for source in dino-atlas/ranger*.js dino-atlas/frontier*.js; do node --check "$source"; done
      - name: Verify local server module MIME type
        shell: bash
        run: |
          PORT=4318 node dino-atlas/server.mjs &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          curl --fail --head --retry 12 --retry-connrefused --retry-delay 1 http://127.0.0.1:4318/vendor/rapier.mjs > /tmp/dino-headers
          grep -i 'Content-Type: text/javascript' /tmp/dino-headers
      - name: Run original data and all vehicle, tools, controller and audio tests
        run: node --test dino-atlas/tests/unit.test.mjs dino-atlas/tests/ranger.test.mjs dino-atlas/tests/frontier.test.mjs
      - name: Install browser test runner
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Adapt acceptance harness to slow software-rendered CI
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements={
            "button(i,1);page.wait_for_timeout(200);button(i,0);page.wait_for_timeout(250)":"button(i,1);page.evaluate('()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)))');button(i,0);page.wait_for_timeout(250)",
            "button(i,1);page.wait_for_timeout(170);button(i,0);page.wait_for_timeout(210)":"button(i,1);page.evaluate('()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)))');button(i,0);page.wait_for_timeout(250)"
          }
          low="localStorage.setItem('dino-atlas.frontier.v2',JSON.stringify({version:2,settings:{low:true,reduced:true}}));"
          for name in ['frontier-browser.py','audio-controller-browser.py']:
              p=Path('dino-atlas/tests')/name
              s=p.read_text()
              for old,new in replacements.items(): s=s.replace(old,new)
              s=s.replace("PAD='''window.__pad", "PAD='''"+low+"window.__pad")
              p.write_text(s)
          PY
      - name: Run actual HTTP, WebGL and simulated Xbox acceptance checks
        run: python dino-atlas/tests/frontier-browser.py
      - name: Run focused audio mixer and controller-only modal checks
        run: python dino-atlas/tests/audio-controller-browser.py
      - name: Verify the published Ranger Operations game
        if: github.ref == 'refs/heads/master'
        run: python dino-atlas/tests/frontier-published.py
      - name: Record source identity
        if: always()
        run: |
          mkdir -p frontier-evidence
          git rev-parse HEAD > frontier-evidence/tested-commit.txt
      - name: Save source and rendered verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dino-atlas-ranger-operations-evidence
          path: |
            dino-atlas/
            frontier-evidence/
          retention-days: 14
