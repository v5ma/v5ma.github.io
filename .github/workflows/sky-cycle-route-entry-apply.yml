name: Apply Sky Cycle route entry checkpoint
on:
  push:
    branches: ['sky-cycle/route-entry-0.27']
    paths: ['.github/workflows/sky-cycle-route-entry-apply.yml']
permissions:
  contents: write
concurrency:
  group: sky-cycle-route-entry-integration
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sky-cycle/route-entry-0.27
      - name: Verify exact patch and owned paths
        run: |
          if [ ! -f .github/sky-route-entry.b64 ]; then
            echo 'Checkpoint already applied; leaving branch unchanged.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import base64,lzma,hashlib
          patch=lzma.decompress(base64.b64decode(Path('.github/sky-route-entry.b64').read_text().strip(),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='d6f79617e2b59e738acad20e60ddac489837b5e7996126479e3ecc92df16d9b9'
          for line in patch.decode().splitlines():
            if line.startswith('diff --git '):
              assert all(p[2:].startswith('mario-maker-clone/svgn-paper-route/') for p in line.split()[2:])
          Path('/tmp/route-entry.patch').write_bytes(patch)
          PY
          git apply --check /tmp/route-entry.patch
          git apply --index /tmp/route-entry.patch
          node --check mario-maker-clone/svgn-paper-route/xr-play.js
          node --check mario-maker-clone/svgn-paper-route/route-entry.js
          git rm .github/sky-route-entry.b64 .github/workflows/sky-cycle-route-entry-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(sky-cycle): explicit per-route AR VR and screen entry with recovery guards'
          git push origin HEAD:refs/heads/sky-cycle/route-entry-0.27
