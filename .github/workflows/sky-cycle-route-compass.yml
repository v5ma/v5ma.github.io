name: Sky Cycle Route Compass
on:
  push:
    branches: [master, 'sky-cycle-flight-deck-*']
    paths:
      - 'mario-maker-clone/svgn-paper-route/**'
      - '.github/workflows/sky-cycle-route-compass.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sky-cycle-route-compass-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact source and rule regression
        run: |
          git rev-parse HEAD
          node --check mario-maker-clone/svgn-paper-route/route-compass.js
          node --check mario-maker-clone/svgn-paper-route/release-status.js
          node --test mario-maker-clone/svgn-paper-route/tests/route-compass-core.test.mjs
          node --test mario-maker-clone/svgn-paper-route/tests/flight-deck-core.test.mjs
      - name: Install browser dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Isolated Compass fixture, not native gameplay evidence
        run: python mario-maker-clone/svgn-paper-route/tests/route-compass-browser.py --fixture
      - name: Native Compass controller and journal checks
        run: python mario-maker-clone/svgn-paper-route/tests/route-compass-browser.py
      # The unchanged Sky Cycle Flight Deck workflow runs its native 3D
      # controller regression on the same commit in parallel, not twice.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-cycle-compass-${{ github.sha }}
          path: /tmp/sky-cycle-compass/
          if-no-files-found: warn
  published:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare live runtime with exact committed source
        run: python mario-maker-clone/svgn-paper-route/tests/route-compass-published.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-cycle-compass-public-${{ github.sha }}
          path: /tmp/sky-cycle-compass/publication.json
