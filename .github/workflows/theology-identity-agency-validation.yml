name: Validate Theology identity agency and scarcity
on:
  pull_request:
    paths:
      - 'theology-wiki/research-expansion-20260918/**'
      - 'theology-wiki/editorial/authorial-articles/jesus-teacher-of-righteousness-hypothesis.md'
      - 'theology-wiki/editorial/authorial-articles/divine-will-and-self-authorizing-power.md'
      - 'theology-wiki/editorial/authorial-articles/ukraine-russia-forecast-record.md'
      - '.github/workflows/theology-identity-agency-validation.yml'
  push:
    branches: [master]
    paths:
      - 'theology-wiki/research-expansion-20260918/**'
      - 'theology-wiki/editorial/authorial-articles/jesus-teacher-of-righteousness-hypothesis.md'
      - 'theology-wiki/editorial/authorial-articles/divine-will-and-self-authorizing-power.md'
      - 'theology-wiki/editorial/authorial-articles/ukraine-russia-forecast-record.md'
      - '.github/workflows/theology-identity-agency-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify actual main integration, deterministic rebuild and preservation
        env:
          INTEGRATED: '1'
        run: |
          set -o pipefail
          mkdir -p theology-test-output/identity-agency
          node theology-wiki/research-expansion-20260918/build.cjs
          node theology-wiki/research-expansion-20260918/integrate.cjs
          node theology-wiki/tools/build.cjs
          node theology-wiki/research-expansion-20260918/reconcile.cjs
          git diff --exit-code -- theology-wiki/
          node --test theology-wiki/research-expansion-20260918/expansion.test.cjs | tee theology-test-output/identity-agency/contracts.log
      - name: Install browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Exercise actual notebook and three main reader routes
        run: python theology-wiki/research-expansion-20260918/browser_checks.py --report theology-test-output/identity-agency/browser.json --screenshot theology-test-output/identity-agency/mobile.png
      - name: Verify production bytes after publication
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: python theology-wiki/research-expansion-20260918/hosted_checks.py --report theology-test-output/identity-agency/hosted-content.json
      - name: Exercise the actual public notebook and three main articles
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: python theology-wiki/research-expansion-20260918/browser_checks.py --url https://v5ma.github.io/theology-wiki/research-expansion-20260918/index.html --report theology-test-output/identity-agency/hosted-browser.json --screenshot theology-test-output/identity-agency/hosted-mobile.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theology-identity-agency-validation
          path: |
            theology-test-output/identity-agency/
            theology-wiki/research-expansion-20260918/
          if-no-files-found: error
