name: Aether Clear Window acceptance
on:
  push:
    branches: [aether/clear-window-20260918]
    paths: ['aether-reach/**', '.github/workflows/aether-clear-window.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aether-clear-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: [render, window, portal]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            aether-reach
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Source, model, controls and save contract
        run: |
          set -euo pipefail
          mkdir -p aether-reach/test-output
          for f in aether-reach/*.mjs; do node --check "$f"; done
          node --test aether-reach/tests/*.test.mjs > aether-reach/test-output/clear-node.log
          python aether-reach/tests/backup_test.py
          node aether-reach/tests/release-manifest.mjs
          python aether-reach/tools/render-production-plan.py
          git diff --exit-code -- aether-reach/planning/AAA-ROADMAP.md
      - name: Install native browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Real application or isolated pixel fixture
        timeout-minutes: 30
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/aether-clear-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          case "$SUITE" in
            render) python -u aether-reach/tests/portal-render-browser.py ;;
            window) python -u aether-reach/tests/window-browser.py ;;
            portal) python -u aether-reach/tests/portal-browser.py ;;
            *) exit 1 ;;
          esac
      - name: Preserve exact tested revision and evidence
        if: always()
        run: |
          mkdir -p aether-reach/test-output
          git rev-parse HEAD > aether-reach/test-output/tested-commit.txt
          git diff --stat > aether-reach/test-output/uncommitted-diff.txt
          if [ '${{ matrix.suite }}' = render ]; then
            git archive --format=zip HEAD aether-reach index.html projects.css .github/workflows > aether-reach/test-output/clear-source.zip
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-clear-${{ matrix.suite }}
          path: aether-reach/test-output/
          retention-days: 30
