name: Sky Cycle public byte verification
on:
  push:
    branches: [master]
    paths: ['.github/workflows/sky-cycle-publish-check.yml']
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Exact reviewed source SHA whose Sky Cycle runtime must be public'
        required: true
        default: '3383257313b74255cb61402d4ca7e21c84fbca20'
        type: string
permissions:
  contents: read
jobs:
  published:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || '3383257313b74255cb61402d4ca7e21c84fbca20' }}
          persist-credentials: false
          sparse-checkout: mario-maker-clone/svgn-paper-route
      - name: Verify accepted runtime in the latest combined public deployment
        run: |
          git rev-parse HEAD
          python mario-maker-clone/svgn-paper-route/tests/portal-network-published.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-cycle-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/sky-cycle-portals-public.json
          retention-days: 30
          if-no-files-found: error
