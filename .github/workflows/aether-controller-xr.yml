name: Aether controller and WebXR adapter verification
on:
  push:
    branches: [feat/aether-controller-webxr-roadmap]
  pull_request:
    paths: ['aether-reach/**','.github/workflows/aether-controller-xr.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aether-devices-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  devices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [pad, xr, board]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pure input, model and public boundary checks
        run: |
          for f in aether-reach/*.mjs; do node --check "$f"; done
          node --test aether-reach/tests/*.test.mjs
          node aether-reach/tests/release-manifest.mjs
      - name: Install test browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Native application with explicit device API emulation
        env:
          DEVICE_SUITE: ${{ matrix.mode }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/aether-controls.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python -u aether-reach/tests/devices.py
      - if: always()
        name: Preserve exact source and diagnostic scope
        run: |
          mkdir -p aether-reach/test-output
          git rev-parse HEAD > aether-reach/test-output/tested-commit.txt
          git diff --stat > aether-reach/test-output/uncommitted-diff.txt
          tar --exclude='aether-reach/test-output' -czf aether-reach/test-output/public-source.tgz aether-reach index.html projects.css .github/workflows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-device-${{ matrix.mode }}
          path: aether-reach/test-output
          retention-days: 7
