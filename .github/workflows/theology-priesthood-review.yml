name: Review Theology priesthood and prophetic time
on:
  push:
    branches: [feat/theology-priesthood-time-20260906]
    paths: ['theology-wiki/**', '.github/workflows/theology-priesthood-review.yml']
permissions:
  contents: write
concurrency:
  group: theology-priesthood-${{ github.ref }}
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Materialize exact reviewed source and workbook parts
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,io,json,lzma,subprocess,zipfile
          root=Path('theology-wiki');parts=sorted(root.glob('priesthood-transfer-*.txt'))
          sha=lambda b:hashlib.sha256(b).hexdigest()
          if parts:
            assert len(parts)==4
            digest,payload=''.join(p.read_text().strip() for p in parts).split(':',1)
            assert digest=='b2091e2931f9e06d513acc77f45c17b6b4a9e43c286fd33e0364b4903d8113e8'
            packed=base64.b64decode(payload,validate=True);assert sha(packed)==digest
            decoded=lzma.decompress(packed);assert len(decoded)<300000
            pkg=json.loads(decoded);assert pkg['schema']=='theology-priesthood-transfer/v1'
            paths=set(pkg['finalHashes']);assert len(paths)==25 and set(pkg['baseHashes'])==paths
            for name in paths:
              assert name.startswith('theology-wiki/') and '..' not in Path(name).parts
              assert name=='theology-wiki/README.md' or name=='theology-wiki/planning/workbook-manifest.json' or name.startswith(('theology-wiki/editorial/','theology-wiki/tests/','theology-wiki/tools/'))
              p=Path(name);old=pkg['baseHashes'][name]
              if old:assert p.is_file() and sha(p.read_bytes())==old,name
              else:assert not p.exists(),name
            patch=Path('/tmp/theology-priesthood.patch');patch.write_text(pkg['patch'])
            changed={line.split('\t')[-1] for line in subprocess.check_output(['git','apply','--numstat',str(patch)],text=True).splitlines()}
            assert changed=={p for p in paths if pkg['baseHashes'][p]}
            subprocess.run(['git','apply','--check',str(patch)],check=True)
            subprocess.run(['git','apply',str(patch)],check=True)
            assert set(pkg['files'])==paths-changed
            for name,text in pkg['files'].items():
              p=Path(name);assert not p.exists();p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
            for name,expected in pkg['finalHashes'].items():assert sha(Path(name).read_bytes())==expected,name
            target=root/'planning/Theology-Research-Plan.xlsx';old=target.read_bytes();delta=pkg['workbook'];assert sha(old)==delta['baseSha256']
            out=io.BytesIO();names=set()
            with zipfile.ZipFile(io.BytesIO(old)) as a,zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as b:
              for row in delta['parts']:
                name=row['name'];assert not name.startswith('/') and '..' not in Path(name).parts and name not in names;names.add(name)
                prior=a.read(name) if name in a.namelist() else b'';assert sha(prior)==row['baseSha256']
                if row.get('copy'):data=prior
                else:
                  tokens=prior.decode().split('>');values=[]
                  for op in row['ops']:
                    if len(op)==2 and isinstance(op[0],int):
                      assert 0<=op[0]<=op[1]<=len(tokens);values.extend(tokens[op[0]:op[1]])
                    else:
                      assert all(isinstance(v,str) for v in op);values.extend(op)
                  data='>'.join(values).encode()
                assert sha(data)==row['sha256']
                info=zipfile.ZipInfo(name,(1980,1,1,0,0,0));info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=0o600<<16
                b.writestr(info,data,compress_type=zipfile.ZIP_DEFLATED,compresslevel=6)
            assert sha(out.getvalue())==delta['sha256']=='f4fe2fbabc3daf4dab70e3198d0b06c533830313fb0ec3d27dfd685cf9414cbe'
            target.write_bytes(out.getvalue())
            for p in parts:p.unlink()
            print('Verified all 25 source files and exact nine-sheet workbook transport.')
          PY
          if [ -f theology-wiki/tools/priesthood-review-fix.py ]; then python theology-wiki/tools/priesthood-review-fix.py; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test sources, historical arithmetic and archive integrity
        run: |
          set -o pipefail
          mkdir -p theology-test-output
          node theology-wiki/tools/build.cjs | tee theology-test-output/build-report.txt
          node --test theology-wiki/tests/research.test.cjs | tee theology-test-output/node-tests.txt
          git diff --exit-code -- theology-sources san-wiki-shell scripts theology-wiki/content/sources theology-wiki/products/media
      - name: Preserve generated edition on the isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- theology-wiki
          if ! git diff --cached --quiet; then git commit -m 'Develop Daniel chronology, Oniad institutional continuity and museum evidence'; git push origin HEAD:${GITHUB_REF_NAME}; fi
      - name: Install native browser and verify existing images
        run: |
          python -m pip install --quiet playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium >/tmp/theology-browser-install.log 2>&1 || { tail -100 /tmp/theology-browser-install.log; exit 1; }
          python theology-wiki/tools/media.py
      - name: Exercise actual HTTP reader and existing recordings
        run: |
          python -m http.server 4174 --bind 127.0.0.1 >/tmp/theology-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python theology-wiki/tests/browser.py
      - name: Preserve review source and evidence
        if: always()
        run: |
          mkdir -p theology-test-output
          git rev-parse HEAD >theology-test-output/tested-commit.txt
          git diff --stat >theology-test-output/uncommitted-diff.txt
          cp /tmp/theology-http.log theology-test-output/ 2>/dev/null || true
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('theology-test-output/review-source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in Path('theology-wiki').rglob('*'):
              if p.is_file() and '__pycache__' not in p.parts and p.suffix.lower() not in {'.ttf','.otf','.woff','.woff2'} and not p.name.startswith('priesthood-transfer-'):z.write(p,p.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theology-priesthood-review
          path: theology-test-output/
          retention-days: 14
