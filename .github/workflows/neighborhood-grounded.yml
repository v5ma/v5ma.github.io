name: Neighborhood grounded upgrade
on:
  push:
    branches: [neighborhood-missions/grounded-controls-20260914]
    paths:
      - 'svgn-planet/**'
      - '.github/workflows/neighborhood-grounded.yml'
  pull_request:
    paths:
      - 'svgn-planet/**'
      - '.github/workflows/neighborhood-grounded.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            svgn-planet
            tests
            scripts
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Archive exact source for reproducible local verification
        run: |
          git rev-parse HEAD > SOURCE-COMMIT.txt
          tar -czf neighborhood-source.tar.gz svgn-planet tests scripts .github/workflows SOURCE-COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: neighborhood-source
          path: neighborhood-source.tar.gz
          retention-days: 7
      - name: Model regressions
        run: node --test svgn-planet/tests/*.test.mjs
