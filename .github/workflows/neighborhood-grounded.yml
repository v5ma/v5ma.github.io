name: Neighborhood grounded upgrade
on:
  push:
    branches: [master, neighborhood-missions/grounded-controls-20260914]
    paths:
      - 'svgn-planet/**/*.mjs'
      - 'svgn-planet/**/*.js'
      - 'svgn-planet/**/*.py'
      - 'svgn-planet/*.html'
      - 'svgn-planet/*.css'
      - '.github/workflows/neighborhood-grounded.yml'
  pull_request:
    paths:
      - 'svgn-planet/**/*.mjs'
      - 'svgn-planet/**/*.js'
      - 'svgn-planet/**/*.py'
      - 'svgn-planet/*.html'
      - 'svgn-planet/*.css'
      - '.github/workflows/neighborhood-grounded.yml'
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            svgn-planet
            little-planet
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retain exact source
        run: |
          git rev-parse HEAD > SOURCE-COMMIT.txt
          tar -czf neighborhood-source.tar.gz svgn-planet little-planet index.html .github/workflows SOURCE-COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: neighborhood-source
          path: neighborhood-source.tar.gz
          retention-days: 14
      - name: Model and source checks
        run: |
          set -o pipefail
          node --test svgn-planet/tests/*.test.mjs | tee grounded-unit.txt
          for f in svgn-planet/*.mjs; do node --check "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grounded-model
          path: grounded-unit.txt
          retention-days: 30
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        script: [coastal_browser_release, homecoming_browser, atmosphere-browser, tidewater-browser, grounded-browser]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            svgn-planet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser harness
        run: |
          python -m pip install playwright==1.55.0 pillow
          python -m playwright install --with-deps chromium
      - name: Serve exact candidate and test real WebGL/input paths
        env:
          SCRIPT: ${{ matrix.script }}
        run: |
          python -m http.server 8765 > server.log 2>&1 &
          python "svgn-planet/tests/$SCRIPT.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grounded-${{ matrix.script }}
          path: |
            *-results/**
            server.log
          retention-days: 30
  gate:
    needs: [model, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Record exact tested commit
        env:
          TESTED_COMMIT: ${{ github.sha }}
        run: echo "Model and all five browser suites passed for $TESTED_COMMIT" >> "$GITHUB_STEP_SUMMARY"
