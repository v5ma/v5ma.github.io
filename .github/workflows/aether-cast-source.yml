name: Aether cast asset review
on:
  push:
    branches: [feat/aether-skyglass-cast-20260912]
    paths: ['.github/workflows/aether-cast-source.yml']
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retrieve selected public creator models and licenses, without executing content
        run: |
          python -m pip install gdown==5.2.0
          mkdir -p /tmp/cast-review
          python - <<'PY'
          import gdown,json,hashlib
          from pathlib import Path
          out=Path('/tmp/cast-review');report={}
          selected=[('courier.gltf','1uxAFnDp73NO1c16LvHHjAYh1-deMNk5I'),('guard.gltf','1VGmU5f8a43NBT22JWB507NDSLbmNxzF9'),('officer.gltf','1NhXHnGU0zK9hBrT5FoZp8nTz_EmvTPg5'),('men-license.txt','1TTvylHa1CsiJuHFWWiv6PFGhLM-aAH5z'),('women-license.txt','1lIFL16xEpoPbr0j_HUATgmcEnAmYoIK2')]
          for name,id in selected:
            path=out/name;gdown.download(id=id,output=str(path),quiet=False)
            data=path.read_bytes();r={'id':id,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)}
            if name.endswith('.gltf'):
              model=json.loads(data);r.update(animations=[a.get('name') for a in model.get('animations',[])],nodes=[n.get('name') for n in model.get('nodes',[])],buffers=[{'byteLength':b['byteLength'],'embedded':b.get('uri','').startswith('data:')} for b in model.get('buffers',[])],images=model.get('images',[]))
            else:r['license']=data.decode()
            report[name]=r
          (out/'selected-models.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-selected-character-models
          path: /tmp/cast-review
          retention-days: 14
