name: Integrate checksum-verified Vesperfall gallery
on:
  push:
    branches: [feat/vesperfall-quest-archery]
    paths: [.github/workflows/vesperfall-gallery-stage.yml, .gothic-incoming/**]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vesperfall-quest-archery
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact inputs and isolate the architecture update
        run: |
          python - <<'PY'
          from pathlib import Path,PurePosixPath
          import hashlib,lzma,json,subprocess
          raw=b''.join(Path(f'.gothic-incoming/part-{i}').read_bytes() for i in range(4))
          assert hashlib.sha256(raw).hexdigest()=='27e5d4a4e7fba96bd50937cd673d0e2cce3e607c5cc2a30bc26b696bd319a8f7'
          d=json.loads(lzma.decompress(raw));assert len(d['after'])==11
          for name,h in d['before'].items():
            q=PurePosixPath(name)
            assert not q.is_absolute() and '..' not in q.parts
            assert name.startswith('vesperfall/') or name in ['gloamward/index.html','scripts/check-vesperfall.py']
            p=Path(name)
            if h is None:assert not p.exists(),name
            else:assert hashlib.sha256(p.read_bytes()).hexdigest()==h,name
          patch=Path('/tmp/vesperfall-gallery.patch');patch.write_text(d['patch'])
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          for name,text in d['new'].items():
            assert name in d['after'] and name in d['before'] and d['before'][name] is None
            p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(text.encode('utf-8'))
          for name,h in d['after'].items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==h,name
          PY
          node --check vesperfall/app.js
          node --check vesperfall/gothic-art.js
          node --test vesperfall/tests/*.test.cjs
          python -m py_compile vesperfall/tests/browser.py
          python scripts/check-vesperfall.py
      - name: Commit only the verified application delta and remove transport
        run: |
          rm -rf .gothic-incoming
          git config user.name 'Vesperfall architecture integration'
          git config user.email 'vesperfall@users.noreply.github.com'
          git add vesperfall/README.md vesperfall/app.js vesperfall/core.js vesperfall/index.html vesperfall/release.json vesperfall/tests/browser.py vesperfall/architecture.js vesperfall/gothic-art.js vesperfall/tests/architecture.test.cjs gloamward/index.html scripts/check-vesperfall.py
          git add -u .gothic-incoming
          git commit -m 'Build playable gothic choir gallery, height-aware arrows, local stonework and stained glass'
          git push origin HEAD:feat/vesperfall-quest-archery
      - name: Preserve exact committed source receipt
        if: always()
        run: |
          mkdir -p output
          git rev-parse HEAD > output/source-sha.txt
          tar -czf output/source.tgz vesperfall gloamward index.html scripts/check-vesperfall.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vesperfall-gallery-source
          path: output/
          retention-days: 7
