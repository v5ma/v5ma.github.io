name: Aether World Portal acceptance
on:
  push:
    branches: [aether/world-portal-20260917]
    paths: ['aether-reach/**', '.github/workflows/aether-portal.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aether-portal-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [render, game]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            aether-reach
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Model, input, save and public contract
        run: |
          set -euo pipefail
          mkdir -p aether-reach/test-output
          node --test aether-reach/tests/*.test.mjs > aether-reach/test-output/portal-node.log
          python aether-reach/tests/backup_test.py
          node aether-reach/tests/release-manifest.mjs
          python aether-reach/tools/render-production-plan.py
          git diff --exit-code -- aether-reach/planning/AAA-ROADMAP.md
      - name: Install native browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: GPU aperture or ordinary-input full application
        timeout-minutes: 25
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/aether-portal-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          if [ "$SUITE" = render ]; then python -u aether-reach/tests/portal-render-browser.py; else python -u aether-reach/tests/portal-browser.py; fi
      - name: Exact tested source
        if: always()
        run: |
          mkdir -p aether-reach/test-output
          git rev-parse HEAD > aether-reach/test-output/tested-commit.txt
          git diff --stat > aether-reach/test-output/uncommitted-diff.txt
          if [ '${{ matrix.suite }}' = render ]; then git archive --format=zip HEAD aether-reach index.html projects.css .github/workflows > aether-reach/test-output/portal-source.zip; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-portal-${{ matrix.suite }}
          path: aether-reach/test-output/
          retention-days: 30
