name: Dino Atlas crew asset intake
on:
  push:
    branches: [dino-crew-canopy-20260912]
    paths: ['.github/workflows/dino-crew-assets.yml']
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            dino-atlas
      - name: Retrieve pinned Three.js conversion libraries
        run: |
          mkdir -p intake/vendor
          python - <<'PY'
          from urllib.request import urlopen
          from pathlib import Path
          base='https://raw.githubusercontent.com/mrdoob/three.js/r177/examples/jsm/'
          for path in ['loaders/GLTFLoader.js','utils/BufferGeometryUtils.js','utils/SkeletonUtils.js','loaders/FBXLoader.js','libs/fflate.module.js','curves/NURBSCurve.js','curves/NURBSUtils.js','exporters/GLTFExporter.js']:
              p=Path('intake/vendor')/path;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(urlopen(base+path,timeout=60).read())
          Path('intake/vendor/LICENSE').write_bytes(urlopen('https://raw.githubusercontent.com/mrdoob/three.js/r177/LICENSE',timeout=60).read())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dino-crew-asset-intake
          path: intake
          retention-days: 7
