name: Prism Current source audit
on:
  push:
    branches: [feat/prism-current-ar-rhythm]
    paths: [.github/workflows/prism-source-audit.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            vesperfall/vendor
          fetch-depth: 1
      - name: Package the public host and dependency only
        run: |
          mkdir -p audit
          git rev-parse HEAD > audit/source-sha.txt
          git ls-tree -r --name-only HEAD | grep -E '(^|/)AGENTS\.md$' > audit/agent-paths.txt || true
          while read -r p; do echo "--- $p"; git show "HEAD:$p"; done < audit/agent-paths.txt > audit/agent-instructions.txt
          tar czf audit/host.tgz index.html projects.css project-shortcuts.css vesperfall/vendor
      - uses: actions/upload-artifact@v4
        with:
          name: prism-host-audit
          path: audit/
          retention-days: 7
