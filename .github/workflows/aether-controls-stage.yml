name: Integrate the reviewed public controller adapter
on:
  push:
    branches: [feat/aether-controller-webxr-roadmap]
    paths: [.github/workflows/aether-controls-stage.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/aether-controller-webxr-roadmap'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check base and final hashes before changing any file
        run: |
          python aether-reach/tools/integrate-devices.py
          for f in aether-reach/*.mjs; do node --check "$f"; done
          node --test aether-reach/tests/model.test.mjs
      - name: Commit only the six verified runtime files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aether-reach/app.mjs aether-reach/model.mjs aether-reach/scene.mjs aether-reach/index.html aether-reach/style.css aether-reach/release.json
          git diff --cached --stat
          git commit -m 'Wire independent controller and WebXR adapters into the public runtime'
          git push origin HEAD:feat/aether-controller-webxr-roadmap
