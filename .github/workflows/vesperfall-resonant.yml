name: Vesperfall Resonant Hunt
on:
  push:
    branches: [master]
    paths: ['vesperfall/**', '.github/workflows/vesperfall-resonant.yml']
  pull_request:
    paths: ['vesperfall/**', '.github/workflows/vesperfall-resonant.yml']
permissions:
  contents: read
concurrency:
  group: vesperfall-resonant-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and all model regressions
        run: |
          set -euo pipefail
          mkdir -p test-output
          for f in vesperfall/*.js; do node --check "$f"; done
          node --test vesperfall/tests/*.test.cjs | tee test-output/resonant-model.tap
          python scripts/check-vesperfall.py
      - name: Install acceptance browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Render Web Audio and exercise physical interactions
        run: |
          set -euo pipefail
          python -m http.server 4173 > test-output/server.log 2>&1 &
          timeout 780 python -u vesperfall/tests/resonant-browser.py | tee test-output/resonant-browser.log
          test -s test-output/resonant/report.json
          test ! -e test-output/resonant/failure.json
      - name: Record tested source
        if: always()
        run: |
          mkdir -p test-output
          git rev-parse HEAD > test-output/source-revision.txt
          tar -czf test-output/vesperfall-tested-source.tgz vesperfall
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vesperfall-resonant-acceptance
          path: test-output/
          retention-days: 14
  publication:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Compare every public runtime file and asset with the merged commit
        run: python -u vesperfall/tests/verify-live.py
      - name: Install verification browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify real public audio and physical-interaction runtime
        env:
          TEST_BASE_URL: https://v5ma.github.io
        run: |
          set -euo pipefail
          timeout 780 python -u vesperfall/tests/resonant-browser.py | tee test-output/resonant-public-browser.log
          test -s test-output/resonant/report.json
          test ! -e test-output/resonant/failure.json
      - name: Open the actual public game card and play
        env:
          TEST_BASE_URL: https://v5ma.github.io
        run: timeout 240 python -u vesperfall/tests/launch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vesperfall-resonant-publication
          path: test-output/
          retention-days: 14
