name: Theology one-shot identity agency integration
on:
  push:
    branches: ['theology/identity-agency-scarcity-20260918']
    paths:
      - 'theology-wiki/research-expansion-20260918/**'
      - '.github/workflows/theology-identity-agency-integration.yml'
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'v5ma/v5ma.github.io' && github.ref == 'refs/heads/theology/identity-agency-scarcity-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: theology/identity-agency-scarcity-20260918
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate exact supplements and verify preserved source
        env:
          INTEGRATED: '1'
          REQUIRE_CORPUS: '1'
        run: |
          set -o pipefail
          mkdir -p theology-test-output/identity-agency
          node theology-wiki/research-expansion-20260918/build.cjs
          node theology-wiki/research-expansion-20260918/integrate.cjs
          node theology-wiki/tools/build.cjs | tee theology-test-output/identity-agency/build.log
          node theology-wiki/research-expansion-20260918/reconcile.cjs
          node --test theology-wiki/tests/research.test.cjs theology-wiki/scripture-concordance/concordance.test.cjs theology-wiki/research-expansion-20260918/expansion.test.cjs | tee theology-test-output/identity-agency/contracts.log
      - name: Commit only tested Theology output to the dedicated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add theology-wiki/
          if git diff --cached --name-only | grep -Ev '^theology-wiki/'; then exit 1; fi
          git diff --cached --quiet && exit 0
          git commit -m 'Integrate identity, divine agency and scarcity into main articles, search and listening text'
          git push origin HEAD:refs/heads/theology/identity-agency-scarcity-20260918
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theology-identity-agency-integration
          path: |
            theology-test-output/identity-agency/
            theology-wiki/research-expansion-20260918/
          if-no-files-found: error
