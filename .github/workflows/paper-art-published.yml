name: Verify published Paper Delivery artwork
on:
  push:
    branches: [master]
    paths: ['svgn-planet/**','.github/workflows/paper-art-published.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for this commit to finish Pages deployment
        env:
          DEPLOY_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYWAIT'
          import json,os,time,urllib.request,urllib.error
          commit=os.environ['GITHUB_SHA'];repo=os.environ['GITHUB_REPOSITORY']
          deadline=time.monotonic()+1200
          while time.monotonic()<deadline:
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/actions/runs?event=dynamic&head_sha='+commit+'&per_page=20',headers={'Authorization':'Bearer '+os.environ['DEPLOY_TOKEN'],'Accept':'application/vnd.github+json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:data=json.load(response)
              except (urllib.error.URLError,TimeoutError):
                  print('Deployment status temporarily unavailable',flush=True);time.sleep(10);continue
              candidates=[r for r in data['workflow_runs'] if r['head_sha']==commit and r['path']=='dynamic/pages/pages-build-deployment']
              if candidates:
                  run=max(candidates,key=lambda r:r['id'])
                  if run['status']=='completed':
                      assert run['conclusion']=='success','Pages did not deploy this commit: '+str(run['conclusion'])
                      print('Pages deployment succeeded:',run['id'],flush=True);break
                  print('Pages deployment:',run['status'],flush=True)
              else:print('Pages has not scheduled this commit yet',flush=True)
              time.sleep(10)
          else:raise SystemExit('No successful exact-commit Pages deployment within 20 minutes')
          PYWAIT
      - name: Match public meshes, images, source and homepage to the committed release
        run: |
          python - <<'PY'
          import pathlib,urllib.request,hashlib,json,subprocess,time,concurrent.futures
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          files=[p for p in pathlib.Path('svgn-planet').rglob('*') if p.is_file() and 'tests' not in p.parts and 'tools' not in p.parts and p.suffix in ['.html','.css','.mjs','.js','.json','.gltf','.bin','.png','.jpg','.webp','.txt']]+[pathlib.Path('index.html')]
          expected={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files};results={}
          def check(name):
              try:
                  with urllib.request.urlopen('https://v5ma.github.io/'+name+'?art='+source,timeout=20) as r:
                      h=hashlib.sha256(r.read()).hexdigest();return name,{'status':r.status,'sha256':h,'match':h==expected[name]}
              except Exception as e:return name,{'match':False,'error':str(e)}
          for attempt in range(50):
              pending=[name for name in expected if not results.get(name,{}).get('match')]
              with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:results.update(pool.map(check,pending))
              if len(results)==len(expected) and all(r['match'] for r in results.values()):break
              time.sleep(5)
          ok=len(results)==len(expected) and all(r['match'] for r in results.values())
          pathlib.Path('art-publication.json').write_text(json.dumps({'source':source,'files':results,'all_match':ok},indent=2));assert ok,results
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-art-publication
          path: art-publication.json
          retention-days: 14
