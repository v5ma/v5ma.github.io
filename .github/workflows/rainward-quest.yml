name: Rainward Quest immersive gameplay
on:
  pull_request:
    paths: ['rainward/**','.github/workflows/rainward-quest.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rainward-quest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        kind: [controllers,hands]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source and controller regression
        run: |
          mkdir -p test-output
          node --test rainward/tests/*.test.mjs | tee test-output/node-models.txt
          python -m compileall -q rainward/tests
      - name: Install native browser
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Real HTTP WebGL with explicit XR pose mock
        env:
          QUEST_KIND: ${{ matrix.kind }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/rainward-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          timeout 780 python -u rainward/tests/quest-browser.py
      - name: Retain exact source and failures
        if: always()
        run: |
          mkdir -p test-output
          python rainward/tests/release.py
          git rev-parse HEAD > test-output/tested-commit.txt
          git diff > test-output/uncommitted.diff
          tar -czf test-output/rainward-source.tgz rainward index.html projects.css
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainward-quest-${{ matrix.kind }}
          path: test-output/
          retention-days: 14
