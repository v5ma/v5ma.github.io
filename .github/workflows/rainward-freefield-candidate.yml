      group: rainward-spatial-refs/pull/183/merge
      cancel-in-progress: true
    steps: [{run: 'echo retire spatial PR queue'}]
  clear_water:
    runs-on: ubuntu-latest
    concurrency:
      group: rainward-clear-water-refs/pull/183/merge
      cancel-in-progress: true
    steps: [{run: 'echo retire clear-water PR queue'}]
  survival:
