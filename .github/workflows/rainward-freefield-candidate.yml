name: Rainward Freefield integrated review
on:
  push:
    branches: [feat/rainward-freefield-20260917]
    paths: ['rainward/**','.github/workflows/rainward-freefield-candidate.yml']
permissions:
  contents: write
concurrency:
  group: rainward-freefield-candidate
  cancel-in-progress: true
jobs:
  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rainward-freefield-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply scoped stage two before acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-output
          python rainward/tools/recover-freefield-stage2.py
          for f in rainward/*.mjs; do node --check "$f"; done
          node --test rainward/tests/*.test.mjs | tee test-output/node-tests.txt
          python -m compileall -q rainward/tests
      - name: Commit exact candidate before native tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rainward
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate Meridian relief, authored bodies, contact IK, goal guide and sight before native review'
            git push origin HEAD:feat/rainward-freefield-20260917
          fi
      - name: Install native HTTP WebGL browser
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Real rendered pixels, new-default XR and earned Meridian mission
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/rainward-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          RESULT=0
          timeout 120 python -u rainward/tests/freefield-graphics.py || RESULT=1
          for CASE in first-person:controllers first-person-ar:controllers diorama-vr:controllers diorama-ar:hands; do
            XR_VIEW="${CASE%:*}" QUEST_KIND="${CASE#*:}" timeout 480 python -u rainward/tests/freefield-browser.py || RESULT=1
          done
          timeout 700 python -u rainward/tests/freefield-meridian.py || RESULT=1
          exit "$RESULT"
      - name: Retain actual checkout, failures and images
        if: always()
        run: |
          mkdir -p test-output
          python rainward/tests/release.py
          git rev-parse HEAD > test-output/tested-commit.txt
          git diff > test-output/uncommitted.diff
          tar -czf test-output/rainward-source.tgz rainward index.html projects.css
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainward-freefield-integrated
          path: test-output/
          retention-days: 14
