name: Retire superseded Rainward pull-request queues
on:
  push:
    branches: [feat/rainward-freefield-20260917]
    paths: ['.github/workflows/rainward-freefield-candidate.yml']
permissions:
  contents: read
jobs:
  quest:
    runs-on: ubuntu-latest
    concurrency:
      group: rainward-quest-refs/pull/183/merge
      cancel-in-progress: true
    steps: [{run: 'echo retire quest PR queue'}]
  wayfinder:
    runs-on: ubuntu-latest
    concurrency:
      group: rainward-wayfinder-refs/pull/183/merge
      cancel-in-progress: true
    steps: [{run: 'echo retire wayfinder PR queue'}]
