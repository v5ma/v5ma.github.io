name: Rainward Freefield candidate
on:
  push:
    branches: [feat/rainward-freefield-20260917]
    paths: ['rainward/**','.github/workflows/rainward-freefield-candidate.yml']
permissions:
  contents: write
concurrency:
  group: rainward-freefield-candidate
  cancel-in-progress: true
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rainward-freefield-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover scoped source and pinned creator assets before acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-output
          python rainward/tools/recover-freefield.py
          python rainward/tools/recover-freefield-xr.py
          python rainward/tools/build-freefield-assets.py
          for f in rainward/*.mjs; do node --check "$f"; done
          node --test rainward/tests/*.test.mjs | tee test-output/node-tests.txt
          python -m compileall -q rainward/tests
      - name: Save exact integrated Rainward source before browser testing
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rainward
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate recovered Freefield source and pinned licensed weapons before native validation'
            git push origin HEAD:feat/rainward-freefield-20260917
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Retain assembly diagnostics and source when any check fails
        if: always()
        run: |
          mkdir -p test-output
          git rev-parse HEAD > test-output/tested-commit.txt
          git diff > test-output/uncommitted.diff
          tar -czf test-output/rainward-source.tgz rainward
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainward-freefield-models
          path: test-output/
          retention-days: 14
  native:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - view: first-person
            kind: controllers
          - view: first-person-ar
            kind: controllers
          - view: diorama-vr
            kind: controllers
          - view: diorama-ar
            kind: hands
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.assemble.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real HTTP WebGL browser
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Real new-default game with explicit mock XR input
        env:
          XR_VIEW: ${{ matrix.view }}
          QUEST_KIND: ${{ matrix.kind }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/rainward-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          timeout 840 python -u rainward/tests/freefield-browser.py
      - name: Preserve exact source and all failures
        if: always()
        run: |
          mkdir -p test-output
          python rainward/tests/release.py
          git rev-parse HEAD > test-output/tested-commit.txt
          git diff > test-output/uncommitted.diff
          tar -czf test-output/rainward-source.tgz rainward index.html projects.css
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainward-freefield-${{ matrix.view }}-${{ matrix.kind }}
          path: test-output/
          retention-days: 14
