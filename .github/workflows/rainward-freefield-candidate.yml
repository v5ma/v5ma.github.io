      cancel-in-progress: true
    steps: [{run: 'echo retire first-light PR queue'}]
  native:
    runs-on: ubuntu-latest
    concurrency:
      group: rainward-refs/pull/183/merge
      cancel-in-progress: true
    steps: [{run: 'echo retire native PR queue'}]
  freefield:
    runs-on: ubuntu-latest
    concurrency:
      group: rainward-freefield-refs/pull/183/merge
      cancel-in-progress: true
    steps: [{run: 'echo retire freefield PR queue'}]
  old_candidate:
    runs-on: ubuntu-latest
    concurrency:
      group: rainward-freefield-final-candidate
      cancel-in-progress: true
    steps: [{run: 'echo retire old candidate queue'}]
