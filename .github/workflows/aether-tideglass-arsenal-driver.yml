name: Harden Aether arsenal browser driver
on:
  push:
    branches: [feat/aether-tideglass-reservoir-20260912]
    paths: ['.github/workflows/aether-tideglass-arsenal-driver.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aether-tideglass-reservoir-20260912
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python aether-reach/tools/harden-arsenal-driver.py
      - run: |
          for f in aether-reach/*.mjs; do node --check "$f"; done
          node --test aether-reach/tests/*.test.mjs
          node aether-reach/tests/release-manifest.mjs
      - name: Commit tested driver fix and remove temporary patch files
        run: |
          rm .github/workflows/aether-tideglass-arsenal-driver.yml
          rm aether-reach/tools/harden-arsenal-driver.py
          git add -A -- aether-reach/tests/arsenal_browser.py aether-reach/tools/harden-arsenal-driver.py .github/workflows/aether-tideglass-arsenal-driver.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stabilize legacy sniper aim and post-transfer route checks'
          git push origin HEAD:feat/aether-tideglass-reservoir-20260912
