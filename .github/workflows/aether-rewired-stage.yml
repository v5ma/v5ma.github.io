name: Stage reviewed Bellwether Rewired
on:
  push:
    branches: [aether/bellwether-diorama-20260915]
    paths: ['aether-reach/tools/integrate-rewired-3.b64']
permissions:
  contents: read
jobs:
  stage:
    if: github.repository == 'v5ma/v5ma.github.io' && github.ref == 'refs/heads/aether/bellwether-diorama-20260915'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply only reviewed exact-base edits
        run: |
          mkdir -p /tmp/rewired-stage
          python - <<'PY'
          import base64,lzma,json,hashlib
          from pathlib import Path
          encoded=''.join(Path(f'aether-reach/tools/integrate-rewired-{i}.b64').read_text().strip() for i in range(4))
          raw=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='9993ee91b55bed18766e453dc59626b0e97d454858b56f11c48880ed86bae2c8'
          data=json.loads(raw)
          assert data['base']=='46a7e4c02b7114f0092709bed12a4d4d298965b4'
          for name,item in data['changes'].items():
            p=Path(name)
            assert name.startswith('aether-reach/') and not p.is_absolute() and '..' not in p.parts and not p.is_symlink()
            assert (hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None)==item['before'],name
            text=p.read_text() if p.exists() else ''
            for start,end,replacement in reversed(item['edits']):
              assert 0<=start<=end<=len(text),name
              text=text[:start]+replacement+text[end:]
            assert hashlib.sha256(text.encode()).hexdigest()==item['after'],name
            p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
          Path('/tmp/rewired-stage/edits.json').write_text(json.dumps(data))
          PY
          git diff --check
      - name: Validate model, save, route, input and presentation invariants
        run: |
          set -euo pipefail
          for f in aether-reach/*.mjs; do node --check "$f"; done
          python -m compileall -q aether-reach/tests
          node --test aether-reach/tests/*.test.mjs | tee /tmp/rewired-stage/node-tests.log
          python aether-reach/tests/backup_test.py
          node aether-reach/tests/release-manifest.mjs
      - name: Create content-only candidate without moving any ref
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          data=json.loads(Path('/tmp/rewired-stage/edits.json').read_text())
          def post(endpoint,payload):
            path=Path('/tmp/rewired-stage/request.json');path.write_text(json.dumps(payload))
            return json.loads(subprocess.check_output(['gh','api','--method','POST','repos/'+os.environ['GH_REPO']+'/'+endpoint,'--input',str(path)],text=True))
          names=list(data['changes'])
          tree=[{'path':n,'mode':'100644','type':'blob','content':Path(n).read_text()} for n in names]
          tree += [{'path':f'aether-reach/tools/integrate-rewired-{i}.b64','mode':'100644','type':'blob','sha':None} for i in range(4)]
          assert all(t['path'].startswith('aether-reach/') for t in tree)
          base_tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          t=post('git/trees',{'base_tree':base_tree,'tree':tree})
          c=post('git/commits',{'message':'feat(aether): Bellwether Rewired and playable third-person AR/VR diorama','tree':t['sha'],'parents':[os.environ['GITHUB_SHA']]})
          Path('/tmp/rewired-stage/candidate.json').write_text(json.dumps({'parent':os.environ['GITHUB_SHA'],'commit':c['sha'],'tree':t['sha'],'files':names,'scope':'Model/input/save and syntax checks passed. Native browser, physical hardware and publication are not established by this stage.'},indent=2))
          print('Created reviewed commit object without moving refs:',c['sha'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-rewired-candidate
          path: |
            /tmp/rewired-stage/candidate.json
            /tmp/rewired-stage/node-tests.log
          retention-days: 14
