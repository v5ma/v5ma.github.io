name: Integrate reviewed public living-city modules
on:
  push:
    branches: [feat/aether-living-city]
    paths: [.github/workflows/aether-city-stage.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/aether-living-city'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate every base and final source hash
        run: |
          python aether-reach/tools/integrate_city_source.py
          for f in aether-reach/*.mjs; do node --check "$f"; done
          node --test aether-reach/tests/*.test.mjs
      - name: Commit only the scoped public application changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aether-reach/model.mjs aether-reach/app.mjs aether-reach/scene.mjs aether-reach/controllers.mjs aether-reach/index.html aether-reach/tests/combat.test.mjs
          git diff --cached --stat
          git commit -m 'Integrate living-city rooms, citizens, missions and pilotable skiff into the existing map'
          git push origin HEAD:feat/aether-living-city
