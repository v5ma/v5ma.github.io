name: Unified Neighborhood integration
on:
  push:
    branches: [neighborhood-missions/night-watch-recovery-20260917]
    paths: ['.github/upgrades/unified-repairs.b64', '.github/workflows/neighborhood-unified-recovery.yml']
permissions:
  contents: read
jobs:
  source:
    if: github.ref == 'refs/heads/neighborhood-missions/night-watch-recovery-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            svgn-planet
            little-planet
            .github/upgrades
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scoped repairs against preimages and model acceptance
        id: source
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess,os
          sha=lambda b:hashlib.sha256(b).hexdigest()
          # Repair one identified transport duplication; exact decoded SHA is authoritative.
          text=pathlib.Path('.github/upgrades/unified-repairs.b64').read_text().strip().replace('V88F88oY','V88oY')
          raw=lzma.decompress(base64.b64decode(text,validate=True))
          assert sha(raw)=='a0008f5d21082bfbc36f1cec60ae98e48bc3d153fc188f5db35099b22546e5f0'
          rows=json.loads(raw);assert len(rows)==8;ready={}
          for row in rows:
              p=pathlib.Path(row['path']);assert p.as_posix().startswith('svgn-planet/') and '..' not in p.parts
              if p.exists() and sha(p.read_bytes())==row['sha256']:continue
              assert (sha(p.read_bytes()) if p.exists() else None)==row['old'],'Changed preimage: '+str(p)
              if 'edits' in row:
                  lines=p.read_text().splitlines(keepends=True)
                  for edit in reversed(row['edits']):lines[edit['a']:edit['b']]=edit['text'].splitlines(keepends=True)
                  data=''.join(lines).encode()
              else:data=row['content'].encode()
              assert sha(data)==row['sha256'],'Incorrect result: '+str(p)
              ready[p]=data
          for p,data in ready.items():p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          for row in json.loads(pathlib.Path('svgn-planet/legacy-layout.json').read_text())['files']:
              assert sha((pathlib.Path('svgn-planet')/row['path']).read_bytes())==row['sha256']
          subprocess.run(['bash','-o','pipefail','-c','node --test svgn-planet/tests/*.test.mjs svgn-planet/design/chapter-contract.test.mjs svgn-planet/lantern/*.test.mjs svgn-planet/spatial-modes.test.mjs | tee unified-model.txt'],check=True)
          if ready:
              subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
              subprocess.run(['git','add',*[str(p) for p in ready]],check=True)
              subprocess.run(['git','commit','-m','fix(neighborhood): stop released movement, isolate confirmations and repair campaign landings'],check=True)
              subprocess.run(['git','push','origin','HEAD:neighborhood-missions/night-watch-recovery-20260917'],check=True)
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('commit='+commit+'\n')
          pathlib.Path('SOURCE-COMMIT.txt').write_text(commit+'\n')
          PY
      - name: Archive exact source
        run: tar -czf unified-source.tar.gz svgn-planet little-planet index.html .github/workflows SOURCE-COMMIT.txt unified-model.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-source
          path: |
            unified-source.tar.gz
            unified-model.txt
          retention-days: 30
  browser:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
          sparse-checkout: |
            svgn-planet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native browser harness
        run: |
          python -m pip install playwright==1.55.0 pillow
          python -m playwright install --with-deps chromium
      - name: Exercise main URL, eight views and same-session district travel
        run: |
          python -m http.server 8765 > server.log 2>&1 &
          python svgn-planet/main-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-main
          path: |
            *-results/
            server.log
          retention-days: 30
