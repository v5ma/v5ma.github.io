name: Validate Theology reception history
on:
  pull_request:
    paths: ['theology-wiki/**', '.github/workflows/theology-reception.yml']
  push:
    branches: [master]
    paths: ['theology-wiki/**', '.github/workflows/theology-reception.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: theology-reception-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reception:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate evidence and retained rankings
        run: |
          python theology-wiki/tests/reception_test.py
          node --test theology-wiki/tests/role-workbook.test.cjs
      - name: Install Chromium
        run: |
          python -m pip install --quiet playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test actual HTTP study and reader entry points
        run: |
          python -m http.server 4174 --bind 127.0.0.1 >/tmp/reception-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python theology-wiki/tests/reception_test.py --browser
      - name: Verify exact public bytes and public-origin behavior
        if: github.ref == 'refs/heads/master'
        run: |
          cp -r theology-reception-proof /tmp/reception-native
          trap 'cp -r /tmp/reception-native theology-reception-proof/native' EXIT
          python - <<'PY'
          import hashlib,json,os,time,urllib.request
          from pathlib import Path
          files=['theology-wiki/reception-history.html','theology-wiki/reception/study.js','theology-wiki/reception/study.json','theology-wiki/assets/js/depth-tools.js','theology-wiki/role-workbook.html','theology-wiki/rankings/workbook.css']
          expected={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files}
          observed={}
          for attempt in range(40):
              for p,digest in expected.items():
                  try:
                      with urllib.request.urlopen('https://v5ma.github.io/'+p+'?rx='+os.environ['GITHUB_SHA'],timeout=15) as r:
                          actual=hashlib.sha256(r.read()).hexdigest()
                          observed[p]={'status':r.status,'sha256':actual==digest and digest or actual,'matches':actual==digest}
                  except Exception as e: observed[p]={'error':str(e),'matches':False}
              if all(v['matches'] for v in observed.values()): break
              time.sleep(5)
          Path('theology-reception-proof/hosted-content.json').write_text(json.dumps(observed,indent=2))
          assert all(v['matches'] for v in observed.values()), observed
          PY
          SITE_ORIGIN=https://v5ma.github.io python theology-wiki/tests/reception_test.py --browser
      - name: Preserve source identity and package
        if: always()
        run: |
          mkdir -p theology-reception-proof
          git rev-parse HEAD > theology-reception-proof/tested-commit.txt
          git diff --exit-code
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          files=['theology-wiki/reception-history.html','theology-wiki/reception/study.js','theology-wiki/reception/study.json','theology-wiki/tests/reception_test.py','theology-wiki/role-workbook.html','theology-wiki/assets/js/depth-tools.js','theology-wiki/rankings/workbook.css','.github/workflows/theology-reception.yml']
          Path('theology-reception-proof/source-manifest.json').write_text(json.dumps({p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files},indent=2))
          with zipfile.ZipFile('theology-reception-proof/reception-release.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in files: z.write(p)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theology-reception-verification
          path: theology-reception-proof/
          retention-days: 14
