name: Aether Aurora character and shader review
on:
  push:
    branches: [feat/aether-aurora-cast-20260912]
    paths: ['aether-reach/**', '.github/workflows/aether-aurora.yml']
  pull_request:
    paths: ['aether-reach/**', '.github/workflows/aether-aurora.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aether-aurora-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all source, assets, animation and production gates
        run: |
          set -euo pipefail
          mkdir -p aether-reach/test-output
          for f in aether-reach/*.mjs; do node --check "$f"; done
          node --test aether-reach/tests/*.test.mjs | tee aether-reach/test-output/aurora-node.log
          python aether-reach/tools/render-production-plan.py
          git diff --exit-code -- aether-reach/planning/AAA-ROADMAP.md
          node aether-reach/tests/release-manifest.mjs
      - name: Install actual browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Review the asset fixture and actual controller-driven arena
        timeout-minutes: 18
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/aurora-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python -u aether-reach/tests/aurora-browser.py | tee aether-reach/test-output/aurora-browser.log
      - name: Preserve exact tested source and actual review results
        if: always()
        run: |
          mkdir -p aether-reach/test-output
          git rev-parse HEAD > aether-reach/test-output/tested-commit.txt
          git diff --stat > aether-reach/test-output/uncommitted-diff.txt
          git archive --format=zip HEAD aether-reach index.html projects.css .github/workflows > aether-reach/test-output/aurora-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-aurora-review
          path: aether-reach/test-output
          retention-days: 21
