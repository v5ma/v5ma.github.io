name: Neighborhood spatial console acceptance
on:
  push:
    branches: [neighborhood-missions/spatial-console-20260920]
    paths: ['svgn-planet/**', '.github/upgrades/console-finalize.py', '.github/workflows/neighborhood-console.yml']
permissions:
  contents: read
concurrency:
  group: neighborhood-console-source
  cancel-in-progress: true
jobs:
  source:
    if: github.repository == 'v5ma/v5ma.github.io' && github.ref == 'refs/heads/neighborhood-missions/spatial-console-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            svgn-planet
            little-planet
            .github/upgrades
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare scoped release records without changing missions or saves
        id: source
        run: |
          python .github/upgrades/console-finalize.py
          python - <<'PY'
          import subprocess,os,pathlib
          allowed={'svgn-planet/index.html','svgn-planet/release.json','svgn-planet/SPATIAL-CONSOLE.md','svgn-planet/DEVELOPMENT-HANDOFF.md','svgn-planet/AAA_ROADMAP.md','svgn-planet/production/roadmap.json'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()+subprocess.check_output(['git','ls-files','--others','--exclude-standard','svgn-planet'],text=True).splitlines())
          assert changed.issubset(allowed),changed
          if changed:
              subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
              subprocess.run(['git','add',*sorted(changed)],check=True)
              subprocess.run(['git','commit','-m','docs(neighborhood): integrate spatial console records and versioned module entry'],check=True)
              subprocess.run(['git','push','origin','HEAD:neighborhood-missions/spatial-console-20260920'],check=True)
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();pathlib.Path('SOURCE-COMMIT.txt').write_text(commit+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('commit='+commit+'\n')
          PY
      - name: All inherited and new tests
        run: |
          set -o pipefail
          node --test svgn-planet/tests/*.test.mjs svgn-planet/design/chapter-contract.test.mjs svgn-planet/lantern/*.test.mjs svgn-planet/*.test.mjs | tee console-model.txt
          for f in svgn-planet/*.mjs; do node --check "$f"; done
          python -m py_compile svgn-planet/console-browser.py
      - name: Archive exact source
        if: always()
        run: tar -czf console-source.tar.gz svgn-planet little-planet index.html .github/workflows SOURCE-COMMIT.txt console-model.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-source
          path: console-source.tar.gz
          retention-days: 30
  browser:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [first-person-vr, third-person-vr, diorama-first-vr, diorama-third-vr, first-person-ar, third-person-ar, diorama-first-ar, diorama-third-ar]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
          sparse-checkout: |
            svgn-planet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.55.0 pillow
          python -m playwright install --with-deps chromium
      - name: Render actual console controls on the main URL
        env:
          CONSOLE_MODE: ${{ matrix.mode }}
        run: |
          python -u -m http.server 8765 --bind 127.0.0.1 > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          python - <<'PY'
          import time,urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8765/svgn-planet/',timeout=2) as r:assert r.status==200
                  break
              except Exception:
                  if attempt==29:raise
                  time.sleep(1)
          PY
          python svgn-planet/console-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-${{ matrix.mode }}
          path: |
            console-results/
            server.log
          retention-days: 30
