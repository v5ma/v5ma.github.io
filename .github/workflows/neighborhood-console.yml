name: Neighborhood spatial console acceptance
on:
  push:
    branches: [master, neighborhood-missions/spatial-console-20260920, neighborhood-missions/mission-focus-20260921]
    paths: ['svgn-planet/**', '.github/workflows/neighborhood-console.yml']
  pull_request:
    paths: ['svgn-planet/console-*.mjs', 'svgn-planet/spatial-console*.mjs', 'svgn-planet/unified-xr.mjs', 'svgn-planet/main-hub.mjs', 'svgn-planet/console-browser.py', '.github/workflows/neighborhood-console.yml']
permissions:
  contents: read
concurrency:
  group: neighborhood-console-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            svgn-planet
            little-planet
            level-design-library/applied
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record exact source
        run: |
          git rev-parse HEAD > SOURCE-COMMIT.txt
          tar -czf console-source.tar.gz svgn-planet little-planet level-design-library/applied index.html .github/workflows SOURCE-COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: console-source
          path: console-source.tar.gz
          retention-days: 30
      - name: All inherited and new tests with frozen legacy validation
        run: |
          set -o pipefail
          node --test svgn-planet/tests/*.test.mjs svgn-planet/design/chapter-contract.test.mjs svgn-planet/lantern/*.test.mjs svgn-planet/*.test.mjs | tee console-model.txt
          for f in svgn-planet/*.mjs; do node --check "$f"; done
          python3 -m py_compile svgn-planet/console-browser.py
          python3 - <<'PY'
          import json,hashlib,pathlib
          root=pathlib.Path('svgn-planet');m=json.loads((root/'legacy-layout.json').read_text())
          for row in m['files']:assert hashlib.sha256((root/row['path']).read_bytes()).hexdigest()==row['sha256'],row['path']
          print('All',len(m['files']),'legacy file hashes match')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-model
          path: console-model.txt
          retention-days: 30
  browser:
    needs: source
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [first-person-vr, third-person-vr, diorama-first-vr, diorama-third-vr, first-person-ar, third-person-ar, diorama-first-ar, diorama-third-ar]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            svgn-planet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.55.0 pillow
          python -m playwright install --with-deps chromium
      - name: Render actual console controls on the main URL
        env:
          CONSOLE_MODE: ${{ matrix.mode }}
        run: |
          python -u svgn-planet/tests/serve-modules.py --port 8765 > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          python - <<'PY'
          import time,urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8765/svgn-planet/',timeout=2) as r:assert r.status==200
                  break
              except Exception:
                  if attempt==29:raise
                  time.sleep(1)
          PY
          python svgn-planet/console-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-${{ matrix.mode }}
          path: |
            console-results/
            server.log
          retention-days: 30
