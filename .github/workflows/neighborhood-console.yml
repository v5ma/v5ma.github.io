name: Neighborhood spatial console acceptance
on:
  push:
    branches: [neighborhood-missions/spatial-console-20260920]
    paths: ['svgn-planet/**', '.github/upgrades/console-integration.patch', '.github/workflows/neighborhood-console.yml']
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'v5ma/v5ma.github.io' && github.ref == 'refs/heads/neighborhood-missions/spatial-console-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            svgn-planet
            little-planet
            .github/upgrades
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only checksum-verified integration against exact source preimages
        id: source
        run: |
          python - <<'PY'
          import hashlib,pathlib,subprocess,os
          targets={
            'svgn-planet/main-app.mjs':('2839006f9412c2ffcf489d75dcc69aefdb7afc70','e6c96388c198a9af4628b6a0e991c04b55a5fe51'),
            'svgn-planet/main-hub.mjs':('3babfbdfb79b46425555306ffb16f646eacf09cb','865d5e462a93f4b19108f347ada2324c11357d6c'),
            'svgn-planet/unified-xr.mjs':('801450dd5c59165410b6788d978fb59f7c6647a7','861ab1515a1d8589041fe6f0e499fe4eca576531'),
            'svgn-planet/main-browser.py':('f325cdbbeaa7fb3ea10a6df6a0d52ea15ecf8c66','e68c85db784011dea2230e206f9ae07e116fedeb'),
            'svgn-planet/main-navigation-browser.py':('dd1db4a3246d646b7d7da413e7c3a9b7d0964ee2','4388c9acf61db24ee331abcdba51de106356aff2')
          }
          def sha(p):return subprocess.check_output(['git','hash-object',p],text=True).strip()
          if not all(sha(p)==after for p,(_,after) in targets.items()):
              assert all(sha(p)==before for p,(before,_) in targets.items()),'Source changed; do not overwrite it'
              patch=pathlib.Path('.github/upgrades/console-integration.patch').read_bytes()
              assert hashlib.sha256(patch).hexdigest()=='b4399dc13c6c86e1feed114dc127f966b4e184323b9017fab63ba49509253ad8','Patch transport mismatch'
              names={line.split()[2][2:] for line in patch.decode().splitlines() if line.startswith('diff --git ')}
              assert names==set(targets)
              subprocess.run(['git','apply','--check','--unidiff-zero','-'],input=patch,check=True)
              subprocess.run(['git','apply','--unidiff-zero','-'],input=patch,check=True)
              assert all(sha(p)==after for p,(_,after) in targets.items()),'Applied bytes do not match reviewed source'
          # Small wording refinement to display the configured off-hand button.
          p=pathlib.Path('svgn-planet/spatial-console.mjs')
          if sha(str(p))!='3e7be72ff169d515d0be5575c3e28e5730b02aab':
              assert sha(str(p))=='694e56f62214f018fc9ba215b55fcb30e69a3d09'
              text=p.read_text();old="hctx.fillText('Menu: Y / raised pinch',22,332)"
              assert text.count(old)==1
              p.write_text(text.replace(old,"hctx.fillText('Menu: '+(data.menu||'Y')+' / raised pinch',22,332)"))
              assert sha(str(p))=='3e7be72ff169d515d0be5575c3e28e5730b02aab'
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed.issubset(set(targets)|{str(p)})
          if changed:
              subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
              subprocess.run(['git','add',*sorted(changed)],check=True)
              subprocess.run(['git','commit','-m','feat(neighborhood): integrate floor console and controller objective HUD'],check=True)
              subprocess.run(['git','push','origin','HEAD:neighborhood-missions/spatial-console-20260920'],check=True)
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          pathlib.Path('SOURCE-COMMIT.txt').write_text(commit+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('commit='+commit+'\n')
          PY
      - name: All existing and new model tests, syntax and legacy identity
        run: |
          set -o pipefail
          node --test svgn-planet/tests/*.test.mjs svgn-planet/design/chapter-contract.test.mjs svgn-planet/lantern/*.test.mjs svgn-planet/*.test.mjs | tee console-model.txt
          for f in svgn-planet/*.mjs; do node --check "$f"; done
          python -m py_compile svgn-planet/console-browser.py svgn-planet/main-browser.py svgn-planet/main-navigation-browser.py
      - name: Archive exact source and evidence
        if: always()
        run: tar -czf console-source.tar.gz svgn-planet little-planet index.html .github/workflows SOURCE-COMMIT.txt console-model.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-source
          path: console-source.tar.gz
          retention-days: 30
  browser:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [first-person-vr, third-person-vr, diorama-first-vr, diorama-third-vr, first-person-ar, third-person-ar, diorama-first-ar, diorama-third-ar]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
          sparse-checkout: |
            svgn-planet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.55.0 pillow
          python -m playwright install --with-deps chromium
      - name: Render actual console controls on the main URL
        env:
          CONSOLE_MODE: ${{ matrix.mode }}
        run: |
          python -u -m http.server 8765 --bind 127.0.0.1 > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          python - <<'PY'
          import time,urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8765/svgn-planet/',timeout=2) as r:assert r.status==200
                  break
              except Exception:
                  if attempt==29:raise
                  time.sleep(1)
          PY
          python svgn-planet/console-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-${{ matrix.mode }}
          path: |
            console-results/
            server.log
          retention-days: 30
