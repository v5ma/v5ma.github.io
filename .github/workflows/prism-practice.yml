name: Verify Prism Practice Lab
on:
  pull_request:
    paths: ['prism-current/**', '.github/workflows/prism-practice.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prism-practice-${{ github.ref }}
  cancel-in-progress: true
jobs:
  practice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: prism-current
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and score/audio invariants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-output
          python prism-current/tests/verify.py
          node --test prism-current/tests/*.test.cjs | tee test-output/core.tap
      - name: Install native Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Play real-time practice passes and exercise controller menus
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/prism-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          timeout 240 python -u prism-current/tests/practice-browser.py
      - if: always()
        run: |
          mkdir -p test-output
          git rev-parse HEAD > test-output/tested-commit.txt
          tar czf test-output/source.tgz prism-current index.html projects.css project-shortcuts.css
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-practice
          path: test-output/
          retention-days: 14
