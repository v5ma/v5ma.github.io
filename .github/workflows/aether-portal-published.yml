name: Play published Aether World Portal
on:
  workflow_run:
    workflows: ['Verify published Aether Reach']
    types: [completed]
    branches: [master]
permissions:
  contents: read
jobs:
  play:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          sparse-checkout: |
            aether-reach
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Source and served byte contract
        env:
          SOURCE: ${{ github.event.workflow_run.head_sha }}
        run: |
          node aether-reach/tests/release-manifest.mjs
          python - <<'PY'
          import hashlib,json,os,urllib.request
          from pathlib import Path
          expected=json.loads(Path('aether-reach/test-output/runtime-manifest.json').read_text())['files']
          files={}
          for name,digest in expected.items():
            with urllib.request.urlopen('https://v5ma.github.io/'+name+'?portal='+os.environ['SOURCE'],timeout=40) as r:
              raw=r.read();files[name]={'status':r.status,'sha256':hashlib.sha256(raw).hexdigest()}
            assert files[name]['status']==200 and files[name]['sha256']==digest,name
          Path('aether-reach/test-output/portal-public-bytes.json').write_text(json.dumps({'source':os.environ['SOURCE'],'allMatch':True,'files':files},indent=2))
          PY
      - name: Install native browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise actual public HTTPS application
        timeout-minutes: 40
        env:
          TEST_BASE_URL: https://v5ma.github.io
        run: |
          python -u aether-reach/tests/rotunda-browser.py
          python -u aether-reach/tests/field-guide-browser.py
          python -u aether-reach/tests/window-browser.py
          python -u aether-reach/tests/portal-browser.py
      - name: Evidence identity
        if: always()
        run: |
          git rev-parse HEAD > aether-reach/test-output/tested-commit.txt
          git diff --stat > aether-reach/test-output/uncommitted-diff.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-portal-live
          path: aether-reach/test-output/
          retention-days: 30
