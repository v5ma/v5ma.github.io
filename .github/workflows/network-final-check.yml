name: Connected world final acceptance
on:
  push:
    branches: [feat/connected-sky-network-20260905]
    paths: ['scripts/finish-connected-world.py', '.github/workflows/network-final-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/connected-sky-network-20260905
      - name: Finish scoped source integration
        run: |
          python scripts/finish-connected-world.py
          python scripts/integrate-sky-network.py
          node --check mario-maker-clone/svgn-paper-route/sky-network-layout.js
          node --check mario-maker-clone/svgn-paper-route/sky-network-runtime.js
          node --check mario-maker-clone/svgn-paper-route/sky-network-art.js
          node --check mario-maker-clone/svgn-paper-route/cloudview-world.js
      - name: Commit only the owned integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- mario-maker-clone/svgn-paper-route/index.html mario-maker-clone/svgn-paper-route/sky-network-art.js mario-maker-clone/svgn-paper-route/sky-network-runtime.js mario-maker-clone/svgn-paper-route/cloudview-world.js mario-maker-clone/svgn-paper-route/cloudview-depth.js mario-maker-clone/svgn-paper-route/ground-runtime.js mario-maker-clone/svgn-paper-route/sw.js .github/workflows/sky-network.yml
          if git ls-files .network-transfer | grep -q .; then git add -u -- .network-transfer; fi
          if git ls-files .github/workflows/network-source-recovery.yml | grep -q .; then git add -u -- .github/workflows/network-source-recovery.yml; fi
          if ! git diff --cached --quiet; then git commit -m 'Finalize bounded road geometry and repeatable connected-world integration'; git push origin HEAD:feat/connected-sky-network-20260905; fi
      - id: identity
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Preserve runnable source for review
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/tested-commit.txt
          tar -czf evidence/connected-world-runtime.tgz mario-maker-clone/svgn-paper-route tests scripts
      - uses: actions/upload-artifact@v4
        with:
          name: connected-world-reviewed-source
          path: evidence/
          retention-days: 14
  acceptance:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        mode: [survey, flight, grapple, road]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test topology and retained mechanics
        run: node --test tests/sky_network.test.cjs tests/adventure_score.test.cjs tests/grapple_core.test.cjs tests/grapple_tolerance.test.cjs tests/depth_geometry.test.mjs
      - name: Install the native browser
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Record ordinary-input play and actual rendering
        env:
          NETWORK_SUITE: ${{ matrix.mode }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/connected-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          timeout 1260 python -u tests/sky_network_browser.py
      - name: Keep exact evidence even on failure
        if: always()
        run: |
          mkdir -p test-output
          git rev-parse HEAD > test-output/tested-commit.txt
          git diff --stat > test-output/uncommitted-diff.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connected-world-final-${{ matrix.mode }}
          path: test-output/
          retention-days: 14
