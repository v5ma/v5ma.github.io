name: Aether Bellwether Rewired acceptance
on:
  push:
    branches: [aether/bellwether-diorama-20260915]
    paths: ['aether-reach/**', '.github/workflows/aether-rewired.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aether-rewired-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        suite: [diorama, bellwether, grounded, controller, expedition, glide]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            aether-reach
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Save exact source snapshot
        if: matrix.suite == 'diorama'
        run: |
          mkdir -p /tmp/rewired-source
          git rev-parse HEAD > /tmp/rewired-source/source-commit.txt
          git archive --format=zip HEAD aether-reach .github/workflows index.html projects.css .nojekyll > /tmp/rewired-source/source.zip
      - uses: actions/upload-artifact@v4
        if: matrix.suite == 'diorama'
        with:
          name: aether-rewired-source
          path: /tmp/rewired-source/
          retention-days: 14
      - name: Model, save, input, layout and presentation contracts
        run: |
          set -euo pipefail
          mkdir -p aether-reach/test-output
          for f in aether-reach/*.mjs; do node --check "$f"; done
          node --test aether-reach/tests/*.test.mjs | tee aether-reach/test-output/rewired-node.log
          python aether-reach/tests/backup_test.py
          python aether-reach/tools/render-production-plan.py
          git diff --exit-code -- aether-reach/planning/AAA-ROADMAP.md
          node aether-reach/tests/release-manifest.mjs
      - name: Install native Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Play HTTP application with ordinary inputs
        timeout-minutes: 19
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/aether-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          case "$SUITE" in
            diorama) python -u aether-reach/tests/diorama-browser.py ;;
            bellwether) python -u aether-reach/tests/bellwether-browser.py ;;
            grounded) python -u aether-reach/tests/grounded-browser.py ;;
            controller) python -u aether-reach/tests/controller-journey.py ;;
            expedition) python -u aether-reach/tests/browser.py ;;
            glide) python -u aether-reach/tests/glide_browser.py ;;
            *) exit 1 ;;
          esac
      - name: Record exact tested source
        if: always()
        run: |
          mkdir -p aether-reach/test-output
          git rev-parse HEAD > aether-reach/test-output/tested-commit.txt
          git diff --stat > aether-reach/test-output/uncommitted-diff.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-rewired-${{ matrix.suite }}
          path: aether-reach/test-output/
          retention-days: 30
