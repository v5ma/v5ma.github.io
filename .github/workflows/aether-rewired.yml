name: Aether Rewired chapter and diorama
on:
  push:
    branches: [aether/bellwether-diorama-20260915]
    paths: ['aether-reach/**', '.github/workflows/aether-rewired.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aether-rewired-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.suite == 'rewired' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        suite: [diorama, rewired, grounded, controller, expedition, glide]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            aether-reach
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Model, save, physical route and presentation invariants
        run: |
          set -euo pipefail
          mkdir -p aether-reach/test-output
          for f in aether-reach/*.mjs; do node --check "$f"; done
          node --test aether-reach/tests/*.test.mjs | tee aether-reach/test-output/rewired-node.log
          python aether-reach/tests/backup_test.py
          python aether-reach/tools/render-production-plan.py
          git diff --exit-code -- aether-reach/planning/AAA-ROADMAP.md
          node aether-reach/tests/release-manifest.mjs
      - name: Clean source restoration
        if: matrix.suite == 'grounded'
        run: |
          python aether-reach/tools/backup.py --out /tmp/aether-rewired-source
          python aether-reach/tools/backup.py --restore /tmp/aether-rewired-source/*source.zip --destination /tmp/aether-rewired-clean
          (cd /tmp/aether-rewired-clean && node --test aether-reach/tests/*.test.mjs) > aether-reach/test-output/rewired-restore.log
      - name: Install native test browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise the actual HTTP WebGL game
        timeout-minutes: ${{ matrix.suite == 'rewired' && 40 || 25 }}
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/aether-rewired-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          case "$SUITE" in
            diorama) python -u aether-reach/tests/diorama-browser.py ;;
            rewired) BELL_ROUTE=rewired python -u aether-reach/tests/bellwether-browser.py ;;
            grounded) python -u aether-reach/tests/grounded-browser.py ;;
            controller) python -u aether-reach/tests/controller-journey.py && DEVICE_SUITE=pad python -u aether-reach/tests/devices.py ;;
            expedition) AETHER_SUITE=expedition python -u aether-reach/tests/browser.py ;;
            glide) python -u aether-reach/tests/glide_browser.py ;;
            *) exit 1 ;;
          esac
      - name: Preserve exact source and evidence
        if: always()
        run: |
          mkdir -p aether-reach/test-output
          git rev-parse HEAD > aether-reach/test-output/tested-commit.txt
          git diff --stat > aether-reach/test-output/uncommitted-diff.txt
          if [ '${{ matrix.suite }}' = grounded ]; then
            git archive --format=zip HEAD aether-reach index.html projects.css .github/workflows > aether-reach/test-output/rewired-source.zip
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-rewired-${{ matrix.suite }}
          path: aether-reach/test-output/
          retention-days: 30
