name: Dino Atlas Living Herds verification
on:
  push:
    branches: [dino-living-herds-20260912, master]
    paths: ['dino-atlas/**', '.github/workflows/dino-living-herds.yml', '.github/patches/living-herds.*.b64']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dino-living-herds-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: ${{ github.ref != 'refs/heads/master' }}
          sparse-checkout: |
            dino-atlas
            .github
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the reviewed Git patch on the candidate only
        if: github.ref == 'refs/heads/dino-living-herds-20260912'
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,lzma,hashlib,subprocess
          parts=sorted(Path('.github/patches').glob('living-herds.*.b64'))
          if parts:
              assert len(parts)==4
              assert subprocess.check_output(['git','rev-parse','HEAD:dino-atlas'],text=True).strip()=='3cc0bdab5c52ddcf2db7a89bde0c8640cf9eeffc','Dino baseline changed; review before applying'
              patch=lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True))
              assert hashlib.sha256(patch).hexdigest()=='3aff4611ff2a31b20cf28194aaea2ee79cdd6c7776b4b15aedae769a7f343fd0','Patch transport checksum mismatch'
              target=Path('/tmp/living-herds.patch');target.write_bytes(patch)
              paths=subprocess.check_output(['git','apply','--numstat',str(target)],text=True)
              assert all(line.split('\t')[-1].startswith('dino-atlas/') for line in paths.splitlines())
              subprocess.run(['git','apply','--check',str(target)],check=True)
              subprocess.run(['git','apply','--index',str(target)],check=True)
              subprocess.run(['git','rm',*[str(p) for p in parts]],check=True)
              subprocess.run(['git','config','user.name','Dino Atlas Build'],check=True)
              subprocess.run(['git','config','user.email','60057241+v5ma@users.noreply.github.com'],check=True)
              subprocess.run(['git','commit','-m','Implement Living Herds behavior, articulated motion, field study and production checklist'],check=True)
              subprocess.run(['git','push','origin','HEAD:dino-living-herds-20260912'],check=True)
          else:
              print('Testing committed direct source; no integration patch remains.')
          PY
      - name: Syntax and all model, physics and save regressions
        shell: bash
        run: |
          mkdir -p herds-evidence
          find dino-atlas -maxdepth 1 -name '*.js' -exec node --check {} \;
          set -o pipefail
          node --test dino-atlas/tests/*.test.mjs | tee herds-evidence/model-tests.tap
      - name: Install native rendered acceptance runner
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Play the Living Herds study using Xbox input
        run: |
          python dino-atlas/tests/living-herds-browser.py
          cp herds-evidence/report.json herds-evidence/local-study-report.json
      - name: Retain the complete Storm Response controller journey
        run: python dino-atlas/tests/aaa-browser.py
      - name: Record reviewed runtime hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          root=Path('dino-atlas');files=[p for p in root.iterdir() if p.suffix in ('.js','.html','.css')]
          files += [root/'AAA-ROADMAP.md',root/'LIVING-HERDS.md']
          manifest={'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files}}
          Path('herds-evidence/runtime-hashes.json').write_text(json.dumps(manifest,indent=2))
          PY
      - name: Verify public runtime and checklist match reviewed bytes
        if: github.ref == 'refs/heads/master'
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen,Request
          from concurrent.futures import ThreadPoolExecutor
          import hashlib,json,time,os
          manifest=json.loads(Path('herds-evidence/runtime-hashes.json').read_text())
          def check(item):
              path,expected=item
              try:
                  url='https://v5ma.github.io/'+path+'?verify='+os.environ['GITHUB_SHA']
                  data=urlopen(Request(url,headers={'Cache-Control':'no-cache'}),timeout=25).read()
                  return path if hashlib.sha256(data).hexdigest()!=expected else None
              except Exception:return path
          for attempt in range(30):
              with ThreadPoolExecutor(max_workers=8) as pool:bad=[p for p in pool.map(check,manifest['files'].items()) if p]
              if not bad:break
              print('Deployment not yet matching:',bad,flush=True);time.sleep(10)
          assert not bad,bad
          Path('herds-evidence/public-bytes.json').write_text(json.dumps({'commit':manifest['commit'],'matched_files':len(manifest['files']),'url':'https://v5ma.github.io/dino-atlas/'},indent=2))
          PY
      - name: Exercise the actual published Living Herds game
        if: github.ref == 'refs/heads/master'
        env:
          DINO_TEST_BASE: https://v5ma.github.io/dino-atlas/
        run: |
          python dino-atlas/tests/living-herds-browser.py
          cp herds-evidence/report.json herds-evidence/published-study-report.json
      - name: Record exact tested source
        if: always()
        run: |
          mkdir -p herds-evidence
          git rev-parse HEAD > herds-evidence/tested-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dino-living-herds-source-and-evidence
          path: |
            dino-atlas
            herds-evidence
            aaa-evidence
          retention-days: 14
