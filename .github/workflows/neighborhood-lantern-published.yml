name: Verify published unified Neighborhood Missions
on:
  push:
    branches: [master]
    paths: ['svgn-planet/**', 'level-design-library/applied/NEIGHBORHOOD-MISSIONS-WORKING-QUAY.md', 'level-design-library/applied/NEIGHBORHOOD-MISSIONS-LIVING-PORTAL.md', 'level-design-library/applied/NEIGHBORHOOD-MISSIONS-NIGHT-WATCH.md', 'level-design-library/applied/NEIGHBORHOOD-MISSIONS-NIGHT-WATCH-CAMPAIGN.md', '.github/workflows/neighborhood-lantern-published.yml']
permissions:
  contents: read
concurrency:
  group: lantern-published
  cancel-in-progress: true
jobs:
  bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            svgn-planet
            level-design-library/applied
      - name: Verify exact public main game, districts, legacy layout and evidence bytes
        env:
          COMMIT: ${{ github.sha }}
        run: python3 svgn-planet/tests/verify-published.py --output published-results/bytes.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lantern-public-bytes
          path: published-results/
          retention-days: 30
  live:
    needs: bytes
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        route: [console-diorama-third-ar, main-nav, console-first-person-vr, grounded-browser, main, campaign, street, xr, market, city, portal, portal-render, watch-roof, watch-combat, xr-ui, console-third-person-vr, console-diorama-first-vr, console-diorama-third-vr, console-first-person-ar, console-third-person-ar, console-diorama-first-ar]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            svgn-planet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.55.0 pillow
          python -m playwright install --with-deps chromium
      - name: Verify live main entry, native district travel, campaign and spatial XR
        env:
          CONSOLE_BASE: https://v5ma.github.io/svgn-planet/
          CONSOLE_OUT: published-results/console
          MAIN_BASE: https://v5ma.github.io/svgn-planet/
          WARD_BASE: https://v5ma.github.io/svgn-planet/lantern-ward.html
          WARD_ROUTE: ${{ matrix.route }}
          CITY_SUITE: ${{ matrix.route }}
          WATCH_SUITE: ${{ matrix.route }}
          MAIN_OUT: published-results/main
          MAIN_NAV_OUT: published-results/main-nav
          WATCH_OUT: published-results/night-watch
          CITY_OUT: published-results/city
          PORTAL_OUT: published-results/portal-render
          WARD_OUT: published-results
          MARKET_OUT: published-results/market
          CAMPAIGN_OUT: published-results/campaign
        run: |
          case "$WARD_ROUTE" in
            console-*) export CONSOLE_MODE="${WARD_ROUTE#console-}"; python svgn-planet/console-browser.py ;;
            grounded-browser) GROUNDED_BASE=https://v5ma.github.io/svgn-planet/legacy.html GROUNDED_OUTPUT=published-results/legacy python svgn-planet/tests/grounded-browser.py ;;
            main) python svgn-planet/main-browser.py ;;
            main-nav) python svgn-planet/main-navigation-browser.py ;;
            campaign) python svgn-planet/lantern/campaign-browser.py ;;
            watch-roof|watch-combat|xr-ui) python svgn-planet/lantern/watch-browser.py ;;
            city|portal) python svgn-planet/lantern/city-browser.py ;;
            portal-render) python svgn-planet/lantern/portal-render-browser.py ;;
            market) python svgn-planet/lantern/market-browser.py ;;
            *) python svgn-planet/lantern/browser.py ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lantern-live-${{ matrix.route }}
          path: published-results/
          retention-days: 30
