name: Verify published Lantern Ward
on:
  push:
    branches: [master]
    paths: ['svgn-planet/**', 'level-design-library/applied/NEIGHBORHOOD-MISSIONS-WORKING-QUAY.md', 'level-design-library/applied/NEIGHBORHOOD-MISSIONS-LIVING-PORTAL.md', 'level-design-library/applied/NEIGHBORHOOD-MISSIONS-NIGHT-WATCH.md', '.github/workflows/neighborhood-lantern-published.yml']
permissions:
  contents: read
concurrency:
  group: lantern-published
  cancel-in-progress: true
jobs:
  bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            svgn-planet
            level-design-library/applied
      - name: Verify exact public game, legacy layout and evidence bytes
        env:
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p published-results
          python - <<'PY'
          import concurrent.futures,hashlib,json,os,pathlib,time,urllib.request
          root=pathlib.Path('svgn-planet');base='https://v5ma.github.io/';commit=os.environ['COMMIT']
          paths=sorted(p for p in root.rglob('*') if p.is_file() and not any(x.startswith('.') or x in ('tests','tools','node_modules','__pycache__') for x in p.relative_to(root).parts) and p.suffix not in ('.py','.pyc'))
          paths.extend(pathlib.Path('level-design-library/applied')/name for name in ['NEIGHBORHOOD-MISSIONS-WORKING-QUAY.md','NEIGHBORHOOD-MISSIONS-LIVING-PORTAL.md','NEIGHBORHOOD-MISSIONS-NIGHT-WATCH.md'])
          expected={p.as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in paths};rows={}
          def check(path):
              row={'path':path,'expected':expected[path],'matches':False}
              try:
                  req=urllib.request.Request(base+path+'?source='+commit+'&nocache='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=25) as response:
                      assert response.status==200
                      data=response.read()
                  row.update(sha256=hashlib.sha256(data).hexdigest(),bytes=len(data));row['matches']=row['sha256']==row['expected']
              except Exception as e:row['error']=str(e)
              return row
          # Pages can publish a later sibling-only commit instead of this exact
          # repository SHA. Acceptance is still every exact game-file hash, not
          # an assumed successful deployment or a relaxed version check.
          deadline=time.monotonic()+1500
          while time.monotonic()<deadline:
              pending=[p for p in expected if not rows.get(p,{}).get('matches')]
              if not pending:break
              with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
                  for r in pool.map(check,pending):rows[r['path']]=r
              count=sum(r['matches'] for r in rows.values());print('Verified',count,'of',len(paths),flush=True)
              if count==len(paths):break
              time.sleep(10)
          version=json.loads((root/'release.json').read_text())['version']
          receipt={'commit':commit,'version':version,'scope':'Exact game-file closure and its applied design note; unrelated repository files may advance.','files':[rows[k] for k in sorted(rows)],'success':len(rows)==len(paths) and all(r['matches'] for r in rows.values())}
          pathlib.Path('published-results/bytes.json').write_text(json.dumps(receipt,indent=2))
          assert receipt['success'],'Public files did not match this exact game snapshot within the verification window'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lantern-public-bytes
          path: published-results/
          retention-days: 30
  live:
    needs: bytes
    runs-on: ubuntu-latest
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        route: [street, xr, market, city, portal, portal-render, watch-roof, watch-combat, xr-ui]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            svgn-planet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.55.0 pillow
          python -m playwright install --with-deps chromium
      - name: Verify live default entry, saved routes and native synthetic XR
        env:
          WARD_BASE: https://v5ma.github.io/svgn-planet/
          WARD_ROUTE: ${{ matrix.route }}
          CITY_SUITE: ${{ matrix.route }}
          WATCH_SUITE: ${{ matrix.route }}
          WATCH_OUT: published-results/night-watch
          CITY_OUT: published-results/city
          PORTAL_OUT: published-results/portal-render
          WARD_OUT: published-results
          MARKET_OUT: published-results/market
        run: |
          case "$WARD_ROUTE" in
            watch-roof|watch-combat|xr-ui) python svgn-planet/lantern/watch-browser.py ;;
            city|portal) python svgn-planet/lantern/city-browser.py ;;
            portal-render) python svgn-planet/lantern/portal-render-browser.py ;;
            market) python svgn-planet/lantern/market-browser.py ;;
            *) python svgn-planet/lantern/browser.py ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lantern-live-${{ matrix.route }}
          path: published-results/
          retention-days: 30
