name: Rainward human models and rain materials
on:
  pull_request:
    paths: ['rainward/**','.github/workflows/rainward-rainworn.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rainward-rainworn-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source, rig and license regression
        run: |
          node --test rainward/tests/*.test.mjs
          python -m compileall -q rainward/tests
      - name: Install real WebGL browser
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Verify actual models, shaders and controller options
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/rainward-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          timeout 780 python -u rainward/tests/rainworn.py
      - name: Preserve source and visual evidence
        if: always()
        run: |
          mkdir -p test-output
          python rainward/tests/release.py
          git rev-parse HEAD > test-output/tested-commit.txt
          tar -czf test-output/rainward-source.tgz rainward index.html projects.css
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainward-rainworn
          path: test-output/
          retention-days: 7
