name: Living Portal candidate
on:
  push:
    branches: [neighborhood-missions/living-portal-20260917]
    paths: ['.github/workflows/neighborhood-living-portal.yml']
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'v5ma/v5ma.github.io' && github.ref == 'refs/heads/neighborhood-missions/living-portal-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            svgn-planet
            little-planet
            .github/upgrades
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and apply reviewed refinement only to this work branch
        id: source
        run: |
          python - <<'PY'
          import base64,hashlib,lzma,pathlib,subprocess
          root=pathlib.Path('svgn-planet/production/evidence/living-portal-0.13.0')
          assert (root/'source-patch.sha256').read_text().strip()=='aef2277ef1d3d2042c34db09d2dddf90f5271b0fb1638eaf105925af95ef02ac'
          marker=root/'review-patch.sha256'
          expected='21929b031eb9680df66455fee57264d0ea88779cba85cf2fef782601d1874cd6'
          if marker.exists():
              assert marker.read_text().strip()==expected
          else:
              parts=[]
              for i in range(1,3):
                  text=pathlib.Path(f'.github/upgrades/living-portal-review-{i}.xz.b64').read_text().strip()
                  print(i,len(text),hashlib.sha256(text.encode()).hexdigest(),flush=True);parts.append(text)
              patch=lzma.decompress(base64.b64decode(''.join(parts),validate=True))
              assert hashlib.sha256(patch).hexdigest()==expected,'Patch checksum mismatch; no game files changed'
              paths=[line.split()[2][2:] for line in patch.decode().splitlines() if line.startswith('diff --git ')]
              assert paths and all(p.startswith('svgn-planet/') and '..' not in p.split('/') for p in paths)
              subprocess.run(['git','apply','--check','-'],input=patch,check=True)
              subprocess.run(['git','apply','-'],input=patch,check=True)
              marker.write_text(expected+'\n')
              subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
              subprocess.run(['git','add','svgn-planet'],check=True)
              subprocess.run(['git','commit','-m','fix(neighborhood): direct mission access, clear interiors and transparent AR recovery'],check=True)
              subprocess.run(['git','push','origin','HEAD:neighborhood-missions/living-portal-20260917'],check=True)
          PY
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > SOURCE-COMMIT.txt
          tar -czf living-portal-source.tar.gz svgn-planet little-planet index.html .github/workflows SOURCE-COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: living-portal-source
          path: living-portal-source.tar.gz
          retention-days: 30
  model:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
          sparse-checkout: |
            svgn-planet
            little-planet
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retained gameplay, all resident stories, save and portal regressions
        run: |
          set -o pipefail
          node --test svgn-planet/tests/*.test.mjs svgn-planet/design/chapter-contract.test.mjs svgn-planet/lantern/*.test.mjs | tee living-portal-model.txt
          for f in svgn-planet/lantern/*.mjs; do node --check "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: living-portal-model
          path: living-portal-model.txt
          retention-days: 30
  browser:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [city, portal, portal-render, street, roof, canal, xr, market, coastal_browser_release, homecoming_browser, atmosphere-browser, tidewater-browser, grounded-browser]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
          sparse-checkout: |
            svgn-planet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real browser harness
        run: |
          python -m pip install playwright==1.55.0 pillow
          python -m playwright install --with-deps chromium
      - name: Real WebGL and simulation through synthetic devices
        env:
          WARD_ROUTE: ${{ matrix.suite }}
          CITY_SUITE: ${{ matrix.suite }}
        run: |
          python -m http.server 8765 > server.log 2>&1 &
          case "$WARD_ROUTE" in
            city|portal) python svgn-planet/lantern/city-browser.py ;;
            portal-render) python svgn-planet/lantern/portal-render-browser.py ;;
            street|roof|canal|xr) python svgn-planet/lantern/browser.py ;;
            market) python svgn-planet/lantern/market-browser.py ;;
            *) python "svgn-planet/tests/$WARD_ROUTE.py" ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: living-portal-${{ matrix.suite }}
          path: |
            *-results/
            server.log
          retention-days: 30
