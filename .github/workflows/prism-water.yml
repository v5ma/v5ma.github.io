name: Verify Prism Floodgate Recovery
on:
  pull_request:
    paths: ['prism-current/**', '.github/workflows/prism-water.yml']
  push:
    branches: [master]
    paths: ['prism-current/**', '.github/workflows/prism-water.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prism-water-${{ github.ref }}
  cancel-in-progress: true
jobs:
  water:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: prism-current
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing invariants and complete water route
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-output
          python prism-current/tests/verify.py
          node --test prism-current/tests/*.test.cjs | tee test-output/core.tap
      - name: Match published mission bytes
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json, urllib.request, hashlib, time
          from pathlib import Path
          m=json.loads(Path('test-output/prism-manifest.json').read_text());files={p:h for p,h in m['files'].items() if p.startswith('prism-current/')};results={}
          for attempt in range(36):
            for p,h in files.items():
              if results.get(p,False):continue
              try:
                with urllib.request.urlopen('https://v5ma.github.io/'+p+'?floodgate='+m['source'][:12],timeout=12) as r:results[p]=hashlib.sha256(r.read()).hexdigest()==h
              except Exception:results[p]=False
            if len(results)==len(files) and all(results.values()):break
            time.sleep(6)
          receipt={'source':m['source'],'version':m['version'],'files':results,'all_match':len(results)==len(files) and all(results.values())};Path('test-output/water-publication.json').write_text(json.dumps(receipt,indent=2));assert receipt['all_match']
          PY
      - name: Install native browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Play the expedition through ordinary controller inputs
        env:
          TEST_BASE_URL: ${{ github.event_name == 'push' && 'https://v5ma.github.io' || 'http://127.0.0.1:4173' }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/prism-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          timeout 420 python -u prism-current/tests/water-browser.py
      - if: always()
        run: |
          git rev-parse HEAD > test-output/tested-commit.txt
          tar czf test-output/source.tgz prism-current
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-water-${{ github.event_name }}
          path: test-output/
          retention-days: 14
