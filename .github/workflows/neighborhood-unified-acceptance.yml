name: Unified Neighborhood acceptance
on:
  push:
    branches: [master]
    paths: ['svgn-planet/**', '.github/workflows/neighborhood-unified-acceptance.yml']
permissions:
  contents: read
concurrency:
  group: unified-neighborhood-${{ github.ref }}
  cancel-in-progress: true
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            svgn-planet
            little-planet
            level-design-library
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Archive exact source before acceptance
        run: |
          git rev-parse HEAD > SOURCE-COMMIT.txt
          tar -czf unified-source.tar.gz svgn-planet little-planet level-design-library index.html .github/workflows SOURCE-COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: unified-source
          path: unified-source.tar.gz
          retention-days: 30
      - name: All inherited models, campaign and eight-mode geometry
        run: |
          set -o pipefail
          node --test svgn-planet/tests/*.test.mjs svgn-planet/design/chapter-contract.test.mjs svgn-planet/lantern/*.test.mjs svgn-planet/*.test.mjs | tee unified-model.txt
          python3 svgn-planet/tests/check-reconciliation.py
          for f in svgn-planet/*.mjs svgn-planet/lantern/*.mjs; do node --check "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-model
          path: unified-model.txt
          retention-days: 30
  browser:
    needs: model
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        suite: [main, main-nav, campaign, watch-roof, watch-combat, xr-ui, city, portal, portal-render, street, roof, canal, xr, market, coastal_browser_release, homecoming_browser, atmosphere-browser, tidewater-browser, grounded-browser]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            svgn-planet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.55.0 pillow
          python -m playwright install --with-deps chromium
      - name: Exercise exact source using real renderer and emulated inputs
        env:
          WARD_ROUTE: ${{ matrix.suite }}
          CITY_SUITE: ${{ matrix.suite }}
          WATCH_SUITE: ${{ matrix.suite }}
        run: |
          python -u svgn-planet/tests/serve-modules.py --port 8765 > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          python svgn-planet/tests/check-http-ready.py
          case "$WARD_ROUTE" in
            main) python svgn-planet/main-browser.py ;;
            main-nav) python svgn-planet/main-navigation-browser.py ;;
            campaign) python svgn-planet/lantern/campaign-browser.py ;;
            watch-roof|watch-combat|xr-ui) python svgn-planet/lantern/watch-browser.py ;;
            city|portal) python svgn-planet/lantern/city-browser.py ;;
            portal-render) python svgn-planet/lantern/portal-render-browser.py ;;
            street|roof|canal|xr) python svgn-planet/lantern/browser.py ;;
            market) python svgn-planet/lantern/market-browser.py ;;
            *) python "svgn-planet/tests/$WARD_ROUTE.py" ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-${{ matrix.suite }}
          path: |
            *-results/
            server.log
          retention-days: 30

  highline:
    needs: model
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: svgn-planet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.55.0 pillow
          python -m playwright install --with-deps chromium
      - name: Play the actual Highline source independently of long inherited suites
        run: |
          python -u svgn-planet/tests/serve-modules.py --port 8765 > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          python svgn-planet/tests/check-http-ready.py
          python svgn-planet/tests/environment-browser.py
          python svgn-planet/lantern/highline-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-highline
          path: |
            highline-results/
            environment-results/
            server.log
          retention-days: 30
