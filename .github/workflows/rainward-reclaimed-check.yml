name: Rainward reclaimed-city integration
on:
  push:
    branches: [feat/rainward-reclaimed-city-20260911]
    paths:
      - '.github/workflows/rainward-reclaimed-check.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore Rainward v0.8 source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, lzma
          data=''.join(p.read_text() for p in sorted(Path('.').glob('.rainward-v08-patch-*')))
          Path('/tmp/rainward-v08.patch').write_bytes(lzma.decompress(base64.b64decode(data, validate=True)))
          PY
          git apply --unidiff-zero --verbose /tmp/rainward-v08.patch
      - name: Verify upgraded source
        run: |
          for file in rainward/*.mjs; do node --check "$file"; done
          node --test rainward/tests/*.test.mjs
          python rainward/tests/release.py
          grep -q '"version": "0.8.0"' rainward/release.json
          grep -q 'whiteout' rainward/expeditions.mjs
      - name: Commit integrated game source
        run: |
          git config user.name 'Micah Blumberg'
          git config user.email '60057241+v5ma@users.noreply.github.com'
          git add index.html rainward
          git rm .rainward-v08-patch-* .github/workflows/rainward-reclaimed-check.yml
          git commit -m 'Upgrade Rainward to v0.8 Reclaimed City'
          git push origin HEAD:feat/rainward-reclaimed-city-20260911
