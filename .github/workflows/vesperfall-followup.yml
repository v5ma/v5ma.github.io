name: Integrate Vesperfall acceptance refinements
on:
  push:
    branches: [vesperfall-hollow-dominions-20260911]
    paths: ['.github/workflows/vesperfall-followup.yml', '.github/vesperfall-dominions-followup.json']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vesperfall-hollow-dominions-20260911
      - name: Apply conflict-checked test updates
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          manifest=Path('.github/vesperfall-dominions-followup.json')
          if manifest.exists():
            for change in json.loads(manifest.read_text()):
              p=Path(change['path']);assert p.parts[:2]==('vesperfall','tests') and '..' not in p.parts
              original=p.read_bytes();sha=hashlib.sha256(original).hexdigest()
              if sha==change['sha256']:continue
              assert sha==change['before'],f'Source changed: {p}'
              text=original.decode('utf-8')
              for a,b,value in reversed(change['ops']):text=text[:a]+value+text[b:]
              data=text.encode('utf-8');assert hashlib.sha256(data).hexdigest()==change['sha256']
              p.write_bytes(data);print('Updated',p)
            manifest.unlink()
          PY
          node --test vesperfall/tests/*.test.cjs
      - name: Commit the refined tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vesperfall/tests
          git add -u .github/vesperfall-dominions-followup.json
          if ! git diff --cached --quiet; then
            git commit -m 'Align retained acceptance checks with Hollow Dominions and preserve unrelated homepage changes'
            git push origin HEAD:vesperfall-hollow-dominions-20260911
          fi
