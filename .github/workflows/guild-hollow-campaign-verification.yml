name: Guild Hollow Campaign Verification
on:
  push:
    branches: [guild/hollow-final-verification-20260913]
    paths: ['leonardos-guild/tests/**', '.github/workflows/guild-hollow-campaign-verification.yml']
permissions:
  contents: read
jobs:
  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        journey: [campaign, watch, north]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm gameplay is byte-identical to accepted Cinder Hollow
        run: |
          set -euo pipefail
          git fetch --depth=1 origin fd6dca9a3eaa7b73b70f3f43736744a0c6bdd80e
          test -z "$(git diff fd6dca9a3eaa7b73b70f3f43736744a0c6bdd80e HEAD -- leonardos-guild ':!leonardos-guild/tests')"
          npm --prefix leonardos-guild test | tee /tmp/model-tests.txt
      - name: Install native browser
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Physical campaign travel and peaceful original mission completion
        env:
          JOURNEY: ${{ matrix.journey }}
          LIFE_SUITE: ${{ matrix.journey }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/legacy-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          if test "$JOURNEY" = campaign; then
            python -u leonardos-guild/tests/browser.py
          else
            python -u leonardos-guild/tests/life-browser.py
          fi
      - name: Retain actual source, screenshots, reports and failures
        if: always()
        env:
          JOURNEY: ${{ matrix.journey }}
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess,tarfile,shutil
          from pathlib import Path
          root=Path('leonardos-guild');j=os.environ['JOURNEY'];out=root/('test-output' if j=='campaign' else 'life-output/'+j);out.mkdir(parents=True,exist_ok=True)
          names=subprocess.check_output(['git','ls-files','leonardos-guild','.github/workflows','index.html'],text=True).splitlines()
          hashes={n:hashlib.sha256(Path(n).read_bytes()).hexdigest() for n in names if Path(n).is_file()}
          (out/'source-hashes.json').write_text(json.dumps(hashes,indent=2));(out/'tested-commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          diff=subprocess.check_output(['git','diff','--stat'],text=True);(out/'uncommitted-diff.txt').write_text(diff)
          if Path('/tmp/model-tests.txt').exists():shutil.copy('/tmp/model-tests.txt',out/'model-tests.txt')
          with tarfile.open(out/'source.tgz','w:gz') as t:
            for n in hashes:t.add(n,arcname=n)
          assert not diff,'Acceptance does not rewrite runtime'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hollow-verified-${{ matrix.journey }}
          path: |
            leonardos-guild/test-output/
            leonardos-guild/life-output/${{ matrix.journey }}/
          retention-days: 10
