name: Vesperfall Pilgrims Rest
on:
  push:
    branches: [master]
    paths: ['vesperfall/**', '.github/workflows/vesperfall-pilgrim.yml']
  pull_request:
    paths: ['vesperfall/**', '.github/workflows/vesperfall-pilgrim.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pilgrim-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, model regressions, workbook integrity and public boundary
        run: |
          set -euo pipefail
          mkdir -p test-output
          for f in vesperfall/*.js; do node --check "$f"; done
          node --test vesperfall/tests/*.test.cjs | tee test-output/pilgrim-model.tap
          python vesperfall/tests/production-workbook.py | tee test-output/workbook.log
          python scripts/check-vesperfall.py
      - name: Install native browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise native saved expeditions and production board
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 > test-output/server.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          timeout 850 python -u vesperfall/tests/pilgrim-browser.py | tee test-output/pilgrim-browser.log
          test -s test-output/pilgrim/report.json
          test ! -e test-output/pilgrim/failure.json
          timeout 300 python -u vesperfall/tests/production-browser.py | tee test-output/production-browser.log
          test -s test-output/production/report.json
          test ! -e test-output/production/failure.json
      - name: Archive exact tested source and diagnostics
        if: always()
        run: |
          mkdir -p test-output
          git rev-parse HEAD > test-output/source-revision.txt
          git diff --stat > test-output/uncommitted-diff.txt
          tar czf test-output/vesperfall-source.tgz vesperfall
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vesperfall-pilgrim-acceptance
          path: test-output/
          retention-days: 14
  publication:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Require all public runtime, asset, plan and workbook bytes to match
        run: python -u vesperfall/tests/verify-live.py
      - name: Inspect published workbook source consistency
        run: python vesperfall/tests/production-workbook.py
      - name: Install public verification browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise actual public saved expeditions with Xbox, Quest and AR fixtures
        env:
          TEST_BASE_URL: https://v5ma.github.io
        run: |
          set -euo pipefail
          timeout 850 python -u vesperfall/tests/pilgrim-browser.py | tee test-output/pilgrim-public-browser.log
          test -s test-output/pilgrim/report.json
          test ! -e test-output/pilgrim/failure.json
      - name: Exercise actual public planning board and download the workbook
        env:
          TEST_BASE_URL: https://v5ma.github.io
        run: |
          set -euo pipefail
          timeout 300 python -u vesperfall/tests/production-browser.py | tee test-output/production-public-browser.log
          test -s test-output/production/report.json
          test ! -e test-output/production/failure.json
      - name: Open the public game card, move and shoot
        env:
          TEST_BASE_URL: https://v5ma.github.io
        run: timeout 240 python -u vesperfall/tests/launch.py
      - name: Record merged source revision
        if: always()
        run: |
          mkdir -p test-output
          git rev-parse HEAD > test-output/source-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vesperfall-pilgrim-publication
          path: test-output/
          retention-days: 14
