name: Integrate Aether Aurora Cast
on:
  push:
    branches: [feat/aether-aurora-cast-20260912]
    paths: ['.github/workflows/aether-aurora-integrate.yml']
permissions:
  contents: write
concurrency:
  group: aether-aurora-integrate
  cancel-in-progress: true
jobs:
  integrate:
    if: github.repository == 'v5ma/v5ma.github.io' && github.ref == 'refs/heads/feat/aether-aurora-cast-20260912'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aether-aurora-cast-20260912
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the exact reviewed text integration
        run: python aether-reach/tools/apply-aurora.py
      - name: Retrieve author data and reproduce the standalone CC0 assets
        run: |
          python -m pip install gdown==5.2.0
          python - <<'PY'
          from pathlib import Path
          import gdown
          src=Path('/tmp/aurora-sources');src.mkdir(exist_ok=True)
          files=[('guard.gltf','1VGmU5f8a43NBT22JWB507NDSLbmNxzF9'),('worker.gltf','14d8n7IDnnlnGt_uiATnNg3uvi_4dyd9V'),('courier.gltf','1uxAFnDp73NO1c16LvHHjAYh1-deMNk5I'),('men-license.txt','1TTvylHa1CsiJuHFWWiv6PFGhLM-aAH5z'),('women-license.txt','1lIFL16xEpoPbr0j_HUATgmcEnAmYoIK2')]
          for name,id in files:
            gdown.download(id=id,output=str(src/name),quiet=False)
            assert (src/name).stat().st_size<10_000_000
          PY
          python aether-reach/tools/prepare-aurora-assets.py /tmp/aurora-sources aether-reach/art/characters
      - name: Run the complete source and asset regression
        run: |
          set -euo pipefail
          for f in aether-reach/*.mjs; do node --check "$f"; done
          python -m py_compile aether-reach/tools/prepare-aurora-assets.py aether-reach/tests/aurora-browser.py
          node --test aether-reach/tests/*.test.mjs | tee aether-reach/test-output/aurora-node.log
          node aether-reach/tests/release-manifest.mjs
      - name: Commit only the tested game and remove the temporary bootstrap
        run: |
          set -euo pipefail
          rm aether-reach/tools/apply-aurora.py aether-reach/tools/aurora-integration.json .github/workflows/aether-aurora-integrate.yml .github/workflows/aether-cast-sources.yml
          git add -A -- aether-reach .github/workflows/aether-aurora-integrate.yml .github/workflows/aether-cast-sources.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement Aether Reach 0.10.0 Aurora Cast with verified CC0 animated humans'
          git push origin HEAD:feat/aether-aurora-cast-20260912
      - name: Record exact source and test evidence
        if: always()
        run: |
          mkdir -p aether-reach/test-output
          git rev-parse HEAD > aether-reach/test-output/tested-commit.txt
          git diff --stat > aether-reach/test-output/uncommitted-diff.txt
          git archive --format=zip HEAD aether-reach index.html projects.css .github/workflows > aether-reach/test-output/aurora-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-aurora-integration
          path: aether-reach/test-output
          retention-days: 14
