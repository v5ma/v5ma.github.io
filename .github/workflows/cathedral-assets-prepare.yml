name: Prepare Vesperfall CC0 art
on:
  push:
    branches: [feat/vesperfall-living-cathedral]
    paths: [.github/workflows/cathedral-assets-prepare.yml]
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vesperfall-living-cathedral
      - run: |
          python -m pip install Pillow==11.3.0
          python scripts/prepare-cathedral-assets.py
      - name: Commit only the isolated local art collection
        run: |
          git config user.name 'Vesperfall art intake'
          git config user.email 'art@users.noreply.github.com'
          git add vesperfall/assets/cathedral
          if ! git diff --cached --quiet; then git commit -m 'Import CC0 castle masonry, paving and modeled marble sculpture'; git push; fi
      - if: always()
        run: |
          mkdir -p output
          git rev-parse HEAD > output/source-sha.txt
          find . -name AGENTS.md -not -path './.git/*' -print > output/agent-files.txt
          while IFS= read -r p; do printf '\n--- %s ---\n' "$p"; cat "$p"; done < output/agent-files.txt > output/agent-instructions.txt
          tar czf output/cathedral-source.tgz vesperfall index.html projects.css gloamward/index.html scripts/check-vesperfall.py scripts/prepare-cathedral-assets.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cathedral-art-baseline
          path: output/
          retention-days: 14
