name: Guild Steady Steps
on:
  push:
    branches: [guild/steady-steps-20260912]
    paths: ['leonardos-guild/**', '.github/workflows/guild-steady-steps.yml']
  pull_request:
    paths: ['leonardos-guild/**', '.github/workflows/guild-steady-steps.yml']
permissions:
  contents: read
concurrency:
  group: guild-steady-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare checked source only on the isolated feature branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'guild/steady-steps-20260912'
          if test ! -f leonardos-guild/STEADY-STEPS-INTEGRATION.json; then
            python leonardos-guild/scripts/prepare-steady-steps.py
            npm --prefix leonardos-guild test
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- leonardos-guild
            git commit -m 'Integrate Steady Steps v0.10.0 verified camera and character source'
            git push origin HEAD:refs/heads/guild/steady-steps-20260912
          fi
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  camera-and-motion:
    needs: prepare
    if: always() && !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate committed modules and retained model regressions
        run: |
          set -euo pipefail
          mkdir -p leonardos-guild/steady-output
          for f in leonardos-guild/*.mjs; do node --check "$f"; done
          npm --prefix leonardos-guild test | tee leonardos-guild/steady-output/model-tests.txt
      - name: Install native browser
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Fresh Xbox-input camera, joints, walls, floors and UI journey
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/steady-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python -u leonardos-guild/tests/steady-browser.py
      - name: Preserve actual screenshots, reports and immutable source identity
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,subprocess,tarfile
          from pathlib import Path
          out=Path('leonardos-guild/steady-output');out.mkdir(exist_ok=True)
          names=subprocess.check_output(['git','ls-files','leonardos-guild','.github/workflows'],text=True).splitlines()
          files={name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in names if Path(name).is_file()}
          (out/'source-hashes.json').write_text(json.dumps(files,indent=2))
          (out/'tested-commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          diff=subprocess.check_output(['git','diff','--stat'],text=True);(out/'uncommitted-diff.txt').write_text(diff)
          with tarfile.open(out/'source.tgz','w:gz') as t:
            for name in files:t.add(name,arcname=name)
          assert not diff,'Native acceptance must not rewrite runtime source'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guild-steady-steps-acceptance
          path: leonardos-guild/steady-output/
          retention-days: 10
