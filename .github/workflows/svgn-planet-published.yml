name: Verify published 3D Paper Delivery
on:
  push:
    branches: [master]
    paths: ['svgn-planet/**','.github/workflows/svgn-planet-published.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for this commit to finish Pages deployment
        env:
          DEPLOY_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYWAIT'
          import json,os,time,urllib.request,urllib.error
          commit=os.environ['GITHUB_SHA'];repo=os.environ['GITHUB_REPOSITORY']
          deadline=time.monotonic()+1200
          while time.monotonic()<deadline:
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/actions/runs?event=dynamic&head_sha='+commit+'&per_page=20',headers={'Authorization':'Bearer '+os.environ['DEPLOY_TOKEN'],'Accept':'application/vnd.github+json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:data=json.load(response)
              except (urllib.error.URLError,TimeoutError):
                  print('Deployment status temporarily unavailable',flush=True);time.sleep(10);continue
              candidates=[r for r in data['workflow_runs'] if r['head_sha']==commit and r['path']=='dynamic/pages/pages-build-deployment']
              if candidates:
                  run=max(candidates,key=lambda r:r['id'])
                  if run['status']=='completed':
                      assert run['conclusion']=='success','Pages did not deploy this commit: '+str(run['conclusion'])
                      print('Pages deployment succeeded:',run['id'],flush=True);break
                  print('Pages deployment:',run['status'],flush=True)
              else:print('Pages has not scheduled this commit yet',flush=True)
              time.sleep(10)
          else:raise SystemExit('No successful exact-commit Pages deployment within 20 minutes')
          PYWAIT
      - name: Compare deployed game and homepage with committed source
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,urllib.request,time,subprocess
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          paths=[p for p in Path('svgn-planet').rglob('*') if p.is_file() and p.suffix in ['.html','.css','.mjs','.js','.json','.webp'] and 'tests' not in p.parts]
          paths.append(Path('index.html'))
          expected={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths};results={}
          for attempt in range(60):
            for name,sha in expected.items():
              if results.get(name,{}).get('match'):continue
              try:
                with urllib.request.urlopen('https://v5ma.github.io/'+name+'?paper-delivery='+source,timeout=10) as response:
                  h=hashlib.sha256(response.read()).hexdigest();results[name]={'status':response.status,'sha256':h,'match':h==sha}
              except Exception as e:results[name]={'match':False,'error':str(e)}
            if len(results)==len(expected) and all(r['match'] for r in results.values()):break
            time.sleep(5)
          ok=len(results)==len(expected) and all(r['match'] for r in results.values())
          version=json.loads(Path('svgn-planet/release.json').read_text())['version']
          Path('planet-publication.json').write_text(json.dumps({'version':version,'source':source,'files':results,'all_match':ok},indent=2))
          assert ok,results
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-delivery-3d-publication
          path: planet-publication.json
          retention-days: 14
