name: Verify Prism Spectral Observatory
on:
  pull_request:
    paths: ['prism-current/**', '.github/workflows/prism-spectral.yml']
  push:
    branches: [master]
    paths: ['prism-current/**', '.github/workflows/prism-spectral.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prism-spectral-${{ github.ref }}
  cancel-in-progress: true
jobs:
  spectral:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: prism-current
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate shaders, pools, preferences and legacy rules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-output
          python prism-current/tests/verify.py
          node --test prism-current/tests/*.test.cjs | tee test-output/core.tap
      - name: Match the exact public release
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json,urllib.request,time,hashlib
          from pathlib import Path
          m=json.loads(Path('test-output/prism-manifest.json').read_text())
          files={p:h for p,h in m['files'].items() if p.startswith('prism-current/')};result={}
          for attempt in range(36):
            for path,expected in files.items():
              if result.get(path,{}).get('match'):continue
              try:
                with urllib.request.urlopen('https://v5ma.github.io/'+path+'?spectral='+m['source'][:12],timeout=12) as r:
                  h=hashlib.sha256(r.read()).hexdigest();result[path]={'sha256':h,'match':h==expected}
              except Exception as e:result[path]={'match':False,'error':str(e)}
            if len(result)==len(files) and all(v['match'] for v in result.values()):break
            time.sleep(6)
          receipt={'source':m['source'],'version':m['version'],'files':result,'all_match':len(result)==len(files) and all(v['match'] for v in result.values())}
          Path('test-output/spectral-publication.json').write_text(json.dumps(receipt,indent=2));assert receipt['all_match'],receipt
          PY
      - name: Install native Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise actual shaders and capture full-resolution themes
        env:
          PRISM_URL: ${{ github.event_name == 'push' && 'https://v5ma.github.io/prism-current/' || 'http://127.0.0.1:4173/prism-current/' }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/prism-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          timeout 360 python -u prism-current/tests/spectral-browser.py
      - if: always()
        run: |
          mkdir -p test-output
          git rev-parse HEAD > test-output/tested-commit.txt
          tar czf test-output/source.tgz prism-current index.html projects.css project-shortcuts.css
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-spectral-${{ github.event_name }}
          path: test-output/
          retention-days: 14
