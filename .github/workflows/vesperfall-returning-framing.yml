name: Vesperfall Returning Bell AR framing
on:
  push:
    branches: [vesperfall-returning-bell-20260915]
    paths: ['.github/workflows/vesperfall-returning-framing.yml']
permissions:
  contents: write
jobs:
  framing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Center the inspection UI without moving the tracked head or expedition
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          def read(path,sha):
           p=Path(path);b=p.read_bytes()
           assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==sha,path
           return p,b.decode()
          p,s=read('vesperfall/returning-bell.js','cd9ce39a5621d622e4a27d3064f5f3095130cadb')
          for a,b in [('addScaledVector(f,1.3).addScaledVector(right,-.28)','addScaledVector(f,1.8).addScaledVector(right,0)'),('Math.max(.35,p.y-.6)','Math.max(.35,p.y-.48)'),('new T.Vector3(.68,.22,.12)','new T.Vector3(0,.38,-.5)')]:
           assert s.count(a)==1,a
           s=s.replace(a,b)
          p.write_text(s)
          p,s=read('vesperfall/tests/returning-bell-browser.py','2382f0a09ee41ebac74edbeab8bf5db9669369a8')
          old="  handaction('Recenter');page.screenshot(path=str(OUT/'architects-table-hand-ui.png'))"
          new='''  handaction('Recenter')
            framing=page.evaluate("""()=>{const g=Vesperfall.component,T=g.T,panel=g.xrPanel.mesh,table=g.returningBell.table;
             panel.updateMatrixWorld(true);table.updateMatrixWorld(true);
             const w=panel.geometry.parameters.width/2,h=panel.geometry.parameters.height/2;
             const menu=[[-w,-h],[w,-h],[-w,h],[w,h]].map(([x,y])=>panel.localToWorld(new T.Vector3(x,y,0)));
             const box=new T.Box3().setFromObject(table),mini=[];
             for(const x of [box.min.x,box.max.x])for(const y of [box.min.y,box.max.y])for(const z of [box.min.z,box.max.z])mini.push(new T.Vector3(x,y,z));
             return g.scene.renderer.xr.getCamera().cameras.map(camera=>({menu:menu.map(p=>p.clone().project(camera).toArray()),table:mini.map(p=>p.clone().project(camera).toArray())}));}""")
            (OUT/'ar-framing.json').write_text(json.dumps(framing,indent=2))
            def in_view(points):return all(all(abs(v)<=.97 for v in p[:2]) and -1<=p[2]<=1 for p in points)
            check(len(framing)==2 and all(in_view(eye['menu']) for eye in framing),'The complete AR inspection menu fits both eyes in the initial gaze')
            check(len(framing)==2 and all(in_view(eye['table']) for eye in framing),'The discovered miniature fits both eyes after recentering without changing head pose')
            page.screenshot(path=str(OUT/'architects-table-hand-ui.png'))'''
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s)
          compile(s,str(p),'exec')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vesperfall/returning-bell.js vesperfall/tests/returning-bell-browser.py
          git commit -m 'fix(vesperfall): frame the AR table and full spatial menu inside both eye views'
          git push origin HEAD:vesperfall-returning-bell-20260915
      - name: Validate model, workbook and source boundaries
        run: |
          set -euo pipefail
          mkdir -p test-output
          for f in vesperfall/*.js; do node --check "$f"; done
          node --test vesperfall/tests/*.test.cjs | tee test-output/model.tap
          python vesperfall/tests/production-workbook.py | tee test-output/workbook.log
          python scripts/check-vesperfall.py
      - name: Install browser
        run: |
          python -m pip install playwright==1.57.0 pillow
          python -m playwright install --with-deps chromium
      - name: Play complete native chapter and inspect actual stereo bounds
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 > test-output/server.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          timeout 2100 python -u vesperfall/tests/returning-bell-browser.py | tee test-output/returning-browser.log
          test -s test-output/returning-bell/report.json
          test ! -e test-output/returning-bell/failure.json
      - name: Preserve exact source and visual evidence
        if: always()
        run: |
          mkdir -p test-output
          git rev-parse HEAD > test-output/source-revision.txt
          git diff --stat > test-output/uncommitted-diff.txt
          tar -czf test-output/vesperfall-source.tgz vesperfall scripts .github/workflows/vesperfall-returning-bell.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vesperfall-returning-framing
          path: test-output/
          retention-days: 14
