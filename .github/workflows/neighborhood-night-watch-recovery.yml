name: Recover Night Watch source
on:
  push:
    branches: [neighborhood-missions/night-watch-recovery-20260917]
    paths: ['.github/upgrades/night-watch-*', '.github/workflows/neighborhood-night-watch-recovery.yml']
permissions:
  contents: read
concurrency:
  group: night-watch-source-import
  cancel-in-progress: true
jobs:
  integrate:
    if: github.repository == 'v5ma/v5ma.github.io' && github.ref == 'refs/heads/neighborhood-missions/night-watch-recovery-20260917'
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            svgn-planet
            little-planet
            level-design-library/applied
            .github/upgrades
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify payload and preimages, apply scoped source, test and commit
        id: source
        run: python .github/upgrades/night-watch-install.py
      - name: Retain exact source and model evidence
        shell: bash
        run: tar -czf night-watch-source.tar.gz svgn-planet little-planet index.html level-design-library/applied .github/workflows SOURCE-COMMIT.txt night-watch-model.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: night-watch-recovered-source
          path: |
            night-watch-source.tar.gz
            night-watch-model.txt
          retention-days: 30
