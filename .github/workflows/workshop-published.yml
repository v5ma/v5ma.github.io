name: Verify published Route Workshop
on:
  push:
    branches: [master]
    paths: ['mario-maker-clone/svgn-paper-route/workshop*','mario-maker-clone/svgn-paper-route/route-workshop.js','.github/workflows/workshop-published.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check published editor bytes against this commit
        run: |
          python - <<'PY'
          import hashlib,json,time,urllib.request
          from pathlib import Path
          path='mario-maker-clone/svgn-paper-route/'
          names=['index.html','workshop-core.js','route-workshop.js','workshop.css','workshop-input.js','sky-network-runtime.js','sw.js']
          expected={n:hashlib.sha256(Path(path+n).read_bytes()).hexdigest() for n in names};result={}
          for _ in range(45):
            for n in names:
              if result.get(n,{}).get('match'):continue
              try:
                with urllib.request.urlopen('https://v5ma.github.io/'+path+n+'?workshop=1788655001',timeout=10) as r:
                  h=hashlib.sha256(r.read()).hexdigest();result[n]={'status':r.status,'sha256':h,'match':h==expected[n]}
              except Exception as e:result[n]={'error':str(e),'match':False}
            if len(result)==len(names) and all(v.get('match') for v in result.values()):break
            time.sleep(5)
          Path('workshop-publication.json').write_text(json.dumps(result,indent=2))
          assert all(v.get('match') for v in result.values()),result
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workshop-publication
          path: workshop-publication.json
          retention-days: 14
