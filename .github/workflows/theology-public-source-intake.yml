name: Check supplied public Theology research files
on:
  push:
    branches: [feat/theology-computational-intake-20260906]
    paths: [.github/workflows/theology-public-source-intake.yml]
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fetch only the supplied public sources and record access scope
        run: |
          python - <<'PY'
          import hashlib,json,time,urllib.request
          from pathlib import Path
          out=Path('public-source-intake');out.mkdir()
          jobs=[
            ('computational-proof','https://files.us.osf.io/v1/resources/3nywu/providers/osfstorage/6a6a86c120caf27b210e50d4'),
            ('tcnr-zenodo','https://zenodo.org/api/records/21693924'),
            ('tcnr-osf-mirror','https://files.us.osf.io/v1/resources/3nywu/providers/osfstorage/6a6a86bbc7fae5fe6622f006'),
            ('additional-osf-metadata','https://api.osf.io/v2/files/6a7eb5433da97c3f1bd90da5/'),
            ('additional-osf-direct','https://files.osf.io/v1/resources/3vsar/providers/osfstorage/6a7eb5433da97c3f1bd90da5')]
          report=[]
          for label,url in jobs:
            row={'id':label,'requestedUrl':url,'checkedAtUTC':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Theology-Source-Review/1.0','Accept':'application/pdf,application/json,text/html;q=0.8'})
              with urllib.request.urlopen(req,timeout=30) as response:
                data=response.read(20*1024*1024+1)
                assert len(data)<=20*1024*1024,'Source exceeded the 20 MiB bound'
                kind='pdf' if data.startswith(b'%PDF-') else 'json' if data.lstrip().startswith((b'{',b'[')) else 'html'
                path=out/(label+'.'+kind);path.write_bytes(data)
                row.update(status=response.status,file=path.name,kind=kind,bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
                if kind=='json':
                  meta=json.loads(data)
                  if label=='additional-osf-metadata':row['metadata']=meta.get('data',{}).get('attributes',{})
                  elif label=='tcnr-zenodo':row['metadata']={k:meta.get('metadata',{}).get(k) for k in ('title','publication_date','version','doi')}
            except Exception as error:row['error']=str(error)
            report.append(row)
            print(json.dumps(row,ensure_ascii=True))
          (out/'retrieval-report.json').write_text(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: theology-public-source-intake
          path: public-source-intake/
          retention-days: 7
          if-no-files-found: error
