name: Dino Atlas public workspace visibility
on:
  push:
    branches: [master]
    paths: ['dino-atlas/classic-xr.css', 'dino-atlas/tidegate.css', 'dino-atlas/tests/workspace-visibility-browser.py', '.github/workflows/dino-workspace-visibility.yml']
permissions:
  contents: read
concurrency:
  group: dino-workspace-visibility
  cancel-in-progress: true
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: dino-atlas
      - name: Install browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify served CSS and real public menu recovery
        run: python dino-atlas/tests/workspace-visibility-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dino-visibility-${{ github.run_id }}
          path: visibility-evidence/
          retention-days: 30
