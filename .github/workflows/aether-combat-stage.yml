name: Integrate checked public arsenal sources
on:
  push:
    branches: [feat/aether-arsenal-and-sky-transfers]
    paths: [.github/workflows/aether-combat-stage.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/aether-arsenal-and-sky-transfers'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate base and resulting hashes before any source writes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          changes=json.loads(Path('aether-reach/tools/combat-splices.json').read_text())
          assert set(changes)=={'aether-reach/'+p for p in ['model.mjs','scene.mjs','app.mjs','input-core.mjs','controllers.mjs','index.html']}
          pending=[]
          for name,change in changes.items():
              p=Path(name);raw=p.read_bytes();sha=hashlib.sha256(raw).hexdigest()
              if sha==change['after']:continue
              assert sha==change['before'],'Base changed; review rather than overwrite: '+name
              text=raw.decode('utf-8')
              for i,j,value in reversed(change['ops']):text=text[:i]+value+text[j:]
              result=text.encode('utf-8');assert hashlib.sha256(result).hexdigest()==change['after'],name
              pending.append((p,result))
          for p,raw in pending:p.write_bytes(raw)
          print('Verified',len(pending),'public runtime integrations.')
          PY
          for f in aether-reach/*.mjs; do node --check "$f"; done
          node --test aether-reach/tests/*.test.mjs
      - name: Commit only the six verified public files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aether-reach/model.mjs aether-reach/scene.mjs aether-reach/app.mjs aether-reach/input-core.mjs aether-reach/controllers.mjs aether-reach/index.html
          git diff --cached --stat
          git commit -m 'Integrate scoped arsenal, earned upgrade economy, enemy classes and carried-state rail transfers'
          git push origin HEAD:feat/aether-arsenal-and-sky-transfers
