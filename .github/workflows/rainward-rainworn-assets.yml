name: Inspect Rainward free character source
on:
  push:
    branches: [feat/rainward-rainworn-20260912]
    paths: ['.github/workflows/rainward-rainworn-assets.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect public author download pages without accounts or payment
        run: |
          mkdir -p test-output/character-source
          curl --fail --location --retry 3 --max-time 60 'https://quaternius.com/packs/universalbasecharacters.html' -o test-output/character-source/base-site.html
          curl --fail --location --retry 3 --max-time 60 'https://quaternius.itch.io/universal-base-characters' -o test-output/character-source/base-itch.html
          python - <<'PY'
          import re
          from pathlib import Path
          for p in Path('test-output/character-source').glob('*.html'):
              print(p.name)
              for match in re.finditer(r'.{0,80}(?:zip|download|csrf|game_id|upload_id|drive.google|dropbox).{0,200}',p.read_text(),re.I):print(match.group(0))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainward-character-source
          path: test-output/character-source/
          retention-days: 7
