name: Sky Cycle Waterwheel reference slice
on:
  push:
    branches: [master, 'sky-cycle/waterwheel-reference-0.23']
    paths:
      - 'mario-maker-clone/svgn-paper-route/**'
      - '!mario-maker-clone/svgn-paper-route/development/**'
      - '.github/workflows/sky-cycle-waterwheel.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sky-cycle-waterwheel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rules:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          git rev-parse HEAD
          node --check mario-maker-clone/svgn-paper-route/waterwheel.js
          node --check mario-maker-clone/svgn-paper-route/waterwheel-core.mjs
          node --test mario-maker-clone/svgn-paper-route/tests/*.test.mjs
          node --test tests/adventure_score.test.cjs
  routes:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        route: [road, quay, canal, express, xr]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Ride actual authored route with ordinary inputs
        env:
          WATERWHEEL_ROUTE: ${{ matrix.route }}
          ARTIFACT_DIR: /tmp/waterwheel-evidence
        run: python mario-maker-clone/svgn-paper-route/tests/waterwheel-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: waterwheel-${{ matrix.route }}-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/waterwheel-evidence/
          retention-days: 30
          if-no-files-found: error
  regressions:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        script: [portal-network-browser.py, bathhouse-browser.py, sunrise-browser.py]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Preserve prior routes and both XR input modes
        env:
          ARTIFACT_DIR: /tmp/waterwheel-regression
        run: python mario-maker-clone/svgn-paper-route/tests/${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: waterwheel-regression-${{ matrix.script }}-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/waterwheel-regression/
          retention-days: 30
          if-no-files-found: error
  published:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify all owned public files against this exact source
        env:
          ARTIFACT_DIR: /tmp/waterwheel-public
        run: python mario-maker-clone/svgn-paper-route/tests/waterwheel-published.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: waterwheel-public-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/waterwheel-public/
          retention-days: 30
          if-no-files-found: error
  live:
    needs: published
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Play public Waterwheel and verify old-save compatibility
        env:
          TEST_ORIGIN: https://v5ma.github.io
          WATERWHEEL_ROUTE: road
          ARTIFACT_DIR: /tmp/waterwheel-live
        run: python mario-maker-clone/svgn-paper-route/tests/waterwheel-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: waterwheel-live-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/waterwheel-live/
          retention-days: 30
          if-no-files-found: error
