name: Review Theology authorial formation edition
on:
  push:
    branches: [feat/theology-authorial-formation-20260906]
    paths: ['theology-wiki/**', '.github/workflows/theology-authorial-review.yml']
permissions:
  contents: write
concurrency:
  group: theology-authorial-${{ github.ref }}
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Materialize the integrity-checked source and workbook edition
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma,subprocess,zipfile,io,re
          root=Path.cwd();parts=sorted((root/'theology-wiki').glob('authorial-transfer-*.txt'))
          if parts:
              assert len(parts)==6
              expected,payload=''.join(p.read_text().strip() for p in parts).split(':',1)
              assert expected=='3ecb908ea6466a819003ea5f4a56cb5deeddb23d80f0aed39ec5145dbbfaf7b0'
              packed=base64.b64decode(payload,validate=True);assert hashlib.sha256(packed).hexdigest()==expected
              decoded=lzma.decompress(packed);assert len(decoded)<2000000
              package=json.loads(decoded)
              assert package['schema']=='theology-authorial-transfer/v1'
              allowed=set(package['finalHashes']);assert len(allowed)==46
              for name in allowed:
                  assert name.startswith('theology-wiki/') and '..' not in Path(name).parts
                  assert name=='theology-wiki/README.md' or name.startswith(('theology-wiki/editorial/','theology-wiki/tools/','theology-wiki/tests/')) or name=='theology-wiki/planning/workbook-manifest.json'
                  p=root/name;old=package['baseHashes'][name]
                  if old:assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==old,name
                  else:assert not p.exists(),name
              for base in package['canonicalBases']:
                  assert base['path'] in allowed and not (root/base['path']).exists()
                  raw=(root/base['source']).read_bytes();assert hashlib.sha256(raw).hexdigest()==base['sourceSha256']
                  text=re.sub(r'^---\n[\s\S]*?\n---\n\n# [^\n]+\n\n','',raw.decode()).split('\n\n## Source conversations\n',1)[0].strip()+'\n'
                  assert hashlib.sha256(text.encode()).hexdigest()==base['bodySha256']
                  p=root/base['path'];p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
              patch=Path('/tmp/theology-authorial.patch');patch.write_text(package['patch'])
              changed={line.split('\t')[-1] for line in subprocess.check_output(['git','apply','--numstat',str(patch)],text=True).splitlines()}
              assert changed<=allowed
              subprocess.run(['git','apply','--check',str(patch)],check=True);subprocess.run(['git','apply',str(patch)],check=True)
              for name,text in package['files'].items():
                  assert name in allowed and not (root/name).exists();p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
              for name,expected in package['finalHashes'].items():assert hashlib.sha256((root/name).read_bytes()).hexdigest()==expected,name
              # Lossless transport of the exact artifact_tool-exported workbook parts.
              workbook=root/'theology-wiki/planning/Theology-Research-Plan.xlsx'
              with zipfile.ZipFile(workbook) as old:
                  files=[]
                  for part in package['workbookParts']:
                      name=part['name'];assert '..' not in Path(name).parts and not name.startswith('/')
                      source=old.read(name).decode() if name in old.namelist() else ''
                      assert hashlib.sha256(source.encode()).hexdigest()==part['baseSha256'],name
                      tokens=source.split('>');out=[]
                      for op in part['ops']:out.extend(tokens[op[0]:op[1]] if len(op)==2 and isinstance(op[0],int) else op)
                      data='>'.join(out).encode();assert hashlib.sha256(data).hexdigest()==part['sha256'],name
                      files.append((name,data))
              output=io.BytesIO()
              with zipfile.ZipFile(output,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
                  for name,data in files:
                      info=zipfile.ZipInfo(name,(1980,1,1,0,0,0));info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=0o600<<16
                      z.writestr(info,data,compress_type=zipfile.ZIP_DEFLATED,compresslevel=6)
              assert hashlib.sha256(output.getvalue()).hexdigest()==package['workbookSha256']
              workbook.write_bytes(output.getvalue())
              # Never relabel older audio as a recording of the changed text.
              (root/'theology-wiki/products/media/manifest.json').unlink()
              for p in parts:p.unlink()
              print('Materialized and verified',len(allowed),'source files and the artifact_tool workbook.')
          PY
          if [ -f theology-wiki/tools/authorial-review-fix.py ]; then python theology-wiki/tools/authorial-review-fix.py; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build the source-pinned first-person edition
        run: |
          mkdir -p theology-test-output
          node theology-wiki/tools/build.cjs | tee theology-test-output/initial-build.txt
          git diff --exit-code -- theology-sources san-wiki-shell scripts theology-wiki/content/sources
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- theology-wiki
          if ! git diff --cached --quiet; then git commit -m 'Implement authorial Theology articles, Christic formation research and museum trail'; git push origin HEAD:${GITHUB_REF_NAME}; fi
      - name: Render fresh recordings from the changed first-person texts
        run: |
          set -o pipefail
          if [ ! -f theology-wiki/products/media/manifest.json ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq espeak-ng ffmpeg fonts-dejavu-core
            python -m pip install --quiet torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
            python -m pip install --quiet -r theology-wiki/tools/requirements-media.txt
            python -u theology-wiki/tools/render_product_media.py | tee theology-test-output/media-production.txt
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('theology-wiki/products/media/manifest.json').read_text())
          assert m['production']['engine']=='Kokoro 0.9.4'
          assert len(m['assets'])==2
          assert {a['kind'] for a in m['assets']}=={'episode','article'}
          PY
      - name: Check source integrity, direct authorial voice and exact media
        run: |
          set -o pipefail
          node theology-wiki/tools/build.cjs | tee theology-test-output/build-report.txt
          node --test theology-wiki/tests/research.test.cjs | tee theology-test-output/node-tests.txt
          git diff --exit-code -- theology-sources san-wiki-shell scripts theology-wiki/content/sources
          git add -- theology-wiki
          if ! git diff --cached --quiet; then git commit -m 'Record the authorial edition and retain source-matched media and workbook'; git push origin HEAD:${GITHUB_REF_NAME}; fi
      - name: Install native browser and verify existing museum images
        run: |
          python -m pip install --quiet playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium > /tmp/theology-browser-install.log 2>&1 || { tail -100 /tmp/theology-browser-install.log; exit 1; }
          python theology-wiki/tools/media.py
      - name: Exercise the real HTTP reader, formation trail and actual audio/video
        run: |
          python -m http.server 4174 --bind 127.0.0.1 > /tmp/theology-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python theology-wiki/tests/browser.py
      - name: Preserve tested source and review evidence
        if: always()
        run: |
          mkdir -p theology-test-output
          git rev-parse HEAD > theology-test-output/tested-commit.txt
          git diff --stat > theology-test-output/uncommitted-diff.txt
          cp /tmp/theology-http.log theology-test-output/ 2>/dev/null || true
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('theology-test-output/review-source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in Path('theology-wiki').rglob('*'):
              if p.is_file() and '__pycache__' not in p.parts and p.suffix.lower() not in {'.ttf','.otf','.woff','.woff2'} and not p.name.startswith('authorial-transfer-'):z.write(p,p.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theology-authorial-review
          path: theology-test-output/
          retention-days: 14
