name: Finalize Vesperfall beacon and expedition receipt
on:
  push:
    branches: [feat/vesperfall-quest-archery]
    paths: [.github/workflows/vesperfall-final-test.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vesperfall-quest-archery
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Open reward UI immediately after a successful beacon interaction
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          assert subprocess.check_output(['git','rev-parse','HEAD:vesperfall/app.js'],text=True).strip()=='f0e1ba3baa48271729a574c8d9c5a4b3a23fde5a'
          p=Path('vesperfall/app.js');s=p.read_text()
          old="if(!C.interact(this.game))this.toast(this.game.portalReady?"
          new="if(C.interact(this.game)){this.bank();this.lastPhase=this.game.phase;this.setPaused(true);return;}this.toast(this.game.portalReady?"
          assert old in s
          p.write_text(s.replace(old,new))
          p=Path('vesperfall/tests/browser.py');s=p.read_text()
          old="page.wait_for_function('Vesperfall.state.phase===\"reward\"')"
          assert old in s
          s=s.replace(old,old+";page.locator('#reward').wait_for(state='visible')")
          old="viewport={'width':1024,'height':720},service_workers='block',record_video_dir=str(OUT/'video')"
          new="viewport=({'width':800,'height':600} if MODE=='expedition' else {'width':1024,'height':720}),service_workers='block',**({} if MODE=='expedition' else {'record_video_dir':str(OUT/'video')})"
          assert old in s
          p.write_text(s.replace(old,new))
          p=Path('vesperfall/tests/core.test.cjs');s=p.read_text()
          s+='''
          test('Beacon interaction opens the reward menu immediately, without another playing tick',()=>{
           const fs=require('node:fs'),vm=require('node:vm');let component;
           const context={VesperCore:C,VesperInput:I,AFRAME:{registerComponent(n,d){component=d;}},document:{getElementById(){return null;}},window:{addEventListener(){}}};
           vm.createContext(context);vm.runInContext(fs.readFileSync(__dirname+'/../app.js','utf8'),context);
           const game=C.create('BEACON');game.kills=5;game.portalReady=true;game.score=700;const gate=game.world.rooms[game.world.exit];game.p=[gate.x,0,gate.z-3.8];
           let saves=0,opened=0;
           const owner={game,practice:false,banked:0,profile:I.cleanProfile({}),lastPhase:'playing',bank:component.bank,profileSave(){saves++;},setPaused(v){assert.equal(v,true);opened++;this.paused=true;},toast(){}};
           component.interact.call(owner);assert.equal(game.phase,'reward');assert.equal(owner.lastPhase,'reward');assert.equal(owner.paused,true);assert.equal(owner.profile.shards,5);assert.equal(saves,1);assert.equal(opened,1);
           component.interact.call(owner);assert.equal(saves,1);assert.equal(opened,1);assert.equal(owner.profile.shards,5);
          });
          test('Practice and unopened beacons cannot enter or bank a reward',()=>{
           const fs=require('node:fs'),vm=require('node:vm');let component;
           const context={VesperCore:C,VesperInput:I,AFRAME:{registerComponent(n,d){component=d;}},document:{getElementById(){return null;}},window:{addEventListener(){}}};vm.createContext(context);vm.runInContext(fs.readFileSync(__dirname+'/../app.js','utf8'),context);
           for(const practice of [true,false]){const game=C.create('NO-REWARD'),o={game,practice,toast(){},bank(){throw Error('Unexpected bank');},setPaused(){throw Error('Unexpected reward menu');}};component.interact.call(o);assert.equal(game.phase,'playing');}
          });
          '''
          p.write_text(s)
          PY
          node --check vesperfall/app.js
          node --test vesperfall/tests/core.test.cjs
          python -m py_compile vesperfall/tests/browser.py
          python scripts/check-vesperfall.py
          git config user.name 'Vesperfall reward-transition repair'
          git config user.email 'vesperfall@users.noreply.github.com'
          git add vesperfall/app.js vesperfall/tests/browser.py vesperfall/tests/core.test.cjs
          git commit -m 'Open and bank beacon rewards directly from interaction; add component regression tests'
          git push origin HEAD:feat/vesperfall-quest-archery
