name: Finalize Vesperfall expedition receipt
on:
  push:
    branches: [feat/vesperfall-quest-archery]
    paths: [.github/workflows/vesperfall-final-test.yml]
permissions:
  contents: write
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vesperfall-quest-archery
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('vesperfall/tests/browser.py');s=p.read_text()
          old="page.wait_for_function('Vesperfall.state.phase===\"reward\"');check(page.locator('#reward').is_visible()"
          new="page.wait_for_function('Vesperfall.state.phase===\"reward\"');page.locator('#reward').wait_for(state='visible');check(page.locator('#reward').is_visible()"
          assert old in s
          s=s.replace(old,new)
          old="context=browser.new_context(viewport={'width':1024,'height':720},service_workers='block',record_video_dir=str(OUT/'video'))"
          new="context=browser.new_context(viewport=({'width':800,'height':600} if MODE=='expedition' else {'width':1024,'height':720}),service_workers='block',**({} if MODE=='expedition' else {'record_video_dir':str(OUT/'video')}))"
          assert old in s
          s=s.replace(old,new)
          p.write_text(s)
          PY
          python -m py_compile vesperfall/tests/browser.py
          git config user.name 'Vesperfall native acceptance'
          git config user.email 'vesperfall@users.noreply.github.com'
          git add vesperfall/tests/browser.py
          git commit -m 'Await asynchronous reward-panel visibility; keep expedition graphics but omit CPU video recording'
          git push origin HEAD:feat/vesperfall-quest-archery
