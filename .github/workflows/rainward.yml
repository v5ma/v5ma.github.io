name: Rainward native survival acceptance
on:
  workflow_dispatch:
  push:
    branches: [feat/rainward-first-survival]
    paths: ['rainward/**','.github/workflows/rainward.yml','index.html']
  pull_request:
    paths: ['rainward/**','.github/workflows/rainward.yml']
permissions:
  contents: read
concurrency:
  group: rainward-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [ui, mission, controller, improvements]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Model and public-boundary checks
        run: |
          for file in rainward/*.mjs; do node --check "$file"; done
          node --test rainward/tests/*.test.mjs
      - name: Install native browser
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Play the actual HTTP game
        env:
          RAINWARD_SUITE: ${{ matrix.suite }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/rainward-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          case "$RAINWARD_SUITE" in
            controller) FILE=controller.py ;;
            improvements) FILE=improvements.py ;;
            *) FILE=browser.py ;;
          esac
          timeout 1000 python -u "rainward/tests/$FILE"
      - name: Preserve exact source and test evidence
        if: always()
        run: |
          mkdir -p test-output
          python rainward/tests/release.py
          git rev-parse HEAD > test-output/tested-commit.txt
          git diff --stat > test-output/uncommitted-diff.txt
          tar -czf test-output/rainward-source.tgz rainward index.html projects.css
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainward-${{ matrix.suite }}
          path: test-output/
          retention-days: 7
