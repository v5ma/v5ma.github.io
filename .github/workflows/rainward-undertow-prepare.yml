name: Integrate Rainward Undertow
on:
  push:
    branches: [feat/rainward-undertow-20260912]
    paths: ['rainward/tools/integrate-undertow.py','rainward/tools/refine-undertow.py','rainward/natatorium.mjs','rainward/natatorium-art.mjs','rainward/tests/aquatic.py','.github/workflows/rainward-undertow-prepare.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rainward-undertow-integration-v3
  cancel-in-progress: true
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/rainward-undertow-20260912'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rainward-undertow-20260912
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize current audio event syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('rainward/tools/integrate-undertow.py')
          s=p.read_text()
          old="else if(type==='land'){at('step-'+surfaceAt(state.player),0,{duration:.4,gain:.65});}"
          new="else if(type==='land')at('step-'+surfaceAt(state.player),0,{duration:.4,gain:.65});"
          if old in s:
              s=s.replace(old,new)
              p.write_text(s)
          PY
      - name: Integrate the seventh expedition and aquatic systems
        run: |
          python rainward/tools/integrate-undertow.py
          python rainward/tools/refine-undertow.py
      - name: Verify source, saves, routes and aquatic model behavior
        run: |
          set -o pipefail
          mkdir -p test-output
          python -m compileall -q rainward/tests rainward/tools
          for f in rainward/*.mjs; do node --check "$f"; done
          node --test rainward/tests/*.test.mjs | tee test-output/rainward-model-tests.txt
      - name: Commit verified Rainward integration to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rainward
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate Rainward v0.13 Undertow water mission and pool shaders'
            git push origin HEAD:feat/rainward-undertow-20260912
          fi
          git rev-parse HEAD > test-output/tested-commit.txt
      - name: Preserve exact source and evidence
        if: always()
        run: |
          mkdir -p test-output
          python rainward/tests/release.py
          tar -czf test-output/rainward-source.tgz rainward index.html projects.css
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainward-undertow-integration
          path: test-output/
          retention-days: 7
