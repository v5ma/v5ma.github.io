name: Verify open ramps and whip traversal
on:
  push:
    branches: [feat/open-ramps-whip-20260905]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: whip-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Integrate the live game entry
        run: |
          python scripts/integrate-open-whip.py
          python scripts/refine-open-whip.py
      - name: Commit only the explicit integration changes
        if: github.ref == 'refs/heads/feat/open-ramps-whip-20260905'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- mario-maker-clone/svgn-paper-route/index.html mario-maker-clone/svgn-paper-route/sw.js mario-maker-clone/svgn-paper-route/grapple-core.js mario-maker-clone/svgn-paper-route/open-course.js mario-maker-clone/svgn-paper-route/grapple-game.js mario-maker-clone/svgn-paper-route/delivery-upgrade.js tests/grapple_browser.py tests/sky_browser.py
          if ! git diff --cached --quiet; then git commit -m 'Integrate open ramps and whip into live Paper Delivery'; git push origin HEAD:${GITHUB_REF_NAME}; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and syntax checks
        run: |
          node --check mario-maker-clone/svgn-paper-route/grapple-game.js
          node --check mario-maker-clone/svgn-paper-route/open-course.js
          node --test tests/grapple_core.test.cjs tests/grapple_tolerance.test.cjs tests/sky_routes.test.mjs
      - name: Install browser
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Play the open-ramp and whip route in real 3D
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/whip-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python tests/grapple_browser.py
      - name: Identify the tested source
        if: always()
        run: |
          mkdir -p test-output/grapple
          git rev-parse HEAD > test-output/grapple/tested-commit.txt
          git diff --stat > test-output/grapple/uncommitted-diff.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-whip-proof
          path: test-output/grapple/
          retention-days: 7
      - name: Replay the original loop courses with the upgrade installed
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/whip-regression.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python tests/sky_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-loop-regression
          path: test-output/sky/
          retention-days: 7
