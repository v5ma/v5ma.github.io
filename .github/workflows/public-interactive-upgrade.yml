name: Validate interactive projects
on:
  push:
    branches: [feat/public-arcade-20260904, master]
    paths: ["scripts/**", "tests/interactive*", "dino-atlas/**", "mario-maker-clone/svgn-paper-route/**", "theology-wiki/san-reader.html", "index.html", "projects.css", ".nojekyll", ".github/workflows/public-interactive-upgrade.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: interactive-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Integrate existing public applications
        run: python scripts/prepare-interactive-site.py
      - name: Commit integrated source on the feature branch only
        if: github.ref == 'refs/heads/feat/public-arcade-20260904'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- mario-maker-clone/svgn-paper-route/index.html mario-maker-clone/svgn-paper-route/sw.js theology-wiki/san-reader.html dino-atlas/app.js dino-atlas/expedition.js
          if ! git diff --cached --quiet; then git commit -m 'Integrate public game upgrade and SAN theology reader'; git push origin HEAD:${GITHUB_REF_NAME}; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and test data, campaign, and geometry
        run: |
          node --check mario-maker-clone/svgn-paper-route/campaign.js
          node --check mario-maker-clone/svgn-paper-route/delivery-upgrade.js
          node --check dino-atlas/expedition.js
          node --test dino-atlas/tests/unit.test.mjs tests/interactive.test.mjs
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Test real HTTP applications and WebGL
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/site-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python tests/interactive_browser.py
      - name: Record source identity
        if: always()
        run: |
          mkdir -p test-output
          git rev-parse HEAD > test-output/tested-commit.txt
          git diff --stat > test-output/uncommitted-diff.txt
      - name: Check hosted routes after a master publication
        if: github.ref == 'refs/heads/master'
        run: |
          python - <<'PY'
          import time,urllib.request,json
          urls={'home':'https://v5ma.github.io/index.html','game':'https://v5ma.github.io/mario-maker-clone/svgn-paper-route/index.html','dino':'https://v5ma.github.io/dino-atlas/index.html','wiki':'https://v5ma.github.io/theology-wiki/san-reader.html','voxel':'https://v5ma.github.io/mario-maker-clone/svgn-paper-route/_voxelizer.js','markdown':'https://v5ma.github.io/theology-wiki/content/home.md'}
          expected={'home':'Follow your','game':'SVGN_INTERACTIVE_UPGRADE_20260904','dino':'expedition.js','wiki':'Theology Wiki','voxel':'voxelizeSprite','markdown':'Theology'}
          for attempt in range(36):
            result={}
            for name,url in urls.items():
              try:
                with urllib.request.urlopen(url+'?build=20260904',timeout=15) as r:
                  text=r.read().decode('utf-8');result[name]={'url':url,'status':r.status,'expected_content':expected[name] in text}
              except Exception as e:result[name]={'url':url,'error':str(e)}
            if all(r.get('status')==200 and r.get('expected_content') for r in result.values()):break
            time.sleep(5)
          from pathlib import Path
          Path('test-output/hosted-routes.json').write_text(json.dumps(result,indent=2))
          assert all(r.get('status')==200 and r.get('expected_content') for r in result.values()),result
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interactive-verification
          path: test-output/
          retention-days: 7
