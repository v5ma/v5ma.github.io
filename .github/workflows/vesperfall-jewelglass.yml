name: Vesperfall Jewelglass material and XR acceptance
on:
  pull_request:
    paths: ['vesperfall/**','scripts/check-vesperfall.py','.github/workflows/vesperfall-jewelglass.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jewelglass-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        suite: [visual, effects, xr]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test committed geometry, optics policy and preserved gameplay
        run: |
          set -o pipefail
          node --check vesperfall/jewelglass.js
          node --check vesperfall/jewel-shaders.js
          node --test vesperfall/tests/*.test.cjs | tee core-tests.tap
          python scripts/check-vesperfall.py
      - name: Install native browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise actual shaders and game inputs
        env:
          JEWEL_SUITE: ${{ matrix.suite }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/jewel-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          timeout 850 python -u vesperfall/tests/jewelglass-browser.py
      - name: Preserve actual renderer captures and exact source
        if: always()
        run: |
          mkdir -p test-output
          cp core-tests.tap test-output/ || true
          git rev-parse HEAD > test-output/tested-commit.txt
          git diff --stat > test-output/uncommitted-diff.txt
          tar czf test-output/source.tgz vesperfall scripts/check-vesperfall.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jewelglass-${{ matrix.suite }}
          path: test-output/
          retention-days: 14
