name: Verify Ride Lab and live flight guide
on:
  push:
    branches: [feat/ride-lab-flow-20260906]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ride-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check isolated live-physics rehearsals and editable geometry
        run: |
          node --check mario-maker-clone/svgn-paper-route/ride-lab-core.js
          node --check mario-maker-clone/svgn-paper-route/ride-lab-editor.js
          node --check mario-maker-clone/svgn-paper-route/ride-guide.js
          node --test tests/ride_lab.test.cjs tests/rail_repair.test.cjs tests/rail_yard.test.cjs tests/rail_hookline_flow.test.cjs tests/workshop_live.test.cjs
          git diff --exit-code
  native:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        suite: [editor, guide]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the pinned native browser
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Exercise actual editor gestures and native 3D riding
        env:
          LAB_SUITE: ${{ matrix.suite }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/ride-lab-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          timeout 900 python -u tests/ride_lab_browser.py
      - name: Preserve exact source and failure evidence
        if: always()
        run: |
          mkdir -p test-output
          git rev-parse HEAD > test-output/tested-commit.txt
          git diff --stat > test-output/uncommitted-diff.txt
          cp /tmp/ride-lab-http.log test-output/http.log || true
          tar -czf test-output/ride-lab-source.tgz mario-maker-clone/svgn-paper-route tests/ride_lab.test.cjs tests/ride_lab_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ride-lab-${{ matrix.suite }}
          path: test-output/
          retention-days: 7
