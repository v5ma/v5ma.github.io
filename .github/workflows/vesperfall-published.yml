name: Verify published Vesperfall demo
on:
  push:
    branches: [master]
    paths: ['vesperfall/**','gloamward/index.html','scripts/check-vesperfall.py','.github/workflows/vesperfall-published.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/check-vesperfall.py
      - name: Compare public bytes with the merged source
        run: |
          python - <<'PY'
          import json,hashlib,time,urllib.request
          from pathlib import Path
          m=json.loads(Path('test-output/vesperfall-manifest.json').read_text());results={}
          for attempt in range(48):
            for name,expected in m['files'].items():
              if results.get(name,{}).get('match'):continue
              try:
                with urllib.request.urlopen('https://v5ma.github.io/'+name+'?vesper='+m['source'],timeout=8) as r:
                  sha=hashlib.sha256(r.read()).hexdigest();results[name]={'status':r.status,'sha256':sha,'match':sha==expected}
              except Exception as e:results[name]={'match':False,'error':str(e)}
            if len(results)==len(m['files']) and all(v['match'] for v in results.values()):break
            time.sleep(5)
          ok=len(results)==len(m['files']) and all(v['match'] for v in results.values())
          Path('test-output/publication.json').write_text(json.dumps({'source':m['source'],'version':m['version'],'files':results,'all_match':ok},indent=2))
          assert ok,results
          PY
      - name: Install verification browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Click the real public card and play in the browser
        env:
          TEST_BASE_URL: https://v5ma.github.io
        run: timeout 240 python -u vesperfall/tests/launch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vesperfall-publication
          path: test-output/
          retention-days: 14
