name: Record grounded release evidence
on:
  push:
    branches: [neighborhood-missions/grounded-controls-20260914]
    paths: ['.github/workflows/neighborhood-grounded-record.yml']
permissions:
  contents: write
  actions: read
jobs:
  record:
    if: github.repository == 'v5ma/v5ma.github.io' && github.ref == 'refs/heads/neighborhood-missions/grounded-controls-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 32
          sparse-checkout: |
            svgn-planet
            .github/workflows
      - name: Verify acceptance, then update only release documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,pathlib,subprocess,time,urllib.request
          repo='v5ma/v5ma.github.io'
          tested='86d0346c93b95b8ea9dae65b2815a717dd9375b0'
          run_id=35000416468
          run_url=f'https://github.com/{repo}/actions/runs/{run_id}'
          def api(path):
              request=urllib.request.Request('https://api.github.com/repos/'+repo+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          for attempt in range(90):
              run=api(f'/actions/runs/{run_id}')
              assert run['head_sha']==tested,'Wrong source commit in acceptance run'
              if run['status']=='completed':break
              print('Waiting for the exact acceptance run:',run['status'],flush=True)
              time.sleep(10)
          else:raise SystemExit('Acceptance is still incomplete; no release records changed')
          assert run['conclusion']=='success','Acceptance failed; no release records changed'
          jobs=api(f'/actions/runs/{run_id}/jobs?per_page=100')['jobs']
          required={'model','browser (coastal_browser_release)','browser (homecoming_browser)','browser (atmosphere-browser)','browser (tidewater-browser)','browser (grounded-browser)','gate'}
          found={j['name']:j for j in jobs}
          assert required.issubset(found) and all(found[n]['conclusion']=='success' for n in required)
          # The work branch may add publication workflow changes, but no untested
          # game changes can be described as the accepted source.
          subprocess.run(['git','diff','--exit-code',tested,'HEAD','--','svgn-planet'],check=True)
          root=pathlib.Path('svgn-planet')
          evidence={'version':'0.11.0','edition':'Grounded Neighborhood','date':'2026-09-15','testedCommit':tested,'acceptanceRun':run_url,'automatedAcceptance':'passed','publication':'Pending normal merge, Pages deployment and live byte/browser verification. See v0.11.0-published.json when recorded.','unitTestsPassed':157,'browserSuitesPassed':5,'browserChecksRecorded':{'coastal':14,'homecoming':12,'grounded':15},'jobs':[{'name':n,'id':found[n]['id'],'conclusion':found[n]['conclusion']} for n in sorted(required)],'evidenceArtifacts':f'{run_url}#artifacts','saveAcceptance':'Historical v1 identity, legacy migration, backup-before-primary, interrupted writes, corrupt-primary recovery, future-schema write blocking, quota/security failures and retained original export passed. Import replacement remains explicitly confirmed and B cancels.','controllerAcceptance':'Xbox standard-mapping emulation, direct gameplay actions, menu neutral rearm and error/recovery navigation passed.','motionAcceptance':'Two-bone segment lengths and reach safety, world-fixed contact targets, idle phase, teleport/air release and finite riding poses passed; actual desktop captures retained.','xrAcceptance':'Synthetic native WebXR session with real Three r177 renderer; tracked rays/grips, joint-pinch menu selection, hand-only movement release, tracking-loss pause and session exit/reload passed.','xrPresentation':'World-anchored flat game screen in a comfort theater, not a stereo game world or room-scale locomotion.','physicalXboxTested':False,'physicalQuest3Tested':False,'hardwareFrameTargetCertified':False,'humanArtApproval':False,'aaaCertificationClaimed':False,'retainedSystems':['Original delivery routes and v1 save identity','Homecoming and exactly-once rewards','Tidewater pool/canal/relay activities','102 city contracts and credits','Unlimited cruise and weather/audio preferences'],'recoveryNote':'The earlier transfer failure was recovered. The waterfront input driver was changed to wait for actual simulation steps instead of repeatedly reading one slow WebGL frame; gameplay physics, arrival tolerance and rewards were not changed.'}
          (root/'production/evidence/v0.11.0.json').write_text(json.dumps(evidence,indent=2)+'\n')
          release=json.loads((root/'release.json').read_text())
          release.update(date='2026-09-15',testedCommit=tested,acceptanceRun=run_url,acceptance='Automated acceptance passed; live publication verification pending',validation={'unitTestsPassed':157,'browserSuitesPassed':5,'physicalControllerTested':False,'physicalQuest3Tested':False,'hardwareFrameTargetCertified':False,'commercialAAAQualityClaimed':False})
          (root/'release.json').write_text(json.dumps(release,indent=2)+'\n')
          roadmap=json.loads((root/'production/roadmap.json').read_text());roadmap['reviewed']='2026-09-15';roadmap['releaseEvidence']='evidence/v0.11.0.json'
          updates={
              'SAVE-02':{'status':'verified','next':'Automated corruption, quota, interruption, migration, original export and controller recovery checks passed. Keep multi-tab conflict resolution and cloud backup outside this release.'},
              'ART-01':{'next':'Measured procedural hero, two-link limbs and world-contact gait passed narrow automated checks. Review standing/running/riding captures and airborne transitions on hardware; skinned production art and authored animation remain open.'},
              'ART-02':{'next':'Pedal/grip target IK and finite riding poses passed automated checks. Human review of vehicle proportions, steering, contact accuracy and transitions remains open, as do suspension and authored hero meshes.'},
              'ACCESS-01':{'next':'Standard Xbox emulation, direct action mappings, neutral rearm and recovery dialogs passed. Complete physical Xbox USB/Bluetooth and Quest 3 device tests; OS text entry and downloads remain outside the in-game UI.'},
              'XR-01':{'status':'needs-playtest','next':'Synthetic session/render/input and controller/hand lifecycle checks passed. Obtain physical Quest 3 comfort, Touch Plus, hand-tracking and performance approval. Stereo game-world rendering is not implemented.'},
              'QA-01':{'acceptance':'Grounded Neighborhood has 157 passing model/save/motion/input tests and five successful browser suites covering the retained game, Homecoming, atmosphere, Tidewater and synthetic XR. Logs and real desktop screenshots are retained. Software WebGL and synthetic devices do not certify physical hardware.','next':'Retain these exact-source checks, obtain physical controller/GPU/headset sign-off and run the extended soak gate.'},
              'BUILD-01':{'acceptance':'Each release must be merged without overwriting sibling games, deployed by Pages and checked against its source bytes. A passing candidate alone is not a published release.','next':'Merge the accepted v0.11.0 candidate normally and retain v0.11.0-published.json after the live byte and browser gate succeeds.'},
              'BUILD-02':{'status':'partial','next':'Scoped read-only model/browser and publication workflows are integrated. Live verification includes modules, all assets, licenses and evidence with bounded cache-propagation retries. Complete publication verification and a scoped rollback drill; do not force-push.'}
          }
          for item in roadmap['items']:
              if item['id'] in updates:
                  item.update(updates[item['id']]);item['lastReviewed']='2026-09-15'
                  for ref in ['evidence/v0.11.0.json',run_url]:
                      if ref not in item['evidence']:item['evidence'].append(ref)
          (root/'production/roadmap.json').write_text(json.dumps(roadmap,indent=2)+'\n')
          subprocess.run(['python','svgn-planet/production/render-roadmap.py'],check=True)
          (root/'DEVELOPMENT-HANDOFF.md').write_text('# Neighborhood Missions development handoff\n\nGrounded Neighborhood v0.11.0 is accepted by automated tests on commit '+tested+'. Acceptance run: '+run_url+'. This checkpoint still requires a normal merge, Pages publication and live verification; read production/evidence/v0.11.0-published.json when present. Do not report a candidate as published.\n\nRead GROUNDED-NEIGHBORHOOD.md, release.json, production/roadmap.json and production/evidence/v0.11.0.json. SAVE-02 now has narrow automated evidence. ART-01/02 remain partial. XR-01 needs physical playtesting: this release is a flat comfort theater with tracked controller and hand UI, not stereo game-world rendering.\n\nNever change the v1 key or historical IDs, remove old missions, force-push over sibling games, or close physical hardware/art gates from synthetic results. The next engineering priority is PERF-03: bounded world streaming and stable frame pacing. PERF-02 and QA-02 require a named desktop and real Xbox sessions; Quest 3 requires actual Touch Plus and hand-tracking sessions. Production hero art, animation, interior gameplay and the 30-minute soak remain open.\n\nRun node --test svgn-planet/tests/*.test.mjs plus all five browser suites in .github/workflows/neighborhood-grounded.yml. The waterfront driver waits for actual simulation steps and does not teleport the player except for its documented canal-start save fixture. Rebuild AAA_ROADMAP.md using production/render-roadmap.py after editing the JSON. Archive exact source, test results and live hashes. Roll back only this game with a new scoped revert commit; never reset the shared master branch.\n')
          allowed={'svgn-planet/release.json','svgn-planet/production/evidence/v0.11.0.json','svgn-planet/production/roadmap.json','svgn-planet/AAA_ROADMAP.md','svgn-planet/DEVELOPMENT-HANDOFF.md'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed.issubset(allowed),changed
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',*sorted(allowed)],check=True)
          # This one-time writer is removed; continuing regression CI stays read-only.
          subprocess.run(['git','rm','.github/workflows/neighborhood-grounded-record.yml'],check=True)
          subprocess.run(['git','commit','-m','docs(neighborhood): record exact accepted v0.11 source; keep physical gates open'],check=True)
          subprocess.run(['git','push','origin','HEAD:neighborhood-missions/grounded-controls-20260914'],check=True)
          PY
          git rev-parse HEAD > RELEASE-EVIDENCE-COMMIT.txt
          git show --stat --oneline HEAD
          tar -czf neighborhood-records.tar.gz svgn-planet/release.json svgn-planet/AAA_ROADMAP.md svgn-planet/DEVELOPMENT-HANDOFF.md svgn-planet/production/roadmap.json svgn-planet/production/evidence/v0.11.0.json RELEASE-EVIDENCE-COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: neighborhood-records
          path: neighborhood-records.tar.gz
          retention-days: 30
