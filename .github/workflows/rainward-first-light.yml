name: Rainward First Light exploration
on:
  pull_request:
    paths: ['rainward/**','.github/workflows/rainward-first-light.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rainward-first-light-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source and model regression
        run: |
          python -m compileall -q rainward/tests
          for f in rainward/*.mjs; do node --check "$f"; done
          node --test rainward/tests/*.test.mjs
      - name: Install actual browser
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Explore and save through normal inputs
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/rainward-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          timeout 780 python -u rainward/tests/first-light.py
      - name: Preserve exact source and evidence
        if: always()
        run: |
          mkdir -p test-output
          python rainward/tests/release.py
          git rev-parse HEAD > test-output/tested-commit.txt
          tar -czf test-output/rainward-source.tgz rainward index.html projects.css
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainward-first-light
          path: test-output/
          retention-days: 7
