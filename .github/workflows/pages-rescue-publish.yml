name: Publish current master to GitHub Pages
on:
  push:
    branches: [master]
    paths: ['.github/workflows/**', 'scripts/theology-connectivity-artifact.cjs', 'scripts/theology-connectivity-artifact.test.cjs', 'theology-wiki/**']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-rescue-publish
  cancel-in-progress: true
# Publish current master, never an older snapshot. Since 2026-09-25 (Micah's decision) this site hosts only the
# Theology Wiki: the games moved to superinformationtheory.com/games; everything else stays in git history.
# Each build attempt gets a distinct artifact; deploy-only retries reuse the
# exact successful build output. Preserve older artifacts rather than deleting them.
# November 9 archive-context correction: preserve the original record; qualify its historical claim.
# November 9 RPPA bridge: publish the tested Revelation, Gaza, AGI and participatory unsealing connections.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      source: ${{ steps.source.outputs.sha }}
      artifact: ${{ steps.source.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          submodules: recursive
          persist-credentials: false
      - name: Record the actual current-master source being published
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "artifact=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD
          shasum -a 256 index.html 404.html agent-wiki-theology-route.html
          shasum -a 256 theology-wiki/index.html theology-wiki/san-reader.html theology-sources/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test publication-only connectivity integration
        run: node --test theology-wiki/connections/test.cjs scripts/theology-connectivity-artifact.test.cjs
      - name: Copy current source and add verified wiki connections
        run: node scripts/theology-connectivity-artifact.cjs .pages-connectivity > connectivity-artifact-report.json
      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.source.outputs.artifact }}
          path: .pages-connectivity
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Identify the published source
        env:
          PAGES_SOURCE: ${{ needs.build.outputs.source }}
        run: echo "Publishing current master at $PAGES_SOURCE"
      - name: Deploy current master
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}

# Evidence edition release 2026-11-09: publish the current master after its candidate gate.

# November 9 alternative inheritances: publish the tested reciprocal Samaritan and scrolls routes.

# November 9 clouds comparison: publish only after the candidate validation gate.

# November 9 grandmaster refinement: publish the tested deep-pattern reasoning clarification.

