name: Publish current master to GitHub Pages
on:
  push:
    branches: [master]
    paths: ['.github/workflows/pages-rescue-publish.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-rescue-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          submodules: recursive
          persist-credentials: false
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy current master
        id: deployment
        uses: actions/deploy-pages@v5
