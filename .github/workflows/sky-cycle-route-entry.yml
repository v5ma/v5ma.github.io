name: Sky Cycle verification
on:
  push:
    branches: [master]
    paths:
      - 'mario-maker-clone/svgn-paper-route/**'
      - '!mario-maker-clone/svgn-paper-route/development/**'
      - '.github/workflows/sky-cycle-route-entry.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sky-cycle-route-entry-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact rules and source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/route-rules
          git rev-parse HEAD > /tmp/route-rules/commit.txt
          node --check mario-maker-clone/svgn-paper-route/route-entry.js
          node --test mario-maker-clone/svgn-paper-route/tests/*.test.mjs | tee /tmp/route-rules/game.tap
          node --test tests/adventure_score.test.cjs | tee /tmp/route-rules/score.tap
          git archive --format=tar.gz HEAD mario-maker-clone tests .github/workflows level-design-library > /tmp/route-rules/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-rules-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/route-rules/
          retention-days: 30
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [ar, vr]
        script: [route-entry-browser.py, xr-buttons-browser.py, xr-workspace-browser.py]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Actual route, menu and editor journey with explicitly emulated hardware
        env:
          XR_MODE: ${{ matrix.mode }}
          ARTIFACT_DIR: /tmp/route-native
        run: python mario-maker-clone/svgn-paper-route/tests/${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-${{ matrix.script }}-${{ matrix.mode }}-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/route-native/
          retention-days: 30
          if-no-files-found: error
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        script: [portal-network-browser.py, waterwheel-deliveries-browser.py, bathhouse-browser.py, sunrise-browser.py]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Preserve existing route and save contracts
        env:
          ARTIFACT_DIR: /tmp/route-regression
        run: python mario-maker-clone/svgn-paper-route/tests/${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-${{ matrix.script }}-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/route-regression/
          retention-days: 30
          if-no-files-found: error
  fork:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        grip: [forgiving, precision]
        scenario: [high, lower, early, coast]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Recovered Canal Choice through original controls, collision and save owners
        env:
          FORK_GRIP: ${{ matrix.grip }}
          FORK_CASE: ${{ matrix.scenario }}
          ARTIFACT_DIR: /tmp/canal-native
        run: python mario-maker-clone/svgn-paper-route/tests/waterwheel-fork-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canal-${{ matrix.grip }}-${{ matrix.scenario }}-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/canal-native/
          retention-days: 30
          if-no-files-found: error
  published:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Independent 38-file public runtime hash match
        env:
          ARTIFACT_DIR: /tmp/route-public
        run: python mario-maker-clone/svgn-paper-route/tests/xr-workspace-published.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-public-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/route-public/
          retention-days: 30
          if-no-files-found: error
  live:
    needs: published
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [ar, vr]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Public route choice, denial, switching and save continuity
        env:
          XR_MODE: ${{ matrix.mode }}
          TEST_ORIGIN: https://v5ma.github.io
          ARTIFACT_DIR: /tmp/route-live
        run: python mario-maker-clone/svgn-paper-route/tests/route-entry-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-live-${{ matrix.mode }}-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/route-live/
          retention-days: 30
          if-no-files-found: error
  live-canal:
    needs: published
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Public lower-route return and actual terrace delivery
        env:
          FORK_GRIP: forgiving
          FORK_CASE: lower
          TEST_ORIGIN: https://v5ma.github.io
          ARTIFACT_DIR: /tmp/canal-live
        run: python mario-maker-clone/svgn-paper-route/tests/waterwheel-fork-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canal-live-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/canal-live/
          retention-days: 30
          if-no-files-found: error
