name: Neighborhood grounded published verification
on:
  push:
    branches: [master]
    paths: ['svgn-planet/**', '.github/workflows/neighborhood-grounded-published.yml']
permissions:
  contents: read
jobs:
  published:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            svgn-planet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check exact deployed release before browser acceptance
        env:
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p published-results
          python - <<'PY'
          import hashlib,json,os,pathlib,time,urllib.request
          base='https://v5ma.github.io/'
          root=pathlib.Path('svgn-planet')
          commit=os.environ['COMMIT']
          def read(path):
              req=urllib.request.Request(base+path+'?verify='+commit+'&t='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  assert response.status==200
                  return response.read()
          expected=(root/'index.html').read_bytes()
          for attempt in range(60):
              try:
                  if read('svgn-planet/index.html')==expected:break
              except Exception as e: print(type(e).__name__,str(e),flush=True)
              time.sleep(10)
          else: raise SystemExit('Pages did not serve this commit within the verification window')
          paths=sorted([p for p in root.glob('*') if p.is_file() and p.suffix in ['.mjs','.html','.css','.json']]+[root/'production/roadmap.json',root/'vendor/three.module.js',root/'vendor/three.core.js'])
          evidence={'commit':commit,'base':base+'svgn-planet/','version':json.loads((root/'release.json').read_text())['version'],'files':[],'success':False}
          try:
              for p in paths:
                  content=read(p.as_posix());actual=hashlib.sha256(content).hexdigest();wanted=hashlib.sha256(p.read_bytes()).hexdigest()
                  evidence['files'].append({'path':p.as_posix(),'sha256':actual,'matches':actual==wanted})
                  assert actual==wanted,'Published byte mismatch: '+str(p)
              evidence['success']=True
          finally:pathlib.Path('published-results/byte-verification.json').write_text(json.dumps(evidence,indent=2))
          print('Verified',len(paths),'deployed files against',commit)
          PY
      - name: Install browser harness
        run: |
          python -m pip install playwright==1.55.0 pillow
          python -m playwright install --with-deps chromium
      - name: Live desktop, synthetic Xbox and synthetic XR acceptance
        env:
          GROUNDED_BASE: https://v5ma.github.io/svgn-planet/
          GROUNDED_OUTPUT: published-results
        run: python svgn-planet/tests/grounded-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neighborhood-grounded-published
          path: published-results/
          retention-days: 30
