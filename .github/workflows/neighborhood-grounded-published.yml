name: Neighborhood grounded published verification
on:
  push:
    branches: [master]
    paths: ['svgn-planet/**', '.github/workflows/neighborhood-grounded-published.yml']
permissions:
  contents: read
  actions: read
jobs:
  published:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            svgn-planet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for this commit to finish Pages deployment
        env:
          DEPLOY_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYWAIT'
          import json,os,time,urllib.request,urllib.error
          commit=os.environ['GITHUB_SHA'];repo=os.environ['GITHUB_REPOSITORY']
          deadline=time.monotonic()+1200
          while time.monotonic()<deadline:
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/actions/runs?event=dynamic&head_sha='+commit+'&per_page=20',headers={'Authorization':'Bearer '+os.environ['DEPLOY_TOKEN'],'Accept':'application/vnd.github+json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:data=json.load(response)
              except (urllib.error.URLError,TimeoutError):
                  print('Deployment status temporarily unavailable',flush=True);time.sleep(10);continue
              candidates=[r for r in data['workflow_runs'] if r['head_sha']==commit and r['path']=='dynamic/pages/pages-build-deployment']
              if candidates:
                  run=max(candidates,key=lambda r:r['id'])
                  if run['status']=='completed':
                      assert run['conclusion']=='success','Pages did not deploy this commit: '+str(run['conclusion'])
                      print('Pages deployment succeeded:',run['id'],flush=True);break
                  print('Pages deployment:',run['status'],flush=True)
              else:print('Pages has not scheduled this commit yet',flush=True)
              time.sleep(10)
          else:raise SystemExit('No successful exact-commit Pages deployment within 20 minutes')
          PYWAIT
      - name: Verify the frozen original runtime and assets
        run: |
          mkdir -p published-results
          python - <<'PY'
          import concurrent.futures,hashlib,json,pathlib,time,urllib.request
          manifest=json.loads(pathlib.Path('svgn-planet/legacy-layout.json').read_text());rows={}
          def check(item):
              row={'path':item['path'],'matches':False}
              try:
                  url='https://v5ma.github.io/svgn-planet/'+item['path']+'?verify-legacy='+str(time.time_ns())
                  with urllib.request.urlopen(url,timeout=25) as r:data=r.read()
                  row['sha256']=hashlib.sha256(data).hexdigest();row['matches']=row['sha256']==item['sha256']
              except Exception as e:row['error']=str(e)
              return row
          for _ in range(60):
              pending=[p for p in manifest['files'] if not rows.get(p['path'],{}).get('matches')]
              if not pending:break
              with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
                  for row in pool.map(check,pending):rows[row['path']]=row
              if all(r['matches'] for r in rows.values()):break
              time.sleep(10)
          receipt={'layout':manifest['layout'],'files':list(rows.values()),'success':len(rows)==len(manifest['files']) and all(r['matches'] for r in rows.values())}
          pathlib.Path('published-results/legacy-bytes.json').write_text(json.dumps(receipt,indent=2))
          assert receipt['success'],'Preserved original game bytes do not match the frozen layout'
          PY
      - name: Install browser harness
        run: |
          python -m pip install playwright==1.55.0 pillow
          python -m playwright install --with-deps chromium
      - name: Live original desktop, synthetic Xbox and theater XR acceptance
        env:
          GROUNDED_BASE: https://v5ma.github.io/svgn-planet/legacy.html
          GROUNDED_OUTPUT: published-results
        run: python svgn-planet/tests/grounded-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neighborhood-grounded-published
          path: published-results/
          retention-days: 30
# Full current chapter, documentation and evidence byte verification now lives
# in neighborhood-lantern-published.yml. This job independently preserves the
# original 102-file layout and its complete retained live browser journey.
