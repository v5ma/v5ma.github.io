name: Review Theology connected arguments
on:
  push:
    branches: [feat/theology-bridges-publication-20260907]
    paths: ['theology-wiki/**', '.github/workflows/theology-bridges-review.yml']
permissions:
  contents: write
concurrency:
  group: theology-bridges-${{ github.ref }}
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize the exact checked editorial and implementation sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma,subprocess
          root=Path('theology-wiki');parts=sorted(root.glob('bridges-transfer-*.txt'))
          assert len(parts)==4
          digest,payload=''.join(p.read_text().strip() for p in parts).split(':',1)
          assert digest=='47ed5d8fe43d8b14076e93631e75f7f17239a78441e05be8fae6d59a08560556'
          packed=base64.b64decode(payload,validate=True)
          assert len(packed)==30352 and hashlib.sha256(packed).hexdigest()==digest
          decoded=lzma.decompress(packed);assert len(decoded)==121258
          package=json.loads(decoded);assert package['schema']=='theology-bridges-source/v1'
          allowed={'theology-wiki/README.md','theology-wiki/assets/css/connected.css','theology-wiki/assets/js/connected-tools.js','theology-wiki/assets/js/research-tools.js','theology-wiki/editorial/bridge-studies/apocalypse-and-repair.md','theology-wiki/editorial/bridge-studies/contested-memories-of-catastrophe.md','theology-wiki/editorial/bridge-studies/inward-formation-and-accountable-intelligence.md','theology-wiki/editorial/bridge-studies/sanctuary-community-and-body.md','theology-wiki/editorial/connected-arguments.json','theology-wiki/tests/browser.py','theology-wiki/tests/connected.test.cjs','theology-wiki/tests/connected_checks.py','theology-wiki/tests/foundations.test.cjs','theology-wiki/tests/research.test.cjs','theology-wiki/tools/build.cjs','theology-wiki/tools/connected.cjs'}
          assert set(package['finalHashes'])==set(package['baseHashes'])==allowed
          sha=lambda b:hashlib.sha256(b).hexdigest()
          for name,old in package['baseHashes'].items():
            p=Path(name)
            if old:assert p.is_file() and sha(p.read_bytes())==old,name
            else:assert not p.exists(),name
          patch=Path('/tmp/theology-bridges.patch');patch.write_text(package['patch'])
          changed={line.split('\t')[-1] for line in subprocess.check_output(['git','apply','--numstat',str(patch)],text=True).splitlines()}
          assert changed=={p for p in allowed if package['baseHashes'][p]}
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          assert set(package['files'])==allowed-changed
          for name,text in package['files'].items():
            p=Path(name);assert not p.exists();p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
          for name,expected in package['finalHashes'].items():assert sha(Path(name).read_bytes())==expected,name
          for p in parts:p.unlink()
          Path('.github/workflows/theology-bridges-review.yml').unlink()
          print('Verified all sixteen source files and removed temporary transfers and workflow.')
          PY
      - name: Build the new routes and verify the retained research edition
        run: |
          set -o pipefail
          mkdir -p theology-test-output
          node theology-wiki/tools/build.cjs | tee theology-test-output/build-report.txt
          node --test theology-wiki/tests/research.test.cjs | tee theology-test-output/node-tests.txt
          git diff --exit-code -- theology-sources san-wiki-shell scripts theology-wiki/content/sources theology-wiki/products theology-wiki/planning theology-wiki/data/source-atlas.json theology-wiki/data/museum-manifest.json theology-wiki/data/roadmap.json theology-wiki/data/foundations.json theology-wiki/data/evidence-workbench.json
      - name: Preserve readable sources and generated pages on the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- theology-wiki .github/workflows/theology-bridges-review.yml
          git commit -m 'Connect Theology investigations through bridge essays and chapter argument maps'
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Install the native browser and verify retained museum images
        run: |
          python -m pip install --quiet playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium >/tmp/theology-browser-install.log 2>&1 || { tail -100 /tmp/theology-browser-install.log; exit 1; }
          python theology-wiki/tools/media.py
      - name: Exercise the actual reader, connected diagrams and existing media
        run: |
          set -o pipefail
          python -m http.server 4174 --bind 127.0.0.1 >/tmp/theology-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python theology-wiki/tests/browser.py | tee theology-test-output/browser-tests.txt
      - name: Preserve source identity and review evidence
        if: always()
        run: |
          mkdir -p theology-test-output
          git rev-parse HEAD >theology-test-output/tested-commit.txt
          git diff --stat >theology-test-output/uncommitted-diff.txt
          cp /tmp/theology-http.log theology-test-output/ 2>/dev/null || true
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('theology-test-output/reader-review.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in Path('theology-wiki').rglob('*'):
              if p.is_file() and '__pycache__' not in p.parts and p.suffix.lower() not in {'.ttf','.otf','.woff','.woff2'} and not p.name.startswith('bridges-transfer-'):z.write(p,p.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theology-bridges-review
          path: theology-test-output/
          retention-days: 14
