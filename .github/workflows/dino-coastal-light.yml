name: Dino Atlas Coastal Light
on:
  push:
    branches: [dino-coastal-light-20260912, master]
    paths: ['dino-atlas/**', '.github/workflows/dino-coastal-light.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dino-coastal-light-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            dino-atlas
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all existing and new models, saves and physics
        run: |
          mkdir -p coastal-evidence
          find dino-atlas -maxdepth 1 -name '*.js' -exec node --check {} \;
          set -o pipefail
          node --test dino-atlas/tests/*.test.mjs | tee coastal-evidence/model-tests.tap
      - name: Install real browser renderer
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Compile candidate shaders and exercise Xbox settings and gameplay
        if: github.ref != 'refs/heads/master'
        run: |
          python dino-atlas/tests/coastal-light-browser.py
          cp coastal-evidence/report.json coastal-evidence/candidate-report.json
      - name: Keep the Living Herds controller field study working
        run: python dino-atlas/tests/living-herds-browser.py
      - name: Keep the complete Storm Response controller mission working
        run: python dino-atlas/tests/aaa-browser.py
      - name: Record exact runtime and production-checklist identity
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          root=Path('dino-atlas');files=[p for p in root.iterdir() if p.suffix in ('.js','.html','.css')]+[root/'AAA-ROADMAP.md',root/'COASTAL-LIGHT.md']
          Path('coastal-evidence/runtime-hashes.json').write_text(json.dumps({'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files}},indent=2))
          PY
      - name: Compare the actual public runtime to this publication
        if: github.ref == 'refs/heads/master'
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen,Request
          from concurrent.futures import ThreadPoolExecutor
          import hashlib,json,time
          manifest=json.loads(Path('coastal-evidence/runtime-hashes.json').read_text())
          def check(item):
              path,sha=item
              try:
                  u='https://v5ma.github.io/'+path+'?verify='+manifest['commit']
                  data=urlopen(Request(u,headers={'Cache-Control':'no-cache'}),timeout=25).read()
                  return path if hashlib.sha256(data).hexdigest()!=sha else None
              except Exception:return path
          for attempt in range(30):
              with ThreadPoolExecutor(max_workers=8) as pool:bad=[p for p in pool.map(check,manifest['files'].items()) if p]
              if not bad:break
              print('Waiting for matching deployment:',bad,flush=True);time.sleep(10)
          assert not bad,bad
          Path('coastal-evidence/public-bytes.json').write_text(json.dumps({'commit':manifest['commit'],'matched':len(manifest['files'])},indent=2))
          PY
      - name: Exercise shaders and controller flow on the real published site
        if: github.ref == 'refs/heads/master'
        env:
          DINO_TEST_BASE: https://v5ma.github.io/dino-atlas/
        run: |
          python dino-atlas/tests/coastal-light-browser.py
          cp coastal-evidence/report.json coastal-evidence/published-report.json
      - name: Record source and failures honestly
        if: always()
        run: |
          mkdir -p coastal-evidence
          git rev-parse HEAD > coastal-evidence/tested-commit.txt
          git status --short > coastal-evidence/worktree-status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dino-coastal-light-source-and-evidence
          path: |
            dino-atlas/
            coastal-evidence/
            herds-evidence/
            aaa-evidence/
          retention-days: 14
