name: Aether arsenal and rail-transfer validation
on:
  push:
    branches: [feat/aether-arsenal-and-sky-transfers]
    paths: ['aether-reach/**','.github/workflows/aether-combat.yml']
  pull_request:
    paths: ['aether-reach/**','.github/workflows/aether-combat.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aether-combat-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [arsenal, rails]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Model, input, public boundaries and source syntax
        run: |
          for f in aether-reach/*.mjs; do node --check "$f"; done
          node --test aether-reach/tests/*.test.mjs
          node aether-reach/tests/release-manifest.mjs
      - name: Install test browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Actual HTTP WebGL game with ordinary inputs
        env:
          COMBAT_SUITE: ${{ matrix.mode }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/aether-combat.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python -u aether-reach/tests/arsenal_browser.py
      - name: Preserve tested public source and diagnostics
        if: always()
        run: |
          mkdir -p aether-reach/test-output
          git rev-parse HEAD > aether-reach/test-output/tested-commit.txt
          git diff --stat > aether-reach/test-output/uncommitted-diff.txt
          tar --exclude='aether-reach/test-output' -czf aether-reach/test-output/public-source.tgz aether-reach index.html projects.css .github/workflows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-combat-${{ matrix.mode }}
          path: aether-reach/test-output
          retention-days: 7
