name: Guild Resonance
on:
  push:
    branches: [guild/sound-and-controller-20260911]
    paths: ['leonardos-guild/**', '.github/workflows/guild-resonance.yml']
  pull_request:
    paths: ['leonardos-guild/**', '.github/workflows/guild-resonance.yml']
permissions:
  contents: read
concurrency:
  group: guild-resonance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: One-time baseline-checked source and original audio preparation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'guild/sound-and-controller-20260911'
          if test ! -f leonardos-guild/assets/resonance/manifest.json; then
            python -m pip install numpy==2.3.5 scipy==1.17.0
            command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
            python leonardos-guild/scripts/prepare-resonance.py
            python -u leonardos-guild/scripts/render-resonance-audio.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- leonardos-guild
            git commit -m 'Integrate Resonance v0.8.0 and render original local score and Foley assets'
            git push origin HEAD:refs/heads/guild/sound-and-controller-20260911
          fi
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  acceptance:
    needs: prepare
    if: always() && !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check ordinary committed runtime and all model regressions
        run: |
          set -euo pipefail
          mkdir -p leonardos-guild/resonance-output
          git rev-parse HEAD | tee leonardos-guild/resonance-output/tested-commit.txt
          for f in leonardos-guild/*.mjs; do node --check "$f"; done
          npm --prefix leonardos-guild test | tee leonardos-guild/resonance-output/model-tests.txt
      - name: Install native browser and actual audio decoding tools
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0 numpy==2.3.5
          python -m playwright install --with-deps chromium
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Decode every packaged audio asset and inspect levels and loop seams
        run: python -u leonardos-guild/tests/resonance-audio-check.py
      - name: Fresh console gameplay, real audio graph, music wheels, mixer and saves
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/resonance-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python -u leonardos-guild/tests/resonance-browser.py
      - name: Preserve committed source and failure evidence without rewriting runtime
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,subprocess,tarfile
          from pathlib import Path
          out=Path('leonardos-guild/resonance-output');out.mkdir(exist_ok=True)
          names=subprocess.check_output(['git','ls-files','leonardos-guild','index.html','.github/workflows'],text=True).splitlines()
          files={name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in names if Path(name).is_file()}
          (out/'source-hashes.json').write_text(json.dumps(files,indent=2))
          (out/'tested-commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          diff=subprocess.check_output(['git','diff','--stat'],text=True)
          (out/'uncommitted-diff.txt').write_text(diff)
          with tarfile.open(out/'source.tgz','w:gz') as t:
            for name in files:t.add(name,arcname=name)
          assert not diff,'Native acceptance must read ordinary committed source'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guild-resonance-acceptance
          path: leonardos-guild/resonance-output/
          retention-days: 10
