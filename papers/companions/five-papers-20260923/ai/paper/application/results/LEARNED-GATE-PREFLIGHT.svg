<rect x="542" y="186" width="220" height="24" fill="#eeeeee"/>
<rect x="542" y="186" width="138.425" height="24" fill="#376a91"/>
<text x="548" y="203" font-family="Arial" font-size="13" fill="black">0.2202</text>
<text x="432" y="265" font-family="Arial" font-size="13">Trajectory</text>
<rect x="542" y="248" width="220" height="24" fill="#eeeeee"/>
<rect x="542" y="248" width="96.608" height="24" fill="#3a7d57"/>
<text x="548" y="265" font-family="Arial" font-size="13" fill="black">0.1537</text>
