<rect x="142" y="186" width="147.950" height="24" fill="#376a91"/>
<text x="148" y="203" font-family="Arial" font-size="13" fill="black">0.6725</text>
<text x="32" y="265" font-family="Arial" font-size="13">Trajectory</text>
<rect x="142" y="248" width="220" height="24" fill="#eeeeee"/>
<rect x="142" y="248" width="167.475" height="24" fill="#3a7d57"/>
<text x="148" y="265" font-family="Arial" font-size="13" fill="black">0.7612</text>
<text x="32" y="327" font-family="Arial" font-size="13">History replay</text>
<rect x="142" y="310" width="220" height="24" fill="#eeeeee"/>
<rect x="142" y="310" width="167.475" height="24" fill="#7a622e"/>
<text x="148" y="327" font-family="Arial" font-size="13" fill="black">0.7612</text>
<text x="32" y="389" font-family="Arial" font-size="13">Prevalence</text>
<rect x="142" y="372" width="220" height="24" fill="#eeeeee"/>
<rect x="142" y="372" width="147.950" height="24" fill="#9272a0"/>
<text x="148" y="389" font-family="Arial" font-size="13" fill="black">0.6725</text>
<text x="432" y="103" font-family="Arial" font-size="16" font-weight="bold">Brier score (lower is better)</text>
<text x="432" y="141" font-family="Arial" font-size="13">Scalar</text>
<rect x="542" y="124" width="220" height="24" fill="#eeeeee"/>
<rect x="542" y="124" width="138.654" height="24" fill="#555555"/>
<text x="548" y="141" font-family="Arial" font-size="13" fill="black">0.2206</text>
