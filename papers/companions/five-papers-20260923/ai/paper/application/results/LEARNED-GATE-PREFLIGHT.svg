<text x="32" y="62" font-family="Arial" font-size="14">2,400 development episodes; 800 held-out episodes; no durable updates</text>
<text x="32" y="103" font-family="Arial" font-size="16" font-weight="bold">Accuracy (higher is better)</text>
<text x="32" y="141" font-family="Arial" font-size="13">Scalar</text>
